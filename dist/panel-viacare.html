  function onAuto(ev) {
    if (!el) return;
    if (ev.type === 'cfg') {
      if (!ev.job || ev.job === 'productos') {
        renderAutoHead();
        renderAutoCfg();
        renderDesc();
      }
      return;
    }
    if (ev.job !== 'productos' && ev.job !== 'descubrir') {
      if (ev.type === 'start' || ev.type === 'done' || ev.type === 'error') {
        renderAutoHead();
        renderDescHead();
      }
      return;
    }
    if (ev.type === 'start') vivo[ev.job === 'productos' ? 'medir' : 'desc'] = [];
    if (ev.type === 'skip' && pedido[ev.job]) toast(ev.motivo || 'No se pudo correr acá.', 'warn');
    if (ev.type === 'progress') {
      if (ev.job === 'productos') renderAutoProg();
      else renderDescProg();
      return;
    }
    renderAutoHead();
    renderAutoProg();
    renderDesc();
    if (ev.type === 'done' || ev.type === 'error') recargar();
  }

  function correr(job) {
    if (!A || pedido[job] || A.running === job) return;
    pedido[job] = true;
    renderAutoHead();
    renderDescHead();
    A.run(job, { origen: 'manual' }).finally(() => {
      pedido[job] = false;
      if (el) {
        renderAutoHead();
        renderDescHead();
      }
    });
  }

  function cargarInvestigacion() {
    return Store.list('investigacion')
      .then((m) => {
        const inv = new Map();
        for (const [id, d] of m) if (id !== 'descubrir' && d && d.senales) inv.set(id, d);
        state.inv = inv;
        if (m.has('descubrir')) state.desc = m.get('descubrir');
        if (el) renderAll();
      })
      .catch(() => {});
  }

  // Después de una tarea: trae del Store las mediciones y los campos que tocó, sin pisar lo que estás escribiendo
  async function recargar() {
    const d = await Store.get('productos/lista').catch(() => null);
    if (d && Array.isArray(d.items) && state.cargado) {
      const by = new Map(d.items.map((x) => [x.id, x]));
      for (const p of state.items) {
        const s = by.get(p.id);
        if (s) for (const k of W.CAMPOS_MEDICION) if (s[k] !== undefined) p[k] = s[k];
      }
    }
    await cargarInvestigacion();
  }

  function agregarDescubierto(n) {
    const d = state.desc && Array.isArray(state.desc.productos) ? state.desc.productos[n] : null;
    if (!d) return;
    if (!state.cargado) {
      toast('Esperá un segundo: todavía estoy cargando tu lista.', 'warn');
      return;
    }
    if (W.yaEnLista(d.busqueda || d.nombre, state.items)) {
      toast('Ya está en tu lista.', 'warn');
      renderDescList();
      return;
    }
    const id = 'p' + Date.now().toString(36);
    const item = W.itemDesdeDescubrimiento(d, id);
    // Si se midió con las búsquedas de partida, la tarjeta arranca con su bloque de Mercado Libre
    if (d.senales && Array.isArray(d.publicaciones) && d.publicaciones.length) {
      const inv = W.investigacionDoc({ fecha: state.desc.fecha, busqueda: d.busqueda, resultados: d.resultados, publicaciones: d.publicaciones, senales: d.senales });
      Object.assign(item, W.camposMedicion(inv));
      state.inv.set(W.docId(id), inv);
      Store.set('investigacion/' + W.docId(id), inv).catch(storeFail);
    }
    state.items.push(item);
    save();
    renderAll();
    toast('Sumé “' + item.nombre + '” a tu lista. Cargá precio y costo para ver cuánto deja.', 'good');
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'pr-cpa') {
      state.cpa = U.parseMoney(t.value);
      save();
      renderRanking();
      for (const s of scored()) updateNumbers(s);
      return;
    }
    if (t.dataset.i == null || !t.dataset.k) return;
    const p = state.items[Number(t.dataset.i)];
    const k = t.dataset.k;
    p[k] = k === 'nombre' ? t.value : U.parseMoney(t.value);
    save();
    renderRanking();
    for (const s of scored()) updateNumbers(s);
  }

  function onChange(ev) {
    const t = ev.target;
    const cfg = t.dataset && t.dataset.cfg;
    if (cfg) {
      if (A) A.setCfg('productos', { [cfg]: t.type === 'checkbox' ? t.checked : Number(t.value) });
      return;
    }
    if (t.tagName === 'SELECT' && t.dataset.k) {
      state.items[Number(t.dataset.i)][t.dataset.k] = Number(t.value);
      save();
      renderRanking();
      for (const s of scored()) updateNumbers(s);
    } else if (t.dataset.k && t.dataset.k !== 'nombre') {
      const v = U.parseMoney(t.value);
      t.value = v ? U.int(v) : '';
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    const i = Number(t.dataset.i);
    switch (t.dataset.act) {
      case 'agregar':
        state.items.push({ id: 'p' + Date.now().toString(36), nombre: 'Producto nuevo', busqueda: '', custom: true, precio: null, costo: null, envioExtra: 0, demanda: 3, competencia: 3, afinidad: 3, video: 3, riesgo: 3, refMin: null, refMax: null, nota: '' });
        save();
        renderAll();
        break;
      case 'quitar': {
        const [fuera] = state.items.splice(i, 1);
        if (fuera && state.inv.has(W.docId(fuera.id))) {
          state.inv.delete(W.docId(fuera.id));
          Store.remove('investigacion/' + W.docId(fuera.id)).catch(() => {});
        }
        save();
        renderAll();
        break;
      }
      case 'ia':
        askIA();
        break;
      case 'ia-stop':
        if (ctl) ctl.abort();
        break;
      case 'aplicar': {
        const p = state.items[i];
        const x = state.ia.data.find((s) => norm(s.nombre) === norm(p.nombre));
        if (!x) return;
        for (const k of ['demanda', 'competencia', 'afinidad', 'video', 'riesgo']) p[k] = x[k];
        if (!p.precio && x.precio_sugerido) p.precio = U.parseMoney(x.precio_sugerido);
        save();
        renderAll();
        toast('Puntajes aplicados.', 'good');
        break;
      }
      case 'medir':
        correr('productos');
        break;
      case 'descubrir':
        correr('descubrir');
        break;
      case 'medir-stop':
      case 'desc-stop':
        if (A) A.stop();
        break;
      case 'desc-agregar':
        agregarDescubierto(Number(t.dataset.n));
        break;
    }
  }

  /* ---------- Tareas automáticas ---------- */

  function cortarSiCancelo(ctx) {
    if (ctx.signal.aborted) {
      const err = new Error('Cancelado.');
      err.code = 'cancelled';
      throw err;
    }
  }

  // Error de un paso: si es `fatal`, corta toda la tanda; si no, se anota y se sigue con el próximo
  function falla(msg, fatal) {
    const err = new Error(msg);
    err.fatal = !!fatal;
    return err;
  }

  async function guardar(path, data) {
    try {
      await Store.set(path, data);
    } catch (err) {
      const code = err && err.code;
      throw new Error(
        code === 'invalid_argument'
          ? 'No tenés permiso para guardar cambios en este panel.'
          : code === 'quota_exceeded'
            ? 'Se llenó el espacio del panel. Borrá datos viejos para seguir guardando.'
            : 'No se pudo guardar la medición. Revisá la conexión y probá de nuevo.'
      );
    }
  }

  // La lista más nueva: la de la pestaña si ya cargó (tiene lo último que tipeaste), si no la guardada
  async function listaActual() {
    if (state.cargado) return { items: state.items, cpa: state.cpa };
    const d = await Store.get('productos/lista').catch(() => null);
    return { items: W.unirLista(d, PR.CANDIDATOS), cpa: d && d.cpa != null ? d.cpa : null };
  }

  /* Lee una búsqueda de Mercado Libre con el navegador y la pasa por Claude: {publicaciones, resultados, senales} */
  async function leerBusqueda(ctx, q, nombre) {
    let texto;
    try {
      texto = await Browser.read(PR.mlUrl(q), { ready: R.mlReady, tries: 3 });
    } catch (err) {
      throw falla(Browser.errorText(err), Browser.fatal(err));
    }
    cortarSiCancelo(ctx);
    if (W.sinResultados(texto)) return { publicaciones: [], resultados: 0, senales: R.mlSignals([], 0) };
    const compacto = R.compactText(texto, 30000);
    if (!compacto) throw falla('La página de Mercado Libre vino vacía.');
    if (!AI.sample) throw falla('Claude no está disponible en esta vista.', true);
    let data;
    try {
      data = await AI.sample.json(W.mlExtractPrompt(compacto, nombre), { signal: ctx.signal, cache: false });
    } catch (err) {
      if (err && err.code === 'cancelled') throw err;
      if (AI.permanent(err)) {
        AI.sample = null;
        throw falla(AI.errorText(err), true);
      }
      throw falla(AI.errorText(err));
    }
    const L = W.sanitizeListings(data);
    const resultados = L.resultados != null ? L.resultados : R.mlResultCount(texto);
    if (!L.publicaciones.length && resultados !== 0) throw falla('No encontré publicaciones en la página: puede que Mercado Libre no haya terminado de cargar.');
    return { publicaciones: L.publicaciones, resultados, senales: R.mlSignals(L.publicaciones, resultados) };
  }

  function detalleSenales(s) {
    const v = W.veredicto(s.vende);
    return [
      v ? v.label : '',
      s.vendidosVisibles != null ? '+' + U.int(s.vendidosVisibles) + ' vendidos visibles' : s.opiniones != null ? U.int(s.opiniones) + ' opiniones' : '',
      s.resultados != null ? U.int(s.resultados) + ' resultados' : '',
    ]
      .filter(Boolean)
      .join(' · ');
  }

  function omitirResto(items, i) {
    for (const it of items.slice(i + 1)) {
      it.estado = 'omitida';
      it.detalle = '';
    }
  }

  // Si la tanda se cortó, lo que quedaba pendiente no se leyó
  function cerrarLog(log) {
    for (const it of log) if (it.estado === 'leyendo' || it.estado === 'espera') it.estado = 'omitida';
  }

  function refrescarMedir() {
    if (el) renderAutoProg();
  }

  function refrescarDesc() {
    if (el) renderDescProg();
  }

  // Una sola escritura de 'productos/lista' con lo medido, sin tocar precio, costo ni envío extra
  async function escribirMediciones(medidos) {
    let items;
    let cpaGuardado;
    if (state.cargado) {
      items = state.items;
      cpaGuardado = state.cpa;
    } else {
      const d = await Store.get('productos/lista').catch(() => null);
      items = W.unirLista(d, PR.CANDIDATOS);
      cpaGuardado = d && d.cpa != null ? d.cpa : null;
    }
    for (const m of medidos) {
      const p = items.find((x) => x.id === m.id);
      if (p) Object.assign(p, W.camposMedicion(m.doc));
    }
    await guardar('productos/lista', JSON.parse(JSON.stringify({ items, cpa: cpaGuardado })));
  }

  /*
   * Mide en Mercado Libre los productos de la lista (hasta 10): abre cada búsqueda con el navegador de Claude,
   * extrae las publicaciones con Claude y guarda las señales de venta. Funciona aunque la pestaña no esté abierta.
   */
  async function medir(ctx) {
    const { items } = await listaActual();
    const elegidos = W.elegirParaMedir(items, W.MAX_MEDIR);
    if (!elegidos.length) throw new Error('No hay productos para medir: agregá alguno con su búsqueda.');
    const fecha = new Date().toISOString();
    const log = elegidos.map((p) => ({ q: p.nombre, estado: 'espera', detalle: '' }));
    vivo.medir = log;
    refrescarMedir();
    const medidos = [];
    let fallo = null;
    try {
      for (let i = 0; i < elegidos.length; i++) {
        const p = elegidos[i];
        const it = log[i];
        cortarSiCancelo(ctx);
        it.estado = 'leyendo';
        ctx.progress(W.progreso(i, elegidos.length, p.nombre));
        refrescarMedir();
        let r;
        try {
          r = await leerBusqueda(ctx, p.busqueda || p.nombre, p.nombre);
        } catch (err) {
          if (err && err.code === 'cancelled') throw err;
          it.estado = 'error';
          it.detalle = err.message;
          if (err.fatal) {
            omitirResto(log, i);
            refrescarMedir();
            throw new Error(err.message);
          }
          refrescarMedir();
          continue;
        }
        const doc = W.investigacionDoc({ fecha, busqueda: p.busqueda || p.nombre, resultados: r.resultados, publicaciones: r.publicaciones, senales: r.senales });
        await guardar('investigacion/' + W.docId(p.id), doc);
        state.inv.set(W.docId(p.id), doc);
        medidos.push({ id: p.id, nombre: p.nombre, senales: r.senales, doc });
        it.estado = 'ok';
        it.detalle = detalleSenales(r.senales);
        refrescarMedir();
      }
    } catch (err) {
      fallo = err;
      cerrarLog(log);
      refrescarMedir();
    }
    // Lo que se llegó a medir queda guardado aunque se corte la tanda
    if (medidos.length) {
      try {
        await escribirMediciones(medidos);
      } catch (err) {
        if (!fallo) fallo = err;
      }
    }
    if (el) renderAll();
    if (fallo) throw fallo;
    if (!medidos.length) throw new Error((log.find((x) => x.detalle) || {}).detalle || 'No se pudo medir ningún producto en Mercado Libre.');
    return {
      novedades: medidos.length,
      medidos: medidos.length,
      errores: log.filter((x) => x.estado === 'error').length,
      resumen: W.resumenMedicion(medidos),
    };
  }

  /* Claude elige qué páginas de Mercado Libre leer (con la herramienta leer_pagina). null: no se pudo, usar las búsquedas fijas. */
  async function descubrirConClaude(ctx, semillas, items) {
    const sub = new AbortController();
    const cortar = () => sub.abort();
    ctx.signal.addEventListener('abort', cortar);
    let lecturas = 0;
    let leidas = 0;
    let fatal = null;
    // Claude puede pedir varias páginas a la vez: el navegador las abre de a una
    let cola = Promise.resolve();
    const turno = (fn) => {
      const p = cola.then(fn);
      cola = p.catch(() => {});
      return p;
    };
    const herramienta = {
      name: 'leer_pagina',
      description:
        'Abre una página pública de Mercado Libre Argentina en el navegador del usuario y devuelve su texto (hasta 12.000 caracteres). Solo acepta URLs https de listado.mercadolibre.com.ar, www.mercadolibre.com.ar o articulo.mercadolibre.com.ar. Máximo ' +
        W.MAX_LECTURAS +
        ' lecturas en total.',
      inputSchema: { type: 'object', properties: { url: { type: 'string', description: 'URL completa, por ejemplo https://listado.mercadolibre.com.ar/almohada-cervical' } }, required: ['url'] },
      execute: (input) =>
        turno(async () => {
          if (sub.signal.aborted) throw new Error('Cancelado.');
          const url = W.urlML(input && input.url);
          if (!url) throw new Error('Solo puedo abrir páginas https de listado.mercadolibre.com.ar, www.mercadolibre.com.ar o articulo.mercadolibre.com.ar.');
          if (lecturas >= W.MAX_LECTURAS) throw new Error('Sin más lecturas: ya se usaron las ' + W.MAX_LECTURAS + '. Respondé con lo que viste.');
          lecturas++;
          const it = { q: W.urlCorta(url), estado: 'leyendo', detalle: '' };
          vivo.desc.push(it);
          ctx.progress('Página ' + lecturas + ' de ' + W.MAX_LECTURAS + ' · ' + it.q);
          refrescarDesc();
          try {
            const texto = await Browser.read(url, { ready: R.mlReady, tries: 3 });
            leidas++;
            it.estado = 'ok';
            return R.compactText(texto, 12000) || '(La página vino vacía.)';
          } catch (err) {
            it.estado = 'error';
            it.detalle = Browser.errorText(err);
            if (Browser.fatal(err)) {
              fatal = err;
              sub.abort();
            }
            throw new Error(Browser.errorText(err));
          } finally {
            refrescarDesc();
          }
        }),
    };
    ctx.progress('Claude elige qué buscar en Mercado Libre…');
    let data;
    try {
      data = await AI.sample.json(W.discoverPrompt(semillas, items.map((p) => p.nombre)), { signal: sub.signal, tools: [herramienta] });
    } catch (err) {
      if (fatal) throw new Error(Browser.errorText(fatal));
      if (err && err.code === 'cancelled') throw err;
      if (err && err.code === 'tools_unavailable') return null;
      if (AI.permanent(err)) AI.sample = null;
      throw new Error(AI.errorText(err));
    } finally {
      ctx.signal.removeEventListener('abort', cortar);
    }
    // Sin páginas leídas no hay evidencia: mejor medir las búsquedas de partida
    if (!leidas) return null;
    return { modo: 'claude', paginas: leidas, productos: W.sanitizeDiscover(data, items, 5) };
  }

  /* Versión fija: mide cada búsqueda de partida que no esté en la lista y las ordena por señales de venta. */
  async function descubrirConBusquedas(ctx, semillas) {
    if (!semillas.length) throw new Error('Ya tenés en tu lista todos los productos que sé buscar. Sumá otros con “Agregar producto”.');
    const log = semillas.map((s) => ({ q: s.q, estado: 'espera', detalle: '' }));
    vivo.desc = log;
    refrescarDesc();
    const productos = [];
    let leidas = 0;
    for (let i = 0; i < semillas.length; i++) {
      const s = semillas[i];
      const it = log[i];
      cortarSiCancelo(ctx);
      it.estado = 'leyendo';
      ctx.progress(W.progreso(i, semillas.length, s.q));
      refrescarDesc();
      let r;
      try {
        r = await leerBusqueda(ctx, s.q, s.q);
      } catch (err) {
        if (err && err.code === 'cancelled') throw err;
        it.estado = 'error';
        it.detalle = err.message;
        if (err.fatal) {
          omitirResto(log, i);
          refrescarDesc();
          throw new Error(err.message);
        }
        refrescarDesc();
        continue;
      }
      leidas++;
      it.estado = 'ok';
      if (r.publicaciones.length) {
        productos.push(W.descubrimientoDesdeBusqueda(s, r.publicaciones, r.resultados, r.senales));
        it.detalle = detalleSenales(r.senales);
      } else it.detalle = 'sin publicaciones';
      refrescarDesc();
    }
    if (!leidas) throw new Error(log[0].detalle || 'No se pudo leer ninguna búsqueda.');
    return { modo: 'busquedas', paginas: leidas, productos: W.ordenarDescubrimientos(productos) };
  }

  async function descubrir(ctx) {
    const { items } = await listaActual();
    const semillas = W.semillasLibres(W.SEMILLAS, items);
    vivo.desc = [];
    refrescarDesc();
    let lim = null;
    try {
      lim = AI.sample && typeof AI.sample.limits === 'function' ? await AI.sample.limits() : null;
    } catch (err) {
      lim = null;
    }
    cortarSiCancelo(ctx);
    let res = lim && lim.tools ? await descubrirConClaude(ctx, semillas, items) : null;
    try {
      if (!res) {
        vivo.desc = [];
        res = await descubrirConBusquedas(ctx, semillas);
      }
    } catch (err) {
      cerrarLog(vivo.desc);
      refrescarDesc();
      throw err;
    }
    const doc = { fecha: new Date().toISOString(), modo: res.modo, productos: res.productos };
    await guardar('investigacion/descubrir', doc);
    state.desc = doc;
    if (el) renderDescList();
    return {
      novedades: res.productos.length,
      encontrados: res.productos.length,
      paginas: res.paginas,
      resumen: W.resumenDescubrir(res.productos),
    };
  }

  if (A) {
    A.NOMBRES.descubrir = 'búsqueda de productos nuevos';
    A.register('productos', { needs: ['browser', 'sample'], run: medir });
    A.register('descubrir', { needs: ['browser', 'sample'], run: descubrir });
  }

  VC.tools = VC.tools || {};
  VC.tools.productos = { mount, render: renderAll };
})(window);
</script>
<script>
/* ui/ajustes.js */
/* Ajustes: costos del negocio, mensajes de WhatsApp, producto para guiones y conexión con Shopify. */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const S = VC.scripts;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, DEFAULT_MSGS, toast, banner } = VC.ui;

  const COSTOS = [
    ['costoUnidad', 'Costo de cada corrector', 'Lo que te cobra el proveedor o Dropi por unidad.', '$'],
    ['costoEnvio', 'Envío de un pedido entregado', 'Flete que pagás cuando el pedido llega y se cobra.', '$'],
    ['costoDevolucion', 'Pedido devuelto', 'Lo que pagás cuando rechazan el paquete: ida y vuelta.', '$'],
    ['comisionCobro', 'Comisión de cobro contra entrega', 'Porcentaje que te descuentan del cobro.', '%'],
    ['otrosPorPedido', 'Otros por pedido despachado', 'Packaging, etiqueta, preparación.', '$'],
    ['fijosMensuales', 'Costos fijos por mes', 'Shopify, apps (Releasit, etc.), herramientas. Se prorratea por día.', '$'],
  ];
  const TASAS = [
    ['tasaConfirmacion', 'Pedidos que se despachan', 'De cada 100 que entran, cuántos no se anulan antes de salir.', 'confirmacion'],
    ['tasaEntrega', 'Despachados que se entregan', 'De cada 100 que salen, cuántos se entregan y cobran.', 'entrega'],
  ];
  const PLANTILLAS = [
    ['confirmacion', 'Pedir confirmación'],
    ['recordatorio', 'Recordatorio de confirmación'],
    ['direccion', 'Pedir dirección completa'],
    ['resena', 'Pedir reseña'],
    ['resenaRecordatorio', 'Recordatorio de reseña'],
  ];
  const TIENDA = [
    ['precio1', 'Precio de 1 unidad', '68.990', true],
    ['precio2', 'Precio llevando 2', '72.990', true],
    ['envio', 'Envíos', 'Enviamos a todo el país', false],
    ['pago', 'Forma de pago', 'pagás en efectivo cuando te llega', false],
    ['demora', 'Cuánto tarda en llegar', 'Ej.: de 3 a 7 días hábiles', false],
    ['talles', 'Talles', 'Ej.: Es regulable, va de S a XL', false],
    ['garantia', 'Cambios o garantía', 'Ej.: Cambio dentro de los 10 días', false],
  ];
  const VARS = ['nombre', 'pedido', 'cantidad', 'producto', 'total', 'direccion', 'ciudad', 'provincia', 'cp', 'extras', 'tienda', 'firma'];

  let el;

  function mount(section) {
    el = section;
    render();
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    Shop.onChange(() => !el.contains(document.activeElement) && render());
  }

  function fmtVal(v, unit) {
    if (v == null || v === '' || (unit !== '%' && !Number(v))) return '';
    return unit === '%' ? String(v).replace('.', ',') : U.int(v);
  }

  function render() {
    if (!el) return;
    const rates = O.historicalRates(Shop.orders);
    const cfg = P.normalizeCfg(App.cfg);
    const be = P.breakEven(App.cfg, rates);
    const sample = Shop.orders.find((o) => o.estado === 'pendiente') || Shop.orders[0];
    el.innerHTML =
      '<header class="tool-head"><div><h2>Ajustes</h2><p class="lede">Lo que cargues acá lo usan todas las herramientas. Se guarda solo.</p></div></header>' +
      '<div class="grid-2">' +
      '<section class="panel"><h3>Costos del negocio</h3><div class="settings">' +
      COSTOS.map(
        ([k, label, help, unit]) =>
          '<label class="setting" for="cfg-' +
          k +
          '"><span class="setting-label">' +
          e(label) +
          '</span><span class="setting-help">' +
          e(help) +
          '</span><span class="input-unit"><span class="unit">' +
          unit +
          '</span><input id="cfg-' +
          k +
          '" data-cfg="' +
          k +
          '" data-unit="' +
          unit +
          '" inputmode="decimal" value="' +
          e(fmtVal(App.cfg[k], unit)) +
          '" placeholder="0"></span></label>'
      ).join('') +
      '</div></section>' +
      '<section class="panel"><h3>Tasas para proyectar</h3><p class="muted small">Vacío = se usa tu historial de Shopify.</p><div class="settings">' +
      TASAS.map(([k, label, help, hk]) => {
        const hist = rates[hk];
        const n = hk === 'confirmacion' ? rates.muestraConfirmacion : rates.muestraEntrega;
        return (
          '<label class="setting" for="cfg-' +
          k +
          '"><span class="setting-label">' +
          e(label) +
          '</span><span class="setting-help">' +
          e(help) +
          (hist != null ? ' Historial: ' + U.pct(hist) + ' (' + n + ').' : ' Sin historial todavía.') +
          '</span><span class="input-unit"><span class="unit">%</span><input id="cfg-' +
          k +
          '" data-cfg="' +
          k +
          '" data-unit="%" inputmode="decimal" value="' +
          e(cfg[k] != null ? String(cfg[k]).replace('.', ',') : '') +
          '" placeholder="' +
          (hist != null ? Math.round(hist * 100) : '') +
          '"></span></label>'
        );
      }).join('') +
      '<label class="setting" for="cfg-cpaMaxManual"><span class="setting-label">CPA máximo para el analizador</span><span class="setting-help">Vacío = el calculado' +
      (be && be.cpaEquilibrio > 0 && P.costsReady(App.cfg) ? ' (' + U.money(be.cpaEquilibrio) + ')' : '') +
      '.</span><span class="input-unit"><span class="unit">$</span><input id="cfg-cpaMaxManual" data-cfg="cpaMaxManual" data-unit="$" inputmode="numeric" value="' +
      e(fmtVal(cfg.cpaMaxManual, '$')) +
      '" placeholder="calculado"></span></label></div>' +
      '<div class="history"><h4>Tu historial en Shopify</h4><p>' +
      (rates.total
        ? e(rates.total) + ' pedidos cargados: ' + e(rates.anulados) + ' anulados (' + e(U.pct(rates.anulados / rates.total)) + '). Ticket promedio entregado: ' + e(U.money(rates.ticketPromedio)) + '.'
        : 'Todavía no se cargaron pedidos.') +
      '</p></div></section></div>' +
      '<section class="panel"><h3>Mensajes de WhatsApp</h3><div class="form-grid">' +
      [
        ['tienda', 'Nombre de la tienda'],
        ['firma', 'Firma (opcional)'],
        ['productoSingular', 'Producto (1 unidad)'],
        ['productoPlural', 'Producto (varias)'],
      ]
        .map(([k, l]) => '<label for="msg-' + k + '">' + e(l) + '<input id="msg-' + k + '" data-msg="' + k + '" value="' + e(App.msgs[k] || '') + '"></label>')
        .join('') +
      '</div><p class="muted small">Variables: ' +
      VARS.map((v) => '<span class="mono">{' + v + '}</span>').join(' ') +
      '</p><div class="templates">' +
      PLANTILLAS.map(
        ([k, label]) =>
          '<div class="template"><label for="msg-' +
          k +
          '">' +
          e(label) +
          '<textarea id="msg-' +
          k +
          '" data-msg="' +
          k +
          '" rows="5">' +
          e(App.msgs[k]) +
          '</textarea></label><div class="tpl-foot"><button class="btn link" data-act="restaurar" data-k="' +
          k +
          '">Volver al texto original</button></div>' +
          (sample ? '<div class="preview" id="prev-' + k + '">' + e(U.fillTemplate(App.msgs[k], O.templateVars(sample, App.msgs))) + '</div>' : '') +
          '</div>'
      ).join('') +
      '</div>' +
      (sample ? '<p class="muted small">Vista previa con el pedido ' + e(sample.name) + '.</p>' : '') +
      '</section>' +
      '<section class="panel"><h3>Datos de la tienda</h3><p class="muted small">Los usan las respuestas a comentarios, el reactivador de clientes y la calculadora de ofertas. Poné solo lo que cumplís.</p><div class="form-grid">' +
      TIENDA.map(([k, label, ph, unit]) => {
        const v = App.tienda[k];
        return (
          '<label for="td-' +
          k +
          '">' +
          e(label) +
          (unit ? '<span class="input-unit"><span class="unit">$</span>' : '') +
          '<input id="td-' +
          k +
          '" data-tienda="' +
          k +
          '"' +
          (unit ? ' data-unit="$" inputmode="numeric"' : '') +
          ' placeholder="' +
          e(ph) +
          '" value="' +
          e(unit ? (v ? U.int(v) : '') : v || '') +
          '">' +
          (unit ? '</span>' : '') +
          '</label>'
        );
      }).join('') +
      '</div></section>' +
      '<div class="grid-2"><section class="panel"><h3>Producto para los guiones</h3><label for="msg-productoGuiones">Cómo se ve el corrector (la IA de video lo necesita para dibujarlo igual en cada clip)<textarea id="msg-productoGuiones" data-msg="productoGuiones" rows="3" placeholder="' +
      e(S.PRODUCTO_DEFAULT) +
      '">' +
      e(App.msgs.productoGuiones || '') +
      '</textarea></label><p class="muted small">Vacío = ' +
      e(S.PRODUCTO_DEFAULT) +
      '.</p></section>' +
      '<section class="panel"><h3>Shopify y datos</h3><label class="check" for="msg-etiquetarShopify"><input type="checkbox" id="msg-etiquetarShopify" data-msg="etiquetarShopify"' +
      (App.msgs.etiquetarShopify ? ' checked' : '') +
      '> Al marcar un pedido, ponerle la etiqueta <span class="mono">WA-confirmado</span> o <span class="mono">WA-cancelado</span> en Shopify</label>' +
      '<p class="muted small">' +
      e(
        Shop.mode === 'live'
          ? 'Conectado a Shopify por claude.ai. ' + (Shop.loadedAt ? Shop.orders.length + ' pedidos cargados.' : 'Cargando…')
          : Shop.mode === 'csv'
            ? 'Usando el CSV importado (' + Shop.orders.length + ' pedidos).'
            : 'Sin conexión a Shopify en esta vista.'
      ) +
      '</p><div class="row-actions"><label class="btn ghost file-btn">Importar CSV de pedidos<input type="file" accept=".csv,text/csv" data-act="importar-csv" hidden></label>' +
      (Shop.mode === 'live' ? '<button class="btn ghost" data-act="refrescar">Volver a traer pedidos</button>' : '') +
      '</div><p class="muted small">' +
      e(
        Store.mode === 'db'
          ? 'Confirmaciones, gastos, reseñas y ajustes se guardan en el panel y los ves desde cualquier dispositivo.'
          : 'Tus datos se guardan solo en este navegador. Abrí el panel desde claude.ai para guardarlos en tu cuenta.'
      ) +
      '</p></section></div>';
  }

  function updatePreviews() {
    const sample = Shop.orders.find((o) => o.estado === 'pendiente') || Shop.orders[0];
    if (!sample) return;
    for (const [k] of PLANTILLAS) {
      const p = el.querySelector('#prev-' + k);
      if (p) p.textContent = U.fillTemplate(App.msgs[k], O.templateVars(sample, App.msgs));
    }
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.dataset.tienda) {
      const k = t.dataset.tienda;
      App.tienda[k] = t.dataset.unit === '$' ? U.parseMoney(t.value) || 0 : t.value;
      App.saveTienda();
      App.emit('tienda');
      return;
    }
    if (t.dataset.cfg) {
      const raw = t.value.trim();
      const parse = t.dataset.unit === '$' ? U.parseMoney : U.parseNum;
      const v = raw === '' ? (P.DEFAULT_CFG[t.dataset.cfg] === null ? null : 0) : parse(raw);
      if (raw !== '' && v == null) return;
      App.cfg[t.dataset.cfg] = v;
      App.saveCfg();
      App.emit('cfg');
    } else if (t.dataset.msg && t.type !== 'checkbox') {
      App.msgs[t.dataset.msg] = t.value;
      App.saveMsgs();
      updatePreviews();
      App.emit('msgs');
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset.tienda && t.dataset.unit === '$') {
      t.value = App.tienda[t.dataset.tienda] ? U.int(App.tienda[t.dataset.tienda]) : '';
    } else if (t.dataset.cfg) {
      t.value = fmtVal(App.cfg[t.dataset.cfg], t.dataset.unit);
    } else if (t.dataset.msg && t.type === 'checkbox') {
      App.msgs[t.dataset.msg] = t.checked;
      App.saveMsgs();
      App.emit('msgs');
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      VC.ui
        .readFileText(t.files[0])
        .then((txt) => {
          const list = Shop.importCSV(txt);
          toast(list.length + ' pedidos importados del CSV.', 'good');
          render();
        })
        .catch((err) => toast(err.message || 'No se pudo leer el archivo.', 'bad'));
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.act === 'restaurar') {
      const k = t.dataset.k;
      App.msgs[k] = DEFAULT_MSGS[k];
      const ta = el.querySelector('#msg-' + k);
      if (ta) ta.value = App.msgs[k];
      App.saveMsgs();
      updatePreviews();
      App.emit('msgs');
    } else if (t.dataset.act === 'refrescar') {
      Shop.ensure(null, { fresh: true })
        .then(() => {
          toast('Pedidos actualizados.', 'good');
          render();
        })
        .catch((err) => toast(err.message || 'No se pudo actualizar.', 'bad'));
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.ajustes = { mount, render, banner };
})(window);
</script>
<script>
/* main.js */
/* Arranque del panel: menú, conexiones y datos compartidos. */
(function (root) {
  'use strict';
  const VC = root.VC;
  const { Store, Shop, AI, Browser } = VC.runtime;
  const { App, DEFAULT_MSGS, $, e, icon, prefGet, prefSet } = VC.ui;

  const TABS = [
    { id: 'inicio', label: 'Inicio', icon: 'home', grupo: '' },
    { id: 'confirmar', label: 'Confirmar', icon: 'check', grupo: 'Pedidos' },
    { id: 'ganancia', label: 'Ganancia', icon: 'wallet', grupo: 'Pedidos' },
    { id: 'resenas', label: 'Reseñas', icon: 'star', grupo: 'Pedidos' },
    { id: 'clientes', label: 'Clientes', icon: 'users', grupo: 'Pedidos' },
    { id: 'creativos', label: 'Creativos', icon: 'chart', grupo: 'Anuncios' },
    { id: 'competencia', label: 'Competencia', icon: 'eye', grupo: 'Anuncios' },
    { id: 'comentarios', label: 'Comentarios', icon: 'message', grupo: 'Anuncios' },
    { id: 'guiones', label: 'Guiones', icon: 'video', grupo: 'Anuncios' },
    { id: 'ofertas', label: 'Ofertas', icon: 'tag', grupo: 'Negocio' },
    { id: 'productos', label: 'Productos', icon: 'box', grupo: 'Negocio' },
    { id: 'ajustes', label: 'Ajustes', icon: 'sliders', grupo: 'Negocio' },
  ];
  // Barra inferior del celular: las más usadas + "Más"
  const BOTTOM = ['inicio', 'confirmar', 'ganancia', 'guiones'];

  const mounted = new Set();
  const badges = {}; // id → texto
  let ready = false;
  let current = null;

  function initialTab() {
    const h = (location.hash || '').replace('#', '');
    if (TABS.some((t) => t.id === h)) return h;
    const p = prefGet('tab', 'inicio');
    return TABS.some((t) => t.id === p) ? p : 'inicio';
  }

  function badgeHtml(id) {
    const b = badges[id];
    return b ? '<span class="tab-badge' + (b === 'nuevo' ? ' is-new' : '') + '" id="badge-' + id + '">' + e(b) + '</span>' : '';
  }

  function renderNav() {
    let html = '';
    let grupo = null;
    for (const t of TABS) {
      if (t.grupo !== grupo) {
        grupo = t.grupo;
        if (grupo) html += '<div class="nav-group" aria-hidden="true">' + e(grupo) + '</div>';
      }
      const on = t.id === current;
      html +=
        '<button type="button" role="tab" id="nav-' +
        t.id +
        '" aria-controls="panel-' +
        t.id +
        '" aria-selected="' +
        on +
        '" tabindex="' +
        (on ? 0 : -1) +
        '" class="nav-item' +
        (on ? ' is-on' : '') +
        '" data-tab="' +
        t.id +
        '">' +
        icon(t.icon) +
        '<span class="nav-label">' +
        e(t.label) +
        '</span>' +
        badgeHtml(t.id) +
        '</button>';
    }
    $('#nav').innerHTML = html;

    const enBarra = BOTTOM.includes(current);
    $('#bottom-nav').innerHTML =
      BOTTOM.map((id) => {
        const t = TABS.find((x) => x.id === id);
        return '<button type="button" class="bn-item' + (id === current ? ' is-on' : '') + '" data-tab="' + id + '">' + icon(t.icon) + '<span>' + e(t.label) + '</span>' + badgeHtml(id) + '</button>';
      }).join('') +
      '<button type="button" class="bn-item' +
      (enBarra ? '' : ' is-on') +
      '" data-act="mas" aria-haspopup="dialog">' +
      icon('grid') +
      '<span>' +
      e(enBarra ? 'Más' : (TABS.find((t) => t.id === current) || {}).label || 'Más') +
      '</span>' +
      (TABS.some((t) => !BOTTOM.includes(t.id) && badges[t.id]) ? '<span class="tab-badge is-new">•</span>' : '') +
      '</button>';
  }

  function openSheet() {
    const sh = $('#sheet');
    sh.innerHTML =
      '<div class="sheet-card" role="dialog" aria-modal="true" aria-label="Todas las herramientas"><div class="sheet-head"><h3>Herramientas</h3><button type="button" class="btn ghost icon-only" data-act="cerrar-mas" aria-label="Cerrar">' +
      icon('x') +
      '</button></div><div class="sheet-grid">' +
      TABS.map((t) => '<button type="button" class="sheet-item' + (t.id === current ? ' is-on' : '') + '" data-tab="' + t.id + '">' + icon(t.icon) + e(t.label) + (badges[t.id] ? ' <span class="badge">' + e(badges[t.id]) + '</span>' : '') + '</button>').join('') +
      '</div></div>';
    sh.hidden = false;
  }

  function closeSheet() {
    $('#sheet').hidden = true;
  }

  function select(id, focus) {
    current = id;
    prefSet('tab', id);
    try {
      history.replaceState(null, '', '#' + id);
    } catch (err) {
      /* sin historial en esta vista */
    }
    if (badges[id] === 'nuevo') delete badges[id];
    closeSheet();
    renderNav();
    for (const t of TABS) $('#panel-' + t.id).hidden = t.id !== id;
    if (id === 'confirmar') updateBadges();
    if (focus) $('#nav-' + id).focus();
    if (ready && !mounted.has(id)) {
      mounted.add(id);
      VC.tools[id].mount($('#panel-' + id));
    } else if (mounted.has(id) && VC.tools[id].render) VC.tools[id].render();
    root.scrollTo({ top: 0, behavior: 'auto' });
  }

  function renderConn() {
    const shop =
      Shop.mode === 'live'
        ? Shop.error
          ? ['Shopify con error', 'bad']
          : Shop.loading
            ? ['Shopify: cargando…', 'info']
            : ['Shopify conectado', 'good']
        : Shop.mode === 'csv'
          ? ['Pedidos desde CSV', 'warn']
          : Shop.mode === 'pending'
            ? ['Conectando…', 'neutral']
            : ['Shopify sin conexión', 'bad'];
    const items = [shop];
    if (Browser.checked) items.push(Browser.available ? ['Navegador de tu PC', 'good'] : ['Sin navegador (app de escritorio)', 'neutral']);
    if (Store.mode === 'db') items.push(['Datos en tu cuenta', 'good']);
    else if (Store.mode === 'local') items.push(['Datos en este navegador', 'warn']);
    const html = items.map(([t, tone]) => '<span class="conn tone-' + tone + '" title="' + e(t) + '"><span class="dot"></span>' + e(t) + '</span>').join('');
    $('#conn').innerHTML = html;
    $('#conn-m').innerHTML = html;

    const A = VC.auto;
    $('#auto-strip').innerHTML =
      A && A.running
        ? '<div class="auto-strip" role="status"><span class="dot"></span><span>' +
          e(cap(A.NOMBRES[A.running] || A.running)) +
          '</span><span class="txt">' +
          e(A.progress[A.running] || '') +
          '</span><button type="button" data-act="auto-stop">Detener</button></div>'
        : '';
  }

  function cap(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  // Pestaña donde se ven los resultados de cada tarea automática
  const TAB_DE = { competencia: 'competencia', tiendas: 'competencia', productos: 'productos', descubrir: 'productos', guiones: 'guiones' };

  function markNew(tab) {
    if (!tab || tab === current) return;
    badges[tab] = 'nuevo';
    renderNav();
  }

  function updateBadges() {
    const open = Shop.orders.filter((o) => o.estado === 'pendiente' && !App.confirm.get(o.key) && o.day >= VC.util.addDays(VC.util.todayKeyAR(), -6));
    const before = badges.confirmar;
    if (open.length) badges.confirmar = String(open.length);
    else delete badges.confirmar;
    if (before !== badges.confirmar) renderNav();
  }

  async function boot() {
    renderNav();
    for (const t of TABS) $('#panel-' + t.id).hidden = t.id !== current;
    renderConn();

    await Promise.all([Store.init(), Shop.init(), AI.init()]);
    renderConn();

    const [cfg, msgs, ultimo, tienda] = await Promise.all([Store.get('config/negocio'), Store.get('config/mensajes'), Store.get('creativos/ultimo'), Store.get('config/tienda')]);
    if (cfg) Object.assign(App.cfg, cfg);
    if (msgs) Object.assign(App.msgs, DEFAULT_MSGS, msgs);
    if (tienda) Object.assign(App.tienda, tienda);
    if (ultimo) App.ultimoAnalisis = ultimo;

    Store.watch('confirmaciones', (m) => {
      App.confirm = m;
      App.emit('confirm');
      updateBadges();
    });
    Store.watch('resenas', (m) => {
      App.resenas = m;
      App.emit('resenas');
    });
    Shop.onChange(() => {
      renderConn();
      updateBadges();
    });

    ready = true;
    mounted.add(current);
    VC.tools[current].mount($('#panel-' + current));

    // Tareas automáticas: necesitan saber si hay navegador (app de escritorio) y Claude
    await Browser.init();
    renderConn();
    VC.auto.on((ev) => {
      renderConn();
      if (ev.type === 'done' && ev.resultado && ev.resultado.novedades > 0) markNew(TAB_DE[ev.job]);
      if (ev.type === 'done' && ev.origen !== 'manual' && ev.resultado && ev.resultado.resumen) VC.ui.toast(ev.resultado.resumen, 'good');
    });
    await VC.auto.load();
    App.emit('auto');
    VC.auto.boot().catch((err) => console.error(err));
    // Inicio se arma con los pedidos de Shopify: cargarlos aunque no se abra otra pestaña
    Shop.ensure(VC.util.addDays(VC.util.todayKeyAR(), -60)).catch(() => {});
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-act="auto-stop"]')) {
      VC.auto.stop();
      return;
    }
    if (ev.target.closest('[data-act="mas"]')) {
      openSheet();
      return;
    }
    if (ev.target.closest('[data-act="cerrar-mas"]') || ev.target.id === 'sheet') {
      closeSheet();
      return;
    }
    const tab = ev.target.closest('[data-tab]');
    if (tab) {
      select(tab.dataset.tab);
      return;
    }
    const go = ev.target.closest('[data-goto]');
    if (go) {
      ev.preventDefault();
      select(go.dataset.goto);
    }
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !$('#sheet').hidden) {
      closeSheet();
      return;
    }
    const tab = ev.target.closest && ev.target.closest('.nav [role="tab"]');
    if (!tab || (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp')) return;
    ev.preventDefault();
    const i = TABS.findIndex((t) => t.id === tab.dataset.tab);
    const next = TABS[(i + (ev.key === 'ArrowDown' ? 1 : TABS.length - 1)) % TABS.length];
    select(next.id, true);
  });

  VC.nav = { select, TABS };
  current = initialTab();
  boot().catch((err) => {
    console.error(err);
    $('#conn').innerHTML = '<span class="conn tone-bad"><span class="dot"></span>Error al iniciar: ' + e(err && err.message ? err.message : String(err)) + '</span>';
  });
})(window);
</script>
