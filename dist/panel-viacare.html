        })
        .join('') +
      '</ul>';
  }

  function renderAutoPlan() {
    const box = el && $('#ugc-auto-plan', el);
    if (!box) return;
    const d = auto.doc;
    if (!d || !d.razones.length) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML =
      '<div class="ugc-plan"><div class="ugc-plan-head"><span class="eyebrow">Por qué salió así</span>' +
      (d.opts && S.ANGULOS[d.opts.angulo] ? '<button type="button" class="btn link" data-act="tanda-al-form">Usar en “Elegirlo yo”</button>' : '') +
      '</div><ul class="ugc-razones">' +
      d.razones.map((r) => '<li>' + icon('check') + '<span>' + e(r) + '</span></li>').join('') +
      '</ul></div>';
  }

  function renderAutoCfg() {
    const box = el && $('#ugc-auto-cfg', el);
    if (!box || !A) return;
    const c = cfgAuto();
    const dis = A.loaded ? '' : ' disabled';
    const cada = CADA.includes(Number(c.cadaHoras)) ? CADA : CADA.concat(Number(c.cadaHoras) || 24).sort((a, b) => a - b);
    // Si el usuario está usando una opción, conservamos el foco al redibujar
    const act = document.activeElement;
    const keep = act && box.contains(act) && act.dataset ? act.dataset.cfg : '';
    box.innerHTML =
      '<div class="ugc-auto-cfg">' +
      toggle('ugc-auto-solo', !!c.auto, 'Escribirlos solos al abrir el panel', 'data-cfg="auto"' + dis) +
      '<div class="form-grid"><label>Cada<select data-cfg="cadaHoras"' +
      dis +
      '>' +
      cada.map((h) => '<option value="' + h + '"' + (Number(c.cadaHoras) === h ? ' selected' : '') + '>' + e(cadaTxt(h)) + '</option>').join('') +
      '</select></label><label>Guiones por tanda<select data-cfg="cantidad"' +
      dis +
      '>' +
      [1, 2, 3, 4, 5].map((n) => '<option value="' + n + '"' + (Number(c.cantidad) === n ? ' selected' : '') + '>' + n + '</option>').join('') +
      '</select></label><label>Clips por guion<select data-cfg="clips"' +
      dis +
      '>' +
      [3, 4, 5, 6].map((n) => '<option value="' + n + '"' + (Number(c.clips) === n ? ' selected' : '') + '>' + n + ' clips · ' + n * S.CLIP_SECONDS + ' s</option>').join('') +
      '</select></label></div>' +
      (A.cfg.competencia && A.cfg.competencia.guionesTras ? '<p class="note">' + icon('eye') + ' También se escriben después de un escaneo de la competencia con anuncios nuevos.</p>' : '') +
      '</div>';
    if (keep) {
      const opt = $('[data-cfg="' + keep + '"]', box);
      if (opt) opt.focus();
    }
  }

  function renderAutoOut() {
    const box = el && $('#ugc-auto-out', el);
    if (!box) return;
    const d = auto.doc;
    if (!d || !d.guiones.length) {
      box.innerHTML = '';
      return;
    }
    const o = d.opts || {};
    const n = d.guiones.length;
    const datos = [(S.ANGULOS[o.angulo] || {}).label, (S.PERSONAJES[o.personaje] || {}).label, o.clips ? o.clips * S.CLIP_SECONDS + ' s' : ''].filter(Boolean);
    box.innerHTML =
      '<details class="ugc-tanda"' +
      (abierta ? ' open' : '') +
      '><summary>' +
      icon('chevronRight') +
      '<span class="ugc-tanda-title">Última tanda · ' +
      n +
      (n === 1 ? ' guion' : ' guiones') +
      '</span><span class="chips">' +
      datos.map((x) => chip(x, 'neutral')).join('') +
      '</span>' +
      (d.fecha ? '<span class="muted small">' + e(U.timeAgo(d.fecha)) + '</span>' : '') +
      '</summary><div class="ugc-tanda-body">' +
      scriptCards(d.guiones, 'auto-') +
      '</div></details>';
    const det = $('details', box);
    det.addEventListener('toggle', () => {
      abierta = det.open;
      prefSet('ugc-auto-abierta', abierta);
    });
  }

  // Lo guardado en 'guiones/auto' listo para mostrar (o null si no sirve)
  function limpiarTanda(d) {
    if (!d || !Array.isArray(d.guiones)) return null;
    return Object.assign({}, d, {
      guiones: S.sanitize(d, d.opts || {}),
      razones: Array.isArray(d.razones) ? d.razones.map(String) : [],
      opts: d.opts && typeof d.opts === 'object' ? d.opts : {},
    });
  }

  function mostrarTanda(d) {
    const t = limpiarTanda(d);
    // No pisamos una tanda más nueva con una lectura que llegó tarde
    if (t && auto.doc && String(auto.doc.fecha || '') > String(t.fecha || '')) return;
    if (t || !auto.doc) auto.doc = t;
    auto.cargado = true;
    if (!el) return;
    renderAutoHead();
    renderAutoPlan();
    renderAutoOut();
  }

  function cargarTanda() {
    return Store.get('guiones/auto').then(mostrarTanda, () => mostrarTanda(null));
  }

  function onAuto(ev) {
    if (!el) return;
    if (ev.type === 'cfg') {
      if (!ev.job || ev.job === 'guiones' || ev.job === 'competencia') renderAutoHead();
      if (!ev.job || ev.job === 'guiones') renderAutoCfg();
      return;
    }
    if (ev.job !== 'guiones') {
      if (ev.type === 'start' || ev.type === 'done' || ev.type === 'error') renderAutoHead();
      return;
    }
    if (ev.type === 'progress') {
      renderAutoProg();
      return;
    }
    if (ev.type === 'skip' && auto.pedido) toast(ev.motivo || 'No se pudo escribir la tanda acá.', 'warn');
    renderAutoHead();
    renderAutoProg();
    if (ev.type === 'done') {
      abierta = true;
      prefSet('ugc-auto-abierta', true);
    }
    if (ev.type === 'done' || ev.type === 'error') cargarTanda();
  }

  function generarAhora() {
    if (!A || auto.pedido || A.running === 'guiones') return;
    auto.pedido = true;
    renderAutoHead();
    A.run('guiones', { origen: 'manual' }).finally(() => {
      auto.pedido = false;
      renderAutoHead();
    });
  }

  // Copia la configuración de la última tanda al formulario de "Elegirlo yo"
  function pasarAlForm() {
    const o = auto.doc && auto.doc.opts;
    if (!o || !S.ANGULOS[o.angulo]) return;
    state.opts = Object.assign({}, state.opts, {
      angulo: o.angulo,
      personaje: S.PERSONAJES[o.personaje] ? o.personaje : state.opts.personaje,
      personajeLibre: '',
      genero: o.genero === 'm' ? 'm' : 'f',
      clips: U.clamp(Number(o.clips) || 4, 3, 6),
      cantidad: U.clamp(Number(o.cantidad) || 3, 1, 5),
      idiomaPrompt: o.idiomaPrompt === 'es' ? 'es' : 'en',
      oferta: o.oferta || state.opts.oferta,
      extra: o.extra || '',
    });
    prefSet('ugc-opts', state.opts);
    renderForm();
    const f = $('#ugc-form', el);
    if (f && f.scrollIntoView) f.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    toast('Listo: quedó en “Elegirlo yo”. Cambiá lo que quieras.', 'good');
  }

  function renderForm() {
    const form = $('#ugc-form', el);
    if (!form) return;
    const abiertos = $$('details[id][open]', form).map((d) => d.id);
    const o = state.opts;
    const ganador = App.ultimoAnalisis && App.ultimoAnalisis.ganador;
    const angOpts = Object.entries(S.ANGULOS)
      .map(([k, a]) => '<label class="pill-radio' + (o.angulo === k ? ' is-on' : '') + '" for="ang-' + k + '"><input type="radio" name="angulo" id="ang-' + k + '" value="' + k + '"' + (o.angulo === k ? ' checked' : '') + '>' + e(a.label) + (ganador === k ? ' <span class="badge">ganador</span>' : '') + '</label>')
      .join('');
    const per = Object.entries(S.PERSONAJES)
      .map(([k, p]) => '<option value="' + k + '"' + (o.personaje === k ? ' selected' : '') + '>' + e(p.label) + '</option>')
      .join('');
    const brief = (S.ANGULOS[o.angulo] || {}).brief;
    const perDesc = o.personaje !== 'libre' ? (S.PERSONAJES[o.personaje] || S.PERSONAJES.oficinista).es : '';
    let acciones;
    if (state.running)
      acciones =
        '<button type="button" class="btn ghost" data-act="detener">' +
        icon('stop') +
        'Detener</button><span class="muted">' +
        (state.streamChars ? 'Escribiendo… ' + U.int(state.streamChars) + ' caracteres' : 'Pensando los guiones…') +
        '</span>';
    else
      acciones =
        (AI.sample ? '<button type="submit" class="btn">' + icon('sparkles') + 'Escribir con Claude</button>' : '') +
        '<button type="button" class="btn ' +
        (AI.sample ? 'ghost' : '') +
        '" data-act="plantillas">' +
        (AI.sample ? 'Usar plantillas' : 'Generar con plantillas') +
        '</button>';
    form.innerHTML =
      (ganador && ganador !== o.angulo && S.ANGULOS[ganador]
        ? '<p class="note ugc-win">' + icon('trending') + ' Gana <strong>' + e(S.ANGULOS[ganador].label) + '</strong> en tus anuncios. <button type="button" class="btn link" data-act="usar-ganador" data-v="' + e(ganador) + '">Usarlo</button></p>'
        : '') +
      '<fieldset><legend><span>Ángulo</span>' +
      (brief ? info(e(brief), 'Qué cuenta este ángulo') : '') +
      '</legend><div class="pill-row">' +
      angOpts +
      '<label class="pill-radio' +
      (o.angulo === 'libre' ? ' is-on' : '') +
      '" for="ang-libre"><input type="radio" name="angulo" id="ang-libre" value="libre"' +
      (o.angulo === 'libre' ? ' checked' : '') +
      '>Otro</label></div>' +
      (o.angulo === 'libre' ? '<label for="ugc-angulo-libre" class="sr-only">Describí el ángulo</label><input id="ugc-angulo-libre" name="anguloLibre" placeholder="Ej.: regalo para el Día de la Madre" value="' + e(o.anguloLibre) + '">' : '') +
      '</fieldset>' +
      '<div class="form-grid ugc-grid">' +
      field('ugc-personaje', 'Personaje', '<select id="ugc-personaje" name="personaje">' + per + '<option value="libre"' + (o.personaje === 'libre' ? ' selected' : '') + '>Otro (lo describo)</option></select>', perDesc ? info(e(perDesc), 'Cómo es el personaje') : '') +
      field('ugc-clips', 'Clips', '<select id="ugc-clips" name="clips">' + [3, 4, 5, 6].map((n) => '<option value="' + n + '"' + (Number(o.clips) === n ? ' selected' : '') + '>' + n + ' clips · ' + n * S.CLIP_SECONDS + ' s</option>').join('') + '</select>') +
      field('ugc-cantidad', 'Cantidad', '<select id="ugc-cantidad" name="cantidad">' + [1, 2, 3, 4, 5].map((n) => '<option value="' + n + '"' + (Number(o.cantidad) === n ? ' selected' : '') + '>' + n + (n === 1 ? ' guion' : ' guiones') + '</option>').join('') + '</select>') +
      field(
        'ugc-idioma',
        'Idioma del prompt',
        '<select id="ugc-idioma" name="idiomaPrompt"><option value="en"' + (o.idiomaPrompt === 'en' ? ' selected' : '') + '>Inglés (mejor en Flow)</option><option value="es"' + (o.idiomaPrompt === 'es' ? ' selected' : '') + '>Español</option></select>'
      ) +
      '</div>' +
      (o.personaje === 'libre'
        ? '<div class="form-grid wide"><label for="ugc-personaje-libre">Personaje, ropa y lugar<textarea id="ugc-personaje-libre" name="personajeLibre" rows="2" placeholder="Ej.: Hombre de 50, camionero, remera azul, cabina de camión">' +
          e(o.personajeLibre) +
          '</textarea></label><label for="ugc-genero">Habla como<select id="ugc-genero" name="genero"><option value="f"' +
          (o.genero === 'f' ? ' selected' : '') +
          '>Mujer</option><option value="m"' +
          (o.genero === 'm' ? ' selected' : '') +
          '>Hombre</option></select></label></div>'
        : '') +
      more(
        'Oferta y pedido extra',
        '<div class="ugc-extra"><label for="ugc-oferta">Oferta y cierre<input id="ugc-oferta" name="oferta" value="' +
          e(o.oferta) +
          '"></label><label for="ugc-extra">Pedido extra<input id="ugc-extra" name="extra" placeholder="Ej.: que el gancho sea una pregunta" value="' +
          e(o.extra) +
          '"></label><p class="note">Producto: ' +
          e(App.msgs.productoGuiones || S.PRODUCTO_DEFAULT) +
          ' <button type="button" class="btn link" data-goto="ajustes">Cambiar</button></p></div>',
        'ugc-form-more'
      ) +
      '<div class="row-actions ugc-actions">' +
      acciones +
      '</div>' +
      (state.error ? '<p class="error-text">' + e(state.error) + '</p>' : '') +
      (!AI.sample ? '<p class="note">' + icon('info') + ' Sin Claude se arman con plantillas.</p>' : '');
    for (const id of abiertos) {
      const d = form.querySelector('#' + id);
      if (d) d.open = true;
    }
  }

  // Campo del formulario: etiqueta (con ayuda opcional) arriba del control
  function field(id, label, control, ayuda) {
    return '<div class="ugc-field"><span class="ugc-lbl"><label for="' + id + '">' + e(label) + '</label>' + (ayuda || '') + '</span>' + control + '</div>';
  }

  function readForm() {
    const f = $('#ugc-form', el);
    const fd = new FormData(f);
    const o = Object.assign({}, state.opts);
    for (const k of ['angulo', 'anguloLibre', 'personaje', 'personajeLibre', 'genero', 'clips', 'cantidad', 'idiomaPrompt', 'oferta', 'extra']) {
      if (fd.has(k)) o[k] = String(fd.get(k));
    }
    o.clips = Number(o.clips);
    o.cantidad = Number(o.cantidad);
    state.opts = o;
    prefSet('ugc-opts', o);
    return o;
  }

  function fullOpts() {
    const o = Object.assign({}, state.opts, { producto: App.msgs.productoGuiones || S.PRODUCTO_DEFAULT });
    if (o.angulo === 'libre') o.angulo = o.anguloLibre || 'ángulo libre';
    if (o.personaje !== 'libre') o.personajeLibre = '';
    return o;
  }

  async function generate() {
    readForm();
    const opts = fullOpts();
    if (state.opts.angulo === 'libre' && !state.opts.anguloLibre.trim()) {
      toast('Describí el ángulo que querés probar.', 'warn');
      return;
    }
    if (state.opts.personaje === 'libre' && !state.opts.personajeLibre.trim()) {
      toast('Describí el personaje y el lugar.', 'warn');
      return;
    }
    ctl = new AbortController();
    state.running = true;
    state.streamChars = 0;
    state.error = '';
    renderForm();
    try {
      const data = await AI.sample.json(S.buildPrompt(opts), {
        signal: ctl.signal,
        cache: false,
        onText: ({ text }) => {
          state.streamChars = text.length;
          const m = el.querySelector('#ugc-form .row-actions .muted');
          if (m) m.textContent = 'Escribiendo… ' + U.int(text.length) + ' caracteres';
        },
      });
      const list = S.sanitize(data, opts);
      if (!list.length) throw { code: 'invalid_json' };
      setResult(list, 'claude', opts);
    } catch (err) {
      if (err && err.code !== 'cancelled') state.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.running = false;
    renderForm();
  }

  function setResult(list, origen, opts) {
    state.guiones = list;
    state.origen = origen;
    state.fecha = new Date().toISOString();
    renderOut();
    const doc = { guiones: list, origen, fecha: state.fecha, opts: { angulo: opts.angulo, clips: opts.clips, cantidad: opts.cantidad } };
    Store.set('guiones/ultimo', JSON.parse(JSON.stringify(doc))).catch(storeFail);
    const out = $('#ugc-out', el);
    if (out && out.scrollIntoView) out.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }

  function renderOut() {
    const out = $('#ugc-out', el);
    if (!out) return;
    if (!state.guiones.length) {
      out.innerHTML = '';
      return;
    }
    const head =
      '<div class="out-head"><h3>' +
      state.guiones.length +
      (state.guiones.length === 1 ? ' guion' : ' guiones') +
      '</h3>' +
      chip(state.origen === 'claude' ? 'Claude' : 'Plantillas', state.origen === 'claude' ? 'source' : 'neutral') +
      (state.fecha ? '<span class="muted small">' + e(U.timeAgo(state.fecha)) + '</span>' : '') +
      '</div>';
    out.innerHTML = head + scriptCards(state.guiones, '');
  }

  function copyBtn(act, label, attrs, cls) {
    return '<button type="button" class="btn ' + (cls || 'ghost sm') + '" data-act="' + act + '"' + attrs + '>' + icon('copy') + '<span class="lbl">' + e(label) + '</span></button>';
  }

  /*
   * Tarjetas de guion (ficha, clips, prompts y botones de copiar). `pre` va adelante de cada data-act para que los
   * botones de la tanda automática ('auto-') y los del formulario ('') no se pisen.
   */
  function scriptCards(list, pre) {
    return list
      .map((g, gi) => {
        const ga = ' data-g="' + gi + '"';
        return (
          '<article class="script"><header class="script-head"><div><h4>' +
          e(g.titulo) +
          '</h4><div class="chips">' +
          (g.gancho ? chip(g.gancho, 'source') : '') +
          chip(g.clips.length * S.CLIP_SECONDS + ' s · ' + g.clips.length + ' clips', 'neutral') +
          '</div>' +
          (g.nota ? '<p class="muted small">' + e(g.nota) + '</p>' : '') +
          '</div>' +
          copyBtn(pre + 'copiar-guion', 'Copiar todo', ga) +
          '</header>' +
          '<div class="ficha"><div class="sc-row"><span class="eyebrow">Ficha de continuidad</span>' +
          copyBtn(pre + 'copiar-ficha', 'Copiar', ga, 'link') +
          '</div><p class="selectable">' +
          e(g.ficha) +
          '</p></div><ol class="clips">' +
          g.clips
            .map(
              (c, ci) =>
                '<li class="clip"><div class="clip-rail"><span class="clip-n">' +
                c.n +
                '</span><span class="clip-time mono">' +
                c.desde +
                '–' +
                c.hasta +
                ' s</span></div><div class="clip-body"><div class="clip-meta">' +
                e(c.plano) +
                (c.largo ? ' ' + chip('Largo para 8 s · ' + c.palabras + ' palabras', 'warn') : '') +
                '</div><p class="clip-dialog">“' +
                e(c.dialogo) +
                '”</p><p class="clip-action">' +
                e(c.accion) +
                '</p>' +
                (c.texto_pantalla ? '<p class="clip-extra"><span class="eyebrow">En pantalla</span>' + e(c.texto_pantalla) + '</p>' : '') +
                '<div class="prompt-box"><div class="sc-row"><span class="eyebrow">Prompt para Flow</span>' +
                copyBtn(pre + 'copiar-prompt', 'Copiar', ga + ' data-c="' + ci + '"', 'soft sm') +
                '</div><pre class="selectable">' +
                e(c.prompt) +
                '</pre></div>' +
                (c.continuidad ? '<p class="clip-extra continuity"><span class="eyebrow">Empalme</span>' + e(c.continuidad) + '</p>' : '') +
                '</div></li>'
            )
            .join('') +
          '</ol>' +
          (g.caption ? '<p class="clip-extra script-caption"><span class="eyebrow">Caption</span><span class="selectable">' + e(g.caption) + '</span></p>' : '') +
          '</article>'
        );
      })
      .join('');
  }

  // Copia y muestra "Copiado" sin perder el ícono del botón
  function copiar(text, btn) {
    copyText(text).then((ok) => {
      const lbl = btn && btn.querySelector('.lbl');
      if (!ok || !lbl) return;
      if (!lbl.dataset.prev) lbl.dataset.prev = lbl.textContent;
      lbl.textContent = 'Copiado';
      btn.classList.add('is-done');
      clearTimeout(btn._t);
      btn._t = setTimeout(() => {
        lbl.textContent = lbl.dataset.prev;
        btn.classList.remove('is-done');
      }, 1600);
    });
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    let act = t.dataset.act;
    let lista = state.guiones;
    if (act.startsWith('auto-')) {
      act = act.slice(5);
      lista = (auto.doc && auto.doc.guiones) || [];
    }
    const g = lista[Number(t.dataset.g)];
    switch (act) {
      case 'plantillas': {
        readForm();
        const opts = fullOpts();
        if (!S.ANGULOS[state.opts.angulo]) toast('Las plantillas solo tienen los 4 ángulos base. Uso “Dolor”.', 'warn');
        setResult(S.fallbackScripts(opts), 'plantillas', opts);
        break;
      }
      case 'detener':
        if (ctl) ctl.abort();
        break;
      case 'usar-ganador':
        state.opts.angulo = t.dataset.v;
        prefSet('ugc-opts', state.opts);
        renderForm();
        break;
      case 'copiar-guion':
        if (g) copiar(S.scriptAsText(g), t);
        break;
      case 'copiar-ficha':
        if (g) copiar(g.ficha, t);
        break;
      case 'copiar-prompt': {
        const c = g && g.clips[Number(t.dataset.c)];
        if (c) copiar(c.prompt, t);
        break;
      }
      case 'tanda-generar':
        generarAhora();
        break;
      case 'tanda-detener':
        if (A && A.running === 'guiones') A.stop();
        break;
      case 'tanda-al-form':
        pasarAlForm();
        break;
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset && t.dataset.cfg && A && t.closest('#ugc-auto-cfg')) {
      const k = t.dataset.cfg;
      A.setCfg('guiones', { [k]: k === 'auto' ? t.checked : Number(t.value) });
      return;
    }
    if (!t.closest('#ugc-form')) return;
    readForm();
    if (t.name === 'angulo' || t.name === 'personaje') renderForm();
  }

  /* ---------- Tanda automática: la tarea ---------- */

  function cortarSiCancelo(ctx) {
    if (ctx.signal.aborted) throw { code: 'cancelled' };
  }

  function refrescarProg() {
    if (el) renderAutoProg();
  }

  async function guardar(path, data) {
    try {
      await Store.set(path, data);
    } catch (err) {
      const code = err && err.code;
      throw new Error(
        code === 'invalid_argument'
          ? 'No tenés permiso para guardar cambios en este panel.'
          : code === 'quota_exceeded'
            ? 'Se llenó el espacio del panel. Borrá datos viejos para seguir guardando.'
            : 'No se pudieron guardar los guiones. Revisá la conexión y probá de nuevo.'
      );
    }
  }

  /*
   * Escribe una tanda de guiones con lo que ya sabe el panel: último reporte de anuncios, anuncios de la competencia,
   * dudas de los comentarios y las tandas anteriores. Funciona aunque la pestaña no esté abierta.
   */
  async function escribirTanda(ctx) {
    if (!AI.sample) throw new Error('Claude no está disponible en esta vista.');
    const pasos = [
      { label: 'Juntar tu último reporte de anuncios, la competencia y los comentarios', estado: 'curso', det: '' },
      { label: 'Escribir los guiones con Claude', estado: 'espera', det: '' },
      { label: 'Guardar la tanda', estado: 'espera', det: '' },
    ];
    auto.pasos = pasos;
    let i = 0;
    const avanzar = (det) => {
      pasos[i].estado = 'ok';
      if (det != null) pasos[i].det = det;
      i++;
      if (pasos[i]) pasos[i].estado = 'curso';
      refrescarProg();
    };
    refrescarProg();
    try {
      ctx.progress('Juntando datos…');
      const [analisis, comp, escaneo, resp, prev] = await Promise.all([
        App.ultimoAnalisis ? Promise.resolve(App.ultimoAnalisis) : Store.get('creativos/ultimo'),
        Store.list('competencia'),
        Store.get('escaneos/ultimo'),
        Store.list('respuestas'),
        Store.get('guiones/auto'),
      ]);
      cortarSiCancelo(ctx);
      const c = cfgAuto();
      const pref = prefGet('ugc-opts', {}) || {};
      const p = P.plan({
        ultimoAnalisis: analisis,
        competencia: { ads: [...comp.values()], escaneo },
        objeciones: P.objeciones(resp),
        historial: (prev && prev.historial) || [],
        tienda: App.tienda,
        cfg: { cantidad: c.cantidad, clips: c.clips },
        idioma: pref.idiomaPrompt === 'es' ? 'es' : 'en',
        hoy: U.todayKeyAR(),
      });
      const o = p.opts;
      const angulo = (S.ANGULOS[o.angulo] || {}).label || o.angulo;
      avanzar('Ángulo ' + angulo + ' · ' + ((S.PERSONAJES[o.personaje] || {}).label || o.personaje));
      pasos[1].label = 'Escribir ' + o.cantidad + (o.cantidad === 1 ? ' guion' : ' guiones') + ' de ' + o.clips + ' clips con Claude';
      refrescarProg();

      ctx.progress('Escribiendo ' + (o.cantidad === 1 ? 'el guion' : o.cantidad + ' guiones') + ' (ángulo ' + angulo + ')…');
      const opts = Object.assign({}, o, { producto: App.msgs.productoGuiones || S.PRODUCTO_DEFAULT });
      let aviso = 0;
      let data;
      try {
        data = await AI.sample.json(S.buildPrompt(opts), {
          signal: ctx.signal,
          cache: false,
          onText: ({ text }) => {
            // De a ratos: cada aviso redibuja el panel y la barra de arriba
            if (Date.now() - aviso < 800) return;
            aviso = Date.now();
            pasos[1].det = 'Escribiendo… ' + U.int(text.length) + ' caracteres';
            ctx.progress('Escribiendo guiones… ' + U.int(text.length) + ' caracteres');
          },
        });
      } catch (err) {
        if ((err && err.code === 'cancelled') || ctx.signal.aborted) throw err;
        if (AI.permanent(err)) {
          AI.sample = null;
          if (el) renderAutoHead();
        }
        throw new Error(AI.errorText(err));
      }
      cortarSiCancelo(ctx);
      const list = S.sanitize(data, opts);
      if (!list.length) throw new Error('Claude no devolvió guiones que se puedan usar. Probá de nuevo o bajá la cantidad de guiones por tanda.');
      avanzar(list.length + (list.length === 1 ? ' guion' : ' guiones'));

      ctx.progress('Guardando la tanda…');
      const fecha = new Date().toISOString();
      const doc = P.armarDoc({
        fecha,
        origen: ctx.origen,
        motivo: ctx.motivo,
        razones: p.razones,
        opts: o,
        guiones: list,
        historial: P.sumarHistorial(prev && prev.historial, { fecha, angulo: o.angulo, personaje: o.personaje }),
      });
      await guardar('guiones/auto', JSON.parse(JSON.stringify(doc)));
      avanzar();
      mostrarTanda(doc);
      const n = doc.guiones.length;
      return { novedades: n, guiones: n, angulo: o.angulo, resumen: P.resumen(n, o.angulo) };
    } catch (err) {
      if (pasos[i]) {
        pasos[i].estado = 'error';
        pasos[i].det = (err && err.code === 'cancelled') || ctx.signal.aborted ? 'Cancelado' : (err && err.message) || 'Error inesperado';
      }
      refrescarProg();
      throw err;
    }
  }

  if (A) A.register('guiones', { needs: ['sample'], run: escribirTanda });

  VC.tools = VC.tools || {};
  VC.tools.guiones = { mount, render };
})(window);
</script>
<script>
/* ui/clientes.js */
/* Reactivador de clientes que ya pagaron */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const C = VC.customers;
  const OF = VC.offers;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, chip, waButton, emptyState, shopStatusBanner, toast, prefGet, prefSet, storeFail, icon, pageHead, info, more, seg } = VC.ui;

  const R_ESTADOS = {
    enviado: { label: 'Oferta enviada', tone: 'warn' },
    respondio: { label: 'Respondió', tone: 'info' },
    compro: { label: 'Compró', tone: 'good' },
    no: { label: 'No le interesa', tone: 'neutral' },
  };

  const state = {
    filtro: prefGet('cli-filtro', 'escribir'),
    cfg: Object.assign({}, C.DEFAULT_CFG),
    contactos: new Map(),
    elegida: {}, // wa → oferta elegida a mano
    verMsg: new Set(), // wa con el mensaje desplegado
    loading: false,
    error: null,
    codigo: { pct: 15, running: false, msg: '' },
  };
  let el;

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead(
        'Clientes',
        'Volvé a venderle a quien ya te compró.',
        '<button class="btn ghost icon-only" data-act="refrescar" aria-label="Actualizar pedidos" title="Actualizar">' + icon('refresh') + '</button>'
      ) +
      '<div id="cli-status"></div><div id="cli-summary"></div>' +
      '<section class="panel cli-ofertas-panel">' +
      more('Ofertas y mensajes', '<div id="cli-ofertas"></div>', 'cli-ofertas-more') +
      '</section><div id="cli-filters"></div><div id="cli-list" class="order-list"></div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('input', onInput);
    // "toggle" no burbujea: se escucha en captura para recordar qué mensajes están abiertos
    el.addEventListener(
      'toggle',
      (ev) => {
        const d = ev.target;
        if (!d.classList || !d.classList.contains('cli-msg')) return;
        if (d.open) state.verMsg.add(d.dataset.wa);
        else state.verMsg.delete(d.dataset.wa);
      },
      true
    );
    Shop.onChange(render);
    App.on((w) => {
      if (w === 'cfg' || w === 'tienda') renderOfertas();
      if (w === 'resenas' || w === 'cfg' || w === 'msgs' || w === 'tienda') render();
    });
    Store.get('config/reactivar').then((d) => {
      if (d) state.cfg = Object.assign({}, C.DEFAULT_CFG, d, { mensajes: Object.assign({}, d.mensajes || {}) });
      renderOfertas();
      render();
    });
    Store.watch('reactivacion', (m) => {
      state.contactos = m;
      render();
    });
    renderOfertas();
    load();
  }

  async function load(fresh) {
    state.loading = true;
    state.error = null;
    render();
    try {
      await Shop.ensure(U.addDays(U.todayKeyAR(), -365), { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    render();
  }

  const saveCfg = VC.ui.debounce(() => Store.set('config/reactivar', JSON.parse(JSON.stringify(state.cfg))).catch(storeFail), 700);

  function ofertaDe(c) {
    const ct = state.contactos.get(c.wa);
    return state.elegida[c.wa] || (ct && ct.oferta) || C.suggestOffer(c);
  }

  function lists() {
    const all = C.buildCustomers(Shop.orders, { minDias: Number(state.cfg.minDias) || 20, resenas: App.resenas });
    const now = Date.now();
    const pausa = (Number(state.cfg.pausaDias) || 30) * 24;
    for (const c of all) {
      const ct = state.contactos.get(c.wa);
      c.contacto = ct || null;
      c.volvio = ct ? C.reordered(c, ct.enviadoEn) : null;
      c.enPausa = ct && ct.enviadoEn && U.hoursSince(ct.enviadoEn, now) < pausa;
    }
    return {
      all,
      escribir: all.filter((c) => c.listo && !c.contacto),
      escritos: all.filter((c) => c.contacto && !c.volvio && c.contacto.estado !== 'compro'),
      volvieron: all.filter((c) => c.volvio || (c.contacto && c.contacto.estado === 'compro')),
    };
  }

  function render() {
    if (!el) return;
    const st = $('#cli-status', el);
    if (Shop.mode === 'none') st.innerHTML = shopStatusBanner({ message: 'Abrí el panel desde claude.ai para ver tus pedidos, o importá el CSV de Shopify.' });
    else st.innerHTML = state.error ? shopStatusBanner(state.error) : '';

    const L = lists();
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;
    const recuperado = U.sum(L.volvieron, (c) => (c.volvio ? c.volvio.total : 0));
    const respondieron = L.all.filter((c) => c.contacto && ['respondio', 'compro'].includes(c.contacto.estado)).length;
    const escritos = L.escritos.length + L.volvieron.length;
    $('#cli-summary', el).innerHTML = loadingFirst
      ? '<div class="summary-strip is-loading">Cargando clientes…</div>'
      : '<div class="summary-strip">' +
        stat(L.escribir.length, 'para escribir', L.escribir.length ? 'warn' : '') +
        stat(escritos, respondieron ? 'escritos · ' + respondieron + (respondieron === 1 ? ' respondió' : ' respondieron') : 'escritos') +
        stat(L.volvieron.length, 'volvieron a comprar', L.volvieron.length ? 'good' : '') +
        stat(recuperado ? U.moneyShort(recuperado) : '—', 'vendido de nuevo') +
        '</div>';

    $('#cli-filters', el).innerHTML = seg(
      'cli-filtro',
      [
        { value: 'escribir', label: 'Para escribir', count: L.escribir.length },
        { value: 'escritos', label: 'Escritos', count: L.escritos.length },
        { value: 'volvieron', label: 'Volvieron', count: L.volvieron.length },
        { value: 'all', label: 'Todos', count: L.all.length },
      ],
      state.filtro
    );

    const list = L[state.filtro] || L.all;
    const box = $('#cli-list', el);
    if (loadingFirst) box.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    else if (!list.length) box.innerHTML = emptyText(L);
    else box.innerHTML = list.map(card).join('');
  }

  function stat(v, label, tone) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"><span class="stat-value">' + e(v) + '</span><span class="stat-label">' + e(label) + '</span></div>';
  }

  function emptyText(L) {
    const sinClientes = ['Sin clientes todavía', 'Aparecen cuando un pedido se entrega y se cobra.', 'users'];
    const m = {
      escribir: L.all.length ? ['Todo al día', 'Cada cliente aparece ' + (Number(state.cfg.minDias) || 20) + ' días después de su compra.', 'check'] : sinClientes,
      escritos: ['Sin ofertas enviadas', 'Todavía no le escribiste a ningún cliente.', 'send'],
      volvieron: ['Nadie volvió todavía', 'Cuando alguien vuelva a comprar, aparece acá solo.', 'gift'],
      all: sinClientes,
    }[state.filtro] || sinClientes;
    return emptyState(m[0], e(m[1]), '', m[2]);
  }

  function ofertaPills(c, actual) {
    const sugerida = C.suggestOffer(c);
    return (
      '<div class="seg cli-of" role="group" aria-label="Oferta para ' +
      e(c.nombre || 'el cliente') +
      '">' +
      Object.entries(C.OFERTAS)
        .map(
          ([k, o]) =>
            '<button type="button" class="seg-btn' +
            (k === actual ? ' is-on' : '') +
            '" aria-pressed="' +
            (k === actual) +
            '" data-act="elegir-oferta" data-key="' +
            e(c.wa) +
            '" data-value="' +
            k +
            '" title="' +
            e(o.label) +
            (k === sugerida ? ' (sugerida)' : '') +
            '">' +
            (k === sugerida ? icon('sparkles') : '') +
            e(o.corto || o.label) +
            (k === sugerida ? '<span class="sr-only"> (sugerida)</span>' : '') +
            '</button>'
        )
        .join('') +
      '</div>'
    );
  }

  function faltan(c) {
    const n = Math.max(1, (Number(state.cfg.minDias) || 20) - c.dias);
    return 'Escribile en ' + n + (n === 1 ? ' día' : ' días');
  }

  function card(c) {
    const of = ofertaDe(c);
    const ct = c.contacto;
    const msg = C.message(c, of, state.cfg, App.datos());
    const chips = [
      c.volvio ? chip('Volvió a comprar: ' + c.volvio.name, 'good') : ct && R_ESTADOS[ct.estado] ? chip(R_ESTADOS[ct.estado].label, R_ESTADOS[ct.estado].tone) : '',
      c.abierto ? chip('Pedido abierto', 'neutral') : '',
      !c.listo && !c.abierto && !ct ? chip(faltan(c), 'neutral') : '',
      c.resena ? chip('Reseña ' + (Number(c.resena.estrellas) || 5) + '/5', 'good') : '',
      c.compras > 1 ? chip(c.compras + ' compras', 'source') : '',
    ].join('');
    const meta = [c.ciudad, c.unidades + (c.unidades === 1 ? ' unidad' : ' unidades'), 'compró ' + U.timeAgo(c.ultimaCompra), ct && ct.enviadoEn ? 'escrito ' + U.timeAgo(ct.enviadoEn) : '']
      .filter(Boolean)
      .map(e)
      .join(' · ');
    const w = e(c.wa);
    return (
      '<article class="order-card cli-card' +
      (c.volvio ? ' is-good' : '') +
      (ct && !c.volvio ? ' has-decide' : '') +
      '"><div class="oc-top"><div class="oc-who"><strong>' +
      e(c.nombre || 'Sin nombre') +
      '</strong>' +
      (chips ? '<span class="chips">' + chips + '</span>' : '') +
      '</div><div class="oc-total" title="Total que te compró">' +
      e(U.money(c.gastado)) +
      '</div></div><div class="oc-meta muted small">' +
      meta +
      '</div>' +
      (!c.volvio
        ? '<div class="cli-offer"><span class="cli-offer-label">Oferta</span>' +
          ofertaPills(c, of) +
          '</div><details class="cli-msg" data-wa="' +
          w +
          '"' +
          (state.verMsg.has(c.wa) ? ' open' : '') +
          '><summary>' +
          icon('chevronRight') +
          'Ver mensaje</summary><p class="preview selectable">' +
          e(msg) +
          '</p></details>' +
          '<div class="oc-actions"><div class="row-actions">' +
          waButton(U.waLink(c.phone.wa, msg), ct ? 'Volver a escribir' : 'Enviar oferta', 'wa-oferta', c.wa, ct ? 'ghost' : 'wa') +
          '</div>' +
          (ct
            ? '<div class="row-actions decide" role="group" aria-label="¿Qué respondió?">' +
              decide('respondio', 'Respondió', c, 'warn', 'message') +
              decide('compro', 'Compró', c, 'good', 'check') +
              decide('no', 'No le interesa', c, 'bad', 'x') +
              '<button class="btn link" data-act="deshacer" data-key="' +
              w +
              '">Deshacer</button></div>'
            : '') +
          '</div>'
        : '') +
      '</article>'
    );
  }

  function decide(v, label, c, tone, ic) {
    const on = c.contacto && c.contacto.estado === v;
    return '<button class="btn sm decide-btn tone-' + tone + (on ? ' is-on' : '') + '" aria-pressed="' + !!on + '" data-act="marcar" data-estado="' + v + '" data-key="' + e(c.wa) + '">' + icon(ic) + e(label) + '</button>';
  }

  function renderOfertas() {
    const box = $('#cli-ofertas', el);
    if (!box) return;
    const f = state.cfg;
    box.innerHTML =
      '<div class="cli-of-body"><div class="form-grid">' +
      field('precioOferta', 'Precio de la 2ª unidad', U.int(f.precioOferta), 'numeric') +
      field('minDias', 'Escribir a los (días)', f.minDias, 'numeric') +
      field('beneficioAmigo', 'Beneficio para el amigo', f.beneficioAmigo) +
      field('premio', 'Premio por recomendar', f.premio) +
      field('ofertaLibre', 'Oferta de recompra', f.ofertaLibre) +
      field('codigo', 'Código de descuento', f.codigo) +
      '</div><p class="note" id="cli-deja">' +
      dejaHtml() +
      '</p>' +
      (Shop.mode === 'live'
        ? '<div class="cli-code"><label class="field-inline" for="cli-pct">Crear el código en Shopify con <span class="input-unit inline"><input id="cli-pct" class="num-input short" inputmode="numeric" value="' +
          e(state.codigo.pct) +
          '"><span class="unit">%</span></span></label><button class="btn ghost sm" data-act="crear-codigo"' +
          (state.codigo.running ? ' disabled' : '') +
          '>' +
          (state.codigo.running ? 'Creando…' : 'Crear código') +
          '</button>' +
          info('Usa el código de arriba. Revisá que tu formulario de pago contra entrega acepte cupones; si no, aplicá el precio a mano cuando el cliente confirme.') +
          '</div>' +
          (state.codigo.msg ? '<p class="note"><strong>' + e(state.codigo.msg) + '</strong></p>' : '')
        : '') +
      '<div class="cli-tpl-head"><h4>Mensajes</h4>' +
      info('Podés usar: <span class="mono">{nombre} {tienda} {precio} {precio_oferta} {beneficio_amigo} {premio} {oferta_libre} {codigo_txt}</span>') +
      '</div><div class="templates">' +
      Object.entries(C.OFERTAS)
        .map(
          ([k, o]) =>
            '<div class="template"><label for="cli-msg-' +
            k +
            '">' +
            e(o.label) +
            '<textarea id="cli-msg-' +
            k +
            '" data-msg="' +
            k +
            '" rows="6">' +
            e((f.mensajes && f.mensajes[k]) || o.mensaje) +
            '</textarea></label></div>'
        )
        .join('') +
      '</div></div>';
  }

  // Lo que deja la segunda unidad al precio de oferta
  function dejaHtml() {
    const f = state.cfg;
    if (!VC.profit.costsReady(App.cfg)) return icon('wallet') + ' Cargá tus costos en Ajustes para ver cuánto te deja cada oferta.';
    const rates = O.historicalRates(Shop.orders);
    // Un cliente que responde la oferta ya confirmó: tasa de confirmación 100%
    const ev = OF.evaluate({ unidades: 1, precio: Number(f.precioOferta) || 0 }, Object.assign({}, App.cfg, { tasaConfirmacion: 100 }), rates, 0, 0);
    return icon('wallet') + ' Cada 2ª unidad a <strong>' + e(U.money(f.precioOferta)) + '</strong> te deja <strong>' + e(U.money(ev.esperado)) + '</strong> en promedio, sin anuncios.';
  }

  function field(k, label, v, mode) {
    return '<label for="cli-' + k + '">' + e(label) + '<input id="cli-' + k + '" data-cfg="' + k + '"' + (mode ? ' inputmode="' + mode + '"' : '') + ' value="' + e(v == null ? '' : v) + '"></label>';
  }

  async function setC(wa, patch) {
    const prev = state.contactos.get(wa) || {};
    const next = Object.assign({}, prev, patch, { actualizado: new Date().toISOString() });
    state.contactos.set(wa, next);
    render();
    try {
      await Store.set('reactivacion/' + wa, next);
    } catch (err) {
      storeFail(err);
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'cli-filtro') {
      state.filtro = t.dataset.value;
      prefSet('cli-filtro', state.filtro);
      render();
      return;
    }
    const wa = t.dataset.key;
    switch (t.dataset.act) {
      case 'refrescar':
      case 'reintentar':
        load(true);
        break;
      case 'permisos':
        VC.runtime.managePermissions();
        break;
      case 'elegir-oferta':
        state.elegida[wa] = t.dataset.value;
        render();
        break;
      case 'wa-oferta': {
        const c = lists().all.find((x) => x.wa === wa);
        const of = c ? ofertaDe(c) : 'familia';
        setTimeout(() => setC(wa, { estado: 'enviado', oferta: of, enviadoEn: new Date().toISOString(), nombre: c ? c.nombre : '' }), 60);
        break;
      }
      case 'marcar':
        setC(wa, { estado: t.dataset.estado });
        break;
      case 'deshacer':
        state.contactos.delete(wa);
        render();
        Store.remove('reactivacion/' + wa).catch(storeFail);
        break;
      case 'crear-codigo':
        crearCodigo();
        break;
    }
  }

  async function crearCodigo() {
    const code = String(state.cfg.codigo || '').trim().toUpperCase();
    const pct = Number(U.parseNum($('#cli-pct', el).value));
    if (!code || !/^[A-Z0-9_-]{3,30}$/.test(code)) {
      toast('Escribí un código de 3 a 30 letras o números, sin espacios (ej.: VUELVE15).', 'warn');
      return;
    }
    if (!(pct >= 1 && pct <= 90)) {
      toast('El descuento tiene que ser entre 1 y 90%.', 'warn');
      return;
    }
    state.codigo = { pct, running: true, msg: '' };
    renderOfertas();
    try {
      const res = await Shop.createDiscount({ code, percentage: pct, title: 'Reactivación clientes ' + code });
      state.codigo.msg = /error|invalid|taken|ya existe|already/i.test(res) ? 'Shopify respondió: ' + res.slice(0, 160) : 'Código ' + code + ' creado (' + pct + '%).';
      if (!/error|invalid|taken|already/i.test(res)) {
        state.cfg.codigo = code;
        saveCfg();
      }
    } catch (err) {
      state.codigo.msg = err && err.code === 'approval_required' ? 'Shopify pidió tu aprobación. Aprobala y probá de nuevo.' : err && err.code === 'not_in_manifest' ? 'No diste permiso para crear descuentos desde esta página.' : 'No se pudo crear: ' + ((err && err.message) || 'error de Shopify');
    }
    state.codigo.running = false;
    renderOfertas();
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.dataset.cfg) {
      const k = t.dataset.cfg;
      state.cfg[k] = ['precioOferta', 'minDias'].includes(k) ? U.parseMoney(t.value) || 0 : t.value;
      saveCfg();
      render();
    } else if (t.dataset.msg) {
      state.cfg.mensajes = Object.assign({}, state.cfg.mensajes, { [t.dataset.msg]: t.value });
      saveCfg();
      render();
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset.cfg === 'precioOferta') {
      const d = $('#cli-deja', el);
      if (d) d.innerHTML = dejaHtml();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      VC.ui
        .readFileText(t.files[0])
        .then((txt) => {
          Shop.importCSV(txt);
          state.error = null;
          render();
        })
        .catch((err) => toast(err.message || 'No se pudo leer el archivo.', 'bad'));
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.clientes = { mount, render: () => (renderOfertas(), render()), load };
})(window);
</script>
<script>
/* ui/tiendas.js */
/* Tiendas de la competencia: catálogo público de Shopify y señales de venta (dentro de la pestaña Competencia) */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const R = VC.research;
  const S = VC.stores;
  const A = VC.auto;
  const { Store, Browser } = VC.runtime;
  const { e, $, App, chip, emptyState, toast, storeFail, icon, bubble, info, more, toggle } = VC.ui;

  const CADA = [24, 48, 72];
  const TONO = { alto: 'good', medio: 'info', bajo: 'neutral' };

  const state = {
    docs: new Map(), // dominio → documento guardado
    anuncios: {}, // dominio → {anuncios, diasMax} (de los anuncios guardados en Competencia)
    log: [], // [{st: 'ok'|'err', texto}] de la corrida en curso o la última
    enCola: false,
    confirmar: null, // {d, hasta}: botón Quitar esperando el segundo toque
    skip: '', // por qué no se pudo revisar (si el motor la salteó)
    det: {}, // desplegables abiertos o cerrados a mano en cada tarjeta
  };
  let el = null;
  let unwatch = null;
  let suscripto = false;

  /* ---------- Tarea automática ---------- */

  async function revisarTiendas(ctx) {
    const cfg = A.cfg.tiendas || {};
    const guardadas = await Store.list('tiendas');
    const dominios = S.dominiosARevisar(cfg.dominios, guardadas, cfg.quitadas);
    state.log = [];
    paintStatus();
    if (!dominios.length) return { novedades: 0, tiendas: 0, resumen: 'No hay tiendas para revisar.' };
    const totales = { nuevos: 0, precios: 0, agotados: 0, repuestos: 0, resenas: 0 };
    let hechas = 0;
    let errores = 0;
    for (let i = 0; i < dominios.length; i++) {
      if (ctx.signal.aborted) break;
      const d = dominios[i];
      const paso = i + 1 + '/' + dominios.length + ' · ' + d;
      ctx.progress(paso);
      let cat = null;
      let error = '';
      const resenas = {};
      try {
        const texto = await Browser.read(R.productsJsonUrl(d), { ready: R.shopifyReady, tries: 3, firstWait: 1500, wait: 2000 });
        cat = S.leerCatalogo(texto);
        if (!cat) error = S.motivoError(texto);
      } catch (err) {
        if (Browser.fatal(err)) throw new Error(Browser.errorText(err));
        error = Browser.errorText(err);
      }
      // Reseñas de sus productos de postura (las páginas de producto las muestran; el catálogo no)
      const top = cat ? S.posturaOrdenada(cat.productos).slice(0, S.TOPE_RESENAS) : [];
      for (let j = 0; j < top.length && !ctx.signal.aborted; j++) {
        ctx.progress(paso + ' · reseñas ' + (j + 1) + '/' + top.length);
        try {
          resenas[top[j].handle] = R.reviewCount(await Browser.read(R.productUrl(d, top[j].handle), { tries: 2 }));
        } catch (err) {
          if (Browser.fatal(err)) throw new Error(Browser.errorText(err));
          resenas[top[j].handle] = null;
        }
      }
      const prev = guardadas.get(d) || null;
      const r = S.revisar(prev, {
        dominio: d,
        fecha: new Date().toISOString(),
        productos: cat ? cat.productos : null,
        parcial: cat ? cat.parcial : false,
        resenas,
        error,
        origen: prev ? prev.origen : 'anuncio', // sin documento: la sumó el escaneo de anuncios
      });
      hechas++;
      // Si la quitaron mientras se revisaba, no se vuelve a guardar
      if ((A.cfg.tiendas.quitadas || []).includes(d)) continue;
      let guardo = true;
      await Store.set('tiendas/' + d, r.doc).catch(() => (guardo = false));
      state.docs.set(d, r.doc);
      if (r.doc.ultima.error) {
        errores++;
        state.log.push({ st: 'err', texto: d + ' · ' + r.doc.ultima.error });
      } else {
        for (const k of Object.keys(totales)) totales[k] += r.cuenta[k];
        state.log.push({ st: 'ok', texto: d + ' · ' + lineaLog(r) + (guardo ? '' : ' (no se pudo guardar)') });
      }
      paintList();
    }
    const novedades = totales.nuevos + totales.precios + totales.agotados + totales.repuestos + totales.resenas;
    return {
      novedades,
      tiendas: hechas,
      cambios: totales.nuevos + totales.precios + totales.agotados + totales.repuestos,
      resenas: totales.resenas,
      errores,
      resumen: S.resumenCorrida(hechas, totales, errores),
    };
  }

  function lineaLog(r) {
    const u = r.doc.ultima;
    const n = u.total + ' producto' + (u.total === 1 ? '' : 's');
    if (!r.doc.cambios) return n + ', primera revisión';
    const c = r.cuenta.nuevos + r.cuenta.precios + r.cuenta.agotados + r.cuenta.repuestos;
    return n + ', ' + (c ? c + ' cambio' + (c === 1 ? '' : 's') : 'sin cambios') + (r.cuenta.resenas ? ', +' + r.cuenta.resenas + ' reseñas' : '');
  }

  A.register('tiendas', { needs: ['browser'], run: revisarTiendas });

  /* ---------- Interfaz ---------- */

  const EXPLICA =
    'Leo el catálogo público de cada tienda Shopify (precios, agotados y productos nuevos) y las reseñas de sus correctores. Shopify no muestra las ventas de otros: comparando una revisión con la siguiente se ven lanzamientos, cambios de precio y reseñas nuevas. Son señales, no ventas exactas, y las reseñas pueden ser inventadas.';
  const MOV = { alto: 'Mucho movimiento', medio: 'Algo de movimiento', bajo: 'Poco movimiento' };

  function mount(container) {
    if (!container) return;
    if (el === container && $('.tn', el)) {
      render();
      return;
    }
    el = container;
    el.innerHTML =
      '<section class="panel tn" aria-labelledby="tn-title">' +
      '<div class="tn-top">' +
      bubble('store', 'source') +
      '<div class="tn-top-txt"><div class="tn-title"><h3 id="tn-title">Tiendas</h3>' +
      info(EXPLICA, 'Cómo se miden las tiendas') +
      '</div><p class="tn-meta" id="tn-meta"></p></div><div class="row-actions" id="tn-act"></div></div>' +
      '<div id="tn-ctrl" class="tn-ctrl"></div><div id="tn-prog" class="tn-prog"></div>' +
      '<form class="tn-add" id="tn-add" novalidate><label for="tn-dominio" class="sr-only">Dominio o link de la tienda</label><input id="tn-dominio" name="dominio" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tienda.com.ar o su link"><button class="btn ghost" type="submit">' +
      icon('plus') +
      'Agregar</button></form>' +
      '<div id="tn-summary"></div><div id="tn-list" class="tn-list"></div>' +
      more('Opciones', '<div id="tn-opts" class="tn-opts"></div>', 'tn-more') +
      '</section>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('submit', onSubmit);
    // Recordamos qué desplegables de cada tarjeta quedaron abiertos (el evento toggle no burbujea)
    el.addEventListener(
      'toggle',
      (ev) => {
        const k = ev.target && ev.target.dataset && ev.target.dataset.k;
        if (k) state.det[k] = ev.target.open;
      },
      true
    );
    if (!unwatch) {
      unwatch = Store.watch(
        'tiendas',
        (m) => {
          state.docs = m;
          paintList();
        },
        () => Store.list('tiendas').then((m) => ((state.docs = m), paintList()))
      );
    }
    if (!suscripto) {
      suscripto = true;
      A.on(onAuto);
    }
    cargarAnuncios();
    render();
  }

  function render() {
    paintStatus();
    paintList();
  }

  function montado() {
    return !!(el && el.isConnected && $('.tn', el));
  }

  function cargarAnuncios() {
    Store.list('competencia')
      .then((m) => {
        state.anuncios = S.anunciosPorDominio([...m.values()]);
        paintList();
      })
      .catch(() => {});
  }

  function onAuto(ev) {
    if (!montado()) return;
    if (ev.type === 'cfg') {
      render();
      return;
    }
    if (ev.job === 'tiendas') {
      if (ev.type === 'progress') {
        paintProg();
        return;
      }
      state.enCola = false;
      if (ev.type === 'start') state.skip = '';
      if (ev.type === 'skip' && ev.motivo) state.skip = ev.motivo;
      render();
      return;
    }
    if (ev.job === 'competencia' && ev.type === 'done') cargarAnuncios();
    if (ev.type === 'start' || ev.type === 'done' || ev.type === 'error') paintCtrl();
  }

  // Dominios que se siguen: los de la configuración (manuales y del escaneo de anuncios) y los guardados, sin los quitados
  function dominios() {
    const c = A.cfg.tiendas || {};
    const fuera = new Set(c.quitadas || []);
    const set = new Set();
    for (const x of (c.dominios || []).concat([...state.docs.keys()])) {
      const n = R.normalizeDomain(x);
      if (n && R.isStoreDomain(n) && !fuera.has(n)) set.add(n);
    }
    return [...set];
  }

  function plural(n, uno, varios) {
    return (n || 0) + ' ' + (n === 1 ? uno : varios);
  }

  function num(n, label, tone, prefijo) {
    return '<span class="chip cp-num tone-' + (tone || 'neutral') + '"><strong>' + (prefijo || '') + e(U.int(n || 0)) + '</strong>' + e(label) + '</span>';
  }

  function nota(ic, html) {
    return '<div class="note tn-note">' + icon(ic) + '<span>' + html + '</span></div>';
  }

  function paintStatus() {
    paintCtrl();
    paintProg();
  }

  function paintCtrl() {
    if (!montado()) return;
    const box = $('#tn-ctrl', el);
    const act = $('#tn-act', el);
    const c = A.cfg.tiendas || {};
    const horas = Number(c.cadaHoras) || 24;
    const opts = CADA.includes(horas) ? CADA : CADA.concat([horas]).sort((a, b) => a - b);
    $('#tn-opts', el).innerHTML =
      toggle('tn-auto', !!c.auto, 'Revisarlas solas al abrir el panel') +
      '<label class="tn-cada" for="tn-cada">Cada <select id="tn-cada">' +
      opts.map((h) => '<option value="' + h + '"' + (h === horas ? ' selected' : '') + '>' + h + ' horas</option>').join('') +
      '</select></label>';
    if (!Browser.checked) {
      act.innerHTML = '';
      box.innerHTML = nota('clock', 'Buscando el navegador de Claude…');
      return;
    }
    if (!Browser.available) {
      act.innerHTML = '';
      box.innerHTML = nota(
        'info',
        'Necesita la app de escritorio de Claude. ' +
          info('La revisión usa el navegador de Claude en tu PC: abrí este panel desde la app de escritorio (Cowork). Igual podés agregar o quitar tiendas y ver lo que ya se revisó.')
      );
      return;
    }
    const corriendo = A.running === 'tiendas';
    const otra = A.running && !corriendo ? A.running : null;
    const n = dominios().length;
    act.innerHTML = corriendo
      ? '<button class="btn ghost" data-act="tn-detener">' + icon('stop') + 'Detener</button>'
      : '<button class="btn" data-act="tn-revisar"' + (n && !state.enCola ? '' : ' disabled') + '>' + icon('refresh') + 'Revisar ahora</button>';
    box.innerHTML = state.enCola && otra ? nota('clock', 'En cola: espera que termine la ' + e(A.NOMBRES[otra] || otra) + '.') : '';
  }

  function paintProg() {
    if (!montado()) return;
    const est = A.estado.tiendas;
    const c = A.cfg.tiendas || {};
    const corriendo = A.running === 'tiendas';
    const n = dominios().length;
    const meta = corriendo ? 'Revisando…' : est && est.ultima ? 'Revisadas ' + U.timeAgo(est.ultima) : 'Sin revisar todavía';
    $('#tn-meta', el).innerHTML =
      '<span>' + e(meta + ' · ' + plural(n, 'tienda', 'tiendas')) + '</span>' + (c.auto ? chip('Solas cada ' + (Number(c.cadaHoras) || 24) + ' h', 'good') : '');
    let h = '';
    if (corriendo) {
      h +=
        '<ul class="auto-progress tn-log-list" aria-live="polite">' +
        state.log.map((l) => '<li><span class="st ' + (l.st === 'ok' ? 'ok' : 'err') + '">' + (l.st === 'ok' ? 'listo' : 'error') + '</span><span class="tn-log">' + e(l.texto) + '</span></li>').join('') +
        '<li class="is-curso"><span class="st">revisando</span><span class="tn-log">' +
        e(A.progress.tiendas || 'Empezando…') +
        '</span></li></ul>';
    } else if (state.skip) h += nota('info', e(state.skip));
    else if (est && est.error === 'Cancelado.') h += nota('stop', 'La última revisión se detuvo antes de terminar.');
    else if (est && est.error) h += '<p class="error-text">No terminó: ' + e(est.error) + '</p>';
    $('#tn-prog', el).innerHTML = h;
  }

  function paintList() {
    if (!montado()) return;
    const hoy = U.todayKeyAR();
    const items = dominios().map((d) => {
      const doc = state.docs.get(d) || null;
      return { d, doc, mv: S.movimiento(doc, { hoy, anuncios: state.anuncios[d] }) };
    });
    items.sort((a, b) => (a.mv.nivel ? 0 : 1) - (b.mv.nivel ? 0 : 1) || b.mv.puntos - a.mv.puntos || a.d.localeCompare(b.d));
    paintSummary(items);
    const box = $('#tn-list', el);
    if (!items.length) {
      box.innerHTML = emptyState('Sin tiendas todavía', 'Pegá arriba el link de un competidor. El escaneo de anuncios también las suma solo.', '', 'store');
      return;
    }
    box.innerHTML = items.map((x) => card(x, hoy)).join('');
  }

  function paintSummary(items) {
    const box = $('#tn-summary', el);
    const rev = items.filter((x) => x.mv.nivel);
    if (!rev.length) {
      box.innerHTML = '';
      return;
    }
    const altos = rev.filter((x) => x.mv.nivel === 'alto').length;
    let cambios = 0;
    let resenas = 0;
    for (const x of rev) {
      const k = x.doc.cambios;
      if (!k) continue;
      cambios += (k.conteo.nuevos || 0) + (k.conteo.precios || 0) + (k.conteo.agotados || 0) + (k.conteo.repuestos || 0);
      resenas += U.sum(k.resenas || [], (r) => r.suma);
    }
    box.innerHTML =
      '<div class="chips cp-nums">' +
      num(rev.length, rev.length === 1 ? 'revisada' : 'revisadas', '') +
      num(altos, 'con mucho movimiento', altos ? 'good' : '') +
      num(cambios, cambios === 1 ? 'cambio' : 'cambios', cambios ? 'info' : '') +
      num(resenas, resenas === 1 ? 'reseña nueva' : 'reseñas nuevas', resenas ? 'source' : '', resenas ? '+' : '') +
      '</div>';
  }

  // Desplegable de una tarjeta que recuerda si quedó abierto
  function det(d, kind, open, summary, body) {
    const k = d + ':' + kind;
    const abierto = state.det[k] != null ? state.det[k] : open;
    return '<details class="tn-det" data-k="' + e(k) + '"' + (abierto ? ' open' : '') + '><summary>' + icon('chevronRight') + summary + '</summary><div class="tn-det-body">' + body + '</div></details>';
  }

  function card(x, hoy) {
    const { d, doc, mv } = x;
    const u = doc && doc.ultima;
    const origen = !doc || doc.origen === 'anuncio' ? 'vino de un anuncio' : 'agregada a mano';
    let cuando = u && u.fecha ? 'Revisada ' + U.timeAgo(u.fecha) : 'Sin revisar';
    if (u && u.error && u.intento) cuando += ' · falló ' + U.timeAgo(u.intento);
    const conf = state.confirmar && state.confirmar.d === d && Date.now() < state.confirmar.hasta;
    let h =
      '<article class="tn-card' +
      (mv.nivel ? ' is-' + mv.nivel : '') +
      '"><header class="tn-card-head"><span class="tn-ini" aria-hidden="true">' +
      e(d.charAt(0).toUpperCase()) +
      '</span><div class="tn-name"><a class="tn-dom" href="https://' +
      e(d) +
      '" target="_blank" rel="noopener">' +
      e(d) +
      icon('external') +
      '</a><span class="tn-sub">' +
      e(cuando + ' · ' + origen) +
      '</span></div><div class="tn-head-r">' +
      chip(mv.nivel ? MOV[mv.nivel] : 'Sin revisar', mv.nivel ? TONO[mv.nivel] : 'neutral') +
      '<button type="button" class="btn link sm tn-quitar' +
      (conf ? ' is-confirm' : '') +
      '" data-act="tn-quitar" data-d="' +
      e(d) +
      '" aria-label="Dejar de seguir ' +
      e(d) +
      '" title="Quitar">' +
      icon('trash') +
      (conf ? 'Tocá de nuevo para quitar' : '') +
      '</button></div></header>';
    if (u && u.fecha) {
      const lz = S.lanzamientos(u.productos, hoy).length;
      const total = u.total != null ? u.total : u.productos.length;
      const agotados = u.agotados != null ? u.agotados : u.productos.filter((p) => !p.disponible).length;
      h +=
        (mv.nivel && mv.motivos && mv.motivos.length ? '<p class="tn-why">' + e(mv.texto) + '</p>' : '') +
        '<p class="tn-facts"><span><strong>' +
        e(U.int(total)) +
        '</strong> productos</span><span><strong>' +
        e(U.int(agotados)) +
        '</strong> agotados</span><span><strong>' +
        e(U.int(lz)) +
        '</strong> nuevos en ' +
        S.DIAS_LANZAMIENTO +
        ' días</span>' +
        (u.parcial ? '<span>catálogo leído en parte</span>' : '') +
        '</p>' +
        corrector(d, doc, hoy) +
        cambios(d, doc) +
        otrosYHistorial(d, doc);
    } else if (!u || !u.error) {
      h += '<p class="tn-quiet">' + icon('clock') + e(Browser.available ? 'Se lee su catálogo con “Revisar ahora”.' : 'Se revisa desde la app de escritorio de Claude.') + '</p>';
    }
    if (u && u.error) h += '<p class="error-text">' + e(u.error) + '</p>';
    return h + '</article>';
  }

  function corrector(d, doc, hoy) {
    const u = doc.ultima;
    const res = u.resenas || {};
    const c = S.principal(u.productos, res);
    if (!c) return '<p class="tn-quiet">' + icon('search') + 'No vende correctores de postura.</p>';
    const delta = ((doc.cambios && doc.cambios.resenas) || []).find((r) => r.handle === c.handle);
    const dias = R.daysSince(c.publicado || c.creado, hoy);
    const mio = App.tienda.precio1;
    const cmp = S.compararPrecio(c.precioMin, mio);
    const chips = [chip(c.disponible ? 'Con stock' : 'Agotado', c.disponible ? 'good' : 'bad')];
    if (c.variantes > 1) chips.push(chip(c.disponibles + ' de ' + c.variantes + ' variantes', c.disponibles < c.variantes ? 'warn' : 'neutral'));
    if (dias != null) chips.push(chip('Publicado hace ' + dias + (dias === 1 ? ' día' : ' días'), 'neutral'));
    chips.push(
      res[c.handle] != null
        ? '<span class="chip tone-source">' + e(U.int(res[c.handle]) + ' reseñas') + (delta && delta.suma ? '<strong class="tn-delta">+' + e(U.int(delta.suma)) + '</strong>' : '') + '</span>'
        : chip('Sin reseñas visibles', 'neutral')
    );
    const est = delta ? S.ventasEstimadas(delta.suma) : null;
    let vs = '';
    if (cmp) {
      const etiqueta = cmp.tono === 'neutral' ? 'Mismo precio' : U.pct(Math.abs(cmp.pct)) + (cmp.dif < 0 ? ' más barato' : ' más caro');
      vs = '<span class="tn-mio">Vos ' + e(U.money(mio)) + '</span>' + chip(etiqueta, cmp.tono, ' title="' + e(cmp.texto) + '"');
    }
    return (
      '<div class="tn-corr"><div class="tn-corr-top"><div class="tn-corr-name"><span class="eyebrow">Su corrector</span><a href="' +
      e(R.productUrl(d, c.handle)) +
      '" target="_blank" rel="noopener">' +
      e(c.titulo || c.handle) +
      '</a></div><div class="tn-price"><strong>' +
      e(U.money(c.precioMin)) +
      '</strong>' +
      (c.tachado && c.tachado > c.precioMin ? '<s>' + e(U.money(c.tachado)) + '</s>' : '') +
      '</div></div>' +
      (vs ? '<div class="tn-vs">' + vs + '</div>' : '') +
      '<div class="chips">' +
      chips.join('') +
      '</div>' +
      (est
        ? nota(
            'trending',
            'Unas ' +
              e(U.int(est.min)) +
              ' a ' +
              e(U.int(est.max)) +
              ' ventas desde el ' +
              e(U.fmtDay(U.dayKeyAR(doc.cambios.desde))) +
              ' ' +
              info(
                'Si esas ' +
                  e(U.int(delta.suma)) +
                  ' reseñas nuevas son reales. Se suele dejar 1 reseña cada ' +
                  S.COMPRAS_POR_RESENA[0] +
                  ' a ' +
                  S.COMPRAS_POR_RESENA[1] +
                  ' compras: es una estimación gruesa.'
              )
          )
        : '') +
      '</div>'
    );
  }

  const GRUPOS = [
    ['nuevos', 'Nuevo', 'info', (x) => x.titulo + ' · ' + U.money(x.precio)],
    ['precios', 'Precio', 'warn', (x) => x.titulo + ': ' + U.money(x.antes) + ' → ' + U.money(x.ahora)],
    ['agotados', 'Se agotó', 'bad', (x) => x.titulo + ' · ' + U.money(x.precio)],
    ['repuestos', 'Repuesto', 'good', (x) => x.titulo + ' · ' + U.money(x.precio)],
    ['variantes', 'Variantes', 'neutral', (x) => x.titulo + ': ' + x.ahora + ' de ' + x.de + ' con stock (antes ' + x.antes + ')'],
    ['resenas', 'Reseñas', 'source', (x) => x.titulo + ': +' + U.int(x.suma) + ' (' + U.int(x.ahora) + ' en total)'],
    ['quitados', 'Quitado', 'neutral', (x) => x.titulo + ' · ' + U.money(x.precio)],
  ];

  function cambios(d, doc) {
    const k = doc.cambios;
    if (!k) return '<p class="tn-quiet">' + icon('clock') + 'Primera revisión: los cambios se ven en la próxima.</p>';
    const conteo = k.conteo || {};
    let total = 0;
    let lis = '';
    for (const [key, label, tone, fmt] of GRUPOS) {
      const list = (k[key] || []).filter((x) => key !== 'resenas' || x.suma > 0);
      const n = key === 'resenas' ? list.length : conteo[key] || list.length;
      total += n;
      lis += list.map((x) => '<li>' + chip(label, tone) + '<span>' + e(fmt(x)) + '</span></li>').join('');
      if (n > list.length) lis += '<li class="muted small">y ' + (n - list.length) + ' más (' + e(label.toLowerCase()) + ')</li>';
    }
    const desde = U.fmtDay(U.dayKeyAR(k.desde));
    if (!total) return '<p class="tn-quiet">' + icon('check') + 'Sin cambios desde el ' + e(desde) + '.</p>';
    return det(d, 'cambios', total <= 6, '<span>' + plural(total, 'cambio', 'cambios') + '</span><span class="muted small">desde el ' + e(desde) + '</span>', '<ul class="tn-changes">' + lis + '</ul>');
  }

  function otrosYHistorial(d, doc) {
    const u = doc.ultima;
    const res = u.resenas || {};
    const c = S.principal(u.productos, res);
    const otros = S.posturaOrdenada(u.productos)
      .filter((p) => !c || p.id !== c.id)
      .slice(0, 4);
    const h = (doc.historial || []).filter((x) => x && x.fecha);
    let out = '';
    if (otros.length)
      out += det(
        d,
        'otros',
        false,
        '<span>Otros de postura</span><span class="muted small">' + otros.length + '</span>',
        '<ul class="tn-otros">' +
          otros
            .map(
              (p) =>
                '<li><a href="' +
                e(R.productUrl(d, p.handle)) +
                '" target="_blank" rel="noopener">' +
                e(p.titulo || p.handle) +
                '</a><span class="muted">' +
                e(U.money(p.precioMin) + (p.disponible ? '' : ' · agotado') + (res[p.handle] != null ? ' · ' + U.int(res[p.handle]) + ' reseñas' : '')) +
                '</span></li>'
            )
            .join('') +
          '</ul>'
      );
    if (h.length >= 2) {
      const n = (v) => (v == null ? '—' : e(U.int(v)));
      out += det(
        d,
        'hist',
        false,
        '<span>Historial</span><span class="muted small">' + h.length + ' revisiones</span>',
        '<div class="table-wrap"><table class="table tn-hist"><thead><tr><th>Fecha</th><th class="num">Productos</th><th class="num">Agotados</th><th class="num">Corrector</th><th class="num">Reseñas</th></tr></thead><tbody>' +
          h
            .slice()
            .reverse()
            .map(
              (x) =>
                '<tr><th scope="row">' +
                e(U.fmtDay(U.dayKeyAR(x.fecha))) +
                '</th><td class="num">' +
                n(x.productos) +
                '</td><td class="num">' +
                n(x.agotados) +
                '</td><td class="num">' +
                (x.precioCorrector == null ? '—' : e(U.money(x.precioCorrector))) +
                '</td><td class="num">' +
                n(x.resenasTotal) +
                (x.resenasNuevas ? ' <span class="tn-delta">+' + e(U.int(x.resenasNuevas)) + '</span>' : '') +
                '</td></tr>'
            )
            .join('') +
          '</tbody></table></div>'
      );
    }
    return out ? '<div class="tn-dets">' + out + '</div>' : '';
  }

  /* ---------- Acciones ---------- */

  function agregar(raw) {
    const d = R.normalizeDomain(raw);
    if (!d) {
      toast('Escribí el dominio de la tienda, por ejemplo tienda.com.ar.', 'warn');
      return false;
    }
    if (!R.isStoreDomain(d)) {
      toast('Eso es una red social, un marketplace o un acortador: poné el dominio de la tienda propia.', 'warn');
      return false;
    }
    if (dominios().includes(d)) {
      toast('Ya seguís ' + d + '.', 'warn');
      return false;
    }
    const doc = S.docBase(d, new Date().toISOString(), 'manual');
    state.docs.set(d, doc);
    const c = A.cfg.tiendas || {};
    A.setCfg('tiendas', { dominios: [...new Set((c.dominios || []).concat(d))], quitadas: (c.quitadas || []).filter((x) => x !== d) });
    Store.set('tiendas/' + d, doc).catch(storeFail);
    toast(Browser.available ? 'Agregaste ' + d + '. Tocá “Revisar ahora” para leer su catálogo.' : 'Agregaste ' + d + '. Se revisa desde la app de escritorio de Claude.', 'good');
    return true;
  }

  function quitar(d) {
    const c = A.cfg.tiendas || {};
    state.confirmar = null;
    state.docs.delete(d);
    // "quitadas" evita que el escaneo de anuncios la vuelva a sumar
    A.setCfg('tiendas', { dominios: (c.dominios || []).filter((x) => R.normalizeDomain(x) !== d), quitadas: [...new Set((c.quitadas || []).concat(d))].slice(-200) });
    Store.remove('tiendas/' + d).catch(storeFail);
    toast('Dejaste de seguir ' + d + '.', 'good');
  }

  function onSubmit(ev) {
    const f = ev.target.closest('#tn-add');
    if (!f) return;
    ev.preventDefault();
    const inp = $('#tn-dominio', f);
    if (agregar(inp.value)) inp.value = '';
    inp.focus();
  }

  function onChange(ev) {
    if (ev.target.id === 'tn-auto') A.setCfg('tiendas', { auto: ev.target.checked });
    else if (ev.target.id === 'tn-cada') A.setCfg('tiendas', { cadaHoras: Number(ev.target.value) || 24 });
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t) || !t.closest('.tn')) return;
    switch (t.dataset.act) {
      case 'tn-revisar':
        state.log = [];
        state.skip = '';
        state.enCola = !!A.running && A.running !== 'tiendas';
        A.run('tiendas', { origen: 'manual' });
        paintStatus();
        break;
      case 'tn-detener':
        if (A.running === 'tiendas') A.stop();
        break;
      case 'tn-quitar': {
        const d = t.dataset.d;
        if (state.confirmar && state.confirmar.d === d && Date.now() < state.confirmar.hasta) {
          quitar(d);
          return;
        }
        state.confirmar = { d, hasta: Date.now() + 4000 };
        t.classList.add('is-confirm');
        t.innerHTML = icon('trash') + 'Tocá de nuevo para quitar';
        setTimeout(() => {
          if (state.confirmar && state.confirmar.d === d && Date.now() >= state.confirmar.hasta) {
            state.confirmar = null;
            if (t.isConnected) {
              t.classList.remove('is-confirm');
              t.innerHTML = icon('trash');
            }
          }
        }, 4100);
        break;
      }
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.tiendas = { mount, render };
})(window);
</script>
<script>
/* ui/competencia.js */
/* Competencia: qué anuncian los competidores en la Biblioteca de anuncios de Meta y qué les funciona */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const CP = VC.competitors;
  const R = VC.research;
  const S = VC.scan;
  const { Store, AI, Browser } = VC.runtime;
  const { e, $, $$, App, chip, emptyState, toast, copyText, storeFail, icon, bubble, pageHead, info, more, toggle, banner } = VC.ui;
  const A = VC.auto;

  const LOGIN = 'Meta pide iniciar sesión en el navegador de Claude: entrá una vez a facebook.com en ese navegador';
  const HORAS = [12, 24, 48, 72];
  const CANCELADO = 'Cancelado.'; // texto que deja VC.auto cuando se detiene una tarea
  const FILAS = 12; // anuncios guardados visibles antes de "Ver todos"

  const state = {
    ads: new Map(),
    texto: '',
    imagenes: [],
    imgLimits: null,
    running: false,
    error: '',
    ideas: { text: '', fecha: null, running: false, error: '' },
    verTodos: false,
    abierto: { found: false, ideas: false }, // textos largos desplegados
  };
  let el;
  let ctl;
  // Escaneo automático: progreso en vivo, último escaneo guardado y si el usuario lo dejó en cola
  const vivo = { items: [] };
  let ultimo = null;
  let ultimoCargado = false;
  let pedido = false;
  let enCurso = false;
  let dataTimer = 0;
  let ultimoTipeo = 0;

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead('Competencia', 'Qué anuncian y qué les funciona.') +
      '<section class="panel auto-panel cp-auto" id="cp-auto" aria-labelledby="cp-auto-title"></section>' +
      '<section class="panel cp-found" id="cp-found" aria-labelledby="cp-found-title"></section>' +
      '<div id="cp-tiendas"></div>' +
      '<section class="panel cp-saved" id="cp-table" aria-labelledby="cp-table-title"><div id="cp-saved-head"></div><div id="cp-ideas" hidden></div><div id="cp-saved-body"></div></section>' +
      '<div class="cp-manual">' +
      more('Buscar a mano', '<div class="cp-manual-body"><section class="cp-step" id="cp-links"></section><section class="cp-step" id="cp-input"></section><section class="cp-step" id="cp-hand"></section></div>', 'cp-manual') +
      '</div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('input', (ev) => {
      ultimoTipeo = Date.now();
      if (ev.target.id === 'cp-texto') state.texto = ev.target.value;
    });
    el.addEventListener('submit', onSubmit);
    el.addEventListener('paste', onPaste);
    Store.watch('competencia', (m) => {
      state.ads = m;
      renderDataSoon();
    });
    if (A) A.on(onAuto);
    if (!ultimoCargado) {
      Store.get('escaneos/ultimo').then((d) => {
        if (!ultimoCargado) ultimo = d || null;
        ultimoCargado = true;
        renderFound();
        renderDataSoon();
      });
    }
    Store.get('ideas/competencia').then((d) => {
      if (d && d.text && !state.ideas.text) {
        state.ideas.text = d.text;
        state.ideas.fecha = d.fecha;
        renderIdeas();
      }
    });
    if (AI.sample && AI.sample.limits) AI.sample.limits().then((l) => ((state.imgLimits = l && l.images ? l.images : null), renderInput())).catch(() => {});
    renderAuto();
    renderFound();
    if (VC.tools.tiendas) VC.tools.tiendas.mount($('#cp-tiendas', el));
    renderLinks();
    renderInput();
    renderHand();
    renderData();
  }

  function render() {
    renderAuto();
    renderFound();
    if (VC.tools.tiendas && VC.tools.tiendas.render) VC.tools.tiendas.render();
    renderInput();
    renderData();
  }

  /* ---------- Piezas chicas ---------- */

  function plural(n, uno, varios) {
    return (n || 0) + ' ' + (n === 1 ? uno : varios);
  }

  // Chip con número destacado: "12 nuevos"
  function num(n, label, tone) {
    return '<span class="chip cp-num tone-' + (tone || 'neutral') + '"><strong>' + e(U.int(n || 0)) + '</strong>' + e(label) + '</span>';
  }

  function nota(ic, html) {
    return '<div class="note cp-note">' + icon(ic) + '<span>' + html + '</span></div>';
  }

  const SEC_ICON = [
    [/novedad/i, 'sparkles'],
    [/funciona/i, 'trending'],
    [/precio/i, 'tag'],
    [/probar|idea|creativo/i, 'video'],
    [/hueco/i, 'search'],
  ];

  /* Parte el texto plano de Claude en secciones (título en una línea y viñetas con guion) */
  function secciones(text) {
    const out = [];
    let cur = null;
    let lista = false;
    const nueva = (t) => {
      cur = { t, h: '' };
      out.push(cur);
      lista = false;
    };
    const cerrar = () => {
      if (cur && lista) cur.h += '</ul>';
      lista = false;
    };
    for (const raw of String(text || '').split(/\r?\n/)) {
      const l = raw.replace(/\*\*/g, '').replace(/^#+\s*/, '').trim();
      if (!l) {
        cerrar();
        continue;
      }
      const vin = l.match(/^[-•*–]\s+(.*)$/);
      if (vin) {
        if (!cur) nueva('');
        if (!lista) {
          cur.h += '<ul>';
          lista = true;
        }
        cur.h += '<li>' + e(vin[1]) + '</li>';
        continue;
      }
      cerrar();
      if (l.length <= 60 && (/:$/.test(l) || !/[.!?…)"”]$/.test(l))) {
        nueva(l.replace(/:$/, ''));
        continue;
      }
      if (!cur) nueva('');
      cur.h += '<p>' + e(l) + '</p>';
    }
    cerrar();
    return out.filter((s) => s.t || s.h);
  }

  function seccion(s) {
    const ic = s.t ? (SEC_ICON.find(([re]) => re.test(s.t)) || [])[1] : '';
    return '<section class="cp-sec">' + (s.t ? '<h4>' + (ic ? icon(ic) : '') + '<span>' + e(s.t) + '</span></h4>' : '') + s.h + '</section>';
  }

  /* Texto de Claude con buena tipografía; si es largo, muestra las dos primeras partes y "Ver todo" */
  function prosa(text, key) {
    const secs = secciones(text);
    const largo = secs.length > 2 && String(text).length > 700;
    const abierto = !largo || state.abierto[key];
    const vis = abierto ? secs : secs.slice(0, 2);
    return (
      '<div class="cp-prose' +
      (secs.length > 1 ? ' is-grid' : '') +
      '">' +
      vis.map(seccion).join('') +
      '</div>' +
      (largo
        ? '<button type="button" class="btn link sm cp-fold" data-act="plegar" data-k="' +
          key +
          '" aria-expanded="' +
          !!abierto +
          '">' +
          (abierto ? 'Ver menos' : 'Ver todo · ' + (secs.length - 2) + ' más') +
          icon('chevronDown') +
          '</button>'
        : '')
    );
  }

  /* ---------- Escaneo automático: interfaz ---------- */

  function renderAuto() {
    const box = el && $('#cp-auto', el);
    if (!box) return;
    if (!box.dataset.ready) {
      box.innerHTML = '<div id="cp-auto-head"></div><div id="cp-auto-prog"></div>' + (A ? more('Opciones', '<div id="cp-auto-cfg"></div>', 'cp-auto-more') : '');
      box.dataset.ready = '1';
    }
    renderAutoHead();
    renderAutoProg();
    renderAutoCfg();
  }

  function renderAutoHead() {
    const box = el && $('#cp-auto-head', el);
    if (!box || !A) return;
    const c = A.cfg.competencia || A.DEFAULTS.competencia;
    const corriendo = A.running === 'competencia';
    const otra = A.running && !corriendo ? A.NOMBRES[A.running] || A.running : '';
    const chk = A.can('competencia');
    const est = A.estado.competencia || {};
    const ult = A.ultima('competencia');
    let meta;
    if (corriendo) meta = 'Escaneando la Biblioteca…';
    else if (ult) meta = 'Escaneado ' + U.timeAgo(ult) + (est.resultado && est.resultado.nuevos != null ? ' · ' + plural(est.resultado.nuevos, 'nuevo', 'nuevos') : '');
    else meta = 'Todavía no escaneaste';
    let accion = '';
    if (Browser.available) {
      accion = corriendo
        ? '<button class="btn ghost" data-act="auto-detener">' + icon('stop') + 'Detener</button>'
        : '<button class="btn" data-act="auto-escanear"' + (!chk.ok || pedido ? ' disabled' : '') + '>' + icon('search') + (pedido ? 'En cola…' : 'Escanear ahora') + '</button>';
    }
    let aviso = '';
    if (!Browser.checked) aviso = nota('clock', 'Buscando el navegador de Claude…');
    else if (!Browser.available)
      aviso = nota(
        'info',
        'Necesita la app de escritorio de Claude. ' +
          info('El escaneo abre la Biblioteca de anuncios en el navegador de Claude de tu PC. Funciona si abrís este panel desde la app de escritorio (Cowork). Mientras tanto podés buscar a mano.') +
          ' <button type="button" class="btn link sm" data-act="abrir-manual">Buscar a mano</button>'
      );
    else if (!chk.ok) aviso = nota('info', e(chk.motivo));
    else if (otra) aviso = nota('clock', pedido ? 'En cola: arranca cuando termine la ' + e(otra) + '.' : 'Ahora corre la ' + e(otra) + '. Si escaneás, queda en cola.');
    else if (!corriendo && est.error === CANCELADO) aviso = nota('stop', 'Detuviste el último escaneo.');
    else if (!corriendo && est.error) aviso = '<p class="error-text">No terminó: ' + e(est.error) + '</p>';
    box.innerHTML =
      '<div class="cp-auto-row">' +
      bubble('zap', 'peach') +
