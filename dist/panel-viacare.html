      const dialogos = [hook];
      for (let j = 1; j < clips - 1; j++) dialogos.push(pick(banco.medio, i + j - 1));
      dialogos.push(pick(CIERRES, i));
      for (let j = 0; j < dialogos.length; j++) dialogos[j] = gender(dialogos[j], g);
      const clipList = dialogos.map((d, j) => {
        const plano = j === 0 ? PLANOS[0] : pick(PLANOS, j + i);
        const accion =
          j === 0
            ? 'Mira a cámara y dice el gancho con gesto de identificación.'
            : j === clips - 1
              ? 'Sonríe, señala hacia abajo (donde va el link) y termina la frase mirando a cámara.'
              : j === 1
                ? 'Muestra el problema: se encorva frente a la pantalla y se toca el cuello o los hombros.'
                : 'Muestra el corrector puesto y ajusta las tiras; se endereza con naturalidad.';
        const prev = j === 0 ? '' : en ? 'Continues exactly from the final frame of the previous clip, same framing and pose. ' : 'Continúa exactamente desde el último cuadro del clip anterior, mismo encuadre y pose. ';
        const prompt = en
          ? ficha + ' ' + prev + 'Shot: ' + plano + '. Action: ' + accion + ' The person says, spoken in Argentine Spanish: "' + d + '" Ambient room sound. No subtitles, no on-screen text, no music.'
          : ficha + ' ' + prev + 'Plano: ' + plano + '. Acción: ' + accion + ' Dice, hablado en español rioplatense: "' + d + '" Sonido ambiente del lugar. Sin subtítulos, sin texto en pantalla, sin música.';
        return {
          plano,
          accion,
          dialogo: d,
          texto_pantalla: j === 0 ? d.split(/[.?!]/)[0] : j === clips - 1 ? 'Pagás al recibir' : '',
          prompt,
          continuidad: j === 0 ? 'Generá este clip primero y elegí la mejor toma: define la cara y la ropa de todo el guion.' : 'En Flow usá "Extend" o tomá el último cuadro del clip ' + j + ' como imagen inicial (Frames to Video).',
        };
      });
      out.push({ titulo: ANGULOS[key].label + ' · ' + gancho, gancho, ficha, clips: clipList, caption: '', nota: 'Generado con plantillas (sin IA). Ajustá el diálogo a tu forma de hablar.' });
    }
    return sanitize({ guiones: out }, opts);
  }

  function scriptAsText(g) {
    const lines = [g.titulo, g.gancho ? 'Gancho: ' + g.gancho : '', '', 'FICHA DE CONTINUIDAD', g.ficha, ''];
    for (const c of g.clips) {
      lines.push('CLIP ' + c.n + ' (' + c.desde + '–' + c.hasta + ' s) · ' + c.plano);
      lines.push('Acción: ' + c.accion);
      lines.push('Diálogo: "' + c.dialogo + '"');
      if (c.texto_pantalla) lines.push('Texto en pantalla: ' + c.texto_pantalla);
      lines.push('Prompt para Flow:');
      lines.push(c.prompt);
      if (c.continuidad) lines.push('Continuidad: ' + c.continuidad);
      lines.push('');
    }
    if (g.caption) lines.push('Caption: ' + g.caption);
    return lines.filter((l, i, arr) => !(l === '' && arr[i - 1] === '')).join('\n').trim();
  }

  const api = { CLIP_SECONDS, MAX_WORDS, ANGULOS, PERSONAJES, PRODUCTO_DEFAULT, buildPrompt, sanitize, fallbackScripts, scriptAsText, wordCount };
  if (typeof module === 'object' && module.exports) module.exports = api;
  else (root.VC = root.VC || {}).scripts = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* lib/offers.js */
/* Calculadora de ofertas: cuánto deja cada promo (1 unidad, 2x1, 3x2, regalo) contra entrega y con publicidad. */
(function (root) {
  'use strict';
  const isNode = typeof module === 'object' && module.exports;
  const P = isNode ? require('./profit.js') : root.VC.profit;

  const DEFAULT_OFERTAS = [
    { id: 'uno', nombre: '1 unidad', unidades: 1, precio: 68990, extra: 0, lift: 0 },
    { id: 'dos', nombre: '2 unidades (oferta actual)', unidades: 2, precio: 72990, extra: 0, lift: 0 },
    { id: '2x1', nombre: '2x1', unidades: 2, precio: 68990, extra: 0, lift: 0 },
    { id: '3x2', nombre: '3x2', unidades: 3, precio: 137980, extra: 0, lift: 0 },
    { id: 'regalo', nombre: '1 unidad + regalo', unidades: 1, precio: 68990, extra: 3000, lift: 0 },
  ];

  /*
   * Economía de una oferta por pedido que entra.
   * margenEntrega: lo que deja un pedido entregado antes de anuncios.
   * esperado: lo que deja en promedio cada pedido que entra (con anulados y devoluciones), antes de anuncios.
   * ganancia: esperado − costo de publicidad por pedido.
   */
  function evaluate(oferta, cfg, rates, cpaBase, envioExtraUnidad) {
    const c = P.normalizeCfg(cfg);
    const r = P.effectiveRates(c, rates);
    const u = Math.max(1, Number(oferta.unidades) || 1);
    const precio = Number(oferta.precio) || 0;
    const extra = Number(oferta.extra) || 0;
    const lift = Number(oferta.lift) || 0;
    const envExtra = (Number(envioExtraUnidad) || 0) * (u - 1);
    const margenEntrega = precio * (1 - c.comisionCobro / 100) - u * c.costoUnidad - extra - c.costoEnvio - envExtra - c.otrosPorPedido;
    const perdidaDevolucion = c.costoDevolucion + c.otrosPorPedido + envExtra;
    const esperado = r.confirmacion * (r.entrega * margenEntrega - (1 - r.entrega) * perdidaDevolucion);
    const cpa = (Number(cpaBase) || 0) / Math.max(0.05, 1 + lift / 100);
    const ganancia = esperado - cpa;
    return {
      oferta,
      unidades: u,
      precio,
      precioUnidad: precio / u,
      margenEntrega,
      perdidaDevolucion,
      esperado,
      cpa,
      ganancia,
      gananciaPorUnidad: ganancia / u,
      cpaEquilibrio: esperado,
      rates: r,
    };
  }

  /*
   * Cuánta conversión extra necesita una oferta para ganar lo mismo que la base.
   * Devuelve la variación relativa (0,25 = necesita 25% más pedidos por peso invertido) o null si no alcanza nunca.
   */
  function liftNeeded(ev, base) {
    const cpaNecesario = ev.esperado - base.ganancia;
    if (cpaNecesario <= 0) return null;
    if (!(base.cpa > 0)) return ev.ganancia >= base.ganancia ? -1 : null;
    return base.cpa / cpaNecesario - 1;
  }

  function compare(ofertas, cfg, rates, cpaBase, envioExtraUnidad) {
    const evs = ofertas.map((o) => evaluate(o, cfg, rates, cpaBase, envioExtraUnidad));
    const base = evs[0];
    const best = evs.reduce((a, b) => (b.ganancia > a.ganancia ? b : a), evs[0]);
    for (const ev of evs) {
      ev.vsBase = ev.ganancia - base.ganancia;
      ev.liftNecesario = ev === base ? 0 : liftNeeded(ev, base);
      ev.mejor = ev === best;
    }
    return { evs, base, best };
  }

  /* Mezcla real de tus pedidos entregados: qué parte lleva 1, 2 o 3+ unidades. */
  function unitMix(orders) {
    const del = orders.filter((o) => o.estado === 'entregado');
    const mix = { 1: 0, 2: 0, 3: 0 };
    for (const o of del) mix[Math.min(3, Math.max(1, o.units))]++;
    const n = del.length;
    return { n, uno: n ? mix[1] / n : null, dos: n ? mix[2] / n : null, tresOMas: n ? mix[3] / n : null };
  }

  const api = { DEFAULT_OFERTAS, evaluate, liftNeeded, compare, unitMix };
  if (isNode) module.exports = api;
  else (root.VC = root.VC || {}).offers = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

/* lib/customers.js */
/* Reactivador: arma la lista de clientes que ya pagaron y elige la oferta para cada uno. */
(function (root) {
  'use strict';
  const isNode = typeof module === 'object' && module.exports;
  const U = isNode ? require('./util.js') : root.VC.util;

  const OFERTAS = {
    familia: {

        '¡Hola {nombre}! Te escribimos de {tienda} 😊 ¿Cómo te viene yendo con el corrector?\n\nComo ya sos cliente, te guardamos una oferta: un segundo corrector para alguien de tu familia a {precio_oferta} (en vez de {precio}).{codigo_txt} Pagás cuando te llega, como la vez pasada.\n\n¿Te lo mandamos a la misma dirección?',

    },
    recompra: {
      label: 'Volvé a comprar',
      corto: 'Recompra',
      mensaje:
        '¡Hola {nombre}! Somos {tienda} 😊 Hace un tiempo te llevaste tu corrector y queríamos saber cómo te fue.\n\nEsta semana tenemos una oferta solo para clientes: {oferta_libre}.{codigo_txt} Pagás al recibir. ¿Te interesa?',
    },
  };

  const DEFAULT_CFG = {
    minDias: 20, // días desde la compra para escribirle (que ya lo haya usado)
    pausaDias: 30, // no volver a escribirle antes de esto
    precioOferta: 45000,
    beneficioAmigo: '10% de descuento',
    premio: 'un 10% de descuento en tu próxima compra',
    ofertaLibre: '2 correctores con 20% de descuento',
    codigo: '',
    mensajes: {},
  };

  function lastDate(o) {
    return o.closedAt || o.deliveredAt || o.shippedAt || o.createdAt;
  }

  /*
   * Agrupa pedidos por WhatsApp. Un cliente es reactivable si tiene al menos un pedido entregado,
   * ningún pedido abierto y pasaron `minDias` desde su última compra.
   */
  function buildCustomers(orders, opts) {
    const o = Object.assign({ minDias: 20, now: Date.now(), resenas: new Map() }, opts || {});
    const by = new Map();
    for (const ord of orders) {
      const k = ord.phone && ord.phone.wa;
      if (!k) continue;
      if (!by.has(k)) by.set(k, []);
      by.get(k).push(ord);
    }
    const out = [];
    for (const [wa, list] of by) {
      list.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
      const entregados = list.filter((x) => x.estado === 'entregado' || x.estado === 'pagado');
      if (!entregados.length) continue;
      const ultimo = entregados[0];
      const abiertos = list.filter((x) => x.estado === 'pendiente' || x.estado === 'en_camino');
      const resena = entregados.map((x) => o.resenas.get(x.key)).find((r) => r && r.estado === 'recibida') || null;
      const dias = Math.floor(U.hoursSince(lastDate(ultimo), o.now) / 24);
      out.push({
        wa,
        key: wa,
        nombre: U.capitalizeName([ultimo.firstName, ultimo.lastName].filter(Boolean).join(' ')),
        firstName: ultimo.firstName,
        ciudad: ultimo.city,
        provincia: ultimo.province,
        direccion: [ultimo.address1, ultimo.city].filter(Boolean).join(', '),
        phone: ultimo.phone,
        pedidos: list.length,
        compras: entregados.length,
        unidades: U.sum(entregados, (x) => x.units),
        gastado: U.sum(entregados, (x) => x.total),
        ultimaCompra: lastDate(ultimo),
        ultimoPedido: list[0].name,
        ultimoPedidoAt: list[0].createdAt,
        dias,
        abierto: abiertos.length > 0,
        resena,
        listo: abiertos.length === 0 && dias >= o.minDias,
        orders: list,
      });
    }
    return out.sort((a, b) => b.gastado - a.gastado || (a.ultimaCompra < b.ultimaCompra ? 1 : -1));
  }

  /* Oferta sugerida: quien llevó 2+ o dejó buena reseña ya confía → referido; el resto → segunda unidad. */
  function suggestOffer(c) {
    if ((c.resena && Number(c.resena.estrellas) >= 4) || c.unidades >= 2 || c.compras >= 2) return 'amigo';
    return 'familia';
  }

  /* ¿Volvió a comprar después de que le escribimos? (pedido nuevo no anulado con su WhatsApp) */
  function reordered(c, contactoISO) {
    if (!contactoISO) return null;
    const hit = c.orders.find((x) => x.createdAt > contactoISO && x.estado !== 'anulado');
    return hit || null;
  }

  function messageVars(c, cfg, msgs) {
    const conf = Object.assign({}, DEFAULT_CFG, cfg || {});
    const precio = (msgs && msgs.precio1) || 68990;
    return {
      nombre: U.firstName(c.firstName) || 'hola',
      tienda: (msgs && msgs.tienda) || 'ViaCare',
      precio: U.money(precio),
      precio_oferta: U.money(conf.precioOferta),
      beneficio_amigo: conf.beneficioAmigo,
      premio: conf.premio,
      oferta_libre: conf.ofertaLibre,

    { id: 'compra', label: 'Quiere comprar', tone: 'good', re: /(c[oó]mo (lo )?(compro|pido|consigo|hago)|d[oó]nde (lo )?(compro|consigo|venden)|lo quiero|quiero (uno|dos|el|lo|comprar)|me interesa|link|pas[aá] (el )?link|info\b|informaci[oó]n|me lo mand)/ },
    { id: 'envio', label: 'Envío', tone: 'info', re: /(env[ií]o|env[ií]an|mandan|hacen env|llega|llegan|tarda|demora|c[oó]rdoba|rosario|mendoza|tucum[aá]n|salta|neuqu[eé]n|mar del plata|la plata|santa fe|interior|provincia|patagonia|chaco|corrientes|misiones|jujuy|san juan|san luis|entre r[ií]os|bah[ií]a blanca|caba|capital)/ },

      envio: [(donde ? '¡Sí! Llegamos a ' + donde + '. ' : '') + envio + ' y ' + pago + '.' + demora, envio + (donde ? ', ' + donde + ' incluido' : '') + '. ' + cap(pago) + ' 📦' + demora],
      pago: ['Sí, ' + pago + '. No tenés que adelantar nada 🙌', cap(pago) + ', sin pagar nada antes. Lo pedís desde el link del perfil.'],
      precio: [precio ? 'Sale ' + precio + '. Y ' + pago + ' 🙌' : 'Te pasamos el precio por mensaje privado. ' + cap(pago) + '.', precio ? 'Está ' + precio + ', y ' + pago + '. Link en el perfil.' : 'Escribinos por privado y te pasamos el precio. ' + cap(pago) + '.'],

      comodidad: ['Es liviano y se regula: lo podés usar debajo de la remera y no se nota. Arrancá con ratitos cortos 🙌', 'Se ajusta a tu cuerpo y va debajo de la ropa. Lo ideal es empezar con un rato por día e ir sumando.'],

<script>
/* lib/competitors.js */
/* Espía de anuncios: links a la Biblioteca de anuncios de Meta, fechas de circulación y resumen de ganchos/ángulos/ofertas. */
(function (root) {
  'use strict';
  const isNode = typeof module === 'object' && module.exports;
  const U = isNode ? require('./util.js') : root.VC.util;

  const BUSQUEDAS = ['corrector postural', 'corrector de postura', 'corrector de espalda', 'faja postural', 'postura espalda', 'dolor de espalda'];
  const GANADOR_DIAS = 21; // un anuncio que sigue activo después de 3 semanas probablemente vende

  const ANGULOS = {
    dolor: 'Dolor',
    medico: 'Médico / experto',
    estetica: 'Estética',
    gym: 'Gym',
    oficina: 'Home office',
    regalo: 'Regalo',
    otro: 'Otro',
  };

  function adLibraryUrl(q, country) {
    return (
      'https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=' +
      encodeURIComponent(country || 'AR') +
      '&q=' +
      encodeURIComponent(q) +
      '&search_type=keyword_unordered&media_type=all'
    );
  }

  function tiktokTopAdsUrl() {
    return 'https://ads.tiktok.com/business/creativecenter/inspiration/topads/pc/es';
  }

  const MESES = { ene: 0, jan: 0, feb: 1, mar: 2, abr: 3, apr: 3, may: 4, jun: 5, jul: 6, ago: 7, aug: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11, dec: 11 };

  /* "12 ago 2026", "12 de agosto de 2026", "Aug 12, 2026", "2026-08-12", "12/08/2026" → AAAA-MM-DD */
  function parseDate(str) {
    if (!str) return null;
    const s = U.stripAccents(String(str)).toLowerCase().trim();
    let m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    m = s.match(/(\d{1,2})\s+(?:de\s+)?([a-z]{3})[a-z]*\.?\s+(?:de\s+)?(\d{4})/);
    if (m && m[2] in MESES) return m[3] + '-' + String(MESES[m[2]] + 1).padStart(2, '0') + '-' + m[1].padStart(2, '0');
    m = s.match(/([a-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/);
    if (m && m[1] in MESES) return m[3] + '-' + String(MESES[m[1]] + 1).padStart(2, '0') + '-' + m[2].padStart(2, '0');
    return null;
  }

  function daysActive(desde, today) {
    const d = parseDate(desde);
    if (!d) return null;
    return Math.max(0, U.daysBetween(d, today || U.todayKeyAR()));
  }

  function summarize(ads, today) {
    const withDays = ads.map((a) => Object.assign({}, a, { dias: a.dias != null ? a.dias : daysActive(a.desde, today) }));
    const ganadores = withDays.filter((a) => a.dias != null && a.dias >= GANADOR_DIAS);
    const count = (k) => {
      const m = new Map();
      for (const a of withDays) {
        const v = (a[k] || '').trim();
        if (v) m.set(v, (m.get(v) || 0) + 1);
      }
      return [...m.entries()].sort((x, y) => y[1] - x[1]);
    };
    return {
      total: withDays.length,
      ganadores: ganadores.length,
      anunciantes: new Set(withDays.map((a) => (a.anunciante || '').toLowerCase()).filter(Boolean)).size,
      angulos: count('angulo'),
      ofertas: count('oferta'),
      ads: withDays.sort((a, b) => (b.dias == null ? -1 : b.dias) - (a.dias == null ? -1 : a.dias)),
    };
  }

  function extractPrompt(text, nImages, today) {
    return [
      'Te paso lo que copié o capturé de la Biblioteca de anuncios de Meta buscando correctores de postura en Argentina.',
      nImages ? 'Hay ' + nImages + ' captura(s) de pantalla adjuntas.' : '',
      text ? 'TEXTO COPIADO:\n' + text.slice(0, 60000) : '',
      '',
      'Hoy es ' + today + '. Extraé cada anuncio distinto que veas. Para cada uno:',
      '- anunciante: nombre de la página',
      '- id: el número de "Identificador de la biblioteca" (o "Library ID"); vacío si no está',
      '- dominio: el sitio al que lleva el anuncio si aparece (ej. "POSTURAYA.COM.AR"); vacío si no',
      '- desde: fecha en que empezó a circular, en formato AAAA-MM-DD (si dice "Comenzó a circular el…" o "Started running on…"); vacío si no está',
      '- gancho: la primera frase del texto o del video, tal cual (máximo 20 palabras)',
      '- angulo: uno de dolor | medico | estetica | gym | oficina | regalo | otro',
      '- oferta: la promo en pocas palabras (ej.: "2x1", "envío gratis + pago al recibir", "40% off"); vacío si no hay',
      '- precio: si aparece, el número en pesos sin símbolos; vacío si no',
      '- formato: video | imagen | carrusel',
      '- cta: el botón (Comprar, Más información, Enviar mensaje…)',
      '- nota: qué hace bien o qué se puede aprender, en una oración',
      'No inventes anuncios ni datos que no estén en el material. Si un anuncio aparece repetido (varias versiones), contalo una vez y decilo en la nota.',
      '',
      'Respondé SOLO con JSON: {"anuncios":[{"anunciante":"","id":"","dominio":"","desde":"","gancho":"","angulo":"","oferta":"","precio":"","formato":"","cta":"","nota":""}]}',
    ]
      .filter((l) => l !== '')
      .join('\n');
  }

  function insightPrompt(ads, today, d) {
    d = d || {};
    const lines = ads
      .slice(0, 120)
      .map((a) => [a.anunciante, a.dias != null ? a.dias + ' días' : 's/f', a.angulo, a.oferta, a.precio, a.formato, '"' + (a.gancho || '') + '"'].join(' | '))
      .join('\n');
    return [
      'Sos estratega de creativos para e-commerce en Argentina. Mi tienda, ViaCare, vende un corrector de postura con pago contra entrega por TikTok y Meta.',
      'Estos son anuncios activos de la competencia (anunciante | días activo | ángulo | oferta | precio | formato | gancho). Los que llevan ' + GANADOR_DIAS + ' días o más probablemente funcionan. Hoy es ' + today + '.',
      lines,
      '',
      'Respondé en español rioplatense, texto plano con guiones, breve:',
      '1. Qué está funcionando: ganchos, ángulos y ofertas que se repiten en los anuncios con más días.',
      '2. Huecos: ángulos u ofertas que nadie está usando y podrían diferenciarme.',
      '3. Precios: cómo me ubico' + (d.precio1 ? ' (mi precio: 1 unidad ' + U.money(d.precio1) + (d.precio2 ? ', 2 unidades ' + U.money(d.precio2) : '') + ')' : '') + '.',
      '4. Cinco ideas de creativos para ViaCare inspiradas en lo que funciona, sin copiar: gancho (primera frase), ángulo y qué se ve en los primeros 3 segundos.',
      'Nada de claims médicos ni promesas de cura.',
    ].join('\n');
  }

  function sanitizeAds(data) {
    const list = Array.isArray(data) ? data : data && Array.isArray(data.anuncios) ? data.anuncios : [];
    return list
      .filter((a) => a && (a.gancho || a.anunciante))
      .map((a) => ({
        anunciante: String(a.anunciante || '').trim(),
        idBiblioteca: String(a.id || a.idBiblioteca || '').replace(/\D/g, ''),
        dominio: String(a.dominio || '')
          .trim()
          .toLowerCase()
          .replace(/^[a-z]+:\/\//, '')
          .replace(/^www\./, '')
          .split(/[/?#\s]/)[0],
        desde: parseDate(a.desde) || '',
        gancho: String(a.gancho || '').trim(),
        angulo: ANGULOS[a.angulo] ? a.angulo : 'otro',
        oferta: String(a.oferta || '').trim(),
        precio: U.parseMoney(a.precio) || null,
        formato: String(a.formato || '').trim().toLowerCase(),
        cta: String(a.cta || '').trim(),
        nota: String(a.nota || '').trim(),
      }));
  }

  const api = { BUSQUEDAS, GANADOR_DIAS, ANGULOS, adLibraryUrl, tiktokTopAdsUrl, parseDate, daysActive, summarize, extractPrompt, insightPrompt, sanitizeAds };
  if (isNode) module.exports = api;
  else (root.VC = root.VC || {}).competitors = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

    { id: 'plantillas', nombre: 'Plantillas ortopédicas', busqueda: 'plantillas ortopedicas', refMin: 16000, refMax: 30000, demanda: 3, competencia: 3, afinidad: 3, video: 3, riesgo: 4, envioExtra: 0, nota: 'Livianas y baratas de enviar, pero con talles: más cambios.' },
    { id: 'soporte', nombre: 'Soporte de notebook', busqueda: 'soporte notebook aluminio', refMin: 8000, refMax: 51000, demanda: 3, competencia: 5, afinidad: 4, video: 3, riesgo: 1, envioExtra: 0, nota: 'Postura frente a la compu, pero hay muchísima oferta barata.' },
    { id: 'faja', nombre: 'Faja lumbar', busqueda: 'faja lumbar', refMin: null, refMax: null, demanda: 3, competencia: 4, afinidad: 4, video: 2, riesgo: 3, envioExtra: 0, nota: 'Mismo cliente con dolor lumbar. Talles y poca diferencia visual.' },
  ];

  const PESOS = { margen: 30, demanda: 20, competencia: 15, afinidad: 15, video: 10, riesgo: 10 };

  function mlUrl(q) {
    return 'https://listado.mercadolibre.com.ar/' + encodeURIComponent(U.stripAccents(q).toLowerCase().trim().replace(/\s+/g, '-'));

  /*
   * Economía de un candidato vendido por anuncios (con CPA) y a clientes actuales por WhatsApp (sin anuncios).
   */
  function economics(p, cfg, rates, cpa) {
    const c = P.normalizeCfg(cfg);
    const r = P.effectiveRates(c, rates);
    const precio = Number(p.precio) || 0;
    const costo = Number(p.costo) || 0;
    if (!precio || !costo) return null;
    const envio = c.costoEnvio + (Number(p.envioExtra) || 0);
    const margenEntrega = precio * (1 - c.comisionCobro / 100) - costo - envio - c.otrosPorPedido;
    const perdida = c.costoDevolucion + (Number(p.envioExtra) || 0) + c.otrosPorPedido;
    const esperado = r.confirmacion * (r.entrega * margenEntrega - (1 - r.entrega) * perdida);
    const conAnuncios = esperado - (Number(cpa) || 0);
    // A un cliente que ya compró se le escribe por WhatsApp: no hay CPA y casi siempre confirma
    const aCliente = r.entrega * margenEntrega - (1 - r.entrega) * perdida;
    return { precio, costo, margenEntrega, esperado, conAnuncios, aCliente, markup: precio / costo };
  }

  function margenScore(conAnuncios) {
    if (conAnuncios == null) return null;
    return U.clamp(1 + (conAnuncios / 20000) * 4, 1, 5); // $0 → 1 · $20.000 o más por pedido → 5
  }

  function score(p, cfg, rates, cpa) {
    const eco = economics(p, cfg, rates, cpa);
    const parts = {
      margen: eco ? margenScore(eco.conAnuncios) : null,
      demanda: Number(p.demanda) || 3,
      competencia: 6 - (Number(p.competencia) || 3),
      afinidad: Number(p.afinidad) || 3,
      video: Number(p.video) || 3,
      riesgo: 6 - (Number(p.riesgo) || 3),

    let peso = 0;
    for (const [k, w] of Object.entries(PESOS)) {
      if (parts[k] == null) continue;
      total += w * ((parts[k] - 1) / 4);
      peso += w;
    }
    return { eco, parts, puntaje: peso ? Math.round((total / peso) * 100) : 0, completo: parts.margen != null };
  }

  function claudePrompt(list, d) {
    const rows = list.map((p) => '- ' + p.nombre + (p.refMin ? ' (Mercado Libre: ' + U.money(p.refMin) + ' a ' + U.money(p.refMax) + ')' : '')).join('\n');
    return [
      'Tengo una tienda online en Argentina (ViaCare) que vende un corrector de postura a ' + U.money(d.precio1 || 68990) + ' con pago contra entrega, por anuncios de TikTok y Meta. Mis clientes: gente de 25 a 60 años con dolor de espalda o cuello por trabajar sentada o usar el celular.',
      'Quiero sumar un segundo producto para venderle al mismo cliente y para anunciar.',
      'Candidatos:',
      rows,
      '',
      'Para cada uno estimá del 1 al 5: demanda en Argentina, competencia (5 = mucha), afinidad con mi cliente del corrector, qué tan bien se muestra en un video corto, y riesgo operativo (5 = muchas devoluciones, talles, fallas o envío caro).',
      'Sugerí un precio de venta para contra entrega en Argentina (en pesos), el mejor ángulo de anuncio y un combo con el corrector.',
      'No tenés acceso a internet: basate en lo que sabés y aclaralo en "dudas" cuando no estés seguro.',
      '',
      'Respondé SOLO con JSON: {"productos":[{"nombre":"(igual que en la lista)","demanda":3,"competencia":3,"afinidad":3,"video":3,"riesgo":3,"precio_sugerido":0,"angulo":"…","combo":"…","dudas":"…"}],"recomendacion":"2-3 oraciones"}',
    ].join('\n');
  }

  const api = { REF_FECHA, CANDIDATOS, PESOS, mlUrl, trendsUrl, economics, score, margenScore, claudePrompt };
  if (isNode) module.exports = api;
  else (root.VC = root.VC || {}).products = api;

<script>
/* lib/research.js */
/*
 * Lectura de páginas públicas que trae el navegador: Biblioteca de anuncios de Meta, Mercado Libre y tiendas Shopify.
 * Solo lógica pura (sin red): detecta si la página terminó de cargar, compacta texto, lee catálogos y compara fotos.

(function (root) {
  'use strict';
  const isNode = typeof module === 'object' && module.exports;
  const U = isNode ? require('./util.js') : root.VC.util;

  /* ---------- Texto ---------- */

  // Colapsa espacios, saca líneas vacías y repetidas seguidas, y corta en `max` caracteres
  function compactText(text, max) {
    const lines = String(text || '')
      .replace(/\r/g, '')
      .split('\n')
      .map((l) => l.replace(/[ \t ]+/g, ' ').trim())
      .filter(Boolean);
    const out = [];
    for (const l of lines) if (out[out.length - 1] !== l) out.push(l);
    const s = out.join('\n');
    return max && s.length > max ? s.slice(0, max) : s;
  }

  /* ---------- Biblioteca de anuncios de Meta ---------- */

  const AD_MARK = /(Identificador de la biblioteca|Identificador de biblioteca|Library ID|Comenz[oó] a circular|Started running)/i;

  function adLibraryReady(text) {
    const s = String(text || '');
    return AD_MARK.test(s) || /(No hay anuncios|No se encontraron anuncios|No ads match|no results)/i.test(s) || needsLogin(s);
  }

  function adLibraryCount(text) {
    const m = String(text || '').match(/(Identificador de la biblioteca|Identificador de biblioteca|Library ID)/gi);
    return m ? m.length : 0;
  }

  function needsLogin(text) {
    const s = String(text || '');
    return !adLibraryCount(s) && /(Inici[aá] sesi[oó]n|Log in to|Log into Facebook|Entrar a Facebook|Iniciar sesi[oó]n en Facebook|You must log in)/i.test(s);
  }

  // Identificadores de la biblioteca que aparecen en el texto ("Identificador de la biblioteca: 1234567890")
  function adLibraryIds(text) {
    const ids = [];
    const re = /(?:Identificador de la biblioteca|Identificador de biblioteca|Library ID)\s*:?\s*(\d{6,})/gi;
    let m;
    while ((m = re.exec(String(text || '')))) ids.push(m[1]);
    return ids;
  }

  function adUrl(id) {
    return id ? 'https://www.facebook.com/ads/library/?id=' + encodeURIComponent(id) : '';
  }

  function normKey(s) {
    return U.stripAccents(String(s || ''))
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  // Clave para no guardar dos veces el mismo anuncio
  function adKey(a) {
    if (a && a.idBiblioteca) return 'id:' + a.idBiblioteca;
    return 'tx:' + normKey(a && a.anunciante) + '|' + normKey(a && a.gancho).slice(0, 80);
  }

  /* ---------- Dominios y tiendas ---------- */

  // "https://www.PosturaYa.com.ar/products/x?y" → "posturaya.com.ar"
  function normalizeDomain(input) {
    let s = String(input || '')
      .trim()
      .toLowerCase();
    if (!s) return '';
    s = s.replace(/^[a-z]+:\/\//, '').replace(/^www\./, '');
    s = s.split(/[/?#\s]/)[0];
    s = s.replace(/:\d+$/, '').replace(/\.$/, '');
    if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(s)) return '';
    return s;
  }

  // Dominios que no son tiendas (redes, marketplaces, acortadores)
  const NO_TIENDA = /(^|\.)(facebook\.com|fb\.com|fb\.me|instagram\.com|whatsapp\.com|wa\.me|tiktok\.com|mercadolibre\.com(\.ar)?|mercadolibre\.com|meli\.la|google\.com|youtube\.com|linktr\.ee|bit\.ly|shopify\.com)$/;

  function isStoreDomain(d) {
    const n = normalizeDomain(d);
    return !!n && !NO_TIENDA.test(n);
  }

  function productsJsonUrl(domain, page) {
    return 'https://' + normalizeDomain(domain) + '/products.json?limit=250' + (page > 1 ? '&page=' + page : '');
  }

  function productUrl(domain, handle) {
    return 'https://' + normalizeDomain(domain) + '/products/' + encodeURIComponent(handle);
  }

  // El texto de una página JSON trae el JSON tal cual (a veces con texto del visor del navegador alrededor)
  function extractJson(text) {
    const s = String(text || '');
    const a = s.indexOf('{');
    const b = s.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try {
      return JSON.parse(s.slice(a, b + 1));
    } catch (e) {
      return null;
    }
  }

  function shopifyReady(text) {
    const s = String(text || '');
    return /"products"\s*:/.test(s) || /(404|not found|no encontrad|password|contraseña|Opening soon|Abriremos pronto)/i.test(s);
  }

  /*
   * Catálogo público de una tienda Shopify (/products.json). Shopify no publica ventas ni stock exacto:
   * se ve precio, precio tachado, si cada variante está disponible y las fechas de creación y publicación.
   */
  function parseShopifyProducts(text) {
    const data = extractJson(text);
    if (!data || !Array.isArray(data.products)) return null;
    return data.products.map((p) => {
      const vs = Array.isArray(p.variants) ? p.variants : [];
      const prices = vs.map((v) => U.parseNum(v.price)).filter((n) => n != null);
      const compare = vs.map((v) => U.parseNum(v.compare_at_price)).filter((n) => n != null && n > 0);
      return {
        id: String(p.id),
        titulo: String(p.title || ''),
        handle: String(p.handle || ''),
        tipo: String(p.product_type || ''),
        creado: p.created_at || null,
        publicado: p.published_at || null,
        actualizado: p.updated_at || null,
        precioMin: prices.length ? Math.min(...prices) : null,
        precioMax: prices.length ? Math.max(...prices) : null,
        tachado: compare.length ? Math.max(...compare) : null,
        variantes: vs.length,
        disponibles: vs.filter((v) => v.available !== false).length,
        disponible: vs.some((v) => v.available !== false),
        imagen: p.images && p.images[0] && p.images[0].src ? String(p.images[0].src) : '',
      };

  }

  /*
   * Compara dos fotos del catálogo de una tienda: productos nuevos, quitados, cambios de precio y de stock.
   * prev/next: arrays de parseShopifyProducts.
   */
  function diffCatalog(prev, next) {
    const a = new Map((prev || []).map((p) => [p.id, p]));
    const b = new Map((next || []).map((p) => [p.id, p]));
    const nuevos = [];
    const quitados = [];
    const precios = [];
    const agotados = [];
    const repuestos = [];
    for (const [id, p] of b) {
      const o = a.get(id);
      if (!o) {
        nuevos.push(p);
        continue;
      }
      if (o.precioMin !== p.precioMin) precios.push({ producto: p, antes: o.precioMin, ahora: p.precioMin });
      if (o.disponible && !p.disponible) agotados.push(p);
      if (!o.disponible && p.disponible) repuestos.push(p);
    }
    for (const [id, p] of a) if (!b.has(id)) quitados.push(p);
    return { nuevos, quitados, precios, agotados, repuestos, cambios: nuevos.length + quitados.length + precios.length + agotados.length + repuestos.length };
  }

  /* Productos de la tienda que se parecen a un corrector de postura (para comparar precio) */
  function postureProducts(list) {
    return (list || []).filter((p) => /postur|corrector|espald|faja|chaleco|columna|hombro/i.test(U.stripAccents(p.titulo + ' ' + p.tipo)));
  }

  function daysSince(iso, today) {
    if (!iso) return null;
    return U.daysBetween(U.dayKeyAR(iso), today || U.todayKeyAR());
  }

  // "123 reseñas", "(45 opiniones)", "87 reviews" → el número más grande que aparezca
  function reviewCount(text) {
    const re = /(\d[\d.,]*)\s*(rese[nñ]as|opiniones|reviews|valoraciones|calificaciones|comentarios)/gi;
    let best = null;
    let m;
    while ((m = re.exec(String(text || '')))) {
      const n = U.parseMoney(m[1]);
      if (n != null && (best == null || n > best)) best = n;
    }
    return best;
  }

  /* ---------- Mercado Libre ---------- */

  function mlReady(text) {
    const s = String(text || '');
    return /(\$\s?\d|resultados|No hay publicaciones|no encontramos)/i.test(s);
  }

  // "+5mil vendidos" → 5000 · "+500 vendidos" → 500 · "+10 mil vendidos" → 10000 · "+1 M vendidos" → 1000000
  function parseVendidos(str) {
    const m = String(str || '')
      .toLowerCase()
      .match(/\+?\s*(\d+(?:[.,]\d+)?)\s*(mil|k|m|mill[oó]n(?:es)?)?\s*vendid/);
    if (!m) return null;
    let n = Number(m[1].replace(',', '.'));
    if (m[2] === 'mil' || m[2] === 'k') n *= 1000;
    else if (m[2]) n *= 1000000; // "m", "millón", "millones"
    return Math.round(n);
  }

  // Todas las menciones de "vendidos" en el texto
  function vendidosEnTexto(text) {
    const out = [];
    const re = /\+?\s*\d+(?:[.,]\d+)?\s*(?:mil|k|m|mill[oó]n(?:es)?)?\s*vendid[oa]s?/gi;
    let m;
    while ((m = re.exec(String(text || '')))) {
      const n = parseVendidos(m[0]);
      if (n != null) out.push(n);
    }
    return out;
  }

  // "1.234 resultados" en la búsqueda de Mercado Libre
  function mlResultCount(text) {
    const m = String(text || '').match(/([\d.]+)\s+resultados/i);
    return m ? U.parseMoney(m[1]) : null;
  }

  function median(nums) {
    const a = (nums || []).filter((n) => Number.isFinite(n)).sort((x, y) => x - y);
    if (!a.length) return null;
    const i = Math.floor(a.length / 2);
    return a.length % 2 ? a[i] : (a[i - 1] + a[i]) / 2;
  }

   * Resumen de demanda a partir de las publicaciones extraídas de una búsqueda:

    const L = (listings || []).filter((l) => l && (l.precio || l.titulo));
    const vend = L.map((l) => l.vendidos).filter((n) => n != null);
    const opin = L.map((l) => l.opiniones).filter((n) => n != null);
    const precios = L.map((l) => l.precio).filter((n) => n > 0);
    const masVendidos = L.filter((l) => l.masVendido).length;
    const totalVend = U.sum(vend);
    const totalOpin = U.sum(opin);
    // Demanda 1–5: por vendidos visibles; si no hay, por opiniones (≈ 1 de cada 10 compradores opina)
    const base = vend.length ? totalVend : totalOpin * 10;
    const demanda = base >= 20000 ? 5 : base >= 5000 ? 4 : base >= 1000 ? 3 : base >= 200 ? 2 : 1;
    // Competencia 1–5: cantidad de resultados y de publicaciones con buenas ventas
    const competencia = resultados == null ? (L.length >= 10 ? 4 : 3) : resultados >= 5000 ? 5 : resultados >= 1500 ? 4 : resultados >= 400 ? 3 : resultados >= 100 ? 2 : 1;
    return {
      publicaciones: L.length,
      resultados: resultados == null ? null : resultados,
      vendidosVisibles: vend.length ? totalVend : null,
      opiniones: opin.length ? totalOpin : null,
      masVendidos,
      precioMin: precios.length ? Math.min(...precios) : null,
      precioMediana: median(precios),
      precioMax: precios.length ? Math.max(...precios) : null,
      demanda,
      competencia,
      vende: base >= 1000 ? 'si' : base >= 200 ? 'algo' : 'poco',
    };
  }

  const api = {
    compactText,
    adLibraryReady,
    adLibraryCount,
    adLibraryIds,
    needsLogin,
    adUrl,
    adKey,
    normKey,
    normalizeDomain,
    isStoreDomain,

    productUrl,

    mlSignals,
    median,
  };
  if (isNode) module.exports = api;
  else (root.VC = root.VC || {}).research = api;

<script>
/* lib/scan.js */
/*
 * Escaneo automático de la competencia en la Biblioteca de anuncios de Meta: lógica pura.
 * Fusiona lo encontrado con los anuncios guardados, arma el resumen por búsqueda, detecta tiendas nuevas
 * y escribe el pedido de "Qué encontré" para Claude.
 */
(function (root) {
  'use strict';
  const isNode = typeof module === 'object' && module.exports;
  const U = isNode ? require('./util.js') : root.VC.util;
  const R = isNode ? require('./research.js') : root.VC.research;
  const CP = isNode ? require('./competitors.js') : root.VC.competitors;

  const MAX_BUSQUEDAS = 8;
  const MAX_DOMINIOS = 20;
  // Campos que se completan en un anuncio guardado si les faltan
  const COMPLETAR = ['desde', 'idBiblioteca', 'dominio', 'precio', 'oferta', 'busqueda'];

  /* ---------- Búsquedas ---------- */

  function limpiarBusqueda(q) {
    return String(q || '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 60);
  }

  // Sin vacías ni repetidas (sin importar mayúsculas ni acentos), hasta `max`
  function limpiarBusquedas(list, max) {
    const out = [];
    const vistas = new Set();
    for (const raw of Array.isArray(list) ? list : []) {
      const q = limpiarBusqueda(raw);
      const k = R.normKey(q);
      if (!k || vistas.has(k)) continue;
      vistas.add(k);
      out.push(q);
      if (out.length >= (max || MAX_BUSQUEDAS)) break;
    }
    return out;
  }

  function agregarBusqueda(list, q, max) {
    const lista = limpiarBusquedas(list, max);
    const nueva = limpiarBusqueda(q);
    if (!R.normKey(nueva)) return { lista, error: 'Escribí qué buscar.' };
    if (lista.some((x) => R.normKey(x) === R.normKey(nueva))) return { lista, error: 'Esa búsqueda ya está.' };
    if (lista.length >= (max || MAX_BUSQUEDAS)) return { lista, error: 'Podés tener hasta ' + (max || MAX_BUSQUEDAS) + ' búsquedas. Quitá una para agregar otra.' };
    return { lista: lista.concat(nueva), error: '' };
  }

  function progreso(i, n, q) {
    return i + 1 + '/' + n + ' · ' + q;
  }

  /* ---------- Página de la Biblioteca ---------- */

  // 'anuncios' | 'login' | 'vacia' | 'cookies' | 'cargando'
  function estadoPagina(text) {
    const s = String(text || '');
    if (R.adLibraryCount(s) > 0 || /(Comenz[oó] a circular|Started running)/i.test(s)) return 'anuncios';
    if (R.needsLogin(s)) return 'login';
    if (R.adLibraryReady(s)) return 'vacia';
    if (/cookies/i.test(s)) return 'cookies';
    return 'cargando';
  }

  // Si Claude devolvió un identificador que no está en la página, lo descartamos (mejor sin id que con uno inventado)
  function validarIds(ads, idsEnTexto) {
    const ok = new Set(idsEnTexto || []);
    return (ads || []).map((a) => (a.idBiblioteca && ok.size && !ok.has(a.idBiblioteca) ? Object.assign({}, a, { idBiblioteca: '' }) : a));
  }

  /* ---------- Fusión con lo guardado ---------- */

  // Clave por texto (anunciante + gancho), sin importar el identificador
  function textKey(a) {
    return R.adKey({ anunciante: a && a.anunciante, gancho: a && a.gancho });
  }

  function vacio(v) {
    return v == null || v === '';
  }

  function nuevoId(now, rand) {
    return 'a' + (now || Date.now()).toString(36) + (rand ? rand() : Math.random()).toString(36).slice(2, 6);
  }

  /*
   * guardados: Map(id → anuncio) o array [{id, ...}]. encontrados: anuncios de sanitizeAds (con `busqueda`).
   * ahora: ISO del escaneo. opts.tocados: Set de ids ya vistos en este escaneo (se suma vistoVeces una sola vez).
   * Devuelve {escrituras: [{id, data, nuevo}], nuevos: [{id, ...}], docs: Map actualizado}. No modifica `guardados`.
   */
  function mergeAds(guardados, encontrados, ahora, opts) {
    opts = opts || {};
    const tocados = opts.tocados || new Set();
    const makeId = opts.makeId || (() => nuevoId());
    const docs = new Map(guardados instanceof Map ? guardados : (guardados || []).map((a) => [a.id, a]));
    const porClave = new Map();
    const porTexto = new Map();
    const indexar = (id, a) => {
      porClave.set(R.adKey(a), id);
      const tk = textKey(a);
      const prev = porTexto.get(tk);
      // Para el cruce por texto preferimos el guardado sin identificador
      if (!prev || (docs.get(prev) && docs.get(prev).idBiblioteca && !a.idBiblioteca)) porTexto.set(tk, id);
    };
    for (const [id, a] of docs) indexar(id, a || {});

    const escrituras = new Map();
    const nuevos = [];
    for (const f of encontrados || []) {
      if (!f || (!f.anunciante && !f.gancho)) continue;
      let id = porClave.get(R.adKey(f));
      if (!id) {
        const c = porTexto.get(textKey(f));
        // Solo por texto si a alguno de los dos le falta el identificador: dos ids distintos son dos anuncios
        if (c && (!f.idBiblioteca || !docs.get(c).idBiblioteca)) id = c;
      }
      if (id) {
        const prev = docs.get(id);
        const next = Object.assign({}, prev);
        if (!tocados.has(id)) {
          next.ultimaVez = ahora;
          next.vistoVeces = (Number(prev.vistoVeces) || 1) + 1;
          tocados.add(id);
        }
        for (const k of COMPLETAR) if (vacio(prev[k]) && !vacio(f[k])) next[k] = f[k];
        if (!next.primeraVez && prev.cargado) next.primeraVez = prev.cargado;
        if (JSON.stringify(next) === JSON.stringify(prev)) continue;
        docs.set(id, next);
        const ya = escrituras.get(id);
        escrituras.set(id, { id, data: next, nuevo: ya ? ya.nuevo : false });
        if (ya && ya.nuevo) {
          const i = nuevos.findIndex((n) => n.id === id);
          if (i >= 0) nuevos[i] = Object.assign({ id }, next);
        }
        indexar(id, next);
      } else {
        id = makeId();
        for (let n = 1; docs.has(id); n++) id = makeId() + n.toString(36);
        const data = Object.assign({}, f, { primeraVez: ahora, ultimaVez: ahora, cargado: ahora, origen: 'auto', vistoVeces: 1 });
        docs.set(id, data);
        tocados.add(id);
        escrituras.set(id, { id, data, nuevo: true });
        nuevos.push(Object.assign({ id }, data));
        indexar(id, data);
      }
    }
    return { escrituras: [...escrituras.values()], nuevos, docs };
  }

  // Nombres de anunciantes de `nuevos` que no estaban entre los guardados antes del escaneo
  function anunciantesNuevos(antes, nuevos) {
    const conocidos = new Set((antes || []).map((a) => R.normKey(a && a.anunciante)).filter(Boolean));
    const out = [];
    for (const a of nuevos || []) {
      const k = R.normKey(a && a.anunciante);
      if (!k || conocidos.has(k)) continue;
      conocidos.add(k);
      out.push(String(a.anunciante).trim());
    }
    return out;
  }

  // Dominios de tiendas que aparecen en los anuncios y todavía no se revisan. lista = actuales + nuevos (tope total)
  function dominiosNuevos(ads, actuales, tope) {
    const max = tope || MAX_DOMINIOS;
    const base = Array.isArray(actuales) ? actuales.slice() : [];
    const set = new Set(base.map(R.normalizeDomain).filter(Boolean));
    const agregar = [];
    for (const a of ads || []) {
      const d = R.normalizeDomain(a && a.dominio);
      if (!d || !R.isStoreDomain(d) || set.has(d)) continue;
      if (set.size >= max) break;
      set.add(d);
      agregar.push(d);
    }
    return { agregar, lista: base.concat(agregar) };
  }

  /* ---------- Resumen del escaneo ---------- */

  const NO_REVISADA = 'No se revisó.';

  // items: [{q, estado, anuncios, nuevos, error}] → [{q, anuncios, nuevos, error}]
  function porBusqueda(items) {
    return (items || []).map((it) => ({
      q: String(it.q || '').slice(0, 80),
      anuncios: Number(it.anuncios) || 0,
      nuevos: Number(it.nuevos) || 0,
      error: it.error ? String(it.error).slice(0, 300) : it.estado === 'espera' || it.estado === 'omitida' ? NO_REVISADA : '',
    }));
  }

  function plural(n, uno, varios) {
    return n + ' ' + (n === 1 ? uno : varios);
  }

  function resumenCorto(nuevos) {
    return nuevos > 0 ? 'Encontré ' + plural(nuevos, 'anuncio nuevo', 'anuncios nuevos') + ' de la competencia' : 'Sin anuncios nuevos de la competencia';
  }

  function esNuevo(a, fechaEscaneo) {
    const p = Date.parse(a && a.primeraVez);
    const f = Date.parse(fechaEscaneo);
    return Number.isFinite(p) && Number.isFinite(f) && p >= f;
  }

  function ganadores(ads, hoy) {
    return (ads || []).filter((a) => {
      const d = a.dias != null ? a.dias : CP.daysActive(a.desde, hoy);
      return d != null && d >= CP.GANADOR_DIAS;
    });
  }

  function preciosResumen(ads) {
    const p = (ads || []).map((a) => Number(a && a.precio)).filter((n) => Number.isFinite(n) && n > 0);
    return { n: p.length, min: p.length ? Math.min(...p) : null, mediana: R.median(p), max: p.length ? Math.max(...p) : null };
  }

  // Documento 'escaneos/ultimo' con tamaños acotados
  function armarEscaneo(o) {
    return {
      fecha: o.fecha,
      porBusqueda: (o.porBusqueda || []).slice(0, MAX_BUSQUEDAS),
      nuevos: Number(o.nuevos) || 0,
      total: Number(o.total) || 0,
      ganadores: Number(o.ganadores) || 0,
      anunciantesNuevos: (o.nombresNuevos || []).length,
      nombresNuevos: (o.nombresNuevos || []).slice(0, 20).map((s) => String(s).slice(0, 80)),
      dominiosNuevos: (o.dominiosNuevos || []).slice(0, MAX_DOMINIOS),
      resumen: String(o.resumen || '').slice(0, 8000),
      aviso: String(o.aviso || '').slice(0, 300),
      errorResumen: String(o.errorResumen || '').slice(0, 300),
    };
  }

  /* ---------- Pedido a Claude: "Qué encontré" ---------- */

  function lineaAnuncio(a, hoy) {
    const dias = a.dias != null ? a.dias : CP.daysActive(a.desde, hoy);
    return [
      a.anunciante || 's/n',
      dias != null ? dias + ' días' : 's/f',
      CP.ANGULOS[a.angulo] || a.angulo || '',
      a.oferta || 'sin oferta',
      a.precio ? U.money(a.precio) : 's/p',
      a.formato || '',
      '"' + String(a.gancho || '').slice(0, 160) + '"',
    ].join(' | ');
  }

  /*
   * o = {nuevos: [anuncios], ganadores: [anuncios], porBusqueda: [{q, anuncios, nuevos, error}], total, hoy,
   *      datos: {tienda, precio1, precio2}, vistos?: [anuncios vistos en el escaneo, para los precios]}
   */
  function findingsPrompt(o) {
    const d = o.datos || {};
    const hoy = o.hoy || U.todayKeyAR();
    const nuevos = (o.nuevos || []).slice(0, 40);
    const gan = (o.ganadores || []).slice(0, 40);
    const precios = preciosResumen(o.vistos || (o.nuevos || []).concat(o.ganadores || []));
    const busq = (o.porBusqueda || []).map((b) => '- ' + b.q + ': ' + (b.error ? 'no se pudo leer (' + b.error + ')' : plural(b.anuncios, 'anuncio', 'anuncios') + ', ' + plural(b.nuevos, 'nuevo', 'nuevos')));
    const mios = d.precio1 ? 'Mis precios: 1 unidad ' + U.money(d.precio1) + (d.precio2 ? ', 2 unidades ' + U.money(d.precio2) : '') + '.' : 'No cargué mis precios.';
    return [
      'Sos estratega de creativos para e-commerce en Argentina. Mi tienda, ' + (d.tienda || 'ViaCare') + ', vende un corrector de postura con pago contra entrega por anuncios de TikTok y Meta.',
      'Hoy es ' + hoy + '. Acabo de escanear la Biblioteca de anuncios de Meta (Argentina, anuncios activos) con estas búsquedas:',
      busq.join('\n') || '- (ninguna)',
      'En total vi ' + plural(Number(o.total) || 0, 'anuncio distinto', 'anuncios distintos') + '.',
      '',
      'ANUNCIOS NUEVOS desde el escaneo anterior (anunciante | días activo | ángulo | oferta | precio | formato | gancho):',
      nuevos.length ? nuevos.map((a) => lineaAnuncio(a, hoy)).join('\n') : 'Ninguno.',
      '',
      'ACTIVOS HACE ' + CP.GANADOR_DIAS + ' DÍAS O MÁS (señal de que les rinde: nadie sostiene semanas un anuncio que pierde plata):',
      gan.length ? gan.map((a) => lineaAnuncio(a, hoy)).join('\n') : 'Ninguno.',
      '',
      'PRECIOS que se ven en los anuncios: ' +
        (precios.n ? plural(precios.n, 'anuncio', 'anuncios') + ' con precio; mínimo ' + U.money(precios.min) + ', mediana ' + U.money(precios.mediana) + ', máximo ' + U.money(precios.max) + '.' : 'ningún anuncio muestra precio.') +
        ' ' +
        mios,
      '',
      'Escribí "Qué encontré" en español rioplatense (con voseo), en texto plano sin markdown (nada de #, ** ni tablas), corto: máximo unas 300 palabras. Cuatro partes, cada una con su título solo en una línea y debajo viñetas con guion:',
      'Novedades: anuncios y anunciantes nuevos que valga la pena mirar. Si no hay, decilo en una línea.',
      'Lo que les funciona: ganchos, ángulos y ofertas que se repiten en los activos hace ' + CP.GANADOR_DIAS + ' días o más.',
      'Precios: los de la competencia contra los míos, y si estoy caro, en línea o barato.',
      'Qué probar en ViaCare: de 3 a 5 ideas, cada una con la primera frase, el ángulo y qué se ve en los primeros 3 segundos.',
      'Reglas: inspirate sin copiar textos de otros; nada de claims médicos ni promesas de cura (nada de "cura", "elimina el dolor" ni "corrige la columna"); no inventes datos que no estén arriba. Los días activos son una señal de que el anuncio rinde, no un dato de ventas: no digas cuánto venden.',
    ].join('\n');
  }

  const api = {
    MAX_BUSQUEDAS,
    MAX_DOMINIOS,
    NO_REVISADA,
    limpiarBusquedas,
    agregarBusqueda,
    progreso,
    estadoPagina,
    validarIds,
    textKey,
    nuevoId,
    mergeAds,
    anunciantesNuevos,
    dominiosNuevos,
    porBusqueda,
    resumenCorto,
    esNuevo,
    ganadores,
    preciosResumen,
    armarEscaneo,
    findingsPrompt,
  };
  if (isNode) module.exports = api;

<script>
/* lib/stores.js */
/*
 * Tiendas Shopify de la competencia: foto compacta del catálogo, comparación entre revisiones, historial
 * y "movimiento" (señales de venta). Shopify no publica ventas ni stock exacto: todo esto son señales.
 */
(function (root) {
  'use strict';
  const isNode = typeof module === 'object' && module.exports;
  const U = isNode ? require('./util.js') : root.VC.util;
  const R = isNode ? require('./research.js') : root.VC.research;

  const TOPE_PRODUCTOS = 150;
  const TOPE_HISTORIAL = 10;
  const TOPE_CAMBIOS = 20;
  const TOPE_RESENAS = 3; // productos de postura a los que se les cuentan reseñas
  const TOPE_TIENDAS = 12; // por corrida
  const DIAS_LANZAMIENTO = 30;
  const PAGINA = 250; // productos por página de /products.json
  const MAX_DOC = 140000; // bytes aproximados por documento (el límite es 256 KB)
  const COMPRAS_POR_RESENA = [10, 50]; // rango orientativo

  function docPath(dominio) {
    const d = R.normalizeDomain(dominio);
    return d ? 'tiendas/' + d : '';
  }

  function plural(n, uno, varios) {
    return U.int(n) + ' ' + (n === 1 ? uno : varios);
  }

  function lista(partes) {
    if (partes.length < 2) return partes.join('');
    return partes.slice(0, -1).join(', ') + ' y ' + partes[partes.length - 1];
  }

  function capital(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  function esPostura(p) {
    return p && p.postura != null ? !!p.postura : R.postureProducts([p]).length > 0;
  }

  function fechaProducto(p) {
    return (p && (p.publicado || p.creado)) || null;
  }

  /* Productos de postura ordenados: primero los que dicen corrector o postura, después los disponibles, después los más viejos */
  function posturaOrdenada(list) {
    const fuerte = (p) => (/corrector|postur/i.test(U.stripAccents(p.titulo || '')) ? 0 : 1);
    const t = (p) => {
      const x = Date.parse(fechaProducto(p));
      return Number.isFinite(x) ? x : Infinity;
    };
    return (list || [])
      .filter(esPostura)
      .slice()
      .sort((a, b) => fuerte(a) - fuerte(b) || (b.disponible ? 1 : 0) - (a.disponible ? 1 : 0) || t(a) - t(b));
  }

  /* El corrector "estrella" de la tienda: el de postura con más reseñas; si no hay reseñas, el primero de posturaOrdenada */
  function principal(productos, resenas) {
    const ps = posturaOrdenada(productos);
    if (!ps.length) return null;
    const r = resenas || {};
    let best = null;
    for (const p of ps) if (r[p.handle] != null && (best == null || r[p.handle] > r[best.handle])) best = p;
    return best || ps[0];
  }

  function compactProduct(p, postura) {
    return {
      id: String(p.id),
      titulo: String(p.titulo || '').slice(0, 100),
      handle: String(p.handle || '').slice(0, 120),
      precioMin: p.precioMin == null ? null : p.precioMin,
      tachado: p.tachado == null ? null : p.tachado,
      disponible: !!p.disponible,
      publicado: p.publicado || null,
      creado: p.creado || null,
      variantes: Number(p.variantes) || 0,
      disponibles: Number(p.disponibles) || 0,
      postura: !!postura,

  }

  /*
   * Foto compacta para guardar: primero los de postura, después los más nuevos, hasta TOPE_PRODUCTOS.
   * productos: lista de VC.research.parseShopifyProducts.
   */
  function snapshot(productos, tope) {
    const all = productos || [];
    const post = posturaOrdenada(all);
    const ids = new Set(post.map((p) => p.id));
    const resto = all
      .filter((p) => !ids.has(p.id))
      .sort((a, b) => String(fechaProducto(b) || '').localeCompare(String(fechaProducto(a) || '')));
    return post
      .map((p) => compactProduct(p, true))
      .concat(resto.map((p) => compactProduct(p, false)))
      .slice(0, tope || TOPE_PRODUCTOS);
  }

  /*
   * El texto de /products.json puede venir cortado si la página es muy larga: rescata los productos completos
   * que alcanzaron a llegar. Devuelve {productos, parcial} o null si no es un catálogo de Shopify.
   */
  function leerCatalogo(texto) {
    const full = R.parseShopifyProducts(texto);
    if (full) return { productos: full, parcial: full.length >= PAGINA };
    const s = String(texto || '');
    const ini = s.search(/\{\s*"products"\s*:\s*\[/);
    if (ini < 0) return null;
    const re = /\{\s*"id"\s*:\s*\d+\s*,\s*"title"\s*:\s*"(?:[^"\\]|\\.)*"\s*,\s*"handle"\s*:/g;
    re.lastIndex = ini;
    const cortes = [];
    let m;
    while ((m = re.exec(s))) cortes.push(m.index);
    // Prueba cortando antes del último producto empezado, después del anterior, y así (pocas veces)
    for (let i = cortes.length - 1; i >= 1 && i >= cortes.length - 4; i--) {
      const trozo = s.slice(ini, cortes[i]).replace(/[\s,]+$/, '') + ']}';
      const prods = R.parseShopifyProducts(trozo);
      if (prods && prods.length) return { productos: prods, parcial: true };
    }
    return null;
  }

  /* Mensaje claro cuando la página no trajo un catálogo */
  function motivoError(texto) {
    const s = String(texto || '');
    if (/(password|contraseña|Opening soon|Abriremos pronto|Enter store using password)/i.test(s)) return 'La tienda está cerrada con contraseña.';
    if (!s.trim()) return 'La página no cargó. Probá de nuevo más tarde.';
    return 'No es una tienda Shopify o tiene el catálogo oculto.';
  }

  function corto(p) {
    return { titulo: p.titulo, handle: p.handle, precio: p.precioMin == null ? null : p.precioMin };
  }

  /*
   * Compara la revisión anterior (doc.ultima) con el catálogo recién leído. Devuelve null en la primera revisión.
   * opts.parcial: el catálogo nuevo no está completo (no se puede saber qué se quitó).
   */
  function comparar(prevUltima, productos, opts) {
    if (!prevUltima || !prevUltima.fecha || !Array.isArray(prevUltima.productos)) return null;
    const o = opts || {};
    const d = R.diffCatalog(prevUltima.productos, productos);
    // Si la foto anterior estaba recortada, "nuevo" es solo lo publicado después de esa revisión
    if (prevUltima.truncado) {
      const desde = Date.parse(prevUltima.fecha);
      d.nuevos = d.nuevos.filter((p) => {
        const t = Date.parse(fechaProducto(p));
        return !Number.isFinite(t) || t > desde;
      });
    }
    if (o.parcial) d.quitados = [];
    const prevById = new Map(prevUltima.productos.map((p) => [p.id, p]));
    const variantes = [];
    for (const p of productos || []) {
      const a = prevById.get(p.id);
      if (!a || !a.disponible || !p.disponible || a.variantes !== p.variantes) continue;
      if (a.disponibles !== p.disponibles) variantes.push({ titulo: p.titulo, handle: p.handle, antes: a.disponibles, ahora: p.disponibles, de: p.variantes });
    }
    const conteo = { nuevos: d.nuevos.length, quitados: d.quitados.length, precios: d.precios.length, agotados: d.agotados.length, repuestos: d.repuestos.length, variantes: variantes.length };
    return {
      desde: prevUltima.fecha,
      fecha: o.fecha || null,
      nuevos: d.nuevos.slice(0, TOPE_CAMBIOS).map(corto),
      quitados: d.quitados.slice(0, TOPE_CAMBIOS).map(corto),
      precios: d.precios.slice(0, TOPE_CAMBIOS).map((x) => ({ titulo: x.producto.titulo, handle: x.producto.handle, antes: x.antes, ahora: x.ahora })),
      agotados: d.agotados.slice(0, TOPE_CAMBIOS).map(corto),
      repuestos: d.repuestos.slice(0, TOPE_CAMBIOS).map(corto),
      variantes: variantes.slice(0, TOPE_CAMBIOS),
      resenas: [],
      conteo,
    };
  }

  /*
   * Reseñas leídas ahora ({handle: n|null}) contra las anteriores. Si una lectura falló, se conserva el número anterior.
   * Devuelve {resenas, cambios: [{titulo, handle, antes, ahora, suma}], nuevas}.
   */
  function compararResenas(prev, ahora, productos) {
    const p = prev || {};
    const resenas = {};
    const cambios = [];
    let nuevas = 0;
    const titulo = new Map((productos || []).map((x) => [x.handle, x.titulo]));
    for (const [h, n] of Object.entries(ahora || {})) {
      if (n == null) {
        if (p[h] != null) resenas[h] = p[h];
        continue;
      }
      resenas[h] = n;
      if (p[h] != null) {
        const suma = Math.max(0, n - p[h]);
        nuevas += suma;
        cambios.push({ titulo: titulo.get(h) || h, handle: h, antes: p[h], ahora: n, suma });
      }
    }
    return { resenas, cambios, nuevas };
  }

  function lanzamientos(productos, hoy, dias) {
    const lim = dias || DIAS_LANZAMIENTO;
    return (productos || []).filter((p) => {
      const d = R.daysSince(fechaProducto(p), hoy);
      return d != null && d >= 0 && d <= lim;
    });
  }

  /* Una línea del historial a partir de la revisión guardada y sus cambios */
  function resumenRevision(ultima, cambios, resenasNuevas) {
    const ps = (ultima && ultima.productos) || [];
    const total = ultima && ultima.total != null ? ultima.total : ps.length;
    const agotados = ultima && ultima.agotados != null ? ultima.agotados : ps.filter((p) => !p.disponible).length;
    const c = principal(ps, ultima && ultima.resenas);
    const vals = Object.values((ultima && ultima.resenas) || {}).filter((n) => n != null);
    const k = (cambios && cambios.conteo) || {};
    return {
      fecha: ultima ? ultima.fecha : null,
      productos: total,
      disponibles: total - agotados,
      agotados,
      precioCorrector: c ? c.precioMin : null,
      resenasTotal: vals.length ? U.sum(vals) : null,
      resenasNuevas: resenasNuevas || 0,
      nuevos: k.nuevos || 0,
      precios: k.precios || 0,
      seAgotaron: k.agotados || 0,
      repuestos: k.repuestos || 0,
    };
  }

  function docBase(dominio, fecha, origen) {
    return { dominio: R.normalizeDomain(dominio), agregada: fecha, origen: origen === 'anuncio' ? 'anuncio' : 'manual', ultima: null, historial: [], cambios: null };
  }

  /*
   * Arma el documento nuevo de una tienda después de revisarla.
   * r: {dominio, fecha (ISO), productos (parseShopifyProducts o null), parcial, resenas {handle: n|null}, error, origen}
   * Devuelve {doc, cuenta: {nuevos, precios, agotados, repuestos, resenas}, novedades}.
   */
  function revisar(prev, r) {
    const fecha = r.fecha || new Date().toISOString();
    const base = Object.assign(docBase(r.dominio, fecha, r.origen), prev || {});
    base.dominio = R.normalizeDomain(r.dominio || base.dominio);
    base.historial = Array.isArray(base.historial) ? base.historial : [];
    const prevUltima = base.ultima && base.ultima.fecha ? base.ultima : null;
    const cuenta = { nuevos: 0, precios: 0, agotados: 0, repuestos: 0, resenas: 0 };
    let error = r.error || '';
    if (!error && (!r.productos || !r.productos.length)) error = r.productos ? 'La tienda no muestra productos en su catálogo público.' : 'No es una tienda Shopify o tiene el catálogo oculto.';
    if (error) {
      // Se conserva la última foto buena para comparar la próxima vez
      const ultima = Object.assign({ fecha: null, productos: [], resenas: {} }, prevUltima || {}, { intento: fecha, error: String(error).slice(0, 300) });
      return { doc: Object.assign({}, base, { ultima }), cuenta, novedades: 0 };
    }
    const productos = r.productos;
    const cambios = comparar(prevUltima, productos, { parcial: !!r.parcial, fecha });
    const res = compararResenas(prevUltima && prevUltima.resenas, r.resenas, productos);
    if (cambios) cambios.resenas = res.cambios.slice(0, TOPE_CAMBIOS);
    const foto = snapshot(productos);
    const ultima = {
      fecha,
      intento: fecha,
      total: productos.length,
      agotados: productos.filter((p) => !p.disponible).length,
      truncado: foto.length < productos.length,
      parcial: !!r.parcial,
      productos: foto,
      resenas: res.resenas,
      error: '',
    };
    const historial = base.historial.concat([resumenRevision(ultima, cambios, cambios ? res.nuevas : 0)]).slice(-TOPE_HISTORIAL);
    if (cambios) {
      cuenta.nuevos = cambios.conteo.nuevos;
      cuenta.precios = cambios.conteo.precios;
      cuenta.agotados = cambios.conteo.agotados;
      cuenta.repuestos = cambios.conteo.repuestos;
      cuenta.resenas = res.nuevas;
    }
    const doc = ajustarTamano(Object.assign({}, base, { ultima, historial, cambios }));
    return { doc, cuenta, novedades: cuenta.nuevos + cuenta.precios + cuenta.agotados + cuenta.repuestos + cuenta.resenas };
  }

  function tamano(doc) {
    return JSON.stringify(doc).length * 1.1; // margen por acentos y caracteres de más de un byte
  }

  /* Recorta el documento si se pasa de MAX_DOC: primero las listas de cambios, después la foto del catálogo */
  function ajustarTamano(doc, max) {
    const lim = max || MAX_DOC;
    if (tamano(doc) <= lim) return doc;
    const d = JSON.parse(JSON.stringify(doc));
    if (d.cambios) for (const k of ['nuevos', 'quitados', 'precios', 'agotados', 'repuestos', 'variantes', 'resenas']) if (Array.isArray(d.cambios[k])) d.cambios[k] = d.cambios[k].slice(0, 5);
    while (d.ultima && Array.isArray(d.ultima.productos) && d.ultima.productos.length > 10 && tamano(d) > lim) {
      d.ultima.productos = d.ultima.productos.slice(0, Math.floor(d.ultima.productos.length * 0.75));
      d.ultima.truncado = true;
    }
    return d;
  }

  /* Anuncios guardados por dominio (colección 'competencia'): {dominio: {anuncios, diasMax}} */
  function anunciosPorDominio(ads, hoy) {
    const out = {};
    const today = hoy || U.todayKeyAR();
    for (const a of ads || []) {
      const d = R.normalizeDomain(a && a.dominio);
      if (!d) continue;
      let dias = a.dias != null && Number.isFinite(Number(a.dias)) ? Number(a.dias) : null;
      if (dias == null && /^\d{4}-\d{2}-\d{2}$/.test(String(a.desde || ''))) dias = Math.max(0, U.daysBetween(a.desde, today));
      const o = out[d] || (out[d] = { anuncios: 0, diasMax: null });
      o.anuncios++;
      if (dias != null && (o.diasMax == null || dias > o.diasMax)) o.diasMax = dias;
    }
    return out;
  }

  function meses(dias) {
    const m = Math.floor(dias / 30);
    return m === 1 ? '1 mes' : m + ' meses';
  }

  /*
   * Movimiento de una tienda (alto, medio o bajo) con una explicación corta. Son señales, no ventas:
   * reseñas que suma, productos que se agotan y se reponen, su corrector agotado o con talles agotados,
   * cuánto lleva publicado y con stock, si pauta, lanzamientos recientes y cambios de precio.
   * opts: {hoy, anuncios: {anuncios, diasMax} | null}
   */
  function movimiento(doc, opts) {
    const o = opts || {};
    const hoy = o.hoy || U.todayKeyAR();
    const u = doc && doc.ultima;
    if (!u || !u.fecha) return { nivel: null, puntos: 0, motivos: [], texto: 'Todavía no se revisó.' };
    const h = Array.isArray(doc.historial) ? doc.historial : [];
    const suma = (k) => U.sum(h, (x) => Number(x[k]) || 0);
    const motivos = [];
    const add = (pts, texto) => motivos.push({ pts, texto });

    const rn = suma('resenasNuevas');
    if (rn > 0) add(rn >= 10 ? 3 : rn >= 3 ? 2 : 1, 'sumó ' + plural(rn, 'reseña', 'reseñas') + (h[0] && h[0].fecha ? ' desde el ' + U.fmtDay(U.dayKeyAR(h[0].fecha)) : ''));
    const rep = suma('repuestos');
    if (rep > 0) add(2, 'repuso ' + plural(rep, 'producto que se había agotado', 'productos que se habían agotado'));
    const ago = suma('seAgotaron');
    if (ago > 0) add(1, 'se le ' + (ago === 1 ? 'agotó 1 producto' : 'agotaron ' + U.int(ago) + ' productos'));

    const c = principal(u.productos, u.resenas);
    if (c) {
      const dias = R.daysSince(fechaProducto(c), hoy);
      if (!c.disponible) add(2, 'su corrector está agotado (demanda o falta de stock)');
      else if (c.variantes > 1 && c.disponibles < c.variantes) add(1, 'tiene ' + plural(c.variantes - c.disponibles, 'variante agotada', 'variantes agotadas') + ' en su corrector');
      if (c.disponible && dias != null && dias >= 90) add(2, 'su corrector sigue publicado y con stock hace ' + meses(dias));
      else if (c.disponible && dias != null && dias >= 45) add(1, 'su corrector lleva ' + dias + ' días publicado y con stock');
    }

    const ads = o.anuncios;
    if (ads && ads.anuncios) add(ads.diasMax != null && ads.diasMax >= 21 ? 2 : 1, 'pauta en Meta (' + plural(ads.anuncios, 'anuncio guardado', 'anuncios guardados') + (ads.diasMax != null && ads.diasMax >= 21 ? ', uno activo hace ' + ads.diasMax + ' días' : '') + ')');
    else if (doc.origen === 'anuncio') add(1, 'la encontramos pautando en Meta');

    const lz = lanzamientos(u.productos, hoy).length;
    if (lz >= 3) add(1, 'lanzó ' + lz + ' productos en ' + DIAS_LANZAMIENTO + ' días (está testeando)');
    const pr = suma('precios');
    if (pr > 0) add(1, 'movió ' + plural(pr, 'precio', 'precios'));

    const puntos = U.sum(motivos, (m) => m.pts);
    const nivel = puntos >= 5 ? 'alto' : puntos >= 2 ? 'medio' : 'bajo';
    const top = motivos
      .slice()
      .sort((a, b) => b.pts - a.pts)
      .slice(0, 3)
      .map((m) => m.texto);
    const texto = top.length ? capital(lista(top)) + '.' : h.length < 2 ? 'Primera revisión: los cambios se ven a partir de la próxima.' : 'Sin señales de venta en las últimas revisiones.';
    return { nivel, puntos, motivos, texto };
  }

  /* Precio de su corrector contra el tuyo */
  function compararPrecio(suyo, mio) {
    if (!(suyo > 0) || !(mio > 0)) return null;
    const dif = suyo - mio;
    const pct = dif / mio;
    if (Math.abs(pct) < 0.02) return { dif, pct, tono: 'neutral', texto: 'Casi el mismo precio que el tuyo' };
    return dif < 0
      ? { dif, pct, tono: 'warn', texto: U.money(-dif) + ' más barato que el tuyo (' + U.pct(-pct) + ')' }
      : { dif, pct, tono: 'good', texto: U.money(dif) + ' más caro que el tuyo (' + U.pct(pct) + ')' };
  }

  /* Rango orientativo de ventas a partir de reseñas nuevas (si son reales) */
  function ventasEstimadas(resenasNuevas) {
    if (!(resenasNuevas > 0)) return null;
    return { min: resenasNuevas * COMPRAS_POR_RESENA[0], max: resenasNuevas * COMPRAS_POR_RESENA[1] };
  }

  /* Dominios a revisar: los de la configuración y los guardados, sin los quitados; primero los que hace más que no se miran */
  function dominiosARevisar(cfgDominios, docs, quitadas, tope) {
    const fuera = new Set((quitadas || []).map(R.normalizeDomain));
    const m = docs instanceof Map ? docs : new Map(Object.entries(docs || {}));
    const set = new Set();
    for (const d of (cfgDominios || []).concat([...m.keys()])) {
      const n = R.normalizeDomain(d);
      if (n && R.isStoreDomain(n) && !fuera.has(n)) set.add(n);
    }
    const ultimo = (d) => {
      const u = m.get(d) && m.get(d).ultima;
      return (u && (u.intento || u.fecha)) || '';
    };
    return [...set].sort((a, b) => ultimo(a).localeCompare(ultimo(b)) || a.localeCompare(b)).slice(0, tope || TOPE_TIENDAS);
  }

  /* Aviso corto de una corrida: totales = suma de las cuentas de revisar() */
  function resumenCorrida(n, totales, errores) {
    const t = totales || {};
    const cambios = (t.nuevos || 0) + (t.precios || 0) + (t.agotados || 0) + (t.repuestos || 0);
    const partes = [];
    if (t.nuevos) partes.push(plural(t.nuevos, 'producto nuevo', 'productos nuevos'));
    if (t.precios) partes.push(plural(t.precios, 'cambio de precio', 'cambios de precio'));
    if (t.agotados) partes.push(plural(t.agotados, 'agotado', 'agotados'));
    if (t.repuestos) partes.push(plural(t.repuestos, 'repuesto', 'repuestos'));
    let s = 'Revisé ' + plural(n, 'tienda', 'tiendas') + ': ' + (cambios ? plural(cambios, 'cambio', 'cambios') + ' (' + partes.join(', ') + ')' : 'sin cambios');
    if (t.resenas) s += ' y ' + plural(t.resenas, 'reseña nueva', 'reseñas nuevas');
    s += '.';
    if (errores) s += ' ' + (errores === 1 ? '1 no se pudo leer.' : errores + ' no se pudieron leer.');
    return s;
  }

  const api = {
    TOPE_PRODUCTOS,
    TOPE_HISTORIAL,
    TOPE_CAMBIOS,
    TOPE_RESENAS,
    TOPE_TIENDAS,
    DIAS_LANZAMIENTO,
    MAX_DOC,
    COMPRAS_POR_RESENA,
    docPath,
    docBase,
    posturaOrdenada,
    principal,
    snapshot,
    leerCatalogo,
    motivoError,
    comparar,
    compararResenas,
    lanzamientos,
    resumenRevision,
    revisar,
    ajustarTamano,
    anunciosPorDominio,
    movimiento,
    compararPrecio,
    ventasEstimadas,
    dominiosARevisar,
    resumenCorrida,
  };
  if (isNode) module.exports = api;
  else (root.VC = root.VC || {}).stores = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* lib/winners.js */
/*
 * Productos ganadores: señales públicas de venta en Mercado Libre (+X vendidos, opiniones, sello MÁS VENDIDO,
 * cantidad de resultados). Mercado Libre no publica las ventas de cada vendedor: todo esto son señales, no ventas exactas.
 * Solo lógica pura (sin red): prompts, limpieza de lo que devuelve Claude, rangos de precio y orden de descubrimientos.
 */
(function (root) {
  'use strict';
  const isNode = typeof module === 'object' && module.exports;
  const U = isNode ? require('./util.js') : root.VC.util;
  const R = isNode ? require('./research.js') : root.VC.research;

  const MAX_MEDIR = 10; // productos por corrida
  const MAX_PUBS = 20; // publicaciones que se leen de una búsqueda
  const MAX_GUARDADAS = 12; // publicaciones que se guardan por producto
  const MAX_LECTURAS = 8; // páginas que Claude puede abrir al descubrir
  const MAX_SEMILLAS = 8;
  const HOSTS_ML = ['listado.mercadolibre.com.ar', 'www.mercadolibre.com.ar', 'articulo.mercadolibre.com.ar'];
  const CAMPOS_MEDICION = ['demanda', 'competencia', 'refMin', 'refMax', 'medido', 'vende'];

  const VEREDICTOS = {
    si: { label: 'Se vende', tone: 'good' },
    algo: { label: 'Se vende algo', tone: 'info' },
    poco: { label: 'Poca venta', tone: 'warn' },
  };

  /* Búsquedas para descubrir productos del mismo cliente (las primeras 8 primero; el resto, de reserva). */
  const SEMILLAS = [
    { q: 'almohada cervical', por_que: 'Mismo dolor de cuello que el corrector, y se usa todas las noches.', video: 'Cómo queda el cuello al dormir de costado, con y sin la almohada.' },
    { q: 'masajeador de cuello', por_que: 'Alivia la contractura de cuello y hombros del que trabaja sentado.', video: 'Primer plano del masajeador sobre la nuca y la cara de alivio.' },
    { q: 'soporte lumbar', por_que: 'Para la silla de home office: el mismo cliente con dolor de espalda baja.', video: 'Sentado en la silla con y sin el soporte, mostrando la curva de la espalda.' },
    { q: 'cojín ortopédico', por_que: 'Para el que pasa muchas horas sentado y siente la cadera o el coxis.', video: 'Cómo se apoya y cómo recupera la forma al apretarlo.' },
    { q: 'antifaz para dormir', por_que: 'Suma al descanso del que duerme mal y es barato para agregar al pedido.', video: 'Rutina de noche: de la luz prendida a la oscuridad total.' },
    { q: 'rodillera', por_que: 'Dolor articular en la misma franja de edad; liviana y barata de enviar.', video: 'Subiendo una escalera con la rodillera puesta.' },
    { q: 'soporte de notebook', por_que: 'Sube la pantalla a la altura de los ojos: corrige la postura frente a la compu.', video: 'Lado a lado: cuello agachado con la notebook en la mesa y derecho con el soporte.' },
    { q: 'faja lumbar', por_que: 'El mismo cliente con dolor lumbar al levantar peso o estar mucho parado.', video: 'Ponérsela sobre la ropa en segundos y agacharse a levantar algo.' },
    { q: 'almohadilla térmica', por_que: 'Calor para la contractura de espalda y cuello; se usa en casa todos los días.', video: 'Apoyada en la espalda mientras trabaja en la compu.' },
    { q: 'masajeador de pies', por_que: 'Para el que termina el día cansado; mismo público de 25 a 60 años.', video: 'Pies adentro del masajeador y la reacción en primer plano.' },
    { q: 'reposapiés ergonómico', por_que: 'Completa la postura del home office junto con el corrector.', video: 'Escritorio armado: pies colgando contra pies apoyados.' },
    { q: 'apoya muñeca mouse', por_que: 'Ergonomía del escritorio; barato para sumar al pedido.', video: 'Mano sobre el mouse con y sin el apoyo, en primer plano.' },

  /* ---------- Números ---------- */

  function texto(v, max) {
    if (v == null || typeof v === 'object') return '';
    const s = String(v).replace(/\s+/g, ' ').trim();
    if (!s || /^(null|undefined|n\/?a|-+)$/i.test(s)) return '';
    return max && s.length > max ? s.slice(0, max - 1).trimEnd() + '…' : s;
  }

  // "$ 29.990" · "29990" · 29990 → 29990 (el primer número que aparece)
  function precio(v) {
    let n;
    if (typeof v === 'number') n = v;
    else {
      const m = String(v == null ? '' : v).match(/\d[\d.]*(?:,\d+)?/);
      n = m ? U.parseMoney(m[0]) : null;
    }
    if (n == null || !Number.isFinite(n) || n < 100 || n > 1e8) return null;
    return Math.round(n);
  }

  // "1.234" · "(1234)" · "4,8 (1.234)" → 1234 (el último número que aparece)
  function cantidad(v) {
    let n;
    if (typeof v === 'number') n = v;
    else {
      const all = String(v == null ? '' : v).match(/\d[\d.]*/g);
      n = all ? U.parseMoney(all[all.length - 1]) : null;
    }
    if (n == null || !Number.isFinite(n) || n < 0 || n > 1e8) return null;
    return Math.round(n);
  }

  // "+5mil vendidos" → 5000 · "+500" → 500 · "+10.000 vendidos" → 10000 · 2500 → 2500
  function vendidos(v) {
    if (typeof v === 'number') return Number.isFinite(v) && v >= 0 ? Math.round(v) : null;
    let s = texto(v, 80);
    if (!s) return null;
    while (/\d\.\d{3}(?!\d)/.test(s)) s = s.replace(/(\d)\.(\d{3})(?!\d)/, '$1$2');
    const n = R.parseVendidos(/vendid/i.test(s) ? s : s + ' vendidos');
    return n != null ? n : cantidad(s);
  }

  function calificacion(v) {
    const n = U.parseNum(v);
    return n != null && n > 0 && n <= 5 ? Math.round(n * 10) / 10 : null;
  }

  function bool(v) {
    return v === true || /^(true|s[ií]|1)$/i.test(String(v == null ? '' : v).trim());
  }

  // Percentil con interpolación lineal (p entre 0 y 1)
  function percentil(nums, p) {
    const a = (nums || []).filter((n) => Number.isFinite(n)).sort((x, y) => x - y);
    if (!a.length) return null;
    const pos = (a.length - 1) * U.clamp(p, 0, 1);
    const lo = Math.floor(pos);
    const hi = Math.ceil(pos);
    return a[lo] + (a[hi] - a[lo]) * (pos - lo);
  }

  /* Rango de precios de referencia: del percentil 25 al 75 (o mínimo y máximo si hay pocas publicaciones). */
  function rangoRef(precios) {
    const a = (precios || []).filter((n) => Number.isFinite(n) && n > 0);
    if (!a.length) return null;
    if (a.length < 4) return [Math.round(Math.min(...a)), Math.round(Math.max(...a))];
    const r100 = (n) => Math.round(n / 100) * 100;
    return [r100(percentil(a, 0.25)), r100(percentil(a, 0.75))];
  }

  /* ---------- Prompts ---------- */

  function mlExtractPrompt(textoPagina, nombre) {
    return [
      'Este es el texto de una búsqueda de Mercado Libre Argentina' + (nombre ? ' para el producto "' + texto(nombre, 100) + '"' : '') + '. Extraé las publicaciones del listado.',
      '',
      'Para cada publicación, en el orden en que aparecen (hasta ' + MAX_PUBS + '), salteando las que claramente no son ese producto:',
