      margen: eco ? margenScore(eco.conAnuncios) : null,
      demanda: Number(p.demanda) || 3,
      competencia: 6 - (Number(p.competencia) || 3),
      afinidad: Number(p.afinidad) || 3,
      video: Number(p.video) || 3,
      riesgo: 6 - (Number(p.riesgo) || 3),
    };
    let total = 0;
    let peso = 0;
    for (const [k, w] of Object.entries(PESOS)) {
      if (parts[k] == null) continue;
      total += w * ((parts[k] - 1) / 4);
      peso += w;
    }
    return { eco, parts, puntaje: peso ? Math.round((total / peso) * 100) : 0, completo: parts.margen != null };
  }

  function claudePrompt(list, d) {
    const rows = list.map((p) => '- ' + p.nombre + (p.refMin ? ' (Mercado Libre: ' + U.money(p.refMin) + ' a ' + U.money(p.refMax) + ')' : '')).join('\n');
    return [
      'Tengo una tienda online en Argentina (ViaCare) que vende un corrector de postura a ' + U.money(d.precio1 || 68990) + ' con pago contra entrega, por anuncios de TikTok y Meta. Mis clientes: gente de 25 a 60 años con dolor de espalda o cuello por trabajar sentada o usar el celular.',
      'Quiero sumar un segundo producto para venderle al mismo cliente y para anunciar.',
      'Candidatos:',
      rows,
      '',
      'Para cada uno estimá del 1 al 5: demanda en Argentina, competencia (5 = mucha), afinidad con mi cliente del corrector, qué tan bien se muestra en un video corto, y riesgo operativo (5 = muchas devoluciones, talles, fallas o envío caro).',
      'Sugerí un precio de venta para contra entrega en Argentina (en pesos), el mejor ángulo de anuncio y un combo con el corrector.',
      'No tenés acceso a internet: basate en lo que sabés y aclaralo en "dudas" cuando no estés seguro.',
      '',
      'Respondé SOLO con JSON: {"productos":[{"nombre":"(igual que en la lista)","demanda":3,"competencia":3,"afinidad":3,"video":3,"riesgo":3,"precio_sugerido":0,"angulo":"…","combo":"…","dudas":"…"}],"recomendacion":"2-3 oraciones"}',
    ].join('\n');
  }

  const api = { REF_FECHA, CANDIDATOS, PESOS, mlUrl, trendsUrl, economics, score, margenScore, claudePrompt };
  if (isNode) module.exports = api;
  else (root.VC = root.VC || {}).products = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* lib/research.js */
/*
 * Lectura de páginas públicas que trae el navegador: Biblioteca de anuncios de Meta, Mercado Libre y tiendas Shopify.
 * Solo lógica pura (sin red): detecta si la página terminó de cargar, compacta texto, lee catálogos y compara fotos.
 */
(function (root) {
  'use strict';
  const isNode = typeof module === 'object' && module.exports;
  const U = isNode ? require('./util.js') : root.VC.util;

  /* ---------- Texto ---------- */

  // Colapsa espacios, saca líneas vacías y repetidas seguidas, y corta en `max` caracteres
  function compactText(text, max) {
    const lines = String(text || '')
      .replace(/\r/g, '')
      .split('\n')
      .map((l) => l.replace(/[ \t ]+/g, ' ').trim())
      .filter(Boolean);
    const out = [];
    for (const l of lines) if (out[out.length - 1] !== l) out.push(l);
    const s = out.join('\n');
    return max && s.length > max ? s.slice(0, max) : s;
  }

  /* ---------- Biblioteca de anuncios de Meta ---------- */

  const AD_MARK = /(Identificador de la biblioteca|Identificador de biblioteca|Library ID|Comenz[oó] a circular|Started running)/i;

  function adLibraryReady(text) {
    const s = String(text || '');
    return AD_MARK.test(s) || /(No hay anuncios|No se encontraron anuncios|No ads match|no results)/i.test(s) || needsLogin(s);
  }

  function adLibraryCount(text) {
    const m = String(text || '').match(/(Identificador de la biblioteca|Identificador de biblioteca|Library ID)/gi);
    return m ? m.length : 0;
  }

  function needsLogin(text) {
    const s = String(text || '');
    return !adLibraryCount(s) && /(Inici[aá] sesi[oó]n|Log in to|Log into Facebook|Entrar a Facebook|Iniciar sesi[oó]n en Facebook|You must log in)/i.test(s);
  }

  // Identificadores de la biblioteca que aparecen en el texto ("Identificador de la biblioteca: 1234567890")
  function adLibraryIds(text) {
    const ids = [];
    const re = /(?:Identificador de la biblioteca|Identificador de biblioteca|Library ID)\s*:?\s*(\d{6,})/gi;
    let m;
    while ((m = re.exec(String(text || '')))) ids.push(m[1]);
    return ids;
  }

  function adUrl(id) {
    return id ? 'https://www.facebook.com/ads/library/?id=' + encodeURIComponent(id) : '';
  }

  function normKey(s) {
    return U.stripAccents(String(s || ''))
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  // Clave para no guardar dos veces el mismo anuncio
  function adKey(a) {
    if (a && a.idBiblioteca) return 'id:' + a.idBiblioteca;
    return 'tx:' + normKey(a && a.anunciante) + '|' + normKey(a && a.gancho).slice(0, 80);
  }

  /* ---------- Dominios y tiendas ---------- */

  // "https://www.PosturaYa.com.ar/products/x?y" → "posturaya.com.ar"
  function normalizeDomain(input) {
    let s = String(input || '')
      .trim()
      .toLowerCase();
    if (!s) return '';
    s = s.replace(/^[a-z]+:\/\//, '').replace(/^www\./, '');
    s = s.split(/[/?#\s]/)[0];
    s = s.replace(/:\d+$/, '').replace(/\.$/, '');
    if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(s)) return '';
    return s;
  }

  // Dominios que no son tiendas (redes, marketplaces, acortadores)
  const NO_TIENDA = /(^|\.)(facebook\.com|fb\.com|fb\.me|instagram\.com|whatsapp\.com|wa\.me|tiktok\.com|mercadolibre\.com(\.ar)?|mercadolibre\.com|meli\.la|google\.com|youtube\.com|linktr\.ee|bit\.ly|shopify\.com)$/;

  function isStoreDomain(d) {
    const n = normalizeDomain(d);
    return !!n && !NO_TIENDA.test(n);
  }

  function productsJsonUrl(domain, page) {
    return 'https://' + normalizeDomain(domain) + '/products.json?limit=250' + (page > 1 ? '&page=' + page : '');
  }

  function productUrl(domain, handle) {
    return 'https://' + normalizeDomain(domain) + '/products/' + encodeURIComponent(handle);
  }

  // El texto de una página JSON trae el JSON tal cual (a veces con texto del visor del navegador alrededor)
  function extractJson(text) {
    const s = String(text || '');
    const a = s.indexOf('{');
    const b = s.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try {
      return JSON.parse(s.slice(a, b + 1));
    } catch (e) {
      return null;
    }
  }

  function shopifyReady(text) {
    const s = String(text || '');
    return /"products"\s*:/.test(s) || /(404|not found|no encontrad|password|contraseña|Opening soon|Abriremos pronto)/i.test(s);
  }

  /*
   * Catálogo público de una tienda Shopify (/products.json). Shopify no publica ventas ni stock exacto:
   * se ve precio, precio tachado, si cada variante está disponible y las fechas de creación y publicación.
   */
  function parseShopifyProducts(text) {
    const data = extractJson(text);
    if (!data || !Array.isArray(data.products)) return null;
    return data.products.map((p) => {
      const vs = Array.isArray(p.variants) ? p.variants : [];
      const prices = vs.map((v) => U.parseNum(v.price)).filter((n) => n != null);
      const compare = vs.map((v) => U.parseNum(v.compare_at_price)).filter((n) => n != null && n > 0);
      return {
        id: String(p.id),
        titulo: String(p.title || ''),
        handle: String(p.handle || ''),
        tipo: String(p.product_type || ''),
        creado: p.created_at || null,
        publicado: p.published_at || null,
        actualizado: p.updated_at || null,
        precioMin: prices.length ? Math.min(...prices) : null,
        precioMax: prices.length ? Math.max(...prices) : null,
        tachado: compare.length ? Math.max(...compare) : null,
        variantes: vs.length,
        disponibles: vs.filter((v) => v.available !== false).length,
        disponible: vs.some((v) => v.available !== false),
        imagen: p.images && p.images[0] && p.images[0].src ? String(p.images[0].src) : '',
      };
    });
  }

  /*
   * Compara dos fotos del catálogo de una tienda: productos nuevos, quitados, cambios de precio y de stock.
   * prev/next: arrays de parseShopifyProducts.
   */
  function diffCatalog(prev, next) {
    const a = new Map((prev || []).map((p) => [p.id, p]));
    const b = new Map((next || []).map((p) => [p.id, p]));
    const nuevos = [];
    const quitados = [];
    const precios = [];
    const agotados = [];
    const repuestos = [];
    for (const [id, p] of b) {
      const o = a.get(id);
      if (!o) {
        nuevos.push(p);
        continue;
      }
      if (o.precioMin !== p.precioMin) precios.push({ producto: p, antes: o.precioMin, ahora: p.precioMin });
      if (o.disponible && !p.disponible) agotados.push(p);
      if (!o.disponible && p.disponible) repuestos.push(p);
    }
    for (const [id, p] of a) if (!b.has(id)) quitados.push(p);
    return { nuevos, quitados, precios, agotados, repuestos, cambios: nuevos.length + quitados.length + precios.length + agotados.length + repuestos.length };
  }

  /* Productos de la tienda que se parecen a un corrector de postura (para comparar precio) */
  function postureProducts(list) {
    return (list || []).filter((p) => /postur|corrector|espald|faja|chaleco|columna|hombro/i.test(U.stripAccents(p.titulo + ' ' + p.tipo)));
  }

  function daysSince(iso, today) {
    if (!iso) return null;
    return U.daysBetween(U.dayKeyAR(iso), today || U.todayKeyAR());
  }

  // "123 reseñas", "(45 opiniones)", "87 reviews" → el número más grande que aparezca
  function reviewCount(text) {
    const re = /(\d[\d.,]*)\s*(rese[nñ]as|opiniones|reviews|valoraciones|calificaciones|comentarios)/gi;
    let best = null;
    let m;
    while ((m = re.exec(String(text || '')))) {
      const n = U.parseMoney(m[1]);
      if (n != null && (best == null || n > best)) best = n;
    }
    return best;
  }

  /* ---------- Mercado Libre ---------- */

  function mlReady(text) {
    const s = String(text || '');
    return /(\$\s?\d|resultados|No hay publicaciones|no encontramos)/i.test(s);
  }

  // "+5mil vendidos" → 5000 · "+500 vendidos" → 500 · "+10 mil vendidos" → 10000 · "+1 M vendidos" → 1000000
  function parseVendidos(str) {
    const m = String(str || '')
      .toLowerCase()
      .match(/\+?\s*(\d+(?:[.,]\d+)?)\s*(mil|k|m|mill[oó]n(?:es)?)?\s*vendid/);
    if (!m) return null;
    let n = Number(m[1].replace(',', '.'));
    if (m[2] === 'mil' || m[2] === 'k') n *= 1000;
    else if (m[2]) n *= 1000000; // "m", "millón", "millones"
    return Math.round(n);
  }

  // Todas las menciones de "vendidos" en el texto
  function vendidosEnTexto(text) {
    const out = [];
    const re = /\+?\s*\d+(?:[.,]\d+)?\s*(?:mil|k|m|mill[oó]n(?:es)?)?\s*vendid[oa]s?/gi;
    let m;
    while ((m = re.exec(String(text || '')))) {
      const n = parseVendidos(m[0]);
      if (n != null) out.push(n);
    }
    return out;
  }

  // "1.234 resultados" en la búsqueda de Mercado Libre
  function mlResultCount(text) {
    const m = String(text || '').match(/([\d.]+)\s+resultados/i);
    return m ? U.parseMoney(m[1]) : null;
  }

  function median(nums) {
    const a = (nums || []).filter((n) => Number.isFinite(n)).sort((x, y) => x - y);
    if (!a.length) return null;
    const i = Math.floor(a.length / 2);
    return a.length % 2 ? a[i] : (a[i - 1] + a[i]) / 2;
  }

  /*
   * Resumen de demanda a partir de las publicaciones extraídas de una búsqueda:
   * listings: [{titulo, precio, opiniones, vendidos, masVendido}]
   */
  function mlSignals(listings, resultados) {
    const L = (listings || []).filter((l) => l && (l.precio || l.titulo));
    const vend = L.map((l) => l.vendidos).filter((n) => n != null);
    const opin = L.map((l) => l.opiniones).filter((n) => n != null);
    const precios = L.map((l) => l.precio).filter((n) => n > 0);
    const masVendidos = L.filter((l) => l.masVendido).length;
    const totalVend = U.sum(vend);
    const totalOpin = U.sum(opin);
    // Demanda 1–5: por vendidos visibles; si no hay, por opiniones (≈ 1 de cada 10 compradores opina)
    const base = vend.length ? totalVend : totalOpin * 10;
    const demanda = base >= 20000 ? 5 : base >= 5000 ? 4 : base >= 1000 ? 3 : base >= 200 ? 2 : 1;
    // Competencia 1–5: cantidad de resultados y de publicaciones con buenas ventas
    const competencia = resultados == null ? (L.length >= 10 ? 4 : 3) : resultados >= 5000 ? 5 : resultados >= 1500 ? 4 : resultados >= 400 ? 3 : resultados >= 100 ? 2 : 1;
    return {
      publicaciones: L.length,
      resultados: resultados == null ? null : resultados,
      vendidosVisibles: vend.length ? totalVend : null,
      opiniones: opin.length ? totalOpin : null,
      masVendidos,
      precioMin: precios.length ? Math.min(...precios) : null,
      precioMediana: median(precios),
      precioMax: precios.length ? Math.max(...precios) : null,
      demanda,
      competencia,
      vende: base >= 1000 ? 'si' : base >= 200 ? 'algo' : 'poco',
    };
  }

  const api = {
    compactText,
    adLibraryReady,
    adLibraryCount,
    adLibraryIds,
    needsLogin,
    adUrl,
    adKey,
    normKey,
    normalizeDomain,
    isStoreDomain,
    productsJsonUrl,
    productUrl,
    extractJson,
    shopifyReady,
    parseShopifyProducts,
    diffCatalog,
    postureProducts,
    daysSince,
    reviewCount,
    mlReady,
    parseVendidos,
    vendidosEnTexto,
    mlResultCount,
    mlSignals,
    median,
  };
  if (isNode) module.exports = api;
  else (root.VC = root.VC || {}).research = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* runtime.js */
/*
 * Conexiones del panel: datos guardados (db del artifact o, si no hay, este navegador),
 * Shopify (conector de claude.ai) y Claude (para guiones y análisis).
 */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const SERVER = 'Shopify';

  function use(name) {
    try {
      return root.claude && typeof root.claude.use === 'function' ? root.claude.use(name).catch(() => null) : Promise.resolve(null);
    } catch (e) {
      return Promise.resolve(null);
    }
  }

  /* ---------------- Datos guardados ---------------- */

  const listeners = new Map(); // ruta de colección → Set(cb)
  const Store = {
    mode: 'pending', // 'db' | 'local'
    readOnly: false,
    db: null,
    cache: new Map(), // ruta de doc → datos
    queues: new Map(),

    async init() {
      const db = await use('db');
      if (db) {
        this.db = db;
        this.mode = 'db';
      } else {
        this.mode = 'local';
      }
      return this.mode;
    },

    _localKey(path) {
      return 'vc:' + path;
    },

    _localGet(path) {
      try {
        const raw = localStorage.getItem(this._localKey(path));
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    },

    _localSet(path, data) {
      try {
        if (data == null) localStorage.removeItem(this._localKey(path));
        else localStorage.setItem(this._localKey(path), JSON.stringify(data));
      } catch (e) {
        /* almacenamiento bloqueado: queda solo en memoria */
      }
    },

    _localCollection(col) {
      const out = new Map();
      try {
        const prefix = this._localKey(col + '/');
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(prefix) && !k.slice(prefix.length).includes('/')) {
            out.set(k.slice(prefix.length), JSON.parse(localStorage.getItem(k)));
          }
        }
      } catch (e) {
        /* ignorar */
      }
      for (const [p, d] of this.cache) {
        if (p.startsWith(col + '/') && !p.slice(col.length + 1).includes('/')) out.set(p.slice(col.length + 1), d);
      }
      return out;
    },

    _emit(path) {
      const col = path.split('/').slice(0, -1).join('/');
      const set = listeners.get(col);
      if (set && this.mode === 'local') {
        const data = this._localCollection(col);
        for (const cb of set) cb(data);
      }
    },

    async get(path) {
      if (this.cache.has(path)) return this.cache.get(path);
      let data = null;
      if (this.mode === 'db') {
        try {
          const snap = await this.db.doc(path).get();
          data = snap.exists ? snap.data() : null;
        } catch (e) {
          data = null;
        }
      } else {
        data = this._localGet(path);
      }
      if (data) this.cache.set(path, data);
      return data;
    },

    /* Escribe el documento completo. Las escrituras a un mismo documento van de a una. */
    set(path, data) {
      this.cache.set(path, data);
      const prev = this.queues.get(path) || Promise.resolve();
      const next = prev
        .catch(() => {})
        .then(async () => {
          if (this.mode === 'db') {
            try {
              await this.db.doc(path).set(data);
            } catch (e) {
              if (e && e.code === 'invalid_argument') this.readOnly = true;
              throw e;
            }
          } else {
            this._localSet(path, data);
            this._emit(path);
          }
        });
      this.queues.set(path, next);
      return next;
    },

    /* Mezcla campos sobre lo último conocido del documento. */
    async patch(path, partial) {
      const cur = this.cache.has(path) ? this.cache.get(path) : await this.get(path);
      const data = Object.assign({}, cur || {}, partial);
      return this.set(path, data);
    },

    /* Lee una colección una sola vez: Map id → datos. */
    async list(col) {
      if (this.mode === 'db') {
        try {
          const snap = await this.db.collection(col).get();
          const m = new Map();
          for (const d of snap.docs) {
            const data = d.data();
            m.set(d.id, data);
            this.cache.set(col + '/' + d.id, data);
          }
          return m;
        } catch (e) {
          return new Map();
        }
      }
      return this._localCollection(col);
    },

    async remove(path) {
      this.cache.delete(path);
      if (this.mode === 'db') await this.db.doc(path).delete();
      else {
        this._localSet(path, null);
        this._emit(path);
      }
    },

    /* Escucha una colección completa: cb(Map id → datos). Devuelve la función para dejar de escuchar. */
    watch(col, cb, onError) {
      if (this.mode === 'db') {
        return this.db.collection(col).onSnapshot(
          (snap) => {
            const m = new Map();
            for (const d of snap.docs) {
              const data = d.data();
              m.set(d.id, data);
              this.cache.set(col + '/' + d.id, data);
            }
            cb(m);
          },
          (e) => onError && onError(e)
        );
      }
      if (!listeners.has(col)) listeners.set(col, new Set());
      listeners.get(col).add(cb);
      setTimeout(() => cb(this._localCollection(col)), 0);
      return () => listeners.get(col).delete(cb);
    },

    watchDoc(path, cb) {
      if (this.mode === 'db') {
        return this.db.doc(path).onSnapshot(
          (snap) => {
            const data = snap.exists ? snap.data() : null;
            if (data) this.cache.set(path, data);
            cb(data);
          },
          () => {}
        );
      }
      setTimeout(() => cb(this._localGet(path) || this.cache.get(path) || null), 0);
      return () => {};
    },
  };

  /* ---------------- Shopify ---------------- */

  const ORDER_FIELDS = `
      id
      name
      createdAt
      closedAt
      cancelledAt
      displayFinancialStatus
      displayFulfillmentStatus
      phone
      tags
      note
      customAttributes { key value }
      totalPriceSet { shopMoney { amount } }
      subtotalLineItemsQuantity
      shippingAddress { firstName lastName name phone address1 address2 city province zip }
      lineItems(first: 10) { nodes { title quantity originalUnitPriceSet { shopMoney { amount } } } }
      fulfillments(first: 5) { status displayStatus createdAt deliveredAt }`;

  const ORDERS_QUERY =
    'query Pedidos($first: Int!, $query: String, $after: String) {\n  orders(first: $first, after: $after, query: $query, sortKey: CREATED_AT, reverse: true) {\n    pageInfo { hasNextPage endCursor }\n    nodes {' +
    ORDER_FIELDS +
    '\n    }\n  }\n}';

  const TAGS_MUTATION =
    'mutation Etiquetar($id: ID!, $add: [String!]!, $remove: [String!]!) {\n  tagsAdd(id: $id, tags: $add) { userErrors { field message } }\n  tagsRemove(id: $id, tags: $remove) { userErrors { field message } }\n}';

  const SHOP_ERRORS = {
    needs_reauth: 'Shopify pide que te vuelvas a conectar. Abrí claude.ai → Configuración → Conectores y reconectá Shopify.',
    server_not_connected: 'No encontramos el conector de Shopify en tu cuenta. Agregalo en claude.ai → Configuración → Conectores, o importá el CSV de pedidos.',
    selection_required: 'Tenés más de un conector de Shopify. Elegí cuál usar en el aviso de claude.ai y recargá.',
    not_in_manifest: 'No le diste permiso a esta página para usar Shopify. Habilitalo en Permisos.',
    blocked_by_policy: 'Tu organización bloquea Shopify en esta página.',
    approval_required: 'Shopify necesita tu aprobación para esta acción.',
    server_unavailable: 'Shopify no respondió. Probá de nuevo en un minuto.',
    not_granted: 'Esta vista no tiene acceso a Shopify. Abrí el panel desde claude.ai o importá el CSV de pedidos.',
    capability_disabled: 'Esta vista no tiene acceso a Shopify. Abrí el panel desde claude.ai o importá el CSV de pedidos.',
    consent_required: 'Falta tu permiso para usar Shopify en esta página.',
  };

  function shopError(e) {
    const code = (e && e.code) || 'upstream_error';
    return {
      code,
      message: SHOP_ERRORS[code] || (code === 'tool_error' ? 'Shopify devolvió un error: ' + (e.message || '') : 'No pudimos hablar con Shopify (' + code + '). Probá de nuevo.'),
      retryable: !!(e && e.retryable),
      canManage: code === 'not_in_manifest' || code === 'consent_required',
    };
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const Shop = {
    mcp: null,
    mode: 'pending', // 'live' | 'csv' | 'none'
    orders: [], // últimos pedidos (más nuevos primero)
    loadedAt: null,
    oldestCovered: null, // día más viejo cubierto por completo
    complete: false, // se trajo todo el historial
    error: null,
    loading: null,
    subs: new Set(),

    async init() {
      this.mcp = await use('mcp');
      this.mode = this.mcp ? 'live' : 'none';
      return this.mode;
    },

    onChange(cb) {
      this.subs.add(cb);
      return () => this.subs.delete(cb);
    },

    _notify() {
      for (const cb of this.subs) {
        try {
          cb(this);
        } catch (e) {
          console.error(e);
        }
      }
    },

    async _call(tool, input, opts, isRead) {
      try {
        const res = await this.mcp.callTool(SERVER, tool, input, opts);
        return res.payload;
      } catch (e) {
        if (isRead && e && e.retryable) {
          await sleep(Math.min(e.retryAfterMs || 1500 + Math.random() * 1500, 8000));
          const res = await this.mcp.callTool(SERVER, tool, input, opts);
          return res.payload;
        }
        throw e;
      }
    },

    async gql(query, variables, fresh) {
      const input = { query, variables };
      if (variables && variables.first) input.first = variables.first;
      if (variables && variables.after) input.after = variables.after;
      const payload = await this._call('graphql_query', input, { cache: fresh ? { refresh: true, staleTime: 60000 } : { staleTime: 60000 } }, true);
      const data = typeof payload === 'string' ? safeJSON(payload) : payload;
      if (!data || typeof data !== 'object') throw { code: 'tool_error', message: String(payload).slice(0, 200) };
      if (data.errors && !data.data) throw { code: 'tool_error', message: (data.errors[0] && data.errors[0].message) || 'error de GraphQL' };
      return data.data || data;
    },

    /*
     * Trae pedidos desde `sinceDay` (AAAA-MM-DD, hora AR) hasta hoy, o los últimos `maxPages`×50 si sinceDay es null.
     */
    async fetchOrders({ sinceDay, maxPages, fresh }) {
      const query = sinceDay ? "created_at:>='" + U.dayStartUTC(sinceDay) + "'" : null;
      const out = [];
      let after = null;
      let complete = false;
      for (let page = 0; page < (maxPages || 10); page++) {
        const vars = { first: 50, query, after };
        const data = await this.gql(ORDERS_QUERY, vars, fresh);
        const conn = data.orders;
        if (!conn) throw { code: 'tool_error', message: 'Respuesta inesperada de Shopify' };
        for (const n of conn.nodes || []) out.push(VC.orders.fromGraphQL(n));
        if (!conn.pageInfo || !conn.pageInfo.hasNextPage) {
          complete = true;
          break;
        }
        after = conn.pageInfo.endCursor;
      }
      return { orders: out, complete };
    },

    _merge(list) {
      const by = new Map(this.orders.map((o) => [o.id, o]));
      for (const o of list) by.set(o.id, o);
      this.orders = [...by.values()].sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
    },

    /*
     * Asegura tener cargados los pedidos desde `sinceDay`. Primero intenta con los últimos 300 pedidos
     * (alcanza para las tasas históricas y, en una tienda chica, para todo).
     */
    async ensure(sinceDay, { fresh } = {}) {
      if (this.mode === 'csv') return this.orders;
      if (this.mode !== 'live') throw { code: 'not_granted' };
      const covered = () => this.complete || (this.oldestCovered && sinceDay && this.oldestCovered <= sinceDay);
      if (!fresh && this.loadedAt && covered()) return this.orders;
      if (this.loading) {
        await this.loading.catch(() => {});
        if (!fresh && covered()) return this.orders;
      }
      this.loading = (async () => {
        this.error = null;
        this._notify();
        if (fresh || !this.loadedAt) {
          const { orders, complete } = await this.fetchOrders({ maxPages: 6, fresh });
          this.orders = [];
          this._merge(orders);
          this.complete = complete;
          this.oldestCovered = orders.length ? orders[orders.length - 1].day : null;
          if (!complete && this.oldestCovered) this.oldestCovered = U.addDays(this.oldestCovered, 1);
        }
        if (sinceDay && !covered()) {
          const { orders } = await this.fetchOrders({ sinceDay, maxPages: 20, fresh });
          this._merge(orders);
          this.oldestCovered = sinceDay;
        }
        this.loadedAt = Date.now();
      })();
      try {
        await this.loading;
      } catch (e) {
        this.error = shopError(e);
        throw this.error;
      } finally {
        this.loading = null;
        this._notify();
      }
      return this.orders;
    },

    importCSV(text) {
      const { rows } = U.parseCSV(text);
      const list = VC.orders.fromShopifyCSV(rows);
      if (!list.length) throw new Error('No encontramos pedidos en el archivo. Usá Shopify → Pedidos → Exportar → CSV para Excel.');
      this.mode = 'csv';
      this.orders = list;
      this.complete = true;
      this.loadedAt = Date.now();
      this.error = null;
      this._notify();
      return list;
    },

    /* Crea un código de descuento porcentual para toda la tienda, activo desde ahora. */
    async createDiscount({ code, percentage, title }) {
      if (this.mode !== 'live') throw { code: 'not_granted' };
      const payload = await this._call(
        'create-discount',
        { title: title || code, code, percentage, startsAt: new Date().toISOString(), customerEligibility: 'all_customers' },
        { cache: false },
        false
      );
      return typeof payload === 'string' ? payload : JSON.stringify(payload);
    },

    async setTags(order, add, remove) {
      if (this.mode !== 'live' || !/^gid:/.test(order.id)) return { skipped: true };
      const payload = await this._call('graphql_mutation', { query: TAGS_MUTATION, variables: { id: order.id, add, remove } }, { cache: false }, false);
      const data = typeof payload === 'string' ? safeJSON(payload) : payload;
      const errs = data && data.data ? [].concat(data.data.tagsAdd ? data.data.tagsAdd.userErrors : [], data.data.tagsRemove ? data.data.tagsRemove.userErrors : []) : [];
      if (data && data.errors && !data.data) throw { code: 'tool_error', message: data.errors[0] && data.errors[0].message };
      if (errs.length) throw { code: 'tool_error', message: errs[0].message };
      order.tags = order.tags.filter((t) => !remove.includes(t)).concat(add.filter((t) => !order.tags.includes(t)));
      return { ok: true };
    },
  };

  function safeJSON(s) {
    try {
      return JSON.parse(s);
    } catch (e) {
      return null;
    }
  }

  /* ---------------- Claude ---------------- */

  const AI_ERRORS = {
    not_granted: 'No diste permiso para usar Claude en esta página.',
    sampling_disabled: 'Claude no está disponible para esta cuenta.',
    rate_limited: 'Llegaste al límite de uso por ahora. Probá en unos minutos.',
    session_expired: 'Tu sesión venció. Volvé a iniciar sesión en claude.ai.',
    refused: 'Claude no quiso responder ese pedido. Cambiá el texto e intentá de nuevo.',
    invalid_json: 'La respuesta vino incompleta. Probá de nuevo o pedí menos guiones.',
    empty_completion: 'Claude no devolvió texto. Probá con un pedido más simple.',
    prompt_too_large: 'Hay demasiados datos para enviar. Probá con menos filas.',
  };

  const AI = {
    sample: null,
    async init() {
      this.sample = await use('sample');
      return !!this.sample;
    },
    errorText(e) {
      const code = (e && e.code) || 'upstream_error';
      return AI_ERRORS[code] || 'Se cortó la conexión con Claude. Probá de nuevo.';
    },
    permanent(e) {
      return ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e && e.code);
    },
  };

  /* ---------------- Navegador de la app de escritorio (en la PC del usuario) ---------------- */

  const BROWSER = 'host:claude_browser';
  const BROWSER_ERRORS = {
    server_not_connected: 'El navegador de Claude solo funciona abriendo este panel desde la app de escritorio de Claude, en una sesión de Cowork.',
    not_in_manifest: 'No le diste permiso a este panel para usar el navegador. Habilitalo en Permisos.',
    cancelled: 'Se canceló el acceso del navegador a esa página.',
    approval_required: 'El navegador necesita tu aprobación para abrir esa página.',
    blocked_by_policy: 'Tu organización no permite usar el navegador desde esta página.',
    consent_required: 'Falta tu permiso para usar el navegador en esta página.',
    not_granted: 'Esta vista no puede usar el navegador.',
    capability_disabled: 'Esta vista no puede usar el navegador.',
  };

  /*
   * Usa el navegador integrado de la app de escritorio de Claude (en la PC del usuario) para leer páginas públicas:
   * Biblioteca de anuncios de Meta, Mercado Libre, tiendas de la competencia.
   * Herramientas: preview_start({url}) abre una pestaña y devuelve su tabId; navigate({url, tabId}); get_page_text({tabId}).
   */
  const Browser = {
    mcp: null,
    available: false,
    checked: false,
    tabs: [], // pestañas abiertas por el panel (se reusan)
    busy: new Set(),
    activeOnly: false, // si no pudimos leer el tabId, trabajamos sobre la pestaña activa, de a una

    async init() {
      this.mcp = Shop.mcp || (await use('mcp'));
      this.available = false;
      if (this.mcp) {
        try {
          const r = await this.mcp.listTools(BROWSER);
          this.available = !!(r && r.servers && r.servers.some((s) => s.server === BROWSER && s.tools && s.tools.length));
        } catch (e) {
          this.available = false;
        }
      }
      this.checked = true;
      return this.available;
    },

    errorText(e) {
      const code = (e && e.code) || 'upstream_error';
      return BROWSER_ERRORS[code] || (code === 'tool_error' ? 'El navegador no pudo abrir la página: ' + ((e && e.message) || '') : 'El navegador no respondió (' + code + ').');
    },

    /* Errores que no se arreglan reintentando: cortan toda la tanda. */
    fatal(e) {
      return ['server_not_connected', 'not_in_manifest', 'blocked_by_policy', 'not_granted', 'capability_disabled', 'capability_removed', 'consent_required'].includes(e && e.code);
    },

    async _call(tool, input) {
      return this.mcp.callTool(BROWSER, tool, input, { cache: false });
    },

    _texts(res) {
      const out = [];
      const p = res && res.payload;
      if (typeof p === 'string') out.push(p);
      else if (p && typeof p === 'object') {
        for (const k of ['text', 'content', 'pageText', 'result']) if (typeof p[k] === 'string') out.push(p[k]);
      }
      for (const b of (res && res.content) || []) if (b && b.type === 'text' && typeof b.text === 'string') out.push(b.text);
      return out;
    },

    _tabId(res) {
      const p = res && res.payload;
      if (p && typeof p === 'object') {
        if (p.tabId != null) return p.tabId;
        if (p.tab_id != null) return p.tab_id;
        if (p.tab && p.tab.id != null) return p.tab.id;
      }
      const t = this._texts(res).join(' ');
      const m = t.match(/tab[\s_-]*id["'\s:=]*["']?([A-Za-z0-9_-]+)/i);
      if (!m) return null;
      return /^\d+$/.test(m[1]) ? Number(m[1]) : m[1];
    },

    _text(res) {
      return this._texts(res).sort((a, b) => b.length - a.length)[0] || '';
    },

    async _acquire(url) {
      if (this.activeOnly) {
        while (this.busy.size) await sleep(300);
        this.busy.add('active');
        await this._call('navigate', { url });
        return null;
      }
      const free = this.tabs.find((t) => !this.busy.has(t));
      if (free != null) {
        this.busy.add(free);
        try {
          await this._call('navigate', { url, tabId: free });
          return free;
        } catch (e) {
          this.busy.delete(free);
          this.tabs = this.tabs.filter((t) => t !== free); // la pestaña pudo cerrarse: abrimos otra
          if (this.fatal(e)) throw e;
        }
      }
      const res = await this._call('preview_start', { url });
      const id = this._tabId(res);
      if (id == null) {
        this.activeOnly = true;
        this.busy.add('active');
        return null;
      }
      this.tabs.push(id);
      this.busy.add(id);
      return id;
    },

    /*
     * Abre `url` y devuelve el texto de la página. Espera a que `ready(text)` sea verdadero (las páginas que cargan
     * con JavaScript tardan unos segundos), hasta `tries` lecturas.
     */
    async read(url, opts) {
      const o = Object.assign({ tries: 5, firstWait: 1800, wait: 2500, ready: null, maxChars: 0 }, opts || {});
      const tab = await this._acquire(url);
      try {
        let text = '';
        for (let i = 0; i < o.tries; i++) {
          await sleep(i === 0 ? o.firstWait : o.wait);
          const res = await this._call('get_page_text', tab == null ? {} : { tabId: tab });
          text = this._text(res);
          if (!o.ready || o.ready(text)) break;
        }
        return o.maxChars ? text.slice(0, o.maxChars) : text;
      } finally {
        this.busy.delete(tab == null ? 'active' : tab);
      }
    },
  };

  async function managePermissions() {
    const p = await use('permissions');
    if (p && p.manage) {
      try {
        await p.manage();
        return true;
      } catch (e) {
        return false;
      }
    }
    return false;
  }

  VC.runtime = { Store, Shop, AI, Browser, use, sleep, managePermissions, ORDERS_QUERY, TAGS_MUTATION };
})(window);
</script>
<script>
/* ui/common.js */
/* Piezas de interfaz compartidas y estado global del panel. */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const { Store } = VC.runtime;

  const e = U.escapeHtml;
  const $ = (sel, el) => (el || document).querySelector(sel);
  const $$ = (sel, el) => [...(el || document).querySelectorAll(sel)];

  const DEFAULT_MSGS = {
    tienda: 'ViaCare',
    firma: '',
    productoSingular: 'corrector de postura ViaCare',
    productoPlural: 'correctores de postura ViaCare',
    confirmacion:
      '¡Hola {nombre}! 👋 Te escribimos de {tienda} por tu pedido {pedido}.\n\n🛒 {cantidad}{extras}\n💵 Total: {total} (pagás al recibir)\n📍 Envío a: {direccion}, {ciudad}, {provincia} (CP {cp})\n\n¿Nos confirmás que los datos están bien para despacharlo? Respondé *SÍ* y sale hoy mismo 🙌',
    recordatorio:
      'Hola {nombre}, ¿pudiste ver nuestro mensaje? 😊 Para despachar tu pedido {pedido} ({cantidad}) necesitamos tu confirmación. Si ya no lo querés, avisanos y lo cancelamos sin problema.',
    direccion:
      'Hola {nombre}, te escribimos de {tienda} por tu pedido {pedido}. Para que el correo no tenga problemas, ¿nos pasás la dirección completa con número, entre calles y localidad? Tenemos: {direccion}, {ciudad}, {provincia} (CP {cp}).',
    resena:
      '¡Hola {nombre}! Somos {tienda} 😊 ¿Cómo te está yendo con el corrector? Ya pasaron unos días y nos encantaría saber tu opinión sincera: ¿qué notaste desde que lo usás?\n\nSi te animás, mandanos una foto usándolo (puede ser sobre la ropa y sin mostrar la cara). Con tu permiso la publicamos en la tienda con tu nombre de pila. ¡Gracias por elegirnos!',
    resenaRecordatorio: 'Hola {nombre}, ¿pudiste probar bien el corrector? Tu opinión, aunque sea cortita, nos ayuda un montón para mejorar. ¡Gracias!',
    productoGuiones: '',
    etiquetarShopify: true,
    diasResena: 4,
  };

  // Datos que usan las respuestas a comentarios, el reactivador y la calculadora de ofertas
  const DEFAULT_TIENDA = {
    precio1: 68990,
    precio2: 72990,
    envio: 'Enviamos a todo el país',
    pago: 'pagás en efectivo cuando te llega',
    demora: '',
    talles: '',
    garantia: '',
  };

  const App = {
    cfg: Object.assign({}, VC.profit.DEFAULT_CFG),
    msgs: Object.assign({}, DEFAULT_MSGS),
    tienda: Object.assign({}, DEFAULT_TIENDA),
    confirm: new Map(), // key pedido → {estado, ...}
    resenas: new Map(),
    ultimoAnalisis: null,
    subs: new Set(),
    on(cb) {
      this.subs.add(cb);
      return () => this.subs.delete(cb);
    },
    emit(what) {
      for (const cb of this.subs) {
        try {
          cb(what);
        } catch (err) {
          console.error(err);
        }
      }
    },
    saveCfg: debounce(function () {
      Store.set('config/negocio', Object.assign({}, App.cfg)).catch(storeFail);
    }, 700),
    saveMsgs: debounce(function () {
      Store.set('config/mensajes', Object.assign({}, App.msgs)).catch(storeFail);
    }, 700),
    saveTienda: debounce(function () {
      Store.set('config/tienda', Object.assign({}, App.tienda)).catch(storeFail);
    }, 700),
    // Nombre de la tienda + datos de venta, para plantillas
    datos() {
      return Object.assign({ tienda: App.msgs.tienda }, App.tienda);
    },
    confirmStates() {
      const m = new Map();
      for (const [k, v] of this.confirm) m.set(k, v.estado);
      return m;
    },
  };

  function storeFail(err) {
    if (err && err.code === 'invalid_argument') toast('No tenés permiso para guardar cambios en este panel.', 'bad');
    else if (err && err.code === 'quota_exceeded') toast('Se llenó el espacio del panel. Borrá datos viejos para seguir guardando.', 'bad');
    else toast('No se pudo guardar. Revisá la conexión y probá de nuevo.', 'bad');
  }

  function debounce(fn, ms) {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  let toastTimer;
  function toast(msg, tone) {
    let el = $('#toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.className = 'toast tone-' + (tone || 'neutral');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.hidden = true), 3800);
  }

  async function copyText(text, btn) {
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        ok = document.execCommand('copy');
      } catch (e2) {
        ok = false;
      }
      ta.remove();
    }
    if (btn) {
      const prev = btn.dataset.label || btn.textContent;
      btn.dataset.label = prev;
      btn.textContent = ok ? 'Copiado' : 'Seleccioná y copiá';
      setTimeout(() => (btn.textContent = prev), 1600);
    }
    if (!ok) toast('Tu navegador no dejó copiar. Seleccioná el texto y copialo a mano.', 'warn');
    return ok;
  }

  function chip(label, tone, extra) {
    return '<span class="chip tone-' + (tone || 'neutral') + '"' + (extra || '') + '>' + e(label) + '</span>';
  }

  function banner(tone, html, actions) {
    return '<div class="banner tone-' + tone + '"><div class="banner-text">' + html + '</div>' + (actions ? '<div class="banner-actions">' + actions + '</div>' : '') + '</div>';
  }

  function emptyState(title, body, actions) {
    return '<div class="empty"><h3>' + e(title) + '</h3><p>' + body + '</p>' + (actions ? '<div class="row-actions">' + actions + '</div>' : '') + '</div>';
  }

  const WA_ICON =
    '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';

  function waButton(href, label, act, key, variant) {
    if (!href) return '<button class="btn" disabled title="El teléfono no es válido">' + WA_ICON + e(label) + '</button>';
    return (
      '<a class="btn ' +
      (variant || 'wa') +
      '" href="' +
      e(href) +
      '" target="_blank" rel="noopener" data-act="' +
      e(act) +
      '" data-key="' +
      e(key) +
      '">' +
      WA_ICON +
      e(label) +
      '</a>'
    );
  }

  function kpi(label, value, sub, tone) {
    return (
      '<div class="kpi' +
      (tone ? ' tone-' + tone : '') +
      '"><div class="kpi-label">' +
      e(label) +
      '</div><div class="kpi-value">' +
      value +
      '</div>' +
      (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') +
      '</div>'
    );
  }

  function seg(name, options, current) {
    return (
      '<div class="seg" role="group" aria-label="' +
      e(name) +
      '">' +
      options
        .map(
          (o) =>
            '<button type="button" class="seg-btn' +
            (o.value === current ? ' is-on' : '') +
            '" aria-pressed="' +
            (o.value === current) +
            '" data-seg="' +
            e(name) +
            '" data-value="' +
            e(o.value) +
            '">' +
            e(o.label) +
            (o.count != null ? ' <span class="seg-count">' + e(o.count) + '</span>' : '') +
            '</button>'
        )
        .join('') +
      '</div>'
    );
  }

  function shopStatusBanner(err, onRetryAct) {
    if (!err) return '';
    const actions =
      (err.canManage ? '<button class="btn ghost" data-act="permisos">Abrir permisos</button>' : '') +
      '<button class="btn ghost" data-act="' +
      (onRetryAct || 'reintentar') +
      '">Reintentar</button>' +
      '<label class="btn ghost file-btn">Importar CSV de pedidos<input type="file" accept=".csv,text/csv" data-act="importar-csv" hidden></label>';
    return banner('bad', e(err.message), actions);
  }

  function prefGet(k, d) {
    try {
      const v = localStorage.getItem('vc-pref:' + k);
      return v == null ? d : JSON.parse(v);
    } catch (err) {
      return d;
    }
  }

  function prefSet(k, v) {
    try {
      localStorage.setItem('vc-pref:' + k, JSON.stringify(v));
    } catch (err) {
      /* ignorar */
    }
  }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result || ''));
      r.onerror = () => reject(r.error);
      r.readAsText(file);
    });
  }

  VC.ui = { e, $, $$, App, DEFAULT_MSGS, DEFAULT_TIENDA, toast, copyText, chip, banner, emptyState, waButton, WA_ICON, kpi, seg, shopStatusBanner, debounce, prefGet, prefSet, readFileText, storeFail };
})(window);
</script>
<script>
/* auto.js */
/*
 * Motor de tareas automáticas del panel: escaneo de la competencia, revisión de tiendas, búsqueda de productos
 * ganadores y guiones del día. Cada herramienta registra su tarea; el motor las corre de a una, cuando toca
 * (al abrir el panel, si pasó el tiempo configurado) o cuando el usuario toca "ahora".
 */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const { Store, AI, Browser } = VC.runtime;

  const ORDEN = ['competencia', 'tiendas', 'productos', 'guiones'];

  const DEFAULTS = {
    competencia: { auto: false, cadaHoras: 24, busquedas: VC.competitors.BUSQUEDAS.slice(), guionesTras: true },
    tiendas: { auto: false, cadaHoras: 24, dominios: [] },
    productos: { auto: false, cadaHoras: 168 },
    guiones: { auto: false, cadaHoras: 24, cantidad: 3, clips: 4 },
  };

  const NOMBRES = {
    competencia: 'escaneo de la competencia',
    tiendas: 'revisión de tiendas',
    productos: 'búsqueda de productos ganadores',
    guiones: 'guiones del día',
  };

  const jobs = new Map();
  const subs = new Set();
  let cola = Promise.resolve();
  const enCola = new Map(); // nombre → promesa
  let ctl = null;

  const Auto = {
    ORDEN,
    DEFAULTS,
    NOMBRES,
    cfg: JSON.parse(JSON.stringify(DEFAULTS)),
    estado: {}, // nombre → {ultima, origen, resultado, error}
    running: null,
    progress: {},
    loaded: false,

    /* Registra la tarea de una herramienta. job = {needs: ['browser'|'sample'], run: async (ctx) => resultado} */
    register(name, job) {
      jobs.set(name, job);
    },

    on(cb) {
      subs.add(cb);
      return () => subs.delete(cb);
    },

    emit(evt) {
      for (const cb of subs) {
        try {
          cb(evt);
        } catch (err) {
          console.error(err);
        }
      }
    },

    async load() {
      const [cfg, estado] = await Promise.all([Store.get('config/automatico'), Store.get('auto/estado')]);
      if (cfg) for (const k of ORDEN) this.cfg[k] = Object.assign({}, DEFAULTS[k], cfg[k] || {});
      if (estado) this.estado = Object.assign({}, estado);
      this.loaded = true;
      this.emit({ type: 'cfg' });
    },

    setCfg(name, patch) {
      this.cfg[name] = Object.assign({}, this.cfg[name], patch);
      this._saveCfg();
      this.emit({ type: 'cfg', job: name });
    },

    _saveCfg: VC.ui.debounce(() => Store.set('config/automatico', JSON.parse(JSON.stringify(Auto.cfg))).catch(VC.ui.storeFail), 600),

    ultima(name) {
      return (this.estado[name] && this.estado[name].ultima) || null;
    },

    due(name) {
      const c = this.cfg[name];
      const u = this.ultima(name);
      return !u || U.hoursSince(u) >= (Number(c && c.cadaHoras) || 24);
    },

    /* ¿Se puede correr acá? Devuelve {ok, motivo}. */
    can(name) {
      const job = jobs.get(name);
      if (!job) return { ok: false, motivo: 'La herramienta todavía no cargó.' };
      for (const n of job.needs || []) {
        if (n === 'browser' && !Browser.available) return { ok: false, motivo: 'Necesita el navegador de Claude: abrí este panel desde la app de escritorio de Claude (Cowork).' };
        if (n === 'sample' && !AI.sample) return { ok: false, motivo: 'Necesita Claude: abrí este panel desde claude.ai o la app de Claude.' };
      }
      return { ok: true, motivo: '' };
    },

    /*
     * Corre una tarea (de a una por vez; si hay otra corriendo, espera). origen: 'manual' | 'auto' | 'cadena'.
     * Devuelve el resultado de la tarea, o null si falló o se canceló.
     */
    run(name, opts) {
      if (enCola.has(name)) return enCola.get(name);
      const p = (cola = cola.then(() => this._run(name, opts || {})).catch(() => null));
      enCola.set(name, p);
      p.finally(() => enCola.delete(name));
      return p;
    },

    async _run(name, opts) {
      const job = jobs.get(name);
      const chk = this.can(name);
      if (!job || !chk.ok) {
        this.emit({ type: 'skip', job: name, motivo: chk.motivo });
        return null;
      }
      ctl = new AbortController();
      this.running = name;
      this.progress[name] = 'Empezando…';
      this.emit({ type: 'start', job: name, origen: opts.origen || 'manual' });
      const ctx = {
        signal: ctl.signal,
        origen: opts.origen || 'manual',
        motivo: opts.motivo || '',
        progress: (text) => {
          this.progress[name] = text;
          this.emit({ type: 'progress', job: name, text });
        },
      };
      let resultado = null;
      let error = '';
      try {
        resultado = await job.run(ctx);
      } catch (err) {
        error = err && err.code === 'cancelled' ? 'Cancelado.' : (err && (err.userMessage || err.message)) || 'Error inesperado.';
        if (err && err.code !== 'cancelled') console.error(err);
      }
      this.running = null;
      this.progress[name] = '';
      const cancelado = ctl.signal.aborted;
      ctl = null;
      this.estado[name] = {
        ultima: cancelado ? this.ultima(name) : new Date().toISOString(),
        origen: ctx.origen,
        resultado: resultado ? small(resultado) : null,
        error: cancelado ? 'Cancelado.' : error,
      };
      Store.set('auto/estado', JSON.parse(JSON.stringify(this.estado))).catch(() => {});
      this.emit({ type: error || cancelado ? 'error' : 'done', job: name, resultado, error: this.estado[name].error, origen: ctx.origen });
      if (resultado && resultado.siguiente && !cancelado) this.run(resultado.siguiente, { origen: 'cadena', motivo: resultado.motivoSiguiente || '' });
      return error || cancelado ? null : resultado;
    },

    stop() {
      if (ctl) ctl.abort();
    },

    /* Al abrir el panel: corre en orden las tareas activadas que ya tocan. */
    async boot() {
      if (!this.loaded) await this.load();
      for (const name of ORDEN) {
        const c = this.cfg[name];
        if (c && c.auto && this.due(name) && this.can(name).ok) await this.run(name, { origen: 'auto' });
      }
    },
  };

  // Lo que se guarda del resultado en auto/estado: solo números y textos cortos
  function small(r) {
    const out = {};
    for (const [k, v] of Object.entries(r || {})) {
      if (k === 'siguiente' || k === 'motivoSiguiente') continue;
      if (typeof v === 'number' || typeof v === 'boolean') out[k] = v;
      else if (typeof v === 'string') out[k] = v.slice(0, 400);
    }
    return out;
  }

  VC.auto = Auto;
})(window);
</script>
<script>
/* ui/confirmar.js */
/* 1 · Confirmador de pedidos por WhatsApp */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, chip, waButton, seg, emptyState, shopStatusBanner, toast, copyText, prefGet, prefSet, storeFail } = VC.ui;

  const WA_ESTADOS = {
    esperando: { label: 'Esperando respuesta', tone: 'warn' },
    no_responde: { label: 'No responde', tone: 'warn' },
    confirmado: { label: 'Confirmado', tone: 'good' },
    cancelado: { label: 'Canceló', tone: 'bad' },
  };
  const TAG_OK = 'WA-confirmado';
  const TAG_NO = 'WA-cancelado';

  const state = {
    filtro: prefGet('conf-filtro', 'escribir'),
    dias: prefGet('conf-dias', 7),
    loading: false,
    error: null,
  };

  let el;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Confirmar pedidos</h2><p class="lede">Escribile por WhatsApp a cada pedido nuevo antes de despacharlo. Marcá quién confirmó y despachá solo esos.</p></div>' +
      '<div class="tool-actions"><label class="field-inline" for="conf-dias">Pedidos de los últimos <select id="conf-dias">' +
      [3, 7, 14, 30].map((d) => '<option value="' + d + '"' + (d === state.dias ? ' selected' : '') + '>' + d + ' días</option>').join('') +
      '</select></label><button class="btn ghost" data-act="refrescar">Actualizar</button></div></header>' +
      '<div id="conf-status"></div><div id="conf-summary"></div><div id="conf-filters"></div><div id="conf-list" class="order-list"></div><div id="conf-dispatch"></div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    Shop.onChange(render);
    App.on((what) => (what === 'confirm' || what === 'msgs') && render());
    load();
  }

  async function load(fresh) {
    state.loading = true;
    state.error = null;
    render();
    try {
      await Shop.ensure(U.addDays(U.todayKeyAR(), -(state.dias - 1)), { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    render();
  }

  function waState(o) {
    const c = App.confirm.get(o.key);
    return c && c.estado;
  }

  function lists() {
    const since = U.addDays(U.todayKeyAR(), -(state.dias - 1));
    const all = Shop.orders.filter((o) => o.day >= since);
    const abiertos = all.filter((o) => o.estado === 'pendiente');
    const s = (o) => waState(o);
    return {
      all,
      escribir: abiertos.filter((o) => !s(o)),
      esperando: abiertos.filter((o) => s(o) === 'esperando' || s(o) === 'no_responde'),
      confirmados: abiertos.filter((o) => s(o) === 'confirmado'),
      cancelados: abiertos.filter((o) => s(o) === 'cancelado'),
    };
  }

  function render() {
    if (!el) return;
    const statusEl = $('#conf-status', el);
    if (Shop.mode === 'none') {
      statusEl.innerHTML = shopStatusBanner({ message: 'Esta vista no puede conectarse a Shopify. Abrí el panel desde claude.ai o importá el CSV de pedidos (Shopify → Pedidos → Exportar).' });
    } else if (state.error) {
      statusEl.innerHTML = shopStatusBanner(state.error);
    } else if (Shop.mode === 'csv') {
      statusEl.innerHTML = '<p class="note">Mostrando pedidos del CSV importado. Para verlos en vivo, abrí el panel desde claude.ai con Shopify conectado.</p>';
    } else statusEl.innerHTML = '';

    const L = lists();
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;
    const rates = O.historicalRates(Shop.orders);
    const hoy = U.todayKeyAR();
    const hoyN = L.all.filter((o) => o.day === hoy).length;
    const decididos = L.all.filter((o) => ['confirmado', 'cancelado'].includes(waState(o)));
    const tasaWA = decididos.length ? decididos.filter((o) => waState(o) === 'confirmado').length / decididos.length : null;

    $('#conf-summary', el).innerHTML = loadingFirst
      ? '<div class="summary-strip is-loading">Cargando pedidos de Shopify…</div>'
      : '<div class="summary-strip">' +
        stat(hoyN, 'pedidos hoy') +
        stat(L.escribir.length, 'por escribir', L.escribir.length ? 'warn' : '') +
        stat(L.esperando.length, 'esperando respuesta') +
        stat(L.confirmados.length, 'listos para despachar', L.confirmados.length ? 'good' : '') +
        stat(tasaWA == null ? '—' : U.pct(tasaWA), 'confirman por WhatsApp') +
        stat(rates.confirmacion == null ? '—' : U.pct(rates.confirmacion), 'se despachaban antes', '', 'De ' + rates.muestraConfirmacion + ' pedidos resueltos en tu historial') +
        '</div>';

    $('#conf-filters', el).innerHTML = seg(
      'conf-filtro',
      [
        { value: 'escribir', label: 'Por escribir', count: L.escribir.length },
        { value: 'esperando', label: 'Esperando', count: L.esperando.length },
        { value: 'confirmados', label: 'Confirmados', count: L.confirmados.length },
        { value: 'cancelados', label: 'Cancelaron', count: L.cancelados.length },
        { value: 'all', label: 'Todos', count: L.all.length },
      ],
      state.filtro
    );

    const list = L[state.filtro] || L.all;
    const dup = O.duplicateIndex(L.all.filter((o) => o.estado !== 'anulado'));
    const listEl = $('#conf-list', el);
    if (loadingFirst) {
      listEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    } else if (!list.length) {
      listEl.innerHTML = emptyText(L);
    } else {
      listEl.innerHTML = list.map((o) => card(o, dup.get(o.id))).join('');
    }

    const disp = $('#conf-dispatch', el);
    if (L.confirmados.length && (state.filtro === 'confirmados' || state.filtro === 'escribir')) {
      const names = L.confirmados.map((o) => o.name).join(', ');
      disp.innerHTML =
        '<div class="dispatch"><div><strong>Para despachar (' +
        L.confirmados.length +
        '):</strong> <span class="mono selectable">' +
        e(names) +
        '</span></div><button class="btn ghost" data-act="copiar-despacho" data-text="' +
        e(names) +
        '">Copiar lista</button></div>';
    } else if (L.cancelados.length && state.filtro === 'cancelados') {
      disp.innerHTML = '<p class="note">Estos pedidos siguen abiertos en Shopify. Anulalos ahí (Pedido → Más acciones → Cancelar pedido) para que Dropi no los despache.</p>';
    } else disp.innerHTML = '';
  }

  function stat(value, label, tone, title) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"' + (title ? ' title="' + e(title) + '"' : '') + '><span class="stat-value">' + e(value) + '</span><span class="stat-label">' + e(label) + '</span></div>';
  }

  function emptyText(L) {
    if (!Shop.loadedAt) return emptyState('Sin pedidos para mostrar', 'Cuando Shopify responda vas a ver acá los pedidos nuevos.');
    const msgs = {
      escribir: L.all.length ? 'No hay pedidos nuevos sin escribir. Buen trabajo.' : 'No entraron pedidos en estos días.',
      esperando: 'Nadie quedó esperando respuesta.',
      confirmados: 'Todavía no hay pedidos confirmados sin despachar.',
      cancelados: 'Ningún cliente canceló por WhatsApp.',
      all: 'No entraron pedidos en estos días.',
    };
    return emptyState('Nada por acá', e(msgs[state.filtro] || msgs.all));
  }

  function card(o, dups) {
    const vars = O.templateVars(o, App.msgs);
    const ws = waState(o);
    const c = App.confirm.get(o.key) || {};
    const st = O.ESTADOS[o.estado];
    const msg = U.fillTemplate(App.msgs.confirmacion, vars);
    const rec = U.fillTemplate(App.msgs.recordatorio, vars);
    const dir = U.fillTemplate(App.msgs.direccion, vars);
    const open = o.estado === 'pendiente';
    const chips = [
      o.estado !== 'pendiente' ? chip(st.label, st.tone) : '',
      ws ? chip(WA_ESTADOS[ws].label, WA_ESTADOS[ws].tone) : open ? chip('Sin escribir', 'neutral') : '',
      o.source !== 'organico' ? chip(O.SOURCES[o.source], 'source') : '',
      dups && dups.length ? chip('Repetido: ' + dups.join(', '), 'warn') : '',
      o.tags.includes(TAG_OK) ? chip('Etiquetado en Shopify', 'neutral') : '',
    ].join('');
    const warn = o.warnings.length && open ? '<ul class="warnings">' + o.warnings.map((w) => '<li>' + e(w) + '</li>').join('') + '</ul>' : '';
    const contacto = c.ultimoContacto ? '<span class="muted">WhatsApp abierto ' + e(U.timeAgo(c.ultimoContacto)) + (c.intentos > 1 ? ' · ' + c.intentos + ' intentos' : '') + '</span>' : '';
    const showRec = ws === 'esperando' || ws === 'no_responde';
    return (
      '<article class="order-card' +
      (ws === 'confirmado' ? ' is-good' : ws === 'cancelado' ? ' is-bad' : '') +
      '">' +
      '<div class="oc-top"><div class="oc-id"><span class="mono">' +
      e(o.name) +
      '</span><span class="muted">' +
      e(U.fmtDateTimeAR(o.createdAt)) +
      ' · ' +
      e(U.timeAgo(o.createdAt)) +
      '</span></div><div class="oc-total mono">' +
      e(U.money(o.total)) +
      '</div></div>' +
      '<div class="oc-who"><strong>' +
      e(o.fullName || 'Sin nombre') +
      '</strong> · ' +
      e(vars.cantidad) +
      e(vars.extras) +
      '</div>' +
      '<div class="oc-addr">' +
      e([vars.direccion, o.city, o.province].filter(Boolean).join(', ')) +
      (o.zip ? ' · CP ' + e(o.zip) : '') +
      (o.courierNote && o.courierNote !== '-' ? '<br><span class="muted">Nota: ' + e(o.courierNote) + '</span>' : '') +
      '</div>' +
      '<div class="oc-phone"><span class="mono selectable">' +
      e(o.phone.display || o.phoneRaw || 'Sin teléfono') +
      '</span>' +
      (o.phone.wa && !o.phone.ok ? chip('Revisá el número', 'warn') : '') +
      contacto +
      '</div>' +
      '<div class="chips">' +
      chips +
      '</div>' +
      warn +
      (open
        ? '<div class="oc-actions"><div class="row-actions">' +
          waButton(U.waLink(o.phone.wa, msg), 'Pedir confirmación', 'wa-confirmar', o.key) +
          (showRec ? waButton(U.waLink(o.phone.wa, rec), 'Recordatorio', 'wa-recordatorio', o.key, 'ghost') : '') +
          (o.warnings.length ? waButton(U.waLink(o.phone.wa, dir), 'Pedir dirección', 'wa-direccion', o.key, 'ghost') : '') +
          '</div><div class="row-actions decide">' +
          decideBtn('confirmado', 'Confirmó', o, ws, 'good') +
          decideBtn('no_responde', 'No responde', o, ws, 'warn') +
          decideBtn('cancelado', 'Canceló', o, ws, 'bad') +
          (ws ? '<button class="btn link" data-act="deshacer" data-key="' + e(o.key) + '">Deshacer</button>' : '') +
          '</div></div>'
        : '') +
      '</article>'
    );
  }

  function decideBtn(value, label, o, ws, tone) {
    return '<button class="btn decide-btn tone-' + tone + (ws === value ? ' is-on' : '') + '" aria-pressed="' + (ws === value) + '" data-act="marcar" data-estado="' + value + '" data-key="' + e(o.key) + '">' + e(label) + '</button>';
  }

  function findOrder(key) {
    return Shop.orders.find((o) => o.key === key);
  }

  async function setWA(key, patch) {
    const o = findOrder(key);
    const prev = App.confirm.get(key) || {};
    const next = Object.assign({}, prev, patch, { pedido: o ? o.name : prev.pedido, actualizado: new Date().toISOString() });
    App.confirm.set(key, next);
    App.emit('confirm');
    try {
      await Store.set('confirmaciones/' + key, next);
    } catch (err) {
      storeFail(err);
    }
    return o;
  }

  async function tagShopify(o, estado) {
    if (!App.msgs.etiquetarShopify || !o || Shop.mode !== 'live') return;
    const add = estado === 'confirmado' ? [TAG_OK] : estado === 'cancelado' ? [TAG_NO] : [];
    const remove = [TAG_OK, TAG_NO].filter((t) => !add.includes(t));
    try {
      await Shop.setTags(o, add, remove);
      render();
    } catch (err) {
      const m = err && err.code === 'approval_required' ? 'Shopify pidió tu aprobación para etiquetar el pedido. Aprobalo y volvé a marcarlo.' : 'Quedó marcado en el panel, pero no se pudo etiquetar en Shopify.';
      toast(m, 'warn');
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'conf-filtro') {
      state.filtro = t.dataset.value;
      prefSet('conf-filtro', state.filtro);
      render();
      return;
    }
    const act = t.dataset.act;
    const key = t.dataset.key;
    if (act === 'refrescar' || act === 'reintentar') load(true);
    else if (act === 'permisos') VC.runtime.managePermissions().then((ok) => !ok && toast('Abrí el menú Permisos de esta página para habilitar Shopify.', 'warn'));
    else if (act === 'wa-confirmar' || act === 'wa-recordatorio' || act === 'wa-direccion') {
      // El enlace abre WhatsApp; acá solo registramos que se abrió el chat (después del clic, para no cortar la navegación).
      const prev = App.confirm.get(key) || {};
      setTimeout(
        () =>
          setWA(key, {
            estado: prev.estado === 'confirmado' || prev.estado === 'cancelado' ? prev.estado : 'esperando',
            ultimoContacto: new Date().toISOString(),
            intentos: (prev.intentos || 0) + 1,
          }),
        60
      );
    } else if (act === 'marcar') {
      const estado = t.dataset.estado;
      setWA(key, { estado }).then((o) => tagShopify(o, estado));
      if (estado === 'confirmado') toast('Confirmado. Ya podés despacharlo.', 'good');
    } else if (act === 'deshacer') {
      const o = findOrder(key);
      App.confirm.delete(key);
      App.emit('confirm');
      Store.remove('confirmaciones/' + key).catch(storeFail);
      if (o && o.tags.some((tg) => tg === TAG_OK || tg === TAG_NO)) tagShopify(o, null);
    } else if (act === 'copiar-despacho') copyText(t.dataset.text, t);
  }

  async function onChange(ev) {
    const t = ev.target;
    if (t.id === 'conf-dias') {
      state.dias = Number(t.value);
      prefSet('conf-dias', state.dias);
      load();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      try {
        Shop.importCSV(await VC.ui.readFileText(t.files[0]));
        state.error = null;
        toast('Pedidos importados del CSV.', 'good');
      } catch (err) {
        toast(err.message || 'No se pudo leer el archivo.', 'bad');
      }
      render();
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.confirmar = { mount, render, load };
})(window);
</script>
<script>
/* ui/ganancia.js */
/* 2 · Panel de ganancia real */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, kpi, seg, banner, shopStatusBanner, prefGet, prefSet, toast, storeFail } = VC.ui;

  const state = {
    rango: prefGet('gan-rango', 'hoy'),
    desde: null,
    hasta: null,
    gastos: {},
    loading: false,
    error: null,
  };

  let el;

  function range() {
    const hoy = U.todayKeyAR();
    switch (state.rango) {
      case 'ayer':
        return [U.addDays(hoy, -1), U.addDays(hoy, -1)];
      case '7d':
        return [U.addDays(hoy, -6), hoy];
      case 'mes':
        return [hoy.slice(0, 8) + '01', hoy];
      case 'custom':
        return [state.desde || U.addDays(hoy, -6), state.hasta || hoy];
      default:
        return [hoy, hoy];
    }
  }

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Ganancia real</h2><p class="lede">Ventas de Shopify menos producto, envíos, devoluciones, comisiones y anuncios. Los pedidos que todavía no se entregaron se proyectan con tus tasas reales.</p></div>' +
      '<div class="tool-actions"><button class="btn ghost" data-act="refrescar">Actualizar</button></div></header>' +
      '<div id="gan-range"></div><div id="gan-status"></div><div id="gan-kpis"></div>' +
      '<div class="grid-2"><section class="panel" id="gan-spend"></section><section class="panel" id="gan-break"></section></div>' +
      '<section class="panel" id="gan-chart"></section><section class="panel" id="gan-sources"></section><p class="note" id="gan-rates"></p>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('input', onInput);
    Shop.onChange(renderAll);
    App.on((w) => (w === 'cfg' || w === 'confirm') && renderAll());
    Store.watch(
      'gastos',
      (m) => {
        const g = {};
        for (const [k, v] of m) g[k] = v;
        state.gastos = g;
        renderAll(true);
      },
      () => {}
    );
    load();
  }

  async function load(fresh) {
    const [from] = range();
    state.loading = true;
    state.error = null;
    renderAll();
    try {
      await Shop.ensure(from, { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    renderAll();
  }

  function renderAll(keepInputs) {
    if (!el) return;
    const [from, to] = range();
    $('#gan-range', el).innerHTML =
      '<div class="toolbar">' +
      seg(
        'gan-rango',
        [
          { value: 'hoy', label: 'Hoy' },
          { value: 'ayer', label: 'Ayer' },
          { value: '7d', label: '7 días' },
          { value: 'mes', label: 'Este mes' },
          { value: 'custom', label: 'Elegir fechas' },
        ],
        state.rango
      ) +
      (state.rango === 'custom'
        ? '<div class="dates"><label for="gan-desde">Desde <input type="date" id="gan-desde" value="' + from + '"></label><label for="gan-hasta">Hasta <input type="date" id="gan-hasta" value="' + to + '"></label></div>'
        : '<span class="muted">' + e(from === to ? U.fmtDay(from, true) : U.fmtDay(from) + ' al ' + U.fmtDay(to)) + '</span>') +
      '</div>';

    const statusEl = $('#gan-status', el);
    const notes = [];
    if (Shop.mode === 'none') notes.push(shopStatusBanner({ message: 'Esta vista no puede conectarse a Shopify. Abrí el panel desde claude.ai o importá el CSV de pedidos.' }));
    else if (state.error) notes.push(shopStatusBanner(state.error));
    if (!P.costsReady(App.cfg)) notes.push(banner('warn', '<strong>Falta el costo del producto.</strong> Cargá cuánto te cuesta cada corrector, el envío y la devolución para ver la ganancia de verdad.', '<button class="btn" data-goto="ajustes">Cargar costos</button>'));
    statusEl.innerHTML = notes.join('');

    const rates = O.historicalRates(Shop.orders);
    const res = P.computeProfit({ orders: Shop.orders, gastos: state.gastos, cfg: App.cfg, rates, confirm: App.confirmStates(), from, to });
    const be = P.breakEven(App.cfg, rates);
    const t = res.total;
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;

    $('#gan-kpis', el).innerHTML = loadingFirst
      ? '<div class="kpis"><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div></div>'
      : '<div class="kpis">' +
        kpi(
          'Ganancia estimada',
          '<span class="' + (t.ganancia >= 0 ? 'pos' : 'neg') + '">' + e(U.money(t.ganancia)) + '</span>',
          'Ya cobrado menos gastos: <span class="mono nowrap">' + e(U.money(t.asegurado.ganancia)) + '</span>',
          t.ganancia >= 0 ? 'good' : 'bad'
        ) +
        kpi('Gasto en anuncios', e(U.money(t.ads)), t.roas != null ? 'ROAS real ' + e(t.roas.toFixed(2).replace('.', ',')) + ' · ' + e(U.money(t.cpaPedido)) + ' por pedido' : t.pedidos ? 'Cargá el gasto del día abajo' : 'Sin gasto cargado') +
        kpi('Pedidos', e(U.int(t.pedidos)), e(t.anulados) + ' anulados · ' + e(t.entregados) + ' entregados · ' + e(t.abiertos) + ' abiertos' + (t.devueltos ? ' · ' + e(t.devueltos) + ' devueltos' : '')) +
        kpi(
          'Costo por entrega',
          t.cpaEntrega != null ? e(U.money(t.cpaEntrega)) : '—',
          be && be.cpaEntregaEquilibrio > 0 ? 'Equilibrio: ' + e(U.money(be.cpaEntregaEquilibrio)) + ' por entrega' : 'Anuncios ÷ entregas esperadas',
          t.cpaEntrega != null && be && be.cpaEntregaEquilibrio > 0 ? (t.cpaEntrega <= be.cpaEntregaEquilibrio ? 'good' : 'bad') : ''
        ) +
        '</div>';

    if (!keepInputs || !el.querySelector('#gan-spend input:focus')) renderSpend(res, from, to);
    renderBreak(res, be);
    renderChart(res);
    renderSources(res);
    const r = res.rates;
    const origen = (o) => (o === 'historico' ? 'tu historial' : o === 'manual' ? 'cargada a mano' : 'supuesta, sin historial');
    $('#gan-rates', el).textContent =
      'Proyección: de cada 100 pedidos se despachan ' +
      Math.round(r.confirmacion * 100) +
      ' (' +
      origen(r.origenConfirmacion) +
      (r.origenConfirmacion === 'historico' ? ', ' + rates.muestraConfirmacion + ' pedidos' : '') +
      ') y de cada 100 despachados se entregan ' +
      Math.round(r.entrega * 100) +
      ' (' +
      origen(r.origenEntrega) +
      (r.origenEntrega === 'historico' ? ', ' + rates.muestraEntrega + ' envíos' : '') +
      '). Los pedidos confirmados por WhatsApp cuentan como despachados. Podés cambiar las tasas en Ajustes.';
  }

  function renderSpend(res, from, to) {
    const days = res.days.slice().reverse();
    const many = days.length > 31;
    const rows = (many ? days.slice(0, 31) : days)
      .map((d) => {
        const g = state.gastos[d.day] || {};
        const inp = (k) =>
          '<input type="text" inputmode="numeric" class="num-input" id="gasto-' +
          d.day +
          '-' +
          k +
          '" data-day="' +
          d.day +
          '" data-k="' +
          k +
          '" value="' +
          (g[k] ? e(U.int(g[k])) : '') +
          '" placeholder="0" aria-label="Gasto en ' +
          k +
          ' el ' +
          e(U.fmtDay(d.day)) +
          '">';
        return (
          '<tr><th scope="row">' +
          e(U.fmtDay(d.day, true)) +
          '</th><td>' +
          inp('tiktok') +
          '</td><td>' +
          inp('meta') +
          '</td><td>' +
          inp('otros') +
          '</td><td class="num ' +
          (d.ganancia >= 0 ? 'pos' : 'neg') +
          '">' +
          e(U.moneyShort(d.ganancia)) +
          '</td></tr>'
        );
      })
      .join('');
    $('#gan-spend', el).innerHTML =
      '<h3>Gasto en anuncios</h3><p class="muted small">Copiá el gasto de cada plataforma (en pesos). Se guarda solo.</p>' +
      '<div class="table-wrap"><table class="table spend"><thead><tr><th>Día</th><th>TikTok</th><th>Meta</th><th>Otros</th><th class="num">Ganancia</th></tr></thead><tbody>' +
      rows +
      '</tbody></table></div>' +
      (many ? '<p class="muted small">Se muestran los últimos 31 días del rango.</p>' : '');
  }

  function renderBreak(res, be) {
    const t = res.total;
    const items = [
      ['Ventas esperadas', t.ventas, 'base'],
      ['Costo del producto', -t.producto],
      ['Envíos', -t.envios],
      ['Devoluciones', -t.devoluciones],
      ['Comisión de cobro', -t.comisiones],
      ['Otros por pedido', -t.otros],
      ['Costos fijos', -t.fijos],
      ['Anuncios', -t.ads],
    ].filter((x) => x[2] === 'base' || Math.round(x[1]) !== 0);
    const max = Math.max(1, t.ventas, Math.abs(t.ganancia));
    const bar = (v, cls) => '<span class="wf-bar ' + cls + '" style="width:' + Math.max(1, (Math.abs(v) / max) * 100).toFixed(1) + '%"></span>';
    const list = items
      .map((x) => '<li><span class="wf-label">' + e(x[0]) + '</span><span class="wf-track">' + bar(x[1], x[2] === 'base' ? 'base' : 'cost') + '</span><span class="wf-val mono">' + e(U.money(x[1])) + '</span></li>')
      .join('');
    const g = '<li class="wf-total"><span class="wf-label">Ganancia</span><span class="wf-track">' + bar(t.ganancia, t.ganancia >= 0 ? 'pos' : 'neg') + '</span><span class="wf-val mono ' + (t.ganancia >= 0 ? 'pos' : 'neg') + '">' + e(U.money(t.ganancia)) + '</span></li>';
    let beHtml = '';
    if (be && P.costsReady(App.cfg)) {
      beHtml =
        be.cpaEquilibrio > 0
          ? '<div class="be"><div><span class="be-num mono">' +
            e(U.money(be.cpaEquilibrio)) +
            '</span><span class="be-txt">es lo máximo que podés pagar por pedido en TikTok o Meta sin perder plata.</span></div><div><span class="be-num mono">' +
            e(U.money(be.cpaObjetivo)) +
            '</span><span class="be-txt">es el costo por pedido para quedarte con el 30% de margen.</span></div><p class="muted small">Con ticket promedio de ' +
            e(U.money(be.ticket)) +
            ' y ' +
            e(be.unidades.toFixed(1).replace('.', ',')) +
            ' unidades por pedido entregado: cada entrega te deja ' +
            e(U.money(be.margenEntrega)) +
            ' antes de anuncios.</p></div>'
          : banner('bad', 'Con estos costos cada pedido pierde plata aun sin anuncios. Revisá el precio o los costos en Ajustes.')
    } else if (!be) beHtml = '<p class="muted small">Cuando tengas pedidos entregados vamos a calcular cuánto podés pagar por pedido.</p>';
    $('#gan-break', el).innerHTML = '<h3>De dónde sale la ganancia</h3><ul class="waterfall">' + list + g + '</ul>' + beHtml;
  }

  function renderChart(res) {
    const box = $('#gan-chart', el);
    if (res.days.length < 2) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    const vals = res.days.map((d) => d.ganancia);
    const maxAbs = Math.max(1, ...vals.map(Math.abs));
    const hasNeg = vals.some((v) => v < 0);
    const W = Math.max(300, Math.floor(box.clientWidth) - 34, res.days.length * 28);
    const H = 190;
    const pad = { t: 18, b: hasNeg ? 42 : 26, l: 8, r: 8 };
    const hasPos = vals.some((v) => v > 0);
    const zeroY = hasNeg && hasPos ? pad.t + ((H - pad.t - pad.b) * maxPos(vals)) / (maxPos(vals) + maxNeg(vals)) : hasNeg ? pad.t : H - pad.b;
    const scale = (H - pad.t - pad.b) / (hasNeg && hasPos ? maxPos(vals) + maxNeg(vals) : maxAbs);
    const bw = (W - pad.l - pad.r) / res.days.length;
    const iMax = vals.indexOf(Math.max(...vals));
    const iMin = vals.indexOf(Math.min(...vals));
    let bars = '';
    res.days.forEach((d, i) => {
      const v = d.ganancia;
      const h = Math.max(1, Math.abs(v) * scale);
      const x = pad.l + i * bw + bw * 0.18;
      const y = v >= 0 ? zeroY - h : zeroY;
      const w = bw * 0.64;
      bars +=
        '<g class="bar-g"><rect class="hit" x="' +
        (pad.l + i * bw) +
        '" y="0" width="' +
        bw +
        '" height="' +
        H +
        '"></rect><rect class="' +
        (v >= 0 ? 'bar-pos' : 'bar-neg') +
        '" x="' +
        x.toFixed(1) +
        '" y="' +
        y.toFixed(1) +
        '" width="' +
        w.toFixed(1) +
        '" height="' +
        h.toFixed(1) +
        '" rx="3"></rect><title>' +
        e(U.fmtDay(d.day, true) + ': ' + U.money(v) + ' · ' + d.pedidos + ' pedidos · anuncios ' + U.money(d.ads)) +
        '</title></g>';
      if ((i === iMax && v > 0) || (i === iMin && v < 0)) {
        const ly = v >= 0 ? y - 5 : y + h + 12;
        bars += '<text class="bar-label" x="' + (x + w / 2).toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle">' + e(U.moneyShort(v)) + '</text>';
      }
      const step = Math.ceil(res.days.length / 10);
      if (i % step === 0 || i === res.days.length - 1) bars += '<text class="axis-label" x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + e(U.fmtDay(d.day)) + '</text>';
    });
    box.innerHTML =
      '<h3>Ganancia por día</h3><div class="chart-wrap"><svg class="chart" viewBox="0 0 ' +
      W +
      ' ' +
      H +
      '" width="' +
      W +
      '" height="' +
      H +
      '" role="img" aria-label="Ganancia estimada por día"><line class="zero" x1="' +
      pad.l +
      '" x2="' +
      (W - pad.r) +
      '" y1="' +
      zeroY.toFixed(1) +
      '" y2="' +
      zeroY.toFixed(1) +
      '"></line>' +
      bars +
      '</svg></div>';
  }

  function maxPos(v) {
    return Math.max(0, ...v);
  }
  function maxNeg(v) {
    return Math.max(0, ...v.map((x) => -x));
  }

  function renderSources(res) {
    const box = $('#gan-sources', el);
    const rows = res.sources.filter((s) => s.pedidos || s.ads);
    if (!rows.length) {
      box.innerHTML = '<h3>Por plataforma</h3><p class="muted">Sin pedidos en este rango.</p>';
      return;
    }
    box.innerHTML =
