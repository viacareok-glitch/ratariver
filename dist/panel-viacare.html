          a.cargado = new Date().toISOString();
          state.ads.set(id, a);
          nuevos++;
          await Store.set('competencia/' + id, a).catch(storeFail);
        }
        toast(nuevos + ' anuncio(s) nuevo(s) guardado(s).', 'good');
        state.texto = '';
        state.imagenes = [];
      }
    } catch (err) {
      if (err && err.code !== 'cancelled') state.error = err.code === 'images_unavailable' || err.code === 'image_rejected' ? 'No se pudieron enviar las capturas. Probá con otras o pegá el texto.' : AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.running = false;
    renderInput();
    renderData();
  }

  async function ideas() {
    ctl = new AbortController();
    state.ideas = { text: '', fecha: null, running: true, error: '' };
    renderIdeas();
    try {
      const s = CP.summarize(adsList());
      const res = await AI.sample(CP.insightPrompt(s.ads, U.todayKeyAR(), App.datos()), {
        signal: ctl.signal,
        cache: false,
        onText: ({ text }) => {
          state.ideas.text = text;
          const out = el.querySelector('#cp-ideas .ia-out');
          if (out) {
            out.classList.remove('is-thinking');
            out.textContent = text;
          }
        },
      });
      state.ideas.text = res.text;
      state.ideas.fecha = new Date().toISOString();
      Store.set('ideas/competencia', { text: res.text, fecha: state.ideas.fecha }).catch(storeFail);
    } catch (err) {
      state.ideas.text = err.text || '';
      if (err.code !== 'cancelled') state.ideas.error = AI.errorText(err);
    }
    state.ideas.running = false;
    renderIdeas();
  }

  function addImages(files) {
    const lim = state.imgLimits;
    if (!lim) return;
    const ok = [...files].filter((f) => lim.mediaTypes.includes(f.type) && f.size <= lim.maxInputBytes);
    state.imagenes = state.imagenes.concat(ok).slice(0, lim.maxCount);
    if (ok.length < files.length) toast('Algunas imágenes no se pudieron usar (tipo o tamaño).', 'warn');
    renderInput();
  }

  function onPaste(ev) {
    if (!state.imgLimits || !ev.clipboardData) return;
    const files = [...ev.clipboardData.files].filter((f) => f.type.startsWith('image/'));
    if (files.length) {
      ev.preventDefault();
      addImages(files);
    }
  }

  function onChange(ev) {
    if (ev.target.id === 'cp-imgs' && ev.target.files) addImages(ev.target.files);
  }

  function onSubmit(ev) {
    const f = ev.target.closest('#cp-form');
    if (!f) return;
    ev.preventDefault();
    const fd = new FormData(f);
    const a = CP.sanitizeAds([Object.fromEntries(fd.entries())])[0];
    if (!a) {
      toast('Escribí al menos el gancho.', 'warn');
      return;
    }
    a.cargado = new Date().toISOString();
    const id = 'a' + Date.now().toString(36);
    state.ads.set(id, a);
    Store.set('competencia/' + id, a).catch(storeFail);
    f.reset();
    renderData();
    toast('Anuncio guardado.', 'good');
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    switch (t.dataset.act) {
      case 'extraer':
        extraer();
        break;
      case 'detener':
      case 'ideas-stop':
        if (ctl) ctl.abort();
        break;
      case 'quitar-imgs':
        state.imagenes = [];
        renderInput();
        break;
      case 'ideas':
        ideas();
        break;
      case 'ideas-copiar':
        copyText(state.ideas.text, t);
        break;
      case 'borrar':
        state.ads.delete(t.dataset.id);
        Store.remove('competencia/' + t.dataset.id).catch(storeFail);
        renderData();
        break;
      case 'borrar-todo':
        if (t.dataset.confirm !== '1') {
          t.dataset.confirm = '1';
          t.textContent = 'Tocá de nuevo para borrar todo';
          setTimeout(() => {
            t.dataset.confirm = '';
            t.textContent = 'Borrar todos';
          }, 4000);
          return;
        }
        for (const id of [...state.ads.keys()]) Store.remove('competencia/' + id).catch(storeFail);
        state.ads = new Map();
        renderData();
        break;
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.competencia = { mount, render };
})(window);
</script>
<script>
/* ui/comentarios.js */
/* Respuestas para comentarios de TikTok */
(function (root) {
  'use strict';
  const VC = root.VC;
  const CM = VC.comments;
  const { Store, AI } = VC.runtime;
  const { e, $, App, chip, banner, toast, copyText, storeFail } = VC.ui;

  const state = {
    texto: '',
    items: [], // {comentario, tipo, respuesta, variante, video, ocultar, origen}
    running: false,
    error: '',
    biblioteca: new Map(),
    tono: '',
  };
  let el;
  let ctl;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Respuestas a comentarios</h2><p class="lede">Pegá los comentarios de tus anuncios de TikTok y te armo una respuesta corta para cada uno, con tu tono y tus datos reales. Responder rápido genera confianza y más alcance.</p></div></header>' +
      '<div id="cm-warn"></div><section class="panel" id="cm-input"></section><div id="cm-summary"></div><div id="cm-list" class="order-list"></div><section class="panel" id="cm-lib"></section>';
    el.addEventListener('click', onClick);
    el.addEventListener('input', onInput);
    App.on((w) => w === 'tienda' && renderWarn());
    Store.watch('respuestas', (m) => {
      state.biblioteca = m;
      renderLib();
    });
    render();
  }

  function render() {
    renderWarn();
    renderInput();
    renderList();
    renderLib();
  }

  function renderWarn() {
    const d = App.tienda;
    const faltan = [!d.demora && 'cuánto tarda el envío', !d.talles && 'qué talles cubre'].filter(Boolean);
    $('#cm-warn', el).innerHTML = faltan.length
      ? banner('info', 'Para responder mejor, completá en Ajustes ' + e(faltan.join(' y ')) + '. Mientras tanto las respuestas no mencionan esos datos.', '<button class="btn ghost" data-goto="ajustes">Completar datos</button>')
      : '';
  }

  function renderInput() {
    $('#cm-input', el).innerHTML =
      '<label for="cm-texto">Comentarios (uno por línea; podés pegar la lista tal como la copiás de TikTok)<textarea id="cm-texto" rows="6" placeholder="¿Es incómodo?&#10;¿Hacen envíos a Córdoba?&#10;¿Sirve de verdad?">' +
      e(state.texto) +
      '</textarea></label>' +
      (AI.sample ? '<label for="cm-tono">Tono (opcional)<input id="cm-tono" placeholder="Ej.: más canchero, sin emojis, tuteo…" value="' + e(state.tono) + '"></label>' : '') +
      '<div class="row-actions">' +
      (state.running
        ? '<button class="btn ghost" data-act="detener">Detener</button><span class="muted">Escribiendo respuestas…</span>'
        : (AI.sample ? '<button class="btn" data-act="claude">Responder con Claude</button>' : '') + '<button class="btn ' + (AI.sample ? 'ghost' : '') + '" data-act="plantillas">Responder con plantillas</button>') +
      '</div>' +
      (state.error ? '<p class="error-text">' + e(state.error) + '</p>' : '');
  }

  function renderList() {
    const box = $('#cm-list', el);
    const sum = $('#cm-summary', el);
    if (!state.items.length) {
      sum.innerHTML = '';
      box.innerHTML = '';
      return;
    }
    const counts = new Map();
    for (const it of state.items) counts.set(it.tipo, (counts.get(it.tipo) || 0) + 1);
    const top = [...counts.entries()].filter(([k]) => !['positivo', 'otro'].includes(k)).sort((a, b) => b[1] - a[1]);
    const videoTip = top.length && top[0][1] >= 2 ? '<p class="note">La duda que más se repite es <strong>' + e(CM.tipo(top[0][0]).label.toLowerCase()) + '</strong> (' + top[0][1] + ' comentarios). Respondela con un video: <button class="btn link" data-goto="guiones">armar guion</button></p>' : '';
    sum.innerHTML = '<div class="chips">' + [...counts.entries()].map(([k, n]) => chip(CM.tipo(k).label + ' · ' + n, CM.tipo(k).tone)).join('') + '</div>' + videoTip;
    box.innerHTML = state.items
      .map((it, i) => {
        const t = CM.tipo(it.tipo);
        const len = it.respuesta.length;
        return (
          '<article class="order-card comment-card"><div class="cm-q">“' +
          e(it.comentario) +
          '”</div><div class="chips">' +
          chip(t.label, t.tone) +
          (it.video ? chip('Conviene responder con video', 'source') : '') +
          (it.ocultar ? chip('Ocultar o ignorar', 'bad') : '') +
          (it.origen === 'claude' ? chip('Claude', 'neutral') : '') +
          '</div><label class="sr-only" for="cm-r-' +
          i +
          '">Respuesta</label><textarea id="cm-r-' +
          i +
          '" data-i="' +
          i +
          '" rows="2" maxlength="' +
          CM.MAX +
          '">' +
          e(it.respuesta) +
          '</textarea><div class="cm-foot"><span class="small ' +
          (len > CM.MAX ? 'warn-text' : 'muted') +
          '" id="cm-n-' +
          i +
          '">' +
          len +
          '/' +
          CM.MAX +
          '</span><div class="row-actions"><button class="btn" data-act="copiar" data-i="' +
          i +
          '">Copiar</button><button class="btn ghost" data-act="otra" data-i="' +
          i +
          '">Otra versión</button><button class="btn link" data-act="guardar" data-i="' +
          i +
          '">Guardar en biblioteca</button></div></div></article>'
        );
      })
      .join('');
  }

  function renderLib() {
    const box = $('#cm-lib', el);
    if (!box) return;
    const list = [...state.biblioteca.entries()].map(([id, r]) => Object.assign({ id }, r));
    if (!list.length) {
      box.innerHTML = '<h3>Biblioteca de respuestas</h3><p class="muted">Guardá las respuestas que más te gusten para reusarlas. Quedan ordenadas por tipo de comentario.</p>';
      return;
    }
    const by = new Map();
    for (const r of list) {
      if (!by.has(r.tipo)) by.set(r.tipo, []);
      by.get(r.tipo).push(r);
    }
    box.innerHTML =
      '<h3>Biblioteca de respuestas (' +
      list.length +
      ')</h3><div class="lib">' +
      [...by.entries()]
        .map(
          ([tipo, rs]) =>
            '<div class="lib-group"><span class="eyebrow">' +
            e(CM.tipo(tipo).label) +
            '</span>' +
            rs
              .map(
                (r) =>
                  '<div class="lib-item"><p class="selectable">' +
                  e(r.respuesta) +
                  '</p><div class="row-actions"><button class="btn link" data-act="lib-copiar" data-id="' +
                  e(r.id) +
                  '">Copiar</button><button class="btn link" data-act="lib-borrar" data-id="' +
                  e(r.id) +
                  '">Borrar</button></div></div>'
              )
              .join('') +
            '</div>'
        )
        .join('') +
      '</div>';
  }

  function plantillas() {
    const coms = CM.splitComments(($('#cm-texto', el) || {}).value || state.texto);
    if (!coms.length) {
      toast('Pegá al menos un comentario.', 'warn');
      return;
    }
    const d = App.datos();
    state.items = coms.slice(0, 80).map((c) => {
      const r = CM.templateReply(c, d, 0);
      return { comentario: c, tipo: r.tipo.id, respuesta: r.respuesta, variante: 0, video: false, ocultar: false, origen: 'plantilla' };
    });
    state.error = '';
    renderInput();
    renderList();
  }

  async function claude() {
    const coms = CM.splitComments(($('#cm-texto', el) || {}).value || state.texto).slice(0, 60);
    if (!coms.length) {
      toast('Pegá al menos un comentario.', 'warn');
      return;
    }
    ctl = new AbortController();
    state.running = true;
    state.error = '';
    renderInput();
    try {
      const data = await AI.sample.json(CM.buildPrompt(coms, App.datos(), state.tono), { signal: ctl.signal, cache: false, modelTier: 'quick' });
      const rs = (data && Array.isArray(data.respuestas) ? data.respuestas : []).filter((r) => r && r.n >= 1 && r.n <= coms.length);
      const byN = new Map(rs.map((r) => [Number(r.n), r]));
      const d = App.datos();
      state.items = coms.map((c, i) => {
        const r = byN.get(i + 1);
        if (!r) {
          const t = CM.templateReply(c, d, 0);
          return { comentario: c, tipo: t.tipo.id, respuesta: t.respuesta, variante: 0, origen: 'plantilla' };
        }
        const tipo = CM.TIPOS.some((t) => t.id === r.tipo) ? r.tipo : CM.classify(c).id;
        return { comentario: c, tipo, respuesta: CM.fit(String(r.respuesta || '')), variante: 0, video: !!r.video, ocultar: !!r.ocultar, origen: 'claude' };
      });
    } catch (err) {
      if (err && err.code !== 'cancelled') state.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.running = false;
    renderInput();
    renderList();
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'cm-texto') state.texto = t.value;
    else if (t.id === 'cm-tono') state.tono = t.value;
    else if (t.dataset.i != null && t.tagName === 'TEXTAREA') {
      const it = state.items[Number(t.dataset.i)];
      it.respuesta = t.value;
      const n = $('#cm-n-' + t.dataset.i, el);
      if (n) {
        n.textContent = t.value.length + '/' + CM.MAX;
        n.className = 'small ' + (t.value.length > CM.MAX ? 'warn-text' : 'muted');
      }
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    const it = t.dataset.i != null ? state.items[Number(t.dataset.i)] : null;
    switch (t.dataset.act) {
      case 'plantillas':
        plantillas();
        break;
      case 'claude':
        claude();
        break;
      case 'detener':
        if (ctl) ctl.abort();
        break;
      case 'copiar':
        copyText(it.respuesta, t);
        break;
      case 'otra': {
        it.variante = (it.variante || 0) + 1;
        it.respuesta = CM.templateReply(it.comentario, App.datos(), it.variante).respuesta;
        it.origen = 'plantilla';
        renderList();
        break;
      }
      case 'guardar': {
        const id = 'r' + Date.now().toString(36);
        const doc = { tipo: it.tipo, respuesta: it.respuesta, ejemplo: it.comentario, creada: new Date().toISOString() };
        state.biblioteca.set(id, doc);
        Store.set('respuestas/' + id, doc).catch(storeFail);
        renderLib();
        toast('Guardada en la biblioteca.', 'good');
        break;
      }
      case 'lib-copiar':
        copyText((state.biblioteca.get(t.dataset.id) || {}).respuesta || '', t);
        break;
      case 'lib-borrar':
        state.biblioteca.delete(t.dataset.id);
        Store.remove('respuestas/' + t.dataset.id).catch(storeFail);
        renderLib();
        break;
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.comentarios = { mount, render };
})(window);
</script>
<script>
/* ui/ofertas.js */
/* Calculadora de ofertas */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const OF = VC.offers;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, chip, banner, storeFail } = VC.ui;

  const state = {
    items: OF.DEFAULT_OFERTAS.map((o) => Object.assign({}, o)),
    cpa: null, // null = usar el real de los últimos 7 días
    envioExtra: 0,
    gastos: {},
  };
  let el;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Calculadora de ofertas</h2><p class="lede">Compará cuánto te deja cada promo con tus costos reales, los pedidos que se anulan y lo que pagás por cada venta en publicidad.</p></div></header>' +
      '<div id="of-warn"></div><section class="panel" id="of-params"></section><section class="panel" id="of-rows"></section><section class="panel" id="of-results"></section><section class="panel" id="of-sens"></section>';
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    App.on((w) => (w === 'cfg' || w === 'tienda') && renderAll());
    Shop.onChange(() => renderResults());
    Store.watch('gastos', (m) => {
      state.gastos = Object.fromEntries(m);
      renderParams();
      renderResults();
    });
    Store.get('config/ofertas').then((d) => {
      if (d && Array.isArray(d.items) && d.items.length) {
        state.items = d.items;
        state.cpa = d.cpa == null ? null : d.cpa;
        state.envioExtra = d.envioExtra || 0;
      } else {
        // Precios de la tienda como punto de partida
        const p1 = Number(App.tienda.precio1) || 68990;
        const p2 = Number(App.tienda.precio2) || 72990;
        state.items = OF.DEFAULT_OFERTAS.map((o) => Object.assign({}, o, { precio: o.id === 'dos' ? p2 : o.id === '3x2' ? p1 * 2 : p1 }));
      }
      renderAll();
    });
    Shop.ensure(U.addDays(U.todayKeyAR(), -7)).catch(() => {});
    renderAll();
  }

  const save = VC.ui.debounce(() => Store.set('config/ofertas', JSON.parse(JSON.stringify({ items: state.items, cpa: state.cpa, envioExtra: state.envioExtra }))).catch(storeFail), 800);

  /* CPA real: gasto en anuncios de los últimos 7 días ÷ pedidos que entraron en esos días. */
  function cpaReal() {
    const hoy = U.todayKeyAR();
    const desde = U.addDays(hoy, -6);
    let ads = 0;
    for (const d of U.dayRange(desde, hoy)) ads += P.spendOf(state.gastos[d]).total;
    const pedidos = Shop.orders.filter((o) => o.day >= desde && o.day <= hoy).length;
    return ads > 0 && pedidos ? { cpa: ads / pedidos, ads, pedidos } : null;
  }

  function cpaActual() {
    if (state.cpa != null) return { valor: state.cpa, origen: 'manual' };
    const r = cpaReal();
    if (r) return { valor: r.cpa, origen: 'real', detalle: r };
    return { valor: 15000, origen: 'supuesto' };
  }

  function renderAll() {
    if (!el) return;
    const warn = $('#of-warn', el);
    warn.innerHTML = P.costsReady(App.cfg) ? '' : banner('warn', '<strong>Faltan tus costos.</strong> Sin el costo del corrector y del envío la comparación no sirve.', '<button class="btn" data-goto="ajustes">Cargar costos</button>');
    renderParams();
    renderRows();
    renderResults();
  }

  function renderParams() {
    const box = $('#of-params', el);
    if (!box || box.contains(document.activeElement)) return;
    const c = cpaActual();
    const cfg = P.normalizeCfg(App.cfg);
    const origen =
      c.origen === 'real'
        ? 'Real de los últimos 7 días: ' + U.money(c.detalle.ads) + ' en anuncios ÷ ' + c.detalle.pedidos + ' pedidos.'
        : c.origen === 'manual'
          ? 'Cargado a mano.'
          : 'Supuesto: cargá el gasto diario en Ganancia o escribí tu costo por pedido.';
    box.innerHTML =
      '<div class="form-grid"><label for="of-cpa">Costo en publicidad por pedido<span class="input-unit"><span class="unit">$</span><input id="of-cpa" inputmode="numeric" value="' +
      e(U.int(c.valor)) +
      '"></span></label><label for="of-envio">Envío extra por cada unidad adicional<span class="input-unit"><span class="unit">$</span><input id="of-envio" inputmode="numeric" value="' +
      e(state.envioExtra ? U.int(state.envioExtra) : '') +
      '" placeholder="0"></span></label></div><p class="muted small">' +
      e(origen) +
      (c.origen === 'manual' ? ' <button class="btn link" data-act="cpa-real">Usar el real</button>' : '') +
      '</p><p class="muted small">Costos de Ajustes: corrector ' +
      e(U.money(cfg.costoUnidad)) +
      ' · envío ' +
      e(U.money(cfg.costoEnvio)) +
      ' · devolución ' +
      e(U.money(cfg.costoDevolucion)) +
      (cfg.comisionCobro ? ' · comisión ' + e(String(cfg.comisionCobro).replace('.', ',')) + '%' : '') +
      '.</p>';
  }

  function renderRows() {
    const box = $('#of-rows', el);
    box.innerHTML =
      '<div class="panel-head"><h3>Ofertas a comparar</h3><button class="btn ghost" data-act="agregar">Agregar oferta</button></div><div class="table-wrap"><table class="table offers-edit"><thead><tr><th>Oferta</th><th class="num">Unidades</th><th class="num">Cobrás en total</th><th class="num">Regalo / extra</th><th class="num">Conversión vs. la 1ª</th><th></th></tr></thead><tbody>' +
      state.items
        .map(
          (o, i) =>
            '<tr><td><label class="sr-only" for="of-n-' +
            i +
            '">Nombre</label><input id="of-n-' +
            i +
            '" data-i="' +
            i +
            '" data-k="nombre" value="' +
            e(o.nombre) +
            '"></td><td><label class="sr-only" for="of-u-' +
            i +
            '">Unidades</label><input id="of-u-' +
            i +
            '" class="num-input short" data-i="' +
            i +
            '" data-k="unidades" inputmode="numeric" value="' +
            e(o.unidades) +
            '"></td><td><label class="sr-only" for="of-p-' +
            i +
            '">Precio</label><input id="of-p-' +
            i +
            '" class="num-input" data-i="' +
            i +
            '" data-k="precio" inputmode="numeric" value="' +
            e(U.int(o.precio)) +
            '"></td><td><label class="sr-only" for="of-x-' +
            i +
            '">Costo del regalo</label><input id="of-x-' +
            i +
            '" class="num-input" data-i="' +
            i +
            '" data-k="extra" inputmode="numeric" value="' +
            e(o.extra ? U.int(o.extra) : '') +
            '" placeholder="0"></td><td><label class="sr-only" for="of-l-' +
            i +
            '">Cambio de conversión</label><span class="input-unit inline"><input id="of-l-' +
            i +
            '" class="num-input short" data-i="' +
            i +
            '" data-k="lift" inputmode="decimal" value="' +
            e(o.lift ? String(o.lift).replace('.', ',') : '') +
            '" placeholder="0"' +
            (i === 0 ? ' disabled' : '') +
            '><span class="unit">%</span></span></td><td>' +
            (state.items.length > 2 ? '<button class="btn link" data-act="quitar" data-i="' + i + '">Quitar</button>' : '') +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div><p class="muted small">“Conversión vs. la 1ª”: si creés que la promo va a traer más pedidos por el mismo gasto (ej. +25%), cargalo y tu costo por pedido baja en esa proporción. La primera fila es la base de comparación.</p>';
  }

  function computed() {
    const rates = O.historicalRates(Shop.orders);
    return OF.compare(state.items, App.cfg, rates, cpaActual().valor, state.envioExtra);
  }

  function renderResults() {
    const box = $('#of-results', el);
    if (!box) return;
    const { evs } = computed();
    const max = Math.max(1, ...evs.map((x) => Math.abs(x.ganancia)));
    const mix = OF.unitMix(Shop.orders);
    const best = evs.find((x) => x.mejor);
    box.innerHTML =
      '<h3>Resultado</h3>' +
      (best ? '<p><strong>' + e(best.oferta.nombre) + '</strong> es la que más deja por pedido: ' + e(U.money(best.ganancia)) + (best !== evs[0] ? ', ' + e(U.money(best.vsBase)) + ' más que ' + e(evs[0].oferta.nombre) + '.' : '.') + '</p>' : '') +
      '<ul class="offer-bars">' +
      evs
        .map(
          (x) =>
            '<li' +
            (x.mejor ? ' class="is-best"' : '') +
            '><span class="ob-name">' +
            e(x.oferta.nombre) +
            (x.mejor ? ' ' + chip('Mejor', 'good') : '') +
            '</span><span class="wf-track"><span class="wf-bar ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '" style="width:' +
            Math.max(1, (Math.abs(x.ganancia) / max) * 100).toFixed(1) +
            '%"></span></span><span class="wf-val mono ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '">' +
            e(U.money(x.ganancia)) +
            '</span></li>'
        )
        .join('') +
      '</ul><p class="muted small">Ganancia promedio por cada pedido que entra, después de anuncios, anulados y devoluciones.</p>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Oferta</th><th class="num">Precio por unidad</th><th class="num">Deja si se entrega</th><th class="num">Por pedido que entra</th><th class="num">vs. ' +
      e(evs[0].oferta.nombre) +
      '</th><th>Para empatar necesita</th></tr></thead><tbody>' +
      evs
        .map(
          (x, i) =>
            '<tr' +
            (x.mejor ? ' class="is-winner"' : '') +
            '><th scope="row">' +
            e(x.oferta.nombre) +
            '</th><td class="num">' +
            e(U.money(x.precioUnidad)) +
            '</td><td class="num">' +
            e(U.money(x.margenEntrega)) +
            '</td><td class="num ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '">' +
            e(U.money(x.ganancia)) +
            '</td><td class="num">' +
            (i === 0 ? '—' : e((x.vsBase >= 0 ? '+' : '') + U.money(x.vsBase))) +
            '</td><td class="small">' +
            (i === 0 ? '<span class="muted">Base</span>' : liftText(x)) +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div>' +
      (mix.n ? '<p class="note">En tu historial, ' + U.pct(mix.dos) + ' de los pedidos entregados llevó 2 unidades' + (mix.tresOMas ? ' y ' + U.pct(mix.tresOMas) + ' llevó 3 o más' : '') + ' (' + mix.n + ' pedidos).</p>' : '');
    renderSens();
  }

  function liftText(x) {
    if (x.liftNecesario == null) return '<span class="neg">No empata ni con publicidad gratis</span>';
    if (x.liftNecesario <= 0) return '<span class="pos">Gana aunque convierta ' + e(U.pct(-x.liftNecesario)) + ' menos</span>';
    return e(U.pct(x.liftNecesario)) + ' más pedidos por el mismo gasto';
  }

  function renderSens() {
    const box = $('#of-sens', el);
    const base = cpaActual().valor;
    const niveles = [0.5, 0.75, 1, 1.25, 1.5].map((f) => Math.round((base * f) / 500) * 500);
    const rates = O.historicalRates(Shop.orders);
    const filas = state.items.map((o) => niveles.map((cpa) => OF.evaluate(o, App.cfg, rates, cpa, state.envioExtra).ganancia));
    const bestCol = niveles.map((_, j) => filas.reduce((bi, f, i) => (f[j] > filas[bi][j] ? i : bi), 0));
    box.innerHTML =
      '<h3>¿Y si la publicidad sube o baja?</h3><p class="muted small">Ganancia por pedido según lo que te cueste cada pedido en anuncios.</p><div class="table-wrap"><table class="table"><thead><tr><th>Oferta</th>' +
      niveles.map((n) => '<th class="num">' + e(U.moneyShort(n)) + '</th>').join('') +
      '</tr></thead><tbody>' +
      filas
        .map(
          (f, i) =>
            '<tr><th scope="row">' +
            e(state.items[i].nombre) +
            '</th>' +
            f.map((v, j) => '<td class="num ' + (v >= 0 ? '' : 'neg') + (bestCol[j] === i ? ' is-best-cell' : '') + '">' + e(U.moneyShort(v)) + '</td>').join('') +
            '</tr>'
        )
        .join('') +
      '</tbody></table></div><p class="muted small">Resaltada: la mejor oferta para cada costo por pedido.</p>';
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'of-cpa') {
      const v = U.parseMoney(t.value);
      state.cpa = v != null ? v : null;
      save();
      renderResults();
    } else if (t.id === 'of-envio') {
      state.envioExtra = U.parseMoney(t.value) || 0;
      save();
      renderResults();
    } else if (t.dataset.i != null && t.dataset.k) {
      const o = state.items[Number(t.dataset.i)];
      const k = t.dataset.k;
      o[k] = k === 'nombre' ? t.value : k === 'lift' ? U.parseNum(t.value) || 0 : k === 'unidades' ? Math.max(1, Math.round(U.parseMoney(t.value) || 1)) : U.parseMoney(t.value) || 0;
      save();
      renderResults();
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset.k === 'precio' || t.dataset.k === 'extra') {
      const v = U.parseMoney(t.value);
      t.value = v ? U.int(v) : '';
    } else if (t.id === 'of-cpa') renderParams();
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.act === 'agregar') {
      state.items.push({ id: 'o' + Date.now().toString(36), nombre: 'Nueva oferta', unidades: 1, precio: Number(App.tienda.precio1) || 68990, extra: 0, lift: 0 });
      save();
      renderRows();
      renderResults();
    } else if (t.dataset.act === 'quitar') {
      state.items.splice(Number(t.dataset.i), 1);
      save();
      renderRows();
      renderResults();
    } else if (t.dataset.act === 'cpa-real') {
      state.cpa = null;
      save();
      renderParams();
      renderResults();
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.ofertas = { mount, render: renderAll };
})(window);
</script>
<script>
/* ui/productos.js */
/* Buscador del próximo producto */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const PR = VC.products;
  const CP = VC.competitors;
  const { Store, Shop, AI } = VC.runtime;
  const { e, $, App, banner, toast, storeFail } = VC.ui;

  const ESCALAS = [
    ['demanda', 'Demanda', 'más es mejor'],
    ['competencia', 'Competencia', '5 = mucha'],
    ['afinidad', 'Afinidad con tu cliente', 'más es mejor'],
    ['video', 'Se luce en video', 'más es mejor'],
    ['riesgo', 'Riesgo (devoluciones, talles, fallas)', '5 = alto'],
  ];

  const state = {
    items: PR.CANDIDATOS.map((c) => Object.assign({ precio: null, costo: null }, c)),
    cpa: null,
    ia: { running: false, data: null, error: '' },
  };
  let el;
  let ctl;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Próximo producto</h2><p class="lede">Compará qué sumar al corrector. Cargá el precio al que lo venderías y lo que te cuesta: el panel calcula cuánto deja con tus tasas reales y lo puntúa por demanda, competencia y afinidad con tu cliente.</p></div>' +
      '<div class="tool-actions"><button class="btn ghost" data-act="agregar">Agregar producto</button></div></header>' +
      '<div id="pr-warn"></div><section class="panel" id="pr-params"></section><div id="pr-ranking"></div><section class="panel" id="pr-ia"></section><div id="pr-list" class="product-list"></div>';
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    App.on((w) => w === 'cfg' && renderAll());
    Store.get('productos/lista').then((d) => {
      if (d && Array.isArray(d.items) && d.items.length) {
        // Conserva lo que cargó el usuario y suma candidatos nuevos de la lista base
        const byId = new Map(d.items.map((x) => [x.id, x]));
        state.items = d.items.concat(PR.CANDIDATOS.filter((c) => !byId.has(c.id)).map((c) => Object.assign({ precio: null, costo: null }, c)));
        state.cpa = d.cpa == null ? null : d.cpa;
      }
      renderAll();
    });
    renderAll();
  }

  const save = VC.ui.debounce(() => Store.set('productos/lista', JSON.parse(JSON.stringify({ items: state.items, cpa: state.cpa }))).catch(storeFail), 800);

  function cpa() {
    if (state.cpa != null) return state.cpa;
    const manual = P.normalizeCfg(App.cfg).cpaMaxManual;
    return manual > 0 ? Math.round(manual * 0.7) : 15000;
  }

  function rates() {
    return O.historicalRates(Shop.orders);
  }

  function renderAll() {
    if (!el) return;
    $('#pr-warn', el).innerHTML = P.costsReady(App.cfg) ? '' : banner('warn', 'Cargá en Ajustes el costo de envío y de devolución: se usan para calcular el margen de cualquier producto.', '<button class="btn ghost" data-goto="ajustes">Ir a Ajustes</button>');
    if (!$('#pr-params', el).contains(document.activeElement)) {
      $('#pr-params', el).innerHTML =
        '<div class="form-grid"><label for="pr-cpa">Costo en publicidad por pedido (estimado para el producto nuevo)<span class="input-unit"><span class="unit">$</span><input id="pr-cpa" inputmode="numeric" value="' +
        e(U.int(cpa())) +
        '"></span></label></div><p class="muted small">Precios de referencia: publicaciones de Mercado Libre Argentina (' +
        PR.REF_FECHA +
        '). Los puntajes vienen con una estimación inicial: ajustalos con lo que veas en Mercado Libre, Google Trends y la Biblioteca de anuncios.</p>';
    }
    renderRanking();
    renderIA();
    renderList();
  }

  function scored() {
    return state.items.map((p) => Object.assign({ p }, PR.score(p, App.cfg, rates(), cpa())));
  }

  function renderRanking() {
    const list = scored().sort((a, b) => b.completo - a.completo || b.puntaje - a.puntaje);
    const box = $('#pr-ranking', el);
    box.innerHTML =
      '<section class="panel"><h3>Ranking</h3><ol class="ranking">' +
      list
        .map(
          (s, i) =>
            '<li><span class="rk-pos mono">' +
            (i + 1) +
            '</span><span class="rk-name">' +
            e(s.p.nombre) +
            (s.completo ? '' : ' <span class="muted small">(falta precio o costo)</span>') +
            '</span><span class="wf-track"><span class="wf-bar ' +
            (i === 0 && s.completo ? 'pos' : 'base') +
            '" style="width:' +
            Math.max(2, s.puntaje) +
            '%"></span></span><span class="wf-val mono">' +
            s.puntaje +
            '</span></li>'
        )
        .join('') +
      '</ol><p class="muted small">Puntaje de 0 a 100: margen ' +
      PR.PESOS.margen +
      '%, demanda ' +
      PR.PESOS.demanda +
      '%, competencia ' +
      PR.PESOS.competencia +
      '%, afinidad ' +
      PR.PESOS.afinidad +
      '%, video ' +
      PR.PESOS.video +
      '%, riesgo ' +
      PR.PESOS.riesgo +
      '%. Sin precio y costo, el margen no cuenta.</p></section>';
  }

  function renderList() {
    const box = $('#pr-list', el);
    if (box.contains(document.activeElement)) {
      // Solo actualiza los números para no perder el foco mientras escribís
      for (const s of scored()) updateNumbers(s);
      return;
    }
    box.innerHTML = scored()
      .map((s, i) => {
        const p = s.p;
        const sug = state.ia.data && state.ia.data.find((x) => norm(x.nombre) === norm(p.nombre));
        return (
          '<article class="product-card" id="pc-' +
          e(p.id) +
          '"><header class="pc-head"><div><h4>' +
          e(p.nombre) +
          '</h4><p class="muted small">' +
          (p.refMin ? 'Mercado Libre: ' + e(U.money(p.refMin)) + ' a ' + e(U.money(p.refMax)) : 'Sin precio de referencia relevado') +
          '</p></div><div class="pc-score"><span class="stat-value" data-out="puntaje">' +
          s.puntaje +
          '</span><span class="stat-label">puntaje</span></div></header>' +
          (p.nota ? '<p class="small">' + e(p.nota) + '</p>' : '') +
          '<div class="row-actions links"><a class="btn link" href="' +
          e(PR.mlUrl(p.busqueda || p.nombre)) +
          '" target="_blank" rel="noopener">Mercado Libre</a><a class="btn link" href="' +
          e(PR.trendsUrl(p.busqueda || p.nombre)) +
          '" target="_blank" rel="noopener">Google Trends</a><a class="btn link" href="' +
          e(CP.adLibraryUrl(p.busqueda || p.nombre)) +
          '" target="_blank" rel="noopener">Anuncios activos</a>' +
          (p.custom ? '<button class="btn link" data-act="quitar" data-i="' + i + '">Quitar</button>' : '') +
          '</div><div class="form-grid">' +
          (p.custom ? money(i, 'nombre', 'Nombre', p.nombre, true) : '') +
          money(i, 'precio', 'Precio de venta', p.precio) +
          money(i, 'costo', 'Costo (proveedor)', p.costo) +
          money(i, 'envioExtra', 'Envío extra vs. el corrector', p.envioExtra) +
          '</div><div class="scales">' +
          ESCALAS.map(
            ([k, label, hint]) =>
              '<label for="pr-' +
              i +
              '-' +
              k +
              '">' +
              e(label) +
              ' <span class="muted">(' +
              e(hint) +
              ')</span><select id="pr-' +
              i +
              '-' +
              k +
              '" data-i="' +
              i +
              '" data-k="' +
              k +
              '">' +
              [1, 2, 3, 4, 5].map((n) => '<option' + (Number(p[k]) === n ? ' selected' : '') + '>' + n + '</option>').join('') +
              '</select></label>'
          ).join('') +
          '</div><div class="pc-out"><div><span class="eyebrow">Por pedido con anuncios</span><span class="mono" data-out="anuncios">' +
          (s.eco ? e(U.money(s.eco.conAnuncios)) : '—') +
          '</span></div><div><span class="eyebrow">Venta a un cliente actual</span><span class="mono" data-out="cliente">' +
          (s.eco ? e(U.money(s.eco.aCliente)) : '—') +
          '</span></div><div><span class="eyebrow">Precio ÷ costo</span><span class="mono" data-out="markup">' +
          (s.eco ? e(s.eco.markup.toFixed(1).replace('.', ',')) + '×' : '—') +
          '</span></div></div>' +
          (sug ? suggestion(sug, i) : '') +
          '</article>'
        );
      })
      .join('');
  }

  function updateNumbers(s) {
    const card = el.querySelector('#pc-' + CSS.escape(s.p.id));
    if (!card) return;
    const set = (k, v) => {
      const n = card.querySelector('[data-out="' + k + '"]');
      if (n) n.textContent = v;
    };
    set('puntaje', s.puntaje);
    set('anuncios', s.eco ? U.money(s.eco.conAnuncios) : '—');
    set('cliente', s.eco ? U.money(s.eco.aCliente) : '—');
    set('markup', s.eco ? s.eco.markup.toFixed(1).replace('.', ',') + '×' : '—');
  }

  function money(i, k, label, v, text) {
    return (
      '<label for="pr-' +
      i +
      '-' +
      k +
      '">' +
      e(label) +
      (text ? '' : '<span class="input-unit"><span class="unit">$</span>') +
      '<input id="pr-' +
      i +
      '-' +
      k +
      '" data-i="' +
      i +
      '" data-k="' +
      k +
      '"' +
      (text ? '' : ' inputmode="numeric" placeholder="0"') +
      ' value="' +
      e(text ? v || '' : v ? U.int(v) : '') +
      '">' +
      (text ? '' : '</span>') +
      '</label>'
    );
  }

  function suggestion(x, i) {
    return (
      '<div class="ia-sug"><span class="eyebrow">Claude sugiere</span><p class="small">Demanda ' +
      x.demanda +
      ' · competencia ' +
      x.competencia +
      ' · afinidad ' +
      x.afinidad +
      ' · video ' +
      x.video +
      ' · riesgo ' +
      x.riesgo +
      (x.precio_sugerido ? ' · precio ' + e(U.money(U.parseMoney(x.precio_sugerido))) : '') +
      '</p>' +
      (x.angulo ? '<p class="small"><strong>Ángulo:</strong> ' + e(x.angulo) + '</p>' : '') +
      (x.combo ? '<p class="small"><strong>Combo:</strong> ' + e(x.combo) + '</p>' : '') +
      (x.dudas ? '<p class="small muted">' + e(x.dudas) + '</p>' : '') +
      '<button class="btn ghost" data-act="aplicar" data-i="' +
      i +
      '">Usar estos puntajes</button></div>'
    );
  }

  function norm(s) {
    return U.stripAccents(String(s || '')).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function renderIA() {
    const box = $('#pr-ia', el);
    const I = state.ia;
    box.innerHTML =
      '<div class="panel-head"><h3>Opinión de Claude</h3>' +
      (AI.sample ? (I.running ? '<button class="btn ghost" data-act="ia-stop">Detener</button>' : '<button class="btn" data-act="ia">' + (I.data ? 'Volver a preguntar' : 'Pedir opinión') + '</button>') : '') +
      '</div>' +
      (AI.sample
        ? I.running
          ? '<p class="muted">Pensando… puede tardar un minuto.</p>'
          : I.reco
            ? '<p>' + e(I.reco) + '</p><p class="muted small">Estimaciones sin acceso a internet: confirmá precios y demanda en Mercado Libre antes de comprar stock.</p>'
            : '<p class="muted">Claude estima demanda, competencia y afinidad de cada candidato y te sugiere precio, ángulo y combo. Son estimaciones sin acceso a internet.</p>'
        : '<p class="muted">Abrí el panel desde claude.ai para pedir la opinión de Claude.</p>') +
      (I.error ? '<p class="error-text">' + e(I.error) + '</p>' : '');
  }

  async function askIA() {
    ctl = new AbortController();
    state.ia = { running: true, data: state.ia.data, error: '' };
    renderIA();
    try {
      const data = await AI.sample.json(PR.claudePrompt(state.items, App.tienda), { signal: ctl.signal, cache: false });
      const list = data && Array.isArray(data.productos) ? data.productos : [];
      const clamp = (n) => U.clamp(Math.round(Number(n) || 3), 1, 5);
      state.ia.data = list.map((x) => ({ nombre: String(x.nombre || ''), demanda: clamp(x.demanda), competencia: clamp(x.competencia), afinidad: clamp(x.afinidad), video: clamp(x.video), riesgo: clamp(x.riesgo), precio_sugerido: x.precio_sugerido, angulo: String(x.angulo || ''), combo: String(x.combo || ''), dudas: String(x.dudas || '') }));
      state.ia.reco = String((data && data.recomendacion) || '');
      if (!state.ia.data.length) state.ia.error = 'La respuesta vino vacía. Probá de nuevo.';
    } catch (err) {
      if (err && err.code !== 'cancelled') state.ia.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.ia.running = false;
    renderIA();
    renderList();
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'pr-cpa') {
      state.cpa = U.parseMoney(t.value);
      save();
      renderRanking();
      for (const s of scored()) updateNumbers(s);
      return;
    }
    if (t.dataset.i == null || !t.dataset.k) return;
    const p = state.items[Number(t.dataset.i)];
    const k = t.dataset.k;
    p[k] = k === 'nombre' ? t.value : U.parseMoney(t.value);
    save();
    renderRanking();
    for (const s of scored()) updateNumbers(s);
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.tagName === 'SELECT' && t.dataset.k) {
      state.items[Number(t.dataset.i)][t.dataset.k] = Number(t.value);
      save();
      renderRanking();
      for (const s of scored()) updateNumbers(s);
    } else if (t.dataset.k && t.dataset.k !== 'nombre') {
      const v = U.parseMoney(t.value);
      t.value = v ? U.int(v) : '';
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    const i = Number(t.dataset.i);
    switch (t.dataset.act) {
      case 'agregar':
        state.items.push({ id: 'p' + Date.now().toString(36), nombre: 'Producto nuevo', busqueda: '', custom: true, precio: null, costo: null, envioExtra: 0, demanda: 3, competencia: 3, afinidad: 3, video: 3, riesgo: 3, refMin: null, refMax: null, nota: '' });
        save();
        renderAll();
        break;
      case 'quitar':
        state.items.splice(i, 1);
        save();
        renderAll();
        break;
      case 'ia':
        askIA();
        break;
      case 'ia-stop':
        if (ctl) ctl.abort();
        break;
      case 'aplicar': {
        const p = state.items[i];
        const x = state.ia.data.find((s) => norm(s.nombre) === norm(p.nombre));
        if (!x) return;
        for (const k of ['demanda', 'competencia', 'afinidad', 'video', 'riesgo']) p[k] = x[k];
        if (!p.precio && x.precio_sugerido) p.precio = U.parseMoney(x.precio_sugerido);
        save();
        renderAll();
        toast('Puntajes aplicados.', 'good');
        break;
      }
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.productos = { mount, render: renderAll };
})(window);
</script>
<script>
/* ui/ajustes.js */
/* Ajustes: costos del negocio, mensajes de WhatsApp, producto para guiones y conexión con Shopify. */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const S = VC.scripts;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, DEFAULT_MSGS, toast, banner } = VC.ui;

  const COSTOS = [
    ['costoUnidad', 'Costo de cada corrector', 'Lo que te cobra el proveedor o Dropi por unidad.', '$'],
    ['costoEnvio', 'Envío de un pedido entregado', 'Flete que pagás cuando el pedido llega y se cobra.', '$'],
    ['costoDevolucion', 'Pedido devuelto', 'Lo que pagás cuando rechazan el paquete: ida y vuelta.', '$'],
    ['comisionCobro', 'Comisión de cobro contra entrega', 'Porcentaje que te descuentan del cobro.', '%'],
    ['otrosPorPedido', 'Otros por pedido despachado', 'Packaging, etiqueta, preparación.', '$'],
    ['fijosMensuales', 'Costos fijos por mes', 'Shopify, apps (Releasit, etc.), herramientas. Se prorratea por día.', '$'],
  ];
  const TASAS = [
    ['tasaConfirmacion', 'Pedidos que se despachan', 'De cada 100 que entran, cuántos no se anulan antes de salir.', 'confirmacion'],
    ['tasaEntrega', 'Despachados que se entregan', 'De cada 100 que salen, cuántos se entregan y cobran.', 'entrega'],
  ];
  const PLANTILLAS = [
    ['confirmacion', 'Pedir confirmación'],
    ['recordatorio', 'Recordatorio de confirmación'],
    ['direccion', 'Pedir dirección completa'],
    ['resena', 'Pedir reseña'],
    ['resenaRecordatorio', 'Recordatorio de reseña'],
  ];
  const TIENDA = [
    ['precio1', 'Precio de 1 unidad', '68.990', true],
    ['precio2', 'Precio llevando 2', '72.990', true],
    ['envio', 'Envíos', 'Enviamos a todo el país', false],
    ['pago', 'Forma de pago', 'pagás en efectivo cuando te llega', false],
    ['demora', 'Cuánto tarda en llegar', 'Ej.: de 3 a 7 días hábiles', false],
    ['talles', 'Talles', 'Ej.: Es regulable, va de S a XL', false],
    ['garantia', 'Cambios o garantía', 'Ej.: Cambio dentro de los 10 días', false],
  ];
  const VARS = ['nombre', 'pedido', 'cantidad', 'producto', 'total', 'direccion', 'ciudad', 'provincia', 'cp', 'extras', 'tienda', 'firma'];

  let el;

  function mount(section) {
    el = section;
    render();
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    Shop.onChange(() => !el.contains(document.activeElement) && render());
  }

  function fmtVal(v, unit) {
    if (v == null || v === '' || (unit !== '%' && !Number(v))) return '';
    return unit === '%' ? String(v).replace('.', ',') : U.int(v);
  }

  function render() {
    if (!el) return;
    const rates = O.historicalRates(Shop.orders);
    const cfg = P.normalizeCfg(App.cfg);
    const be = P.breakEven(App.cfg, rates);
    const sample = Shop.orders.find((o) => o.estado === 'pendiente') || Shop.orders[0];
    el.innerHTML =
      '<header class="tool-head"><div><h2>Ajustes</h2><p class="lede">Lo que cargues acá lo usan todas las herramientas. Se guarda solo.</p></div></header>' +
      '<div class="grid-2">' +
      '<section class="panel"><h3>Costos del negocio</h3><div class="settings">' +
      COSTOS.map(
        ([k, label, help, unit]) =>
          '<label class="setting" for="cfg-' +
          k +
          '"><span class="setting-label">' +
          e(label) +
          '</span><span class="setting-help">' +
          e(help) +
          '</span><span class="input-unit"><span class="unit">' +
          unit +
          '</span><input id="cfg-' +
          k +
          '" data-cfg="' +
          k +
          '" data-unit="' +
          unit +
          '" inputmode="decimal" value="' +
          e(fmtVal(App.cfg[k], unit)) +
          '" placeholder="0"></span></label>'
      ).join('') +
      '</div></section>' +
      '<section class="panel"><h3>Tasas para proyectar</h3><p class="muted small">Vacío = se usa tu historial de Shopify.</p><div class="settings">' +
      TASAS.map(([k, label, help, hk]) => {
        const hist = rates[hk];
        const n = hk === 'confirmacion' ? rates.muestraConfirmacion : rates.muestraEntrega;
        return (
          '<label class="setting" for="cfg-' +
          k +
          '"><span class="setting-label">' +
          e(label) +
          '</span><span class="setting-help">' +
          e(help) +
          (hist != null ? ' Historial: ' + U.pct(hist) + ' (' + n + ').' : ' Sin historial todavía.') +
          '</span><span class="input-unit"><span class="unit">%</span><input id="cfg-' +
          k +
          '" data-cfg="' +
          k +
          '" data-unit="%" inputmode="decimal" value="' +
          e(cfg[k] != null ? String(cfg[k]).replace('.', ',') : '') +
          '" placeholder="' +
          (hist != null ? Math.round(hist * 100) : '') +
          '"></span></label>'
        );
      }).join('') +
      '<label class="setting" for="cfg-cpaMaxManual"><span class="setting-label">CPA máximo para el analizador</span><span class="setting-help">Vacío = el calculado' +
      (be && be.cpaEquilibrio > 0 && P.costsReady(App.cfg) ? ' (' + U.money(be.cpaEquilibrio) + ')' : '') +
      '.</span><span class="input-unit"><span class="unit">$</span><input id="cfg-cpaMaxManual" data-cfg="cpaMaxManual" data-unit="$" inputmode="numeric" value="' +
      e(fmtVal(cfg.cpaMaxManual, '$')) +
      '" placeholder="calculado"></span></label></div>' +
      '<div class="history"><h4>Tu historial en Shopify</h4><p>' +
      (rates.total
        ? e(rates.total) + ' pedidos cargados: ' + e(rates.anulados) + ' anulados (' + e(U.pct(rates.anulados / rates.total)) + '). Ticket promedio entregado: ' + e(U.money(rates.ticketPromedio)) + '.'
        : 'Todavía no se cargaron pedidos.') +
      '</p></div></section></div>' +
      '<section class="panel"><h3>Mensajes de WhatsApp</h3><div class="form-grid">' +
      [
        ['tienda', 'Nombre de la tienda'],
        ['firma', 'Firma (opcional)'],
        ['productoSingular', 'Producto (1 unidad)'],
        ['productoPlural', 'Producto (varias)'],
      ]
        .map(([k, l]) => '<label for="msg-' + k + '">' + e(l) + '<input id="msg-' + k + '" data-msg="' + k + '" value="' + e(App.msgs[k] || '') + '"></label>')
        .join('') +
      '</div><p class="muted small">Variables: ' +
      VARS.map((v) => '<span class="mono">{' + v + '}</span>').join(' ') +
      '</p><div class="templates">' +
      PLANTILLAS.map(
        ([k, label]) =>
          '<div class="template"><label for="msg-' +
          k +
          '">' +
          e(label) +
          '<textarea id="msg-' +
          k +
          '" data-msg="' +
          k +
          '" rows="5">' +
          e(App.msgs[k]) +
          '</textarea></label><div class="tpl-foot"><button class="btn link" data-act="restaurar" data-k="' +
          k +
          '">Volver al texto original</button></div>' +
          (sample ? '<div class="preview" id="prev-' + k + '">' + e(U.fillTemplate(App.msgs[k], O.templateVars(sample, App.msgs))) + '</div>' : '') +
          '</div>'
      ).join('') +
      '</div>' +
      (sample ? '<p class="muted small">Vista previa con el pedido ' + e(sample.name) + '.</p>' : '') +
      '</section>' +
      '<section class="panel"><h3>Datos de la tienda</h3><p class="muted small">Los usan las respuestas a comentarios, el reactivador de clientes y la calculadora de ofertas. Poné solo lo que cumplís.</p><div class="form-grid">' +
      TIENDA.map(([k, label, ph, unit]) => {
        const v = App.tienda[k];
        return (
          '<label for="td-' +
          k +
          '">' +
          e(label) +
          (unit ? '<span class="input-unit"><span class="unit">$</span>' : '') +
          '<input id="td-' +
          k +
          '" data-tienda="' +
          k +
          '"' +
          (unit ? ' data-unit="$" inputmode="numeric"' : '') +
          ' placeholder="' +
          e(ph) +
          '" value="' +
          e(unit ? (v ? U.int(v) : '') : v || '') +
          '">' +
          (unit ? '</span>' : '') +
          '</label>'
        );
      }).join('') +
      '</div></section>' +
      '<div class="grid-2"><section class="panel"><h3>Producto para los guiones</h3><label for="msg-productoGuiones">Cómo se ve el corrector (la IA de video lo necesita para dibujarlo igual en cada clip)<textarea id="msg-productoGuiones" data-msg="productoGuiones" rows="3" placeholder="' +
      e(S.PRODUCTO_DEFAULT) +
      '">' +
      e(App.msgs.productoGuiones || '') +
      '</textarea></label><p class="muted small">Vacío = ' +
      e(S.PRODUCTO_DEFAULT) +
      '.</p></section>' +
      '<section class="panel"><h3>Shopify y datos</h3><label class="check" for="msg-etiquetarShopify"><input type="checkbox" id="msg-etiquetarShopify" data-msg="etiquetarShopify"' +
      (App.msgs.etiquetarShopify ? ' checked' : '') +
      '> Al marcar un pedido, ponerle la etiqueta <span class="mono">WA-confirmado</span> o <span class="mono">WA-cancelado</span> en Shopify</label>' +
      '<p class="muted small">' +
      e(
        Shop.mode === 'live'
          ? 'Conectado a Shopify por claude.ai. ' + (Shop.loadedAt ? Shop.orders.length + ' pedidos cargados.' : 'Cargando…')
          : Shop.mode === 'csv'
            ? 'Usando el CSV importado (' + Shop.orders.length + ' pedidos).'
            : 'Sin conexión a Shopify en esta vista.'
      ) +
      '</p><div class="row-actions"><label class="btn ghost file-btn">Importar CSV de pedidos<input type="file" accept=".csv,text/csv" data-act="importar-csv" hidden></label>' +
      (Shop.mode === 'live' ? '<button class="btn ghost" data-act="refrescar">Volver a traer pedidos</button>' : '') +
      '</div><p class="muted small">' +
      e(
        Store.mode === 'db'
          ? 'Confirmaciones, gastos, reseñas y ajustes se guardan en el panel y los ves desde cualquier dispositivo.'
          : 'Tus datos se guardan solo en este navegador. Abrí el panel desde claude.ai para guardarlos en tu cuenta.'
      ) +
      '</p></section></div>';
  }

  function updatePreviews() {
    const sample = Shop.orders.find((o) => o.estado === 'pendiente') || Shop.orders[0];
    if (!sample) return;
    for (const [k] of PLANTILLAS) {
      const p = el.querySelector('#prev-' + k);
      if (p) p.textContent = U.fillTemplate(App.msgs[k], O.templateVars(sample, App.msgs));
    }
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.dataset.tienda) {
      const k = t.dataset.tienda;
      App.tienda[k] = t.dataset.unit === '$' ? U.parseMoney(t.value) || 0 : t.value;
      App.saveTienda();
      App.emit('tienda');
      return;
    }
    if (t.dataset.cfg) {
      const raw = t.value.trim();
      const parse = t.dataset.unit === '$' ? U.parseMoney : U.parseNum;
      const v = raw === '' ? (P.DEFAULT_CFG[t.dataset.cfg] === null ? null : 0) : parse(raw);
      if (raw !== '' && v == null) return;
      App.cfg[t.dataset.cfg] = v;
      App.saveCfg();
      App.emit('cfg');
    } else if (t.dataset.msg && t.type !== 'checkbox') {
      App.msgs[t.dataset.msg] = t.value;
      App.saveMsgs();
      updatePreviews();
      App.emit('msgs');
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset.tienda && t.dataset.unit === '$') {
      t.value = App.tienda[t.dataset.tienda] ? U.int(App.tienda[t.dataset.tienda]) : '';
    } else if (t.dataset.cfg) {
      t.value = fmtVal(App.cfg[t.dataset.cfg], t.dataset.unit);
    } else if (t.dataset.msg && t.type === 'checkbox') {
      App.msgs[t.dataset.msg] = t.checked;
      App.saveMsgs();
      App.emit('msgs');
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      VC.ui
        .readFileText(t.files[0])
        .then((txt) => {
          const list = Shop.importCSV(txt);
          toast(list.length + ' pedidos importados del CSV.', 'good');
          render();
        })
        .catch((err) => toast(err.message || 'No se pudo leer el archivo.', 'bad'));
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.act === 'restaurar') {
      const k = t.dataset.k;
      App.msgs[k] = DEFAULT_MSGS[k];
      const ta = el.querySelector('#msg-' + k);
      if (ta) ta.value = App.msgs[k];
      App.saveMsgs();
      updatePreviews();
      App.emit('msgs');
    } else if (t.dataset.act === 'refrescar') {
      Shop.ensure(null, { fresh: true })
        .then(() => {
          toast('Pedidos actualizados.', 'good');
          render();
        })
        .catch((err) => toast(err.message || 'No se pudo actualizar.', 'bad'));
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.ajustes = { mount, render, banner };
})(window);
</script>
<script>
/* main.js */
/* Arranque del panel: pestañas, conexiones y datos compartidos. */
(function (root) {
  'use strict';
  const VC = root.VC;
  const { Store, Shop, AI, Browser } = VC.runtime;
  const { App, DEFAULT_MSGS, $, $$, e, prefGet, prefSet } = VC.ui;

  const TABS = [
    { id: 'confirmar', label: 'Confirmar', grupo: 'pedidos' },
    { id: 'ganancia', label: 'Ganancia', grupo: 'pedidos' },
    { id: 'resenas', label: 'Reseñas', grupo: 'pedidos' },
    { id: 'clientes', label: 'Clientes', grupo: 'pedidos' },
    { id: 'creativos', label: 'Creativos', grupo: 'anuncios' },
    { id: 'competencia', label: 'Competencia', grupo: 'anuncios' },
    { id: 'comentarios', label: 'Comentarios', grupo: 'anuncios' },
    { id: 'guiones', label: 'Guiones', grupo: 'anuncios' },
    { id: 'ofertas', label: 'Ofertas', grupo: 'negocio' },
    { id: 'productos', label: 'Productos', grupo: 'negocio' },
    { id: 'ajustes', label: 'Ajustes', grupo: 'ajustes' },
  ];
  const mounted = new Set();
  let ready = false;
  let current = null;

  function initialTab() {
    const h = (location.hash || '').replace('#', '');
    if (TABS.some((t) => t.id === h)) return h;
    const p = prefGet('tab', 'confirmar');
    return TABS.some((t) => t.id === p) ? p : 'confirmar';
  }

  function renderNav() {
    $('#tabs').innerHTML = TABS.map(
      (t, i) =>
        (i && TABS[i - 1].grupo !== t.grupo ? '<span class="tab-sep" aria-hidden="true"></span>' : '') +
        '<button type="button" role="tab" id="tab-' +
        t.id +
        '" aria-controls="panel-' +
        t.id +
        '" aria-selected="' +
        (t.id === current) +
        '" tabindex="' +
        (t.id === current ? 0 : -1) +
        '" class="tab' +
        (t.id === current ? ' is-on' : '') +
        '" data-tab="' +
        t.id +
        '">' +
        e(t.label) +
        '<span class="tab-badge" id="badge-' +
        t.id +
        '" hidden></span></button>'
    ).join('');
  }

  function select(id, focus) {
    current = id;
    prefSet('tab', id);
    try {
      history.replaceState(null, '', '#' + id);
    } catch (err) {
      /* sin historial en esta vista */
    }
    renderNav();
    for (const t of TABS) $('#panel-' + t.id).hidden = t.id !== id;
    if (id === 'confirmar') updateBadges();
    if (focus) $('#tab-' + id).focus();
    if (ready && !mounted.has(id)) {
      mounted.add(id);
      VC.tools[id].mount($('#panel-' + id));
    } else if (mounted.has(id) && VC.tools[id].render) VC.tools[id].render();
  }

  function renderConn() {
    const shop =
      Shop.mode === 'live'
        ? Shop.error
          ? ['Shopify con error', 'bad']
          : Shop.loading
            ? ['Shopify: cargando', 'info']
            : ['Shopify conectado', 'good']
        : Shop.mode === 'csv'
          ? ['Pedidos desde CSV', 'warn']
          : Shop.mode === 'pending'
            ? ['Conectando…', 'neutral']
            : ['Shopify sin conexión', 'bad'];
    const data = Store.mode === 'db' ? ['Datos en tu cuenta', 'neutral'] : Store.mode === 'local' ? ['Datos en este navegador', 'warn'] : ['', 'neutral'];
    const A = VC.auto;
    const auto = A && A.running ? '<span class="conn tone-info auto-chip"><span class="dot pulse"></span>' + e('Automático: ' + A.NOMBRES[A.running] + (A.progress[A.running] ? ' · ' + A.progress[A.running] : '')) + '<button type="button" class="conn-stop" data-act="auto-stop" aria-label="Detener la tarea automática">Detener</button></span>' : '';
    $('#conn').innerHTML =
      auto +
      '<span class="conn tone-' +
      shop[1] +
      '"><span class="dot"></span>' +
      e(shop[0]) +
      '</span>' +
      (Browser.available ? '<span class="conn tone-good" title="El panel puede leer páginas públicas con el navegador de Claude en tu PC"><span class="dot"></span>Navegador de tu PC</span>' : '') +
      (data[0] ? '<span class="conn tone-' + data[1] + '"><span class="dot"></span>' + e(data[0]) + '</span>' : '');
  }

  // Pestaña donde se ven los resultados de cada tarea automática
  const TAB_DE = { competencia: 'competencia', tiendas: 'competencia', productos: 'productos', guiones: 'guiones' };

  function markNew(tab) {
    if (tab === current) return;
    const b = $('#badge-' + tab);
    if (b) {
      b.hidden = false;
      b.textContent = 'nuevo';
      b.classList.add('is-new');
    }
  }

  function updateBadges() {
    const open = Shop.orders.filter((o) => o.estado === 'pendiente' && !App.confirm.get(o.key) && o.day >= VC.util.addDays(VC.util.todayKeyAR(), -6));
    const b = $('#badge-confirmar');
    if (b) {
      b.hidden = !open.length;
      b.textContent = open.length;
    }
  }

  async function boot() {
    renderNav();
    for (const t of TABS) $('#panel-' + t.id).hidden = t.id !== current;
    renderConn();

    await Promise.all([Store.init(), Shop.init(), AI.init()]);
    renderConn();

    const [cfg, msgs, ultimo, tienda] = await Promise.all([Store.get('config/negocio'), Store.get('config/mensajes'), Store.get('creativos/ultimo'), Store.get('config/tienda')]);
    if (cfg) Object.assign(App.cfg, cfg);
    if (msgs) Object.assign(App.msgs, DEFAULT_MSGS, msgs);
    if (tienda) Object.assign(App.tienda, tienda);
    if (ultimo) App.ultimoAnalisis = ultimo;

    Store.watch('confirmaciones', (m) => {
      App.confirm = m;
      App.emit('confirm');
      updateBadges();
    });
    Store.watch('resenas', (m) => {
      App.resenas = m;
      App.emit('resenas');
    });
    Shop.onChange(() => {
      renderConn();
      updateBadges();
    });

    ready = true;
    mounted.add(current);
    VC.tools[current].mount($('#panel-' + current));

    // Tareas automáticas: necesitan saber si hay navegador (app de escritorio) y Claude
    await Browser.init();
    renderConn();
    VC.auto.on((ev) => {
      renderConn();
      if (ev.type === 'done' && ev.resultado && ev.resultado.novedades > 0) markNew(TAB_DE[ev.job]);
      if (ev.type === 'done' && ev.origen !== 'manual' && ev.resultado && ev.resultado.resumen) VC.ui.toast(ev.resultado.resumen, 'good');
    });
    await VC.auto.load();
    VC.auto.boot().catch((err) => console.error(err));
  }

  document.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-act="auto-stop"]')) {
      VC.auto.stop();
      return;
    }
    const tab = ev.target.closest('[data-tab]');
    if (tab) {
      select(tab.dataset.tab);
      return;
    }
    const go = ev.target.closest('[data-goto]');
    if (go) {
      ev.preventDefault();
      select(go.dataset.goto);
      root.scrollTo({ top: 0, behavior: 'auto' });
    }
  });

  document.addEventListener('keydown', (ev) => {
    const tab = ev.target.closest && ev.target.closest('[role="tab"]');
    if (!tab || (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft')) return;
    const i = TABS.findIndex((t) => t.id === tab.dataset.tab);
    const next = TABS[(i + (ev.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
    select(next.id, true);
  });

  current = initialTab();
  boot().catch((err) => {
    console.error(err);
    $('#conn').innerHTML = '<span class="conn tone-bad"><span class="dot"></span>Error al iniciar: ' + e(err && err.message ? err.message : String(err)) + '</span>';
  });
})(window);
</script>
