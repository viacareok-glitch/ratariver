      '<div id="conf-status"></div><div id="conf-summary"></div><div id="conf-filters"></div><div id="conf-list" class="order-list"></div><div id="conf-dispatch"></div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    Shop.onChange(render);
    App.on((what) => (what === 'confirm' || what === 'msgs') && render());
    load();
  }

  async function load(fresh) {
    state.loading = true;
    state.error = null;
    render();
    try {
      await Shop.ensure(U.addDays(U.todayKeyAR(), -(state.dias - 1)), { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    render();
  }

  function waState(o) {
    const c = App.confirm.get(o.key);
    return c && c.estado;
  }

  function lists() {
    const since = U.addDays(U.todayKeyAR(), -(state.dias - 1));
    const all = Shop.orders.filter((o) => o.day >= since);
    const abiertos = all.filter((o) => o.estado === 'pendiente');
    const s = (o) => waState(o);
    return {
      all,
      escribir: abiertos.filter((o) => !s(o)),
      esperando: abiertos.filter((o) => s(o) === 'esperando' || s(o) === 'no_responde'),
      confirmados: abiertos.filter((o) => s(o) === 'confirmado'),
      cancelados: abiertos.filter((o) => s(o) === 'cancelado'),
    };
  }

  function render() {
    if (!el) return;
    const statusEl = $('#conf-status', el);
    if (Shop.mode === 'none') {
      statusEl.innerHTML = shopStatusBanner({ message: 'Abrí el panel desde claude.ai para ver tus pedidos, o importá el CSV de Shopify.' });
    } else if (state.error) {
      statusEl.innerHTML = shopStatusBanner(state.error);
    } else if (Shop.mode === 'csv') {
      statusEl.innerHTML = '<p class="note">Pedidos del CSV importado.</p>';
    } else statusEl.innerHTML = '';

    const L = lists();
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;
    const rates = O.historicalRates(Shop.orders);
    const hoy = U.todayKeyAR();
    const hoyN = L.all.filter((o) => o.day === hoy).length;
    const decididos = L.all.filter((o) => ['confirmado', 'cancelado'].includes(waState(o)));
    const tasaWA = decididos.length ? decididos.filter((o) => waState(o) === 'confirmado').length / decididos.length : null;

    $('#conf-summary', el).innerHTML = loadingFirst
      ? '<div class="summary-strip is-loading">Cargando pedidos…</div>'
      : '<div class="summary-strip">' +
        stat(L.escribir.length, 'por escribir', L.escribir.length ? 'warn' : '') +
        stat(L.esperando.length, 'esperando respuesta') +
        stat(L.confirmados.length, 'listos para despachar', L.confirmados.length ? 'good' : '') +
        stat(
          tasaWA == null ? '—' : U.pct(tasaWA),
          'confirman',
          '',
          info(
            'De los pedidos que marcaste, cuántos confirmaron. Antes de usar el panel se despachaba el ' +
              (rates.confirmacion == null ? '—' : U.pct(rates.confirmacion)) +
              ' (' +
              rates.muestraConfirmacion +
              ' pedidos de tu historial). Hoy entraron ' +
              hoyN +
              '.'
          )
        ) +
        '</div>';

    $('#conf-filters', el).innerHTML = seg(
      'conf-filtro',
      [
        { value: 'escribir', label: 'Por escribir', count: L.escribir.length },
        { value: 'esperando', label: 'Esperando', count: L.esperando.length },
        { value: 'confirmados', label: 'Confirmados', count: L.confirmados.length },
        { value: 'cancelados', label: 'Cancelaron', count: L.cancelados.length },
        { value: 'all', label: 'Todos', count: L.all.length },
      ],
      state.filtro
    );

    const list = L[state.filtro] || L.all;
    const dup = O.duplicateIndex(L.all.filter((o) => o.estado !== 'anulado'));
    const listEl = $('#conf-list', el);
    if (loadingFirst) {
      listEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    } else if (!list.length) {
      listEl.innerHTML = emptyText(L);
    } else {
      listEl.innerHTML = list.map((o) => card(o, dup.get(o.id))).join('');
    }

    const disp = $('#conf-dispatch', el);
    if (L.confirmados.length && (state.filtro === 'confirmados' || state.filtro === 'escribir')) {
      const names = L.confirmados.map((o) => o.name).join(', ');
      disp.innerHTML =
        '<div class="dispatch"><div>' +
        icon('truck') +
        ' <strong>' +
        L.confirmados.length +
        ' para despachar:</strong> <span class="mono selectable">' +
        e(names) +
        '</span></div><button class="btn ghost sm" data-act="copiar-despacho" data-text="' +
        e(names) +
        '">' +
        icon('copy') +
        'Copiar</button></div>';
    } else if (L.cancelados.length && state.filtro === 'cancelados') {
      disp.innerHTML = '<p class="note">' + icon('alert') + ' Anulalos también en Shopify para que Dropi no los despache.</p>';
    } else disp.innerHTML = '';
  }

  function stat(value, label, tone, extra) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"><span class="stat-value">' + e(value) + '</span><span class="stat-label">' + e(label) + (extra ? ' ' + extra : '') + '</span></div>';
  }

  function emptyText(L) {
    if (!Shop.loadedAt) return emptyState('Sin pedidos todavía', 'Cuando Shopify responda aparecen acá.', '', 'clock');
    const msgs = {
      escribir: L.all.length ? ['Todo al día', 'No hay pedidos sin escribir.', 'check'] : ['Sin pedidos', 'No entraron pedidos en estos días.', 'box'],
      esperando: ['Nadie esperando', 'Ningún cliente quedó sin responder.', 'check'],
      confirmados: ['Nada para despachar', 'Cuando alguien confirme, aparece acá.', 'truck'],
      cancelados: ['Sin cancelaciones', 'Ningún cliente canceló por WhatsApp.', 'check'],
      all: ['Sin pedidos', 'No entraron pedidos en estos días.', 'box'],
    };
    const m = msgs[state.filtro] || msgs.all;
    return emptyState(m[0], e(m[1]), '', m[2]);
  }

  function card(o, dups) {
    const vars = O.templateVars(o, App.msgs);
    const ws = waState(o);
    const c = App.confirm.get(o.key) || {};
    const st = O.ESTADOS[o.estado];
    const msg = U.fillTemplate(App.msgs.confirmacion, vars);
    const rec = U.fillTemplate(App.msgs.recordatorio, vars);
    const dir = U.fillTemplate(App.msgs.direccion, vars);
    const open = o.estado === 'pendiente';
    const chips = [
      o.estado !== 'pendiente' ? chip(st.label, st.tone) : '',
      ws ? chip(WA_ESTADOS[ws].label, WA_ESTADOS[ws].tone) : '',
      o.source !== 'organico' ? chip(O.SOURCES[o.source], 'source') : '',
      dups && dups.length ? chip('Repetido: ' + dups.join(', '), 'warn') : '',

    ].join('');
    const warn = o.warnings.length && open ? '<ul class="warnings">' + o.warnings.map((w) => '<li>' + e(w) + '</li>').join('') + '</ul>' : '';
    const contacto = c.ultimoContacto ? '<span class="muted small">' + icon('clock') + ' Escrito ' + e(U.timeAgo(c.ultimoContacto)) + (c.intentos > 1 ? ' · ' + c.intentos + ' veces' : '') + '</span>' : '';
    const showRec = ws === 'esperando' || ws === 'no_responde';
    return (
      '<article class="order-card' +
      (ws === 'confirmado' ? ' is-good' : ws === 'cancelado' ? ' is-bad' : '') +
      '">' +
      '<div class="oc-top"><div class="oc-who"><strong>' +
      e(o.fullName || 'Sin nombre') +
      '</strong></div><div class="oc-total">' +
      e(U.money(o.total)) +
      '</div></div>' +
      '<div class="oc-meta muted small">' +
      e(vars.cantidad) +
      e(vars.extras) +
      ' · <span class="mono">' +
      e(o.name) +
      '</span> · ' +
      e(U.timeAgo(o.createdAt)) +
      '</div>' +
      '<div class="oc-addr">' +
      icon('truck') +
      '<span>' +
      e([vars.direccion, o.city, o.province].filter(Boolean).join(', ')) +
      (o.zip ? ' · CP ' + e(o.zip) : '') +
      (o.courierNote && o.courierNote !== '-' ? ' · ' + e(o.courierNote) : '') +
      '</span></div>' +
      '<div class="oc-phone"><span class="mono selectable">' +
      e(o.phone.display || o.phoneRaw || 'Sin teléfono') +
      '</span>' +
      (o.phone.wa && !o.phone.ok ? chip('Revisá el número', 'warn') : '') +
      contacto +
      '</div>' +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      warn +
      (open
        ? '<div class="oc-actions"><div class="row-actions">' +
          waButton(U.waLink(o.phone.wa, ws ? rec : msg), ws ? 'Recordatorio' : 'Pedir confirmación', ws ? 'wa-recordatorio' : 'wa-confirmar', o.key, ws ? 'ghost' : 'wa') +
          (o.warnings.length ? waButton(U.waLink(o.phone.wa, dir), 'Pedir dirección', 'wa-direccion', o.key, 'ghost') : '') +
          '</div><div class="row-actions decide" role="group" aria-label="¿Qué respondió?">' +
          decideBtn('confirmado', 'Confirmó', o, ws, 'good', 'check') +
          decideBtn('no_responde', 'No responde', o, ws, 'warn', 'clock') +
          decideBtn('cancelado', 'Canceló', o, ws, 'bad', 'x') +
          (ws ? '<button class="btn link" data-act="deshacer" data-key="' + e(o.key) + '">Deshacer</button>' : '') +
          '</div></div>'
        : '') +
      '</article>'
    );
  }

  function decideBtn(value, label, o, ws, tone, ic) {
    return '<button class="btn sm decide-btn tone-' + tone + (ws === value ? ' is-on' : '') + '" aria-pressed="' + (ws === value) + '" data-act="marcar" data-estado="' + value + '" data-key="' + e(o.key) + '">' + icon(ic) + e(label) + '</button>';
  }

  function findOrder(key) {
    return Shop.orders.find((o) => o.key === key);
  }

  async function setWA(key, patch) {
    const o = findOrder(key);
    const prev = App.confirm.get(key) || {};
    const next = Object.assign({}, prev, patch, { pedido: o ? o.name : prev.pedido, actualizado: new Date().toISOString() });
    App.confirm.set(key, next);
    App.emit('confirm');
    try {
      await Store.set('confirmaciones/' + key, next);
    } catch (err) {
      storeFail(err);
    }
    return o;
  }

  async function tagShopify(o, estado) {
    if (!App.msgs.etiquetarShopify || !o || Shop.mode !== 'live') return;
    const add = estado === 'confirmado' ? [TAG_OK] : estado === 'cancelado' ? [TAG_NO] : [];
    const remove = [TAG_OK, TAG_NO].filter((t) => !add.includes(t));
    try {
      await Shop.setTags(o, add, remove);
      render();
    } catch (err) {
      const m = err && err.code === 'approval_required' ? 'Shopify pidió tu aprobación para etiquetar el pedido. Aprobalo y volvé a marcarlo.' : 'Quedó marcado en el panel, pero no se pudo etiquetar en Shopify.';
      toast(m, 'warn');
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'conf-filtro') {
      state.filtro = t.dataset.value;
      prefSet('conf-filtro', state.filtro);
      render();
      return;
    }
    const act = t.dataset.act;
    const key = t.dataset.key;
    if (act === 'refrescar' || act === 'reintentar') load(true);
    else if (act === 'permisos') VC.runtime.managePermissions().then((ok) => !ok && toast('Abrí el menú Permisos de esta página para habilitar Shopify.', 'warn'));
    else if (act === 'wa-confirmar' || act === 'wa-recordatorio' || act === 'wa-direccion') {
      // El enlace abre WhatsApp; acá solo registramos que se abrió el chat (después del clic, para no cortar la navegación).
      const prev = App.confirm.get(key) || {};
      setTimeout(
        () =>
          setWA(key, {
            estado: prev.estado === 'confirmado' || prev.estado === 'cancelado' ? prev.estado : 'esperando',
            ultimoContacto: new Date().toISOString(),
            intentos: (prev.intentos || 0) + 1,
          }),
        60
      );
    } else if (act === 'marcar') {
      const estado = t.dataset.estado;
      setWA(key, { estado }).then((o) => tagShopify(o, estado));
      if (estado === 'confirmado') toast('Confirmado. Ya podés despacharlo.', 'good');
    } else if (act === 'deshacer') {
      const o = findOrder(key);
      App.confirm.delete(key);
      App.emit('confirm');
      Store.remove('confirmaciones/' + key).catch(storeFail);
      if (o && o.tags.some((tg) => tg === TAG_OK || tg === TAG_NO)) tagShopify(o, null);
    } else if (act === 'copiar-despacho') copyText(t.dataset.text, t);
  }

  async function onChange(ev) {
    const t = ev.target;
    if (t.id === 'conf-dias') {
      state.dias = Number(t.value);
      prefSet('conf-dias', state.dias);
      load();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      try {
        Shop.importCSV(await VC.ui.readFileText(t.files[0]));
        state.error = null;
        toast('Pedidos importados del CSV.', 'good');
      } catch (err) {
        toast(err.message || 'No se pudo leer el archivo.', 'bad');
      }
      render();
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.confirmar = { mount, render, load };
})(window);
</script>
<script>
/* ui/ganancia.js */
/* 2 · Ganancia real */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, seg, chip, banner, shopStatusBanner, prefGet, prefSet, toast, storeFail, icon, bubble, pageHead, info } = VC.ui;

  const state = {
    rango: prefGet('gan-rango', 'hoy'),
    desde: null,
    hasta: null,
    gastos: {},
    loading: false,
    error: null,
  };

  const PLATAFORMAS = [
    ['tiktok', 'TikTok'],
    ['meta', 'Meta'],
    ['otros', 'Otros'],
  ];

  let el;

  function range() {
    const hoy = U.todayKeyAR();
    switch (state.rango) {
      case 'ayer':
        return [U.addDays(hoy, -1), U.addDays(hoy, -1)];
      case '7d':
        return [U.addDays(hoy, -6), hoy];
      case 'mes':
        return [hoy.slice(0, 8) + '01', hoy];
      case 'custom':
        return [state.desde || U.addDays(hoy, -6), state.hasta || hoy];
      default:
        return [hoy, hoy];
    }
  }

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead(
        'Ganancia',
        '¿Cuánto te queda de verdad?',
        '<div id="gan-range"></div><button class="btn ghost icon-only" data-act="refrescar" aria-label="Actualizar pedidos" title="Actualizar">' + icon('refresh') + '</button>'
      ) +
      '<div id="gan-dates"></div><div id="gan-status"></div><div id="gan-kpis"></div>' +
      '<div class="grid-2">' +
      '<section class="panel gan-spend" id="gan-spend"><div class="panel-head"><div class="panel-title">' +
      bubble('trending', 'peach') +
      '<h3>Gasto en anuncios</h3>' +
      info('Copiá lo que gastaste cada día en cada plataforma, en pesos. Se guarda solo.') +
      '</div></div><div id="gan-be"></div><div id="gan-spend-rows"></div></section>' +
      '<section class="panel" id="gan-break"></section></div>' +
      '<section class="panel" id="gan-chart"></section><section class="panel" id="gan-sources"></section>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('input', onInput);
    Shop.onChange(renderAll);
    App.on((w) => (w === 'cfg' || w === 'confirm') && renderAll());
    Store.watch(
      'gastos',
      (m) => {
        const g = {};
        for (const [k, v] of m) g[k] = v;
        state.gastos = g;
        renderAll(true);
      },
      () => {}
    );
    load();
  }

  async function load(fresh) {
    const [from] = range();
    state.loading = true;
    state.error = null;
    renderAll();
    try {
      await Shop.ensure(from, { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    renderAll();
  }

  function periodo(from, to) {
    if (from === to) return U.fmtDay(from, true);
    return U.fmtDay(from) + ' al ' + U.fmtDay(to);
  }

  function renderAll(keepInputs) {
    if (!el) return;
    const [from, to] = range();
    $('#gan-range', el).innerHTML = seg(
      'gan-rango',
      [
        { value: 'hoy', label: 'Hoy' },
        { value: 'ayer', label: 'Ayer' },
        { value: '7d', label: '7 días' },
        { value: 'mes', label: 'Este mes' },
        { value: 'custom', label: 'Fechas' },
      ],
      state.rango
    );
    const dates = $('#gan-dates', el);
    if (state.rango === 'custom') {
      if (!dates.querySelector('#gan-desde'))
        dates.innerHTML =
          '<div class="dates gan-dates"><label for="gan-desde">Desde <input type="date" id="gan-desde" value="' +
          from +
          '"></label><label for="gan-hasta">Hasta <input type="date" id="gan-hasta" value="' +
          to +
          '"></label></div>';
    } else dates.innerHTML = '';

    const statusEl = $('#gan-status', el);
    const notes = [];
    if (Shop.mode === 'none') notes.push(shopStatusBanner({ message: 'Abrí el panel desde claude.ai para ver tus pedidos, o importá el CSV de Shopify.' }));
    else if (state.error) notes.push(shopStatusBanner(state.error));
    if (!P.costsReady(App.cfg)) notes.push(banner('warn', '<strong>Faltan tus costos.</strong> Sin ellos la ganancia no es real.', '<button class="btn" data-goto="ajustes">Cargar costos</button>'));
    statusEl.innerHTML = notes.join('');

    const rates = O.historicalRates(Shop.orders);
    const res = P.computeProfit({ orders: Shop.orders, gastos: state.gastos, cfg: App.cfg, rates, confirm: App.confirmStates(), from, to });
    const be = P.breakEven(App.cfg, rates);
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;

    renderKpis(res, be, rates, from, to, loadingFirst);
    renderBE(res, be);
    if (!keepInputs || !el.querySelector('#gan-spend-rows input:focus')) renderSpend(res);
    renderBreak(res);
    renderChart(res);
    renderSources(res);
  }

  function kpiCard(ic, tone, label, value, sub, valueTone, extra) {
    return (
      '<div class="gk' +
      (valueTone ? ' is-' + valueTone : '') +
      '">' +
      bubble(ic, tone) +
      '<span class="gk-label">' +
      e(label) +
      (extra || '') +
      '</span><span class="gk-value">' +
      value +
      '</span><span class="gk-sub">' +
      sub +
      '</span></div>'
    );
  }

  function proyeccion(res, rates) {
    const r = res.rates;
    const origen = (o, n, que) => (o === 'historico' ? 'según tu historial, ' + n + ' ' + que : o === 'manual' ? 'cargada por vos' : 'estimada, sin historial');
    return (
      'Los pedidos sin entregar se proyectan: de cada 100 se despachan <strong>' +
      Math.round(r.confirmacion * 100) +
      '</strong> (' +
      e(origen(r.origenConfirmacion, rates.muestraConfirmacion, 'pedidos')) +
      ') y de esos se entregan <strong>' +
      Math.round(r.entrega * 100) +
      '</strong> (' +
      e(origen(r.origenEntrega, rates.muestraEntrega, 'envíos')) +
      '). Los confirmados por WhatsApp cuentan como despachados. Las tasas se cambian en Ajustes.<br><br>Ya cobrado, menos gastos: <strong>' +
      e(U.money(res.total.asegurado.ganancia)) +
      '</strong>.'
    );
  }

  function renderKpis(res, be, rates, from, to, loadingFirst) {
    const box = $('#gan-kpis', el);
    if (loadingFirst) {
      box.innerHTML = '<div class="gan-kpis"><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div></div>';
      return;
    }
    const t = res.total;
    const costos = P.costsReady(App.cfg);
    const pedidosSub = [
      t.entregados ? t.entregados + (t.entregados === 1 ? ' entregado' : ' entregados') : '',
      t.abiertos ? t.abiertos + (t.abiertos === 1 ? ' abierto' : ' abiertos') : '',
      t.anulados ? t.anulados + (t.anulados === 1 ? ' anulado' : ' anulados') : '',
      t.devueltos ? t.devueltos + (t.devueltos === 1 ? ' devuelto' : ' devueltos') : '',
    ]
      .filter(Boolean)
      .slice(0, 2)
      .join(' · ');
    const eqEntrega = be && be.cpaEntregaEquilibrio > 0 ? be.cpaEntregaEquilibrio : null;
    box.innerHTML =
      '<div class="gan-kpis">' +
      kpiCard(
        'wallet',
        !costos ? '' : t.ganancia >= 0 ? 'good' : 'bad',
        'Ganancia estimada',
        e(U.money(t.ganancia)),
        e(periodo(from, to)),
        !costos ? '' : t.ganancia >= 0 ? 'good' : 'bad',
        info(proyeccion(res, rates), 'Cómo se calcula')
      ) +
      kpiCard('trending', 'peach', 'Anuncios', e(U.money(t.ads)), t.roas != null ? 'ROAS ' + e(t.roas.toFixed(2).replace('.', ',')) : t.pedidos ? 'Sin cargar' : 'Sin gasto') +
      kpiCard('box', '', 'Pedidos', e(U.int(t.pedidos)), e(pedidosSub || 'Sin pedidos')) +
      kpiCard(
        'truck',
        'source',
        'Costo por entrega',
        t.cpaEntrega != null ? e(U.money(t.cpaEntrega)) : '—',
        eqEntrega ? 'Máximo ' + e(U.money(eqEntrega)) : 'Sin datos',
        t.cpaEntrega != null && eqEntrega ? (t.cpaEntrega <= eqEntrega ? 'good' : 'bad') : ''
      ) +
      '</div>';
  }

  // Cuánto se puede pagar por pedido en TikTok o Meta
  function renderBE(res, be) {
    const box = $('#gan-be', el);
    const t = res.total;
    if (!be) {
      box.innerHTML = '<p class="note">' + icon('clock') + ' Cuando tengas entregas, te digo cuánto podés pagar por pedido.</p>';
      return;
    }
    if (!P.costsReady(App.cfg)) {
      box.innerHTML = '';
      return;
    }
    if (be.cpaEquilibrio <= 0) {
      box.innerHTML = banner('bad', 'Con estos costos cada pedido pierde plata aun sin anuncios.', '<button class="btn ghost sm" data-goto="ajustes">Revisar costos</button>');
      return;
    }
    const ahora = t.cpaPedido != null && t.ads > 0 ? t.cpaPedido : null;
    box.innerHTML =
      '<div class="gan-be"><span class="gb-label">Podés pagar hasta</span><span class="gb-num">' +
      e(U.money(be.cpaEquilibrio)) +
      '</span><span class="gb-sub">por pedido sin perder plata ' +
      info(
        'Para quedarte con un 30% de margen: <strong>' +
          e(U.money(be.cpaObjetivo)) +
          '</strong> por pedido.<br><br>Ticket promedio ' +
          e(U.money(be.ticket)) +
          ', ' +
          e(be.unidades.toFixed(1).replace('.', ',')) +
          ' unidades por pedido. Cada entrega te deja ' +
          e(U.money(be.margenEntrega)) +
          ' antes de anuncios.',
        'Cómo se calcula'
      ) +
      '</span>' +
      (ahora != null
        ? '<span class="gb-now">' +
          chip('Estás pagando ' + U.money(ahora), ahora <= be.cpaEquilibrio ? 'good' : 'bad') +
          '</span>'
        : '') +
      '</div>';
  }

  function renderSpend(res) {
    const days = res.days.slice().reverse();
    const many = days.length > 31;
    const rows = (many ? days.slice(0, 31) : days)
      .map((d) => {
        const g = state.gastos[d.day] || {};
        const inp = (k, label) =>
          '<input type="text" inputmode="numeric" class="num-input" id="gasto-' +
          d.day +
          '-' +
          k +
          '" data-day="' +
          d.day +
          '" data-k="' +
          k +
          '" value="' +
          (g[k] ? e(U.int(g[k])) : '') +
          '" placeholder="' +
          label +
          '" aria-label="Gasto en ' +
          label +
          ' el ' +
          e(U.fmtDay(d.day)) +
          '">';
        return (
          '<div class="sp-row"><span class="sp-day">' +
          e(U.fmtDay(d.day, true)) +
          '</span><span class="sp-ins">' +
          PLATAFORMAS.map(([k, label]) => inp(k, label)).join('') +
          '</span><span class="sp-gan mono ' +
          (d.ganancia >= 0 ? 'pos' : 'neg') +
          '" title="Ganancia del día">' +
          e(U.moneyShort(d.ganancia)) +
          '</span></div>'
        );
      })
      .join('');
    $('#gan-spend-rows', el).innerHTML =
      '<div class="sp-list"><div class="sp-row sp-headrow" aria-hidden="true"><span class="sp-day">Día</span><span class="sp-ins">' +
      PLATAFORMAS.map(([, label]) => '<span>' + label + '</span>').join('') +
      '</span><span class="sp-gan">Ganancia</span></div>' +
      rows +
      '</div>' +
      (many ? '<p class="note">Se ven los últimos 31 días.</p>' : '');
  }

  function renderBreak(res) {
    const t = res.total;
    const items = [
      ['Ventas esperadas', t.ventas, 'base'],
      ['Producto', -t.producto],
      ['Envíos', -t.envios],
      ['Devoluciones', -t.devoluciones],
      ['Comisión', -t.comisiones],
      ['Otros por pedido', -t.otros],
      ['Costos fijos', -t.fijos],
      ['Anuncios', -t.ads],
    ].filter((x) => x[2] === 'base' || Math.round(x[1]) !== 0);
    const max = Math.max(1, t.ventas, Math.abs(t.ganancia));
    const bar = (v, cls) => '<span class="wf-bar ' + cls + '" style="width:' + Math.max(1, (Math.abs(v) / max) * 100).toFixed(1) + '%"></span>';
    const list = items
      .map((x) => '<li><span class="wf-label">' + e(x[0]) + '</span><span class="wf-track">' + bar(x[1], x[2] === 'base' ? 'base' : 'cost') + '</span><span class="wf-val mono">' + e(U.money(x[1])) + '</span></li>')
      .join('');
    const g =
      '<li class="wf-total"><span class="wf-label">Ganancia</span><span class="wf-track">' +
      bar(t.ganancia, t.ganancia >= 0 ? 'pos' : 'neg') +
      '</span><span class="wf-val mono ' +
      (t.ganancia >= 0 ? 'pos' : 'neg') +
      '">' +
      e(U.money(t.ganancia)) +
      '</span></li>';
    $('#gan-break', el).innerHTML =
      '<div class="panel-head"><div class="panel-title">' +
      bubble('wallet', 'good') +
      '<h3>De dónde sale la ganancia</h3>' +
      info('Ventas esperadas: lo que vas a cobrar de los pedidos del período, contando los que todavía no se entregaron según tus tasas. Abajo, todo lo que se resta.') +
      '</div></div><ul class="waterfall">' +
      list +
      g +
      '</ul>';
  }

  function renderChart(res) {
    const box = $('#gan-chart', el);
    if (res.days.length < 2) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    const vals = res.days.map((d) => d.ganancia);
    const maxAbs = Math.max(1, ...vals.map(Math.abs));
    const hasNeg = vals.some((v) => v < 0);
    const W = Math.max(300, Math.floor(box.clientWidth) - 34, res.days.length * 28);
    const H = 190;
    const pad = { t: 18, b: hasNeg ? 42 : 26, l: 8, r: 8 };
    const hasPos = vals.some((v) => v > 0);
    const zeroY = hasNeg && hasPos ? pad.t + ((H - pad.t - pad.b) * maxPos(vals)) / (maxPos(vals) + maxNeg(vals)) : hasNeg ? pad.t : H - pad.b;
    const scale = (H - pad.t - pad.b) / (hasNeg && hasPos ? maxPos(vals) + maxNeg(vals) : maxAbs);
    const bw = (W - pad.l - pad.r) / res.days.length;
    const iMax = vals.indexOf(Math.max(...vals));
    const iMin = vals.indexOf(Math.min(...vals));
    let bars = '';
    res.days.forEach((d, i) => {
      const v = d.ganancia;
      const h = Math.max(1, Math.abs(v) * scale);
      const x = pad.l + i * bw + bw * 0.18;
      const y = v >= 0 ? zeroY - h : zeroY;
      const w = bw * 0.64;
      bars +=
        '<g class="bar-g"><rect class="hit" x="' +
        (pad.l + i * bw) +
        '" y="0" width="' +
        bw +
        '" height="' +
        H +
        '"></rect><rect class="' +
        (v >= 0 ? 'bar-pos' : 'bar-neg') +
        '" x="' +
        x.toFixed(1) +
        '" y="' +
        y.toFixed(1) +
        '" width="' +
        w.toFixed(1) +
        '" height="' +
        h.toFixed(1) +
        '" rx="4"></rect><title>' +
        e(U.fmtDay(d.day, true) + ': ' + U.money(v) + ' · ' + d.pedidos + ' pedidos · anuncios ' + U.money(d.ads)) +
        '</title></g>';
      if ((i === iMax && v > 0) || (i === iMin && v < 0)) {
        const ly = v >= 0 ? y - 5 : y + h + 12;
        bars += '<text class="bar-label" x="' + (x + w / 2).toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle">' + e(U.moneyShort(v)) + '</text>';
      }
      const step = Math.ceil(res.days.length / 10);
      if (i % step === 0 || i === res.days.length - 1) bars += '<text class="axis-label" x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + e(U.fmtDay(d.day)) + '</text>';
    });
    box.innerHTML =
      '<div class="panel-head"><div class="panel-title">' +
      bubble('chart') +
      '<h3>Ganancia por día</h3></div></div><div class="chart-wrap"><svg class="chart" viewBox="0 0 ' +
      W +
      ' ' +
      H +
      '" width="' +
      W +
      '" height="' +
      H +
      '" role="img" aria-label="Ganancia estimada por día"><line class="zero" x1="' +
      pad.l +
      '" x2="' +
      (W - pad.r) +
      '" y1="' +
      zeroY.toFixed(1) +
      '" y2="' +
      zeroY.toFixed(1) +
      '"></line>' +
      bars +
      '</svg></div>';
  }

  function maxPos(v) {
    return Math.max(0, ...v);
  }
  function maxNeg(v) {
    return Math.max(0, ...v.map((x) => -x));
  }

  function renderSources(res) {
    const box = $('#gan-sources', el);
    const rows = res.sources.filter((s) => s.pedidos || s.ads);
    const head =
      '<div class="panel-head"><div class="panel-title">' +
      bubble('grid', 'source') +
      '<h3>Por plataforma</h3>' +
      info('Según la UTM que trae cada pedido. El gasto de “Otros” no se asigna a ninguna plataforma.') +
      '</div></div>';
    if (!rows.length) {
      box.innerHTML = head + '<p class="note">Sin pedidos en estas fechas.</p>';
      return;
    }
    box.innerHTML =
      head +
      '<div class="table-wrap"><table class="table gan-src"><thead><tr><th>Plataforma</th><th class="num">Pedidos</th><th class="num hide-sm">Anulados</th><th class="num hide-sm">Ventas</th><th class="num hide-sm">Anuncios</th><th class="num">Ganancia</th><th class="num">ROAS</th></tr></thead><tbody>' +
      rows
        .map(
          (s) =>
            '<tr><th scope="row">' +
            e(O.SOURCES[s.source] || s.source) +
            '</th><td class="num">' +
            s.pedidos +
            '</td><td class="num hide-sm">' +
            s.anulados +
            '</td><td class="num hide-sm">' +
            e(U.money(s.ventas)) +
            '</td><td class="num hide-sm">' +
            e(U.money(s.ads)) +
            '</td><td class="num ' +
            (s.ganancia - s.fijos >= 0 ? 'pos' : 'neg') +
            '">' +
            e(U.money(s.ganancia)) +
            '</td><td class="num">' +
            (s.roas != null ? e(s.roas.toFixed(2).replace('.', ',')) : '—') +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div>';
  }

  const saveSpend = {};
  function onInput(ev) {
    const t = ev.target;
    if (!t.dataset.day) return;
    const day = t.dataset.day;
    clearTimeout(saveSpend[day]);
    saveSpend[day] = setTimeout(() => {
      const row = {};
      for (const [k] of PLATAFORMAS) {
        const inp = el.querySelector('#gasto-' + day + '-' + k);
        row[k] = inp ? U.parseMoney(inp.value) || 0 : 0;
      }
      state.gastos[day] = row;
      Store.set('gastos/' + day, row).catch(storeFail);
      renderAll(true);
    }, 600);
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.id === 'gan-desde' || t.id === 'gan-hasta') {
      state.desde = $('#gan-desde', el).value;
      state.hasta = $('#gan-hasta', el).value;
      if (state.desde > state.hasta) {
        [state.desde, state.hasta] = [state.hasta, state.desde];
        $('#gan-desde', el).value = state.desde;
        $('#gan-hasta', el).value = state.hasta;
      }
      load();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      VC.ui
        .readFileText(t.files[0])
        .then((txt) => {
          Shop.importCSV(txt);
          state.error = null;
          toast('Pedidos importados del CSV.', 'good');
          renderAll();
        })
        .catch((err) => toast(err.message || 'No se pudo leer el archivo.', 'bad'));
    } else if (t.dataset.day) {
      const v = U.parseMoney(t.value);
      t.value = v ? U.int(v) : '';
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'gan-rango') {
      state.rango = t.dataset.value;
      prefSet('gan-rango', state.rango);
      load();
    } else if (t.dataset.act === 'refrescar' || t.dataset.act === 'reintentar') load(true);
    else if (t.dataset.act === 'permisos') VC.runtime.managePermissions();
  }

  VC.tools = VC.tools || {};
  VC.tools.ganancia = { mount, render: renderAll, load };
})(window);
</script>
<script>
/* ui/creativos.js */
/* 3 · Analizador de creativos (reportes de TikTok Ads y Meta Ads) */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const A = VC.ads;
  const P = VC.profit;
  const O = VC.orders;
  const { Store, Shop, AI } = VC.runtime;
  const { e, $, $$, App, chip, banner, toast, copyText, storeFail, icon, bubble, pageHead, info, more } = VC.ui;

  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  const EJEMPLO = [
    'Ad name,Cost,Impressions,Clicks (destination),Complete payment,2-second video views,Video views at 100%',
    'EJEMPLO dolor_confesion_v1,84000,31000,620,9,10500,1400',
    'EJEMPLO dolor_pregunta_v2,52000,22000,350,4,6900,800',
    'EJEMPLO medico_kinesiologa_v1,61000,26000,410,3,7800,1100',
    'EJEMPLO estetica_remera_v1,48000,24000,190,0,4100,300',
    'EJEMPLO gym_press_v1,39000,15000,240,1,5200,500',
    'EJEMPLO gym_espejo_v2,12000,5200,40,0,700,60',
    'EJEMPLO dolor_demo_v3,9000,4100,70,0,1600,210',
  ].join('\n');

  const state = {
    file: null,
    headers: [],
    rows: [],
    map: {},
    plataforma: null,
    ads: [],
    overrides: {},
    cpaMax: null,
    ejemplo: false,
    filtro: null,
    ia: { running: false, text: '', error: '' },
  };
  let el;
  let ctl;

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead('Creativos', 'Subí el reporte y te digo qué apagar y qué escalar.') +
      '<div id="cr-drop"></div><div id="cr-body"></div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('dragover', (ev) => {
      if (ev.target.closest('.dropzone')) {
        ev.preventDefault();
        ev.target.closest('.dropzone').classList.add('is-over');
      }
    });
    el.addEventListener('dragleave', (ev) => ev.target.closest('.dropzone') && ev.target.closest('.dropzone').classList.remove('is-over'));
    el.addEventListener('drop', (ev) => {
      const dz = ev.target.closest('.dropzone');
      if (!dz) return;
      ev.preventDefault();
      dz.classList.remove('is-over');
      if (ev.dataTransfer.files[0]) loadFile(ev.dataTransfer.files[0]);
    });
    Store.get('creativos/angulos').then((d) => {
      state.overrides = (d && d.map) || {};
      render();
    });
    App.on((w) => w === 'cfg' && render());
    Shop.onChange(() => state.rows.length && render());
    render();
  }

  function suggestedCpa() {
    const manual = P.normalizeCfg(App.cfg).cpaMaxManual;
    if (manual > 0) return { value: manual, origen: 'Ajustes' };
    const be = P.breakEven(App.cfg, O.historicalRates(Shop.orders));
    if (be && P.costsReady(App.cfg) && be.cpaEquilibrio > 0) return { value: Math.round(be.cpaEquilibrio), origen: 'Ganancia real' };
    return { value: null, origen: null };
  }

  function angleOf(a) {
    return state.overrides[a.nombre] || A.detectAngle(a.nombre);
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (root.XLSX) return resolve();
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('No se pudo cargar el lector de Excel. Exportá el reporte como CSV.'));
      document.head.appendChild(s);
    });
  }

  async function loadFile(file) {
    try {
      let headers;
      let rows;
      if (/\.(xlsx|xls)$/i.test(file.name)) {
        await loadScript(XLSX_URL);
        const wb = root.XLSX.read(await file.arrayBuffer(), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const matrix = root.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
        const hi = matrix.findIndex((r) => r.filter((c) => String(c).trim()).length >= 3);
        headers = (matrix[hi] || []).map((h) => String(h).trim());
        rows = matrix.slice(hi + 1).map((r) => {
          const o = {};
          headers.forEach((h, i) => (o[h] = r[i] == null ? '' : r[i]));
          return o;
        });
      } else {
        const parsed = U.parseCSV(await VC.ui.readFileText(file));
        headers = parsed.headers;
        rows = parsed.rows;
      }
      setData(file.name, headers, rows, false);
    } catch (err) {
      toast(err.message || 'No se pudo leer el archivo.', 'bad');
    }
  }

  function setData(name, headers, rows, ejemplo) {
    state.file = name;
    state.headers = headers;
    state.rows = rows;
    state.map = A.detectMapping(headers);
    state.plataforma = A.detectPlatform(headers);
    state.ejemplo = ejemplo;
    state.filtro = null;
    state.ia = { running: false, text: '', error: '' };
    recompute();
    if (!state.map.nombre || !state.map.gasto) toast('Faltan columnas: revisalas en “Columnas detectadas”.', 'warn');
    else saveSummary();
  }

  function recompute() {
    state.ads = state.map.nombre ? A.aggregate(state.rows, state.map) : [];
    render();
  }

  function cpaMax() {
    return state.cpaMax != null ? state.cpaMax : suggestedCpa().value;
  }

  function analysis() {
    const max = cpaMax();
    const ads = state.ads.map((a) => Object.assign({}, a, { angulo: angleOf(a), decision: A.decide(a, max) }));
    ads.sort((x, y) => A.ACCIONES[x.decision.accion].orden - A.ACCIONES[y.decision.accion].orden || y.gasto - x.gasto);
    const angles = A.byAngle(state.ads, angleOf);
    return { ads, angles, ganador: A.winner(angles), max };
  }

  function angleLabel(k) {
    return (A.ANGLES[k] && A.ANGLES[k].label) || 'Sin ángulo';
  }

  const ACC_ICON = { escalar: 'trending', mantener: 'check', revisar: 'refresh', esperar: 'clock', apagar: 'stop', sin_cpa: 'info' };

  function exportHelp() {
    return (
      '<div class="cr-howto"><div><h4>TikTok Ads</h4><ol class="steps"><li>Campañas → pestaña <strong>Anuncios</strong>.</li><li>Rango: últimos 3 a 7 días.</li><li>Columnas: costo, impresiones, clics, pagos completados y vistas de 2 s y al 100%.</li><li>Exportar → CSV o Excel.</li></ol></div>' +
      '<div><h4>Meta Ads</h4><ol class="steps"><li>Administrador → pestaña <strong>Anuncios</strong>.</li><li>Elegí el rango de fechas.</li><li>Columnas: importe gastado, impresiones, clics en el enlace, compras, vistas de 3 s y ThruPlays.</li><li>Informes → Exportar → CSV.</li></ol></div></div>' +
      '<p class="note">Poné el ángulo en el nombre del anuncio y lo detecto solo: <span class="mono">dolor</span>, <span class="mono">medico</span>, <span class="mono">estetica</span> o <span class="mono">gym</span>.</p>'
    );
  }

  // Ids de los <details> abiertos, para no cerrarlos al redibujar
  function openIds(box) {
    return $$('details[id][open]', box).map((d) => d.id);
  }

  function reopen(box, ids) {
    for (const id of ids) {
      const d = box.querySelector('#' + id);
      if (d) d.open = true;
    }
  }

  // Si un "change" llega mientras se redibuja (al sacar un campo con foco), se redibuja después
  let dibujando = false;
  let otraVez = false;

  function render() {
    if (!el) return;
    if (dibujando) {
      otraVez = true;
      return;
    }
    dibujando = true;
    try {
      dibujar();
    } finally {
      dibujando = false;
    }
    if (otraVez) {
      otraVez = false;
      setTimeout(render, 0);
    }
  }

  function dibujar() {
    const drop = $('#cr-drop', el);
    const body = $('#cr-body', el);
    if (!state.file) {
      drop.innerHTML =
        '<label class="dropzone cr-drop" for="cr-file"><input type="file" id="cr-file" accept=".csv,.xlsx,.xls,text/csv">' +
        bubble('upload') +
        '<span class="dz-title">Soltá el reporte acá</span><span class="dz-sub">o tocá para elegirlo · CSV o Excel de TikTok o Meta</span></label>';
      body.innerHTML =
        '<div class="row-actions cr-start"><button class="btn soft" data-act="ejemplo">' +
        icon('play') +
        'Ver un ejemplo</button></div>' +
        more('Cómo exportar el reporte', exportHelp(), 'cr-howto');
      return;
    }
    const keep = openIds(el);
    const sug = suggestedCpa();
    const an = analysis();
    const counts = {};
    for (const a of an.ads) counts[a.decision.accion] = (counts[a.decision.accion] || 0) + 1;
    if (state.filtro && !counts[state.filtro]) state.filtro = null;
    const plat = state.plataforma === 'tiktok' ? 'TikTok' : state.plataforma === 'meta' ? 'Meta' : 'Otra plataforma';
    const faltaCol = !state.map.nombre || !state.map.gasto;

    // Barra del reporte: archivo (se puede cambiar o soltar otro), CPA máximo y columnas
    let cpaHint = '';
    if (sug.value && state.cpaMax != null && state.cpaMax !== sug.value) cpaHint = '<button class="btn link" data-act="cpa-sugerido">Usar ' + e(U.money(sug.value)) + '</button>';
    else if (sug.origen && state.cpaMax == null) cpaHint = '<span class="muted small">de ' + e(sug.origen) + '</span>';
    drop.innerHTML =
      '<section class="panel cr-bar"><div class="cr-bar-row"><label class="dropzone is-compact cr-file" for="cr-file"><input type="file" id="cr-file" accept=".csv,.xlsx,.xls,text/csv">' +
      bubble('upload') +
      '<span class="cr-file-txt"><span class="dz-title">' +
      e(state.file) +
      (state.ejemplo ? ' ' + chip('Ejemplo', 'peach') : '') +
      '</span><span class="dz-sub">' +
      e(plat + ' · ' + an.ads.length + (an.ads.length === 1 ? ' anuncio' : ' anuncios')) +
      ' · <span class="cr-change">Cambiar</span></span></span></label><div class="cr-cpa"><span class="cr-cpa-label"><label for="cr-cpa">CPA máximo</label>' +
      info('Lo máximo que podés pagar en anuncios por pedido sin perder plata. Ya descuenta los pedidos que se anulan y los que vuelven: la plataforma cuenta el pedido, no la entrega.') +
      '</span><input type="text" inputmode="numeric" id="cr-cpa" class="num-input" value="' +
      (an.max ? e(U.int(an.max)) : '') +
      '" placeholder="25.000">' +
      cpaHint +
      '</div></div>' +
      more('Columnas detectadas', colsHtml(), 'cr-cols') +
      '</section>';
    if (faltaCol) {
      const d = $('#cr-cols', drop);
      if (d) d.open = true;
    }

    if (faltaCol) {
      body.innerHTML = banner('bad', 'No encontré la columna del <strong>nombre</strong> o del <strong>gasto</strong>. Elegila en “Columnas detectadas”.');
      reopen(el, keep);
      return;
    }
    let html = '';
    if (!state.map.compras) html += banner('warn', 'No hay columna de compras: decido solo por CTR y retención.');
    if (!an.max) html += banner('warn', 'Falta tu <strong>CPA máximo</strong> para decidir.', '<button class="btn" data-goto="ajustes">Cargar costos</button>');

    // Cuántos anuncios van a cada acción (tocar una tarjeta filtra la lista)
    if (an.max && an.ads.length) {
      html +=
        '<div class="cr-tiles" role="group" aria-label="Filtrar por acción">' +
        ['escalar', 'mantener', 'revisar', 'esperar', 'apagar']
          .map((k) => {
            const acc = A.ACCIONES[k];
            const on = state.filtro === k;
            return (
              '<button type="button" class="cr-tile tone-' +
              acc.tone +
              (on ? ' is-on' : '') +
              (counts[k] ? '' : ' is-zero') +
              '" data-act="filtro" data-v="' +
              k +
              '" aria-pressed="' +
              on +
              '"' +
              (counts[k] ? '' : ' disabled') +
              '><span class="cr-tile-n">' +
              (counts[k] || 0) +
              '</span><span class="cr-tile-l">' +
              icon(ACC_ICON[k]) +
              e(acc.label) +
              '</span></button>'
            );
          })
          .join('') +
        '</div>';
    }

    // Ángulos
    const g = an.ganador;
    let winTxt = '<span class="muted">Todavía no hay datos para elegir un ganador.</span>';
    if (g && g.criterio === 'cpa')
      winTxt =
        'Gana <strong>' +
        e(angleLabel(g.angulo)) +
        '</strong>: ' +
        e(U.money(g.cpa)) +
        ' por venta' +
        (g.vsPromedio != null && g.vsPromedio < 0 ? ', ' + e(U.pct(-g.vsPromedio)) + ' más barato' : '') +
        '. Hacé más variantes.';
    else if (g) winTxt = 'Señal temprana: <strong>' + e(angleLabel(g.angulo)) + '</strong> tiene el mejor CTR (' + e(U.pct(g.ctr, 2)) + '), todavía sin ventas.';
    if (an.angles.length) {
      html +=
        '<section class="panel"><div class="panel-head"><div class="panel-title">' +
        bubble('trending', 'good') +
        '<div><h3>Ángulos</h3><p class="small cr-win">' +
        winTxt +
        '</p></div></div>' +
        (g && A.ANGLES[g.angulo] ? '<button class="btn soft sm" data-goto="guiones">' + icon('video') + 'Hacer guiones</button>' : '') +
        '</div><div class="cr-angles">' +
        an.angles
          .map((x) => {
            const win = g && x.angulo === g.angulo;
            return (
              '<article class="cr-angle' +
              (win ? ' is-winner' : '') +
              '"><div class="cr-angle-top"><h4>' +
              e(angleLabel(x.angulo)) +
              '</h4>' +
              (win ? chip('Ganador', 'good') : '<span class="muted small">' + x.anuncios + (x.anuncios === 1 ? ' anuncio' : ' anuncios') + '</span>') +
              '</div><div class="cr-angle-cpa"><span class="cr-big">' +
              e(x.cpa != null ? U.money(x.cpa) : '—') +
              '</span><span class="muted small">por venta</span></div>' +
              nums([
                ['Gasto', U.money(x.gasto)],
                ['Ventas', U.int(x.compras)],
                ['CTR', U.pct(x.ctr, 2)],
                ['Gancho', U.pct(x.hookRate)],
              ]) +
              '</article>'
            );
          })
          .join('') +
        '</div></section>';
    }

    // Anuncios
    const lista = state.filtro ? an.ads.filter((a) => a.decision.accion === state.filtro) : an.ads;
    const angKeys = Object.keys(A.ANGLES).concat('otro');
    html +=
      '<section class="panel"><div class="panel-head"><div class="panel-title">' +
      bubble('grid') +
      '<h3>' +
      (state.filtro ? e(A.ACCIONES[state.filtro].label) : 'Cada anuncio') +
      '</h3>' +
      chip(String(lista.length), 'neutral') +
      '</div>' +
      (state.filtro ? '<button class="btn link" data-act="filtro" data-v="">Ver todos</button>' : '') +
      '</div>' +
      (lista.length
        ? '<ul class="cr-ads">' +
          lista
            .map((a) => {
              const acc = A.ACCIONES[a.decision.accion];
              const i = an.ads.indexOf(a);
              return (
                '<li class="cr-ad tone-' +
                acc.tone +
                '"><div class="cr-ad-main"><div class="cr-ad-head">' +
                chip(acc.label, acc.tone) +
                '<span class="ad-name">' +
                e(a.nombre) +
                '</span></div>' +
                (a.decision.accion !== 'sin_cpa' ? '<p class="ad-why">' + e(a.decision.motivo) + '</p>' : '') +
                '<label class="cr-ad-ang" for="ang-' +
                i +
                '">Ángulo<select id="ang-' +
                i +
                '" class="mini-select" data-ad="' +
                e(a.nombre) +
                '">' +
                angKeys.map((k) => '<option value="' + k + '"' + (k === a.angulo ? ' selected' : '') + '>' + e(angleLabel(k)) + '</option>').join('') +
                '</select></label></div>' +
                nums([
                  ['Gasto', U.money(a.gasto)],
                  ['Ventas', U.int(a.compras)],
                  ['CPA', a.cpa != null ? U.money(a.cpa) : '—'],
                  ['CTR', U.pct(a.ctr, 2)],
                  ['Gancho', U.pct(a.hookRate)],
                ]) +
                '</li>'
              );
            })
            .join('') +
          '</ul>'
        : '<p class="muted">No hay anuncios para mostrar.</p>') +
      '</section>';

    // Claude
    let iaAct = '';
    if (AI.sample) {
      if (state.ia.running) iaAct = '<button class="btn ghost" data-act="ia-stop">' + icon('stop') + 'Detener</button>';
      else if (state.ia.text) iaAct = '<button class="btn ghost sm" data-act="ia-copiar">' + icon('copy') + '<span class="lbl">Copiar</span></button><button class="btn ghost sm" data-act="ia">' + icon('refresh') + 'De nuevo</button>';
      else iaAct = '<button class="btn" data-act="ia">' + icon('sparkles') + 'Pedir lectura</button>';
    }
    html +=
      '<section class="panel" id="cr-ia"><div class="panel-head"><div class="panel-title">' +
      bubble('sparkles', 'source') +
      '<div><h3>Lectura de Claude</h3>' +
      (state.ia.text || state.ia.running ? '' : '<p class="small muted">Qué está pasando y 5 ganchos nuevos para probar.</p>') +
      '</div></div>' +
      (iaAct ? '<div class="row-actions">' + iaAct + '</div>' : '') +
      '</div>' +
      (AI.sample
        ? state.ia.text || state.ia.running
          ? '<div class="ia-out' + (state.ia.running && !state.ia.text ? ' is-thinking' : '') + '">' + (state.ia.text ? e(state.ia.text) : 'Pensando…') + '</div>'
          : ''
        : '<div class="note">' + icon('sparkles') + ' Necesita Claude. ' + info('Abrí el panel desde claude.ai o la app de Claude para pedirle una lectura del reporte.') + '</div>') +
      (state.ia.error ? '<p class="error-text">' + e(state.ia.error) + '</p>' : '') +
      '</section>';

    body.innerHTML = html;
    reopen(el, keep);
  }

  function nums(list) {
    return '<dl class="cr-nums">' + list.map(([k, v]) => '<div><dt>' + e(k) + '</dt><dd>' + e(v) + '</dd></div>').join('') + '</dl>';
  }

  function colsHtml() {
    const fields = { nombre: 'Nombre del anuncio', gasto: 'Gasto', impresiones: 'Impresiones', clics: 'Clics', compras: 'Compras', valor: 'Valor de compras', hook: 'Vistas de 2-3 s', completas: 'Vistas completas' };
    return (
      '<div class="map-grid">' +
      Object.entries(fields)
        .map(
          ([k, label]) =>
            '<label for="map-' +
            k +
            '">' +
            e(label) +
            '<select id="map-' +
            k +
            '" data-map="' +
            k +
            '"><option value="">(no usar)</option>' +
            state.headers.map((h) => '<option' + (state.map[k] === h ? ' selected' : '') + '>' + e(h) + '</option>').join('') +
            '</select></label>'
        )
        .join('') +
      '</div>'
    );
  }

  // Copia y muestra "Copiado" sin perder el ícono del botón
  function copiar(text, btn) {
    copyText(text).then((ok) => {
      const lbl = btn && btn.querySelector('.lbl');
      if (!ok || !lbl) return;
      if (!lbl.dataset.prev) lbl.dataset.prev = lbl.textContent;
      lbl.textContent = 'Copiado';
      clearTimeout(btn._t);
      btn._t = setTimeout(() => (lbl.textContent = lbl.dataset.prev), 1600);
    });
  }

  function summaryRows(an) {
    return an.angles.map((x) => ({ angulo: x.angulo, gasto: Math.round(x.gasto), compras: x.compras, cpa: x.cpa ? Math.round(x.cpa) : null, ctr: x.ctr, hookRate: x.hookRate }));
  }

  function saveSummary() {
    if (state.ejemplo) return;
    const an = analysis();
    const doc = {
      fecha: new Date().toISOString(),
      archivo: state.file,
      plataforma: state.plataforma,
      cpaMax: an.max || null,
      ganador: an.ganador ? an.ganador.angulo : null,
      angulos: summaryRows(an),
      acciones: an.ads.slice(0, 60).map((a) => ({ nombre: a.nombre, angulo: a.angulo, accion: a.decision.accion, gasto: Math.round(a.gasto), compras: a.compras })),
    };
    App.ultimoAnalisis = doc;
    App.emit('analisis');
    Store.set('creativos/ultimo', doc).catch(storeFail);
  }

  async function askClaude() {
    const an = analysis();
    const ticket = O.historicalRates(Shop.orders).ticketPromedio;
    const tabla = an.ads
      .slice(0, 80)
      .map((a) => [a.nombre, angleLabel(a.angulo), Math.round(a.gasto), a.compras, a.cpa ? Math.round(a.cpa) : '-', U.pct(a.ctr, 2), U.pct(a.hookRate), A.ACCIONES[a.decision.accion].label].join(' | '))
      .join('\n');
    const angs = an.angles.map((x) => [angleLabel(x.angulo), Math.round(x.gasto), x.compras, x.cpa ? Math.round(x.cpa) : '-', U.pct(x.ctr, 2), U.pct(x.hookRate)].join(' | ')).join('\n');
    const prompt = [
      'Sos media buyer de e-commerce en Argentina. La tienda vende un corrector de postura con pago contra entrega' + (ticket ? ' (ticket promedio de los pedidos entregados: ' + U.money(ticket) + ')' : '') + '. Plataforma del reporte: ' + (state.plataforma || 'desconocida') + '.',
      'CPA máximo por pedido para no perder: ' + (an.max ? U.money(an.max) : 'sin dato') + '. La plataforma cuenta pedidos, no entregas.',
      '',
      'ÁNGULOS (ángulo | gasto ARS | ventas | CPA | CTR | gancho 2-3 s):',
      angs,
      '',
      'ANUNCIOS (nombre | ángulo | gasto ARS | ventas | CPA | CTR | gancho | decisión por reglas):',
      tabla,
      '',
      'Respondé en español rioplatense, sin markdown (texto plano con guiones), en este orden y breve:',
      '1. Lectura en 3 líneas: qué está pasando.',
      '2. Si alguna decisión por reglas te parece equivocada, cuál y por qué (si no, decilo).',
      '3. Por qué creés que funciona el mejor ángulo y qué patrón ves en los ganchos que retienen.',
      '4. Cinco ganchos nuevos (primera frase del video, máximo 12 palabras) para testear del ángulo ganador. Sin promesas de cura ni claims médicos.',
      '5. Cómo repartir el presupuesto mañana.',
    ].join('\n');
    ctl = new AbortController();
    state.ia = { running: true, text: '', error: '' };
    render();
    try {
      const res = await AI.sample(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => {
        state.ia.text = text;
        const out = el.querySelector('#cr-ia .ia-out');
        if (out) {
          out.classList.remove('is-thinking');
          out.textContent = text;
        }
      } });
      state.ia.text = res.text + (res.truncated ? '\n\n(La respuesta se cortó por largo.)' : '');
    } catch (err) {
      state.ia.text = err.text || '';
      if (err.code !== 'cancelled') state.ia.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.ia.running = false;
    render();
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    const act = t.dataset.act;
    if (act === 'ejemplo') {
      const p = U.parseCSV(EJEMPLO);
      setData('reporte-ejemplo.csv', p.headers, p.rows, true);
    } else if (act === 'cpa-sugerido') {
      state.cpaMax = null;
      render();
    } else if (act === 'ia') askClaude();
    else if (act === 'ia-stop') ctl && ctl.abort();
    else if (act === 'ia-copiar') copiar(state.ia.text, t);
    else if (act === 'filtro') {
      state.filtro = t.dataset.v && t.dataset.v !== state.filtro ? t.dataset.v : null;
      render();
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.id === 'cr-file' && t.files && t.files[0]) loadFile(t.files[0]);
    else if (t.id === 'cr-cpa') {
      const v = U.parseMoney(t.value);
      state.cpaMax = v > 0 ? v : null;
      render();
      saveSummary();
    } else if (t.dataset.ad) {
      state.overrides[t.dataset.ad] = t.value;
      if (!state.ejemplo) Store.set('creativos/angulos', { map: Object.assign({}, state.overrides) }).catch(storeFail);
      render();
      saveSummary();
    } else if (t.dataset.map) {
      state.map[t.dataset.map] = t.value || undefined;
      recompute();
      saveSummary();
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.creativos = { mount, render };
})(window);
</script>
<script>
/* ui/resenas.js */
/* 4 · Pedidor de reseñas reales */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, chip, waButton, seg, emptyState, shopStatusBanner, toast, copyText, prefGet, prefSet, storeFail, icon, bubble, pageHead, info, more, toggle } = VC.ui;

  const R_ESTADOS = {
    pedida: { label: 'Pedida', tone: 'warn' },
    recordada: { label: 'Recordatorio enviado', tone: 'warn' },
    recibida: { label: 'Recibida', tone: 'good' },
    no: { label: 'No quiere', tone: 'neutral' },
  };
  const HANDLE = 'corrector-postura-viacare';

  const state = { filtro: prefGet('res-filtro', 'pedir'), editing: null, loading: false, error: null };
  let el;

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead(
        'Reseñas',
        'Pedí su opinión a quien ya recibió su pedido.',
        '<button class="btn ghost icon-only" data-act="refrescar" aria-label="Actualizar pedidos" title="Actualizar">' + icon('refresh') + '</button>'
      ) +
      '<div id="res-status"></div><div id="res-summary"></div><div id="res-filters"></div><div id="res-list" class="order-list"></div><section class="panel" id="res-export"></section>' +
      '<div class="res-foot">' +
      more(
        'Opciones',
        '<div class="res-opts"><label class="field-inline" for="res-dias">Pedirla a los <select id="res-dias">' +
          [2, 3, 4, 5, 7, 10].map((d) => '<option value="' + d + '">' + d + ' días</option>').join('') +
          '</select> de entregado</label><button class="btn link" data-goto="ajustes">Editar el mensaje</button></div>',
        'res-opciones'
      ) +
      '</div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('submit', onSubmit);
    Shop.onChange(render);
    App.on((w) => (w === 'resenas' || w === 'msgs') && render());
    load();
  }

  async function load(fresh) {
    state.loading = true;
    state.error = null;
    render();
    try {
      await Shop.ensure(U.addDays(U.todayKeyAR(), -60), { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    render();
  }

  function deliveredAt(o) {
    return o.deliveredAt || o.closedAt || o.shippedAt || o.createdAt;
  }

  function lists() {
    const since = U.addDays(U.todayKeyAR(), -60);
    const entregados = Shop.orders.filter((o) => o.estado === 'entregado' && o.day >= since).sort((a, b) => (deliveredAt(a) < deliveredAt(b) ? 1 : -1));
    const st = (o) => (App.resenas.get(o.key) || {}).estado;
    return {
      pedir: entregados.filter((o) => !st(o)),
      pedidas: entregados.filter((o) => st(o) === 'pedida' || st(o) === 'recordada'),
      recibidas: [...App.resenas.entries()].filter(([, r]) => r.estado === 'recibida').map(([k, r]) => Shop.orders.find((o) => o.key === k) || ghost(k, r)),
      todas: entregados,
    };
  }

  // Reseña guardada de un pedido que ya no está en la lista cargada
  function ghost(key, r) {
    return { key, name: r.pedido || '', fullName: r.cliente || '', firstName: r.cliente || '', city: r.ciudad || '', phone: { wa: '', display: '' }, units: 1, extras: [], total: 0, createdAt: r.pedidaEn || r.actualizado, estado: 'entregado', ghost: true };
  }

  function render() {
    if (!el) return;
    const statusEl = $('#res-status', el);
    if (Shop.mode === 'none') statusEl.innerHTML = shopStatusBanner({ message: 'Abrí el panel desde claude.ai para ver tus pedidos, o importá el CSV de Shopify.' });
    else statusEl.innerHTML = state.error ? shopStatusBanner(state.error) : '';

    const dias = $('#res-dias', el);
    if (dias && document.activeElement !== dias) dias.value = String(Number(App.msgs.diasResena) || 4);

    const L = lists();
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;
    const conPermiso = L.recibidas.filter((o) => (App.resenas.get(o.key) || {}).permiso);
    const conFoto = L.recibidas.filter((o) => (App.resenas.get(o.key) || {}).foto);
    const pedidasTot = [...App.resenas.values()].filter((r) => r.estado !== 'no').length;
    $('#res-summary', el).innerHTML = loadingFirst
      ? '<div class="summary-strip is-loading">Cargando entregas…</div>'
      : '<div class="summary-strip">' +
        stat(L.pedir.length, 'para pedir', L.pedir.length ? 'warn' : '') +
        stat(L.pedidas.length, 'esperando respuesta') +
        stat(L.recibidas.length, conFoto.length ? 'recibidas · ' + conFoto.length + ' con foto' : 'recibidas', L.recibidas.length ? 'good' : '') +
        stat(pedidasTot ? U.pct(L.recibidas.length / pedidasTot) : '—', 'responden') +
        '</div>';

    $('#res-filters', el).innerHTML = seg(
      'res-filtro',
      [
        { value: 'pedir', label: 'Para pedir', count: L.pedir.length },
        { value: 'pedidas', label: 'Pedidas', count: L.pedidas.length },
        { value: 'recibidas', label: 'Recibidas', count: L.recibidas.length },
        { value: 'todas', label: 'Todas', count: L.todas.length },
      ],
      state.filtro
    );

    const list = L[state.filtro] || [];
    const listEl = $('#res-list', el);
    if (loadingFirst) listEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    else if (!list.length) listEl.innerHTML = emptyText(L);
    else listEl.innerHTML = list.map(card).join('');

    renderExport(conPermiso);
  }

  function stat(value, label, tone) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"><span class="stat-value">' + e(value) + '</span><span class="stat-label">' + e(label) + '</span></div>';
  }

  function emptyText(L) {
    const sinEntregas = ['Sin entregas', 'No hubo entregas en los últimos 60 días.', 'box'];
    const m = {
      pedir: L.todas.length ? ['Todo al día', 'Ya les pediste reseña a todos.', 'check'] : sinEntregas,
      pedidas: ['Nadie esperando', 'No hay reseñas pedidas sin respuesta.', 'clock'],
      recibidas: ['Sin reseñas todavía', 'Cuando te respondan, tocá “Cargar reseña”.', 'star'],
      todas: sinEntregas,
    }[state.filtro] || sinEntregas;
    return emptyState(m[0], e(m[1]), '', m[2]);
  }

  function stars(n) {
    let html = '<span class="res-stars" role="img" aria-label="' + n + ' de 5 estrellas">';
    for (let i = 1; i <= 5; i++) html += icon('star', i <= n ? 'is-on' : '');
    return html + '</span>';
  }

  function card(o) {
    const r = App.resenas.get(o.key) || {};
    const vars = O.templateVars(o, App.msgs);
    const dAt = deliveredAt(o);
    const dias = Math.floor(U.hoursSince(dAt) / 24);
    const ideal = Number(App.msgs.diasResena) || 4;
    const st = R_ESTADOS[r.estado];
    const chips = [
      st ? chip(st.label, st.tone) : dias < ideal ? chip('Ideal en ' + (ideal - dias) + (ideal - dias === 1 ? ' día' : ' días'), 'neutral') : '',
      r.foto ? chip('Con foto', 'good') : '',
      r.estado === 'recibida' && !r.permiso ? chip('Sin permiso', 'warn') : '',
    ].join('');
    const meta = [
      o.city ? e(o.city) : '',
      o.name ? '<span class="mono">' + e(o.name) + '</span>' : '',
      o.ghost ? '' : 'entregado ' + e(U.timeAgo(dAt)),
      r.pedidaEn && r.estado !== 'recibida' ? 'pedida ' + e(U.timeAgo(r.pedidaEn)) : '',
    ]
      .filter(Boolean)
      .join(' · ');
    const msg = U.fillTemplate(App.msgs.resena, vars);
    const rec = U.fillTemplate(App.msgs.resenaRecordatorio, vars);
    const editing = state.editing === o.key;
    const k = e(o.key);
    let wa = '';
    if (r.estado !== 'recibida' && !o.ghost) {
      if (!r.estado) wa = waButton(U.waLink(o.phone.wa, msg), 'Pedir reseña', 'wa-resena', o.key, 'wa');
      else if (r.estado === 'pedida') wa = waButton(U.waLink(o.phone.wa, rec), 'Recordatorio', 'wa-recordatorio', o.key, 'wa') + waButton(U.waLink(o.phone.wa, msg), 'Volver a pedir', 'wa-resena', o.key, 'ghost');
      else wa = waButton(U.waLink(o.phone.wa, msg), 'Volver a pedir', 'wa-resena', o.key, 'ghost');
    }
    return (
      '<article class="order-card res-card' +
      (r.estado === 'recibida' ? ' is-good' : '') +
      '"><div class="oc-top"><div class="oc-who"><strong>' +
      e(o.fullName || 'Sin nombre') +
      '</strong></div><div class="chips">' +
      chips +
      '</div></div><div class="oc-meta muted small">' +
      meta +
      '</div>' +
      (r.texto && !editing
        ? '<figure class="res-quote">' +
          stars(Number(r.estrellas) || 5) +
          '<blockquote>“' +
          e(r.texto) +
          '”</blockquote><figcaption>' +
          e([r.nombre, r.ciudad].filter(Boolean).join(', ')) +
          '</figcaption></figure>'
        : '') +
      (editing
        ? form(o, r)
        : '<div class="oc-actions"><div class="row-actions">' +
          wa +
          '</div><div class="row-actions decide"><button class="btn ghost sm" data-act="cargar" data-key="' +
          k +
          '">' +
          icon('star') +
          (r.estado === 'recibida' ? 'Editar reseña' : 'Cargar reseña') +
          '</button>' +
          (r.estado !== 'recibida' && r.estado !== 'no' ? '<button class="btn link" data-act="no-quiere" data-key="' + k + '">No quiere</button>' : '') +
          (r.estado ? '<button class="btn link" data-act="deshacer" data-key="' + k + '">Deshacer</button>' : '') +
          '</div></div>') +
      '</article>'
    );
  }

  function form(o, r) {
    const k = e(o.key);
    const defName = r.nombre || U.firstName(o.firstName) + (o.lastName ? ' ' + U.capitalizeName(o.lastName).charAt(0) + '.' : '');
    const actual = Number(r.estrellas) || 5;
    let picker = '<div class="rv-stars" role="radiogroup" aria-label="Estrellas">';
    // De 5 a 1: con row-reverse se ven de 1 a 5 y el "~" pinta las anteriores
    for (let n = 5; n >= 1; n--)
      picker +=
        '<input type="radio" id="rv-st-' +
        k +
        '-' +
        n +
        '" name="estrellas" value="' +
        n +
        '"' +
        (n === actual ? ' checked' : '') +
        '><label for="rv-st-' +
        k +
        '-' +
        n +
        '" title="' +
        n +
        (n === 1 ? ' estrella' : ' estrellas') +
        '">' +
        icon('star') +
        '<span class="sr-only">' +
        n +
        (n === 1 ? ' estrella' : ' estrellas') +
        '</span></label>';
    picker += '</div>';
    return (
      '<form class="res-form" data-key="' +
      k +
      '"><div class="rf-row"><span class="rf-title">Cargar reseña</span>' +
      picker +
      '</div><label class="rf-field" for="rv-texto-' +
      k +
      '">Lo que escribió<textarea id="rv-texto-' +
      k +
      '" name="texto" rows="3" required placeholder="Copialo tal cual">' +
      e(r.texto || '') +
      '</textarea></label><div class="rf-grid"><label class="rf-field" for="rv-nombre-' +
      k +
      '">Nombre a mostrar<input id="rv-nombre-' +
      k +
      '" name="nombre" value="' +
      e(defName) +
      '"></label><label class="rf-field" for="rv-ciudad-' +
      k +
      '">Ciudad<input id="rv-ciudad-' +
      k +
      '" name="ciudad" value="' +
      e(r.ciudad || o.city || '') +
      '"></label></div><div class="rf-checks">' +
      toggle('rv-foto-' + o.key, !!r.foto, 'Mandó foto', 'name="foto"') +
      toggle('rv-permiso-' + o.key, !!r.permiso, 'Puedo publicarla', 'name="permiso"') +
      '</div><div class="row-actions"><button class="btn" type="submit">Guardar</button><button class="btn link" type="button" data-act="cancelar-form">Cancelar</button></div></form>'
    );
  }

  function renderExport(list) {
    const box = $('#res-export', el);
    const head = (extra) =>
      '<div class="panel-head"><div class="panel-title">' +
      bubble('upload', 'good') +
      '<h3>Para publicar</h3>' +
      (list.length ? chip(String(list.length), 'good') : '') +
      info('Las reseñas con permiso, en CSV para importar en tu app de reseñas. Revisá que las columnas coincidan. Las fotos las bajás de WhatsApp y las subís a mano.') +
      '</div>' +
      (extra || '') +
      '</div>';
    if (!list.length) {
      box.innerHTML = head() + '<p class="note">Las reseñas con permiso aparecen acá, listas para copiar.</p>';
      delete box.dataset.csv;
      return;
    }
    const rows = list.map((o) => {
      const r = App.resenas.get(o.key);
      const words = String(r.texto || '').split(/\s+/);
      return {
        product_handle: HANDLE,
        rating: r.estrellas || 5,
        title: words.slice(0, 6).join(' ') + (words.length > 6 ? '…' : ''),
        body: r.texto || '',
        reviewer_name: r.nombre || '',
        reviewer_location: r.ciudad || '',
        review_date: (r.actualizado || '').slice(0, 10),
        foto: r.foto ? 'sí' : 'no',
        pedido: r.pedido || o.name,
      };
    });
    const headers = ['product_handle', 'rating', 'title', 'body', 'reviewer_name', 'reviewer_location', 'review_date', 'foto', 'pedido'];
    const csv = U.toCSV(headers, rows);
    const prev = $('#res-csv-more', box);
    const wasOpen = !!(prev && prev.open);
    box.innerHTML =
      head('<button class="btn" data-act="copiar-csv">' + icon('copy') + '<span>Copiar CSV</span></button>') +
      more('Ver el CSV', '<pre class="code-block selectable" id="res-csv">' + e(csv) + '</pre>', 'res-csv-more');
    if (wasOpen) $('#res-csv-more', box).open = true;
    box.dataset.csv = csv;
  }

  async function setR(key, patch) {
    const o = Shop.orders.find((x) => x.key === key);
    const prev = App.resenas.get(key) || {};
    const next = Object.assign({}, prev, patch, { actualizado: new Date().toISOString() });
    if (o) {
      next.pedido = o.name;
      next.cliente = o.fullName;
    }
    App.resenas.set(key, next);
    App.emit('resenas');
    try {
      await Store.set('resenas/' + key, next);
    } catch (err) {
      storeFail(err);
    }
  }

  async function copiarCSV(btn) {
    const ok = await copyText($('#res-export', el).dataset.csv || '');
    const label = btn.querySelector('span');
    if (!ok || !label) return;
    label.textContent = 'Copiado';
    setTimeout(() => (label.textContent = 'Copiar CSV'), 1600);
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'res-filtro') {
      state.filtro = t.dataset.value;
      prefSet('res-filtro', state.filtro);
      render();
      return;
    }
    const key = t.dataset.key;
    switch (t.dataset.act) {
      case 'refrescar':
      case 'reintentar':
        load(true);
        break;
      case 'permisos':
        VC.runtime.managePermissions();
        break;
      case 'wa-resena': {
        const prev = App.resenas.get(key) || {};
        setTimeout(() => setR(key, { estado: prev.estado === 'recibida' ? 'recibida' : 'pedida', pedidaEn: new Date().toISOString() }), 60);
        break;
      }
      case 'wa-recordatorio':
        setTimeout(() => setR(key, { estado: 'recordada', recordadaEn: new Date().toISOString() }), 60);
        break;
      case 'cargar':
        state.editing = key;
        render();
        {
          const ta = el.querySelector('.res-form textarea');
          if (ta) ta.focus();
        }
        break;
      case 'cancelar-form':
        state.editing = null;
        render();
        break;
      case 'no-quiere':
        setR(key, { estado: 'no' });
        break;
      case 'deshacer':
        App.resenas.delete(key);
        App.emit('resenas');
        Store.remove('resenas/' + key).catch(storeFail);
        break;
      case 'copiar-csv':
        copiarCSV(t);
        break;
    }
  }

  function onSubmit(ev) {
    const f = ev.target.closest('.res-form');
    if (!f) return;
    ev.preventDefault();
    const fd = new FormData(f);
    const texto = String(fd.get('texto') || '').trim();
    if (!texto) {
      toast('Escribí lo que te mandó el cliente.', 'warn');
      return;
    }
    setR(f.dataset.key, {
      estado: 'recibida',
      estrellas: Number(fd.get('estrellas')) || 5,
      nombre: String(fd.get('nombre') || '').trim(),
      ciudad: String(fd.get('ciudad') || '').trim(),
      texto,
      foto: fd.get('foto') === 'on',
      permiso: fd.get('permiso') === 'on',
    });
    state.editing = null;
    toast('Reseña guardada.', 'good');
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.id === 'res-dias') {
      App.msgs.diasResena = Number(t.value);
      App.saveMsgs();
      render();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      VC.ui
        .readFileText(t.files[0])
        .then((txt) => {
          Shop.importCSV(txt);
          state.error = null;
          render();
        })
        .catch((err) => toast(err.message || 'No se pudo leer el archivo.', 'bad'));
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.resenas = { mount, render, load };
})(window);
</script>
<script>
/* ui/guiones.js */
/* 5 · Generador de guiones UGC para Flow: tanda automática y "Elegirlo yo" */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const S = VC.scripts;
  const P = VC.autoplan;
  const { Store, AI } = VC.runtime;
  const { e, $, $$, App, chip, toast, copyText, prefGet, prefSet, storeFail, icon, bubble, pageHead, info, more, toggle } = VC.ui;
  const A = VC.auto;

  const CADA = [24, 48, 72];
  const CANCELADO = 'Cancelado.'; // texto que deja VC.auto cuando se detiene una tarea

  const state = {
    opts: Object.assign(
      { angulo: 'dolor', anguloLibre: '', personaje: 'oficinista', personajeLibre: '', genero: 'f', clips: 4, cantidad: 3, idiomaPrompt: 'en', oferta: 'Pagás al recibir. Llevando 2 pagás $ 72.990 en total', extra: '' },
      prefGet('ugc-opts', {})
    ),
    guiones: [],
    origen: null,
    fecha: null,
    running: false,
    streamChars: 0,
    error: '',
  };
  // Tanda automática: último documento guardado, pasos en vivo y si el usuario la dejó en cola
  const auto = { doc: null, cargado: false, pasos: [], pedido: false };
  let abierta = prefGet('ugc-auto-abierta', true);
  let el;
  let ctl;

  const FLOW_TIPS =
    '<ol class="steps ugc-steps"><li>Pegá el prompt del clip 1 y generá 2 o 3 tomas. Quedate con la de mejor cara y voz.</li><li>Para el clip 2 usá <strong>Extend</strong> sobre esa toma (o su último cuadro con <strong>Frames to Video</strong>) y pegá el prompt del clip 2.</li><li>Repetí clip por clip. La ficha va completa en cada prompt para que no cambie la ropa ni el lugar.</li><li>Al subir a TikTok, activá la etiqueta de contenido generado con IA.</li></ol>';

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead('Guiones', 'Videos UGC listos para Flow, clip por clip.') +
      '<section class="panel auto-panel ugc-auto" id="ugc-auto" aria-labelledby="ugc-auto-title"></section><div id="ugc-auto-out"></div>' +
      '<section class="ugc-manual" aria-labelledby="ugc-manual-title"><div class="ugc-manual-head"><h3 id="ugc-manual-title">Elegirlo yo</h3><p class="muted small">Vos elegís el ángulo, el personaje y cuántos.</p></div>' +
      '<form id="ugc-form" class="panel ugc-form"></form><div id="ugc-out"></div></section>' +
      '<div class="ugc-flow">' +
      more('Cómo usarlos en Flow', FLOW_TIPS, 'ugc-flow') +
      '</div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('submit', (ev) => {
      ev.preventDefault();
      generate();
    });
    Store.get('guiones/ultimo').then((d) => {
      if (d && Array.isArray(d.guiones) && !state.guiones.length) {
        state.guiones = S.sanitize(d, d.opts || {});
        state.origen = d.origen;
        state.fecha = d.fecha;
        renderOut();
      }
    });
    App.on((w) => (w === 'analisis' || w === 'msgs') && renderForm());
    if (A) A.on(onAuto);
    if (!auto.cargado) cargarTanda();
    renderAuto();
    renderAutoOut();
    renderForm();
    renderOut();
  }

  function render() {
    renderAuto();
    renderForm();
  }

  /* ---------- Tanda automática: interfaz ---------- */

  function cfgAuto() {
    return Object.assign({}, A ? A.DEFAULTS.guiones : {}, A ? A.cfg.guiones : {});
  }

  function cadaTxt(h) {
    h = Number(h) || 24;
    if (h % 24) return h + ' h';
    return h === 24 ? '1 día' : h / 24 + ' días';
  }

  function renderAuto() {
    const box = el && $('#ugc-auto', el);
    if (!box) return;
    if (!box.dataset.ready) {
      box.innerHTML = '<div id="ugc-auto-head"></div><div id="ugc-auto-prog"></div><div id="ugc-auto-plan"></div>' + (A ? more('Opciones', '<div id="ugc-auto-cfg"></div>', 'ugc-auto-more') : '');
      box.dataset.ready = '1';
    }
    renderAutoHead();
    renderAutoProg();
    renderAutoPlan();
    renderAutoCfg();
  }

  function renderAutoHead() {
    const box = el && $('#ugc-auto-head', el);
    if (!box) return;
    const c = cfgAuto();
    const corriendo = !!A && A.running === 'guiones';
    const otra = A && A.running && !corriendo ? A.NOMBRES[A.running] || A.running : '';
    const est = (A && A.estado.guiones) || {};
    const d = auto.doc;
    let meta;
    if (corriendo) meta = 'Escribiendo la tanda…';
    else if (d && d.fecha) {
      const hace = U.timeAgo(d.fecha);
      meta = (hace === 'recién' ? 'Tanda lista recién' : 'Última tanda ' + hace) + ' · ' + d.guiones.length + (d.guiones.length === 1 ? ' guion' : ' guiones');
    }
    else meta = auto.cargado ? 'Todavía no hay tandas' : 'Buscando la última tanda…';
    let accion = '';
    if (A && AI.sample) {
      accion = corriendo
        ? '<button type="button" class="btn ghost" data-act="tanda-detener">' + icon('stop') + 'Detener</button>'
        : '<button type="button" class="btn" data-act="tanda-generar"' + (auto.pedido ? ' disabled' : '') + '>' + icon('sparkles') + (auto.pedido ? 'En cola…' : 'Generar ahora') + '</button>';
    }
    let estado = '';
    if (!AI.sample)
      estado =
        '<div class="note">' +
        icon('sparkles') +
        ' Necesita Claude. ' +
        info('Los guiones automáticos los escribe Claude: abrí el panel desde claude.ai o la app de Claude. Mientras tanto, en “Elegirlo yo” los armás con plantillas.') +
        '</div>';
    else if (otra) estado = '<p class="note">' + icon('clock') + ' ' + (auto.pedido ? 'En cola: arranca cuando termine la ' + e(otra) + '.' : 'Ahora corre la ' + e(otra) + '. Si tocás “Generar ahora”, queda en cola.') + '</p>';
    else if (!corriendo && est.error === CANCELADO) estado = '<p class="note">' + icon('stop') + ' Cancelaste la última tanda.</p>';
    else if (!corriendo && est.error) estado = '<p class="error-text">La última tanda no terminó: ' + e(est.error) + '</p>';
    box.innerHTML =
      '<div class="ugc-auto-row">' +
      bubble('zap', 'peach') +
      '<div class="ugc-auto-txt"><h3 id="ugc-auto-title">Guiones automáticos</h3><p class="ugc-auto-meta"><span>' +
      e(meta) +
      '</span>' +
      (c.auto ? chip('Solo cada ' + cadaTxt(c.cadaHoras), 'good') : '') +
      '</p></div>' +
      (accion ? '<div class="row-actions">' + accion + '</div>' : '') +
      '</div>' +
      estado;
  }

  const ST = {
    espera: ['en espera', ''],
    curso: ['en curso', ''],
    ok: ['listo', 'ok'],
    error: ['error', 'err'],
  };

  function renderAutoProg() {
    const box = el && $('#ugc-auto-prog', el);
    if (!box) return;
    const corriendo = !!A && A.running === 'guiones';
    const est = (A && A.estado.guiones) || {};
    if (!auto.pasos.length || (!corriendo && (!est.error || est.error === CANCELADO))) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML =
      '<ul class="auto-progress ugc-prog">' +
      auto.pasos
        .map((p) => {
          const st = ST[p.estado] || ST.espera;
          return '<li class="is-' + e(p.estado) + '"><span class="st' + (st[1] ? ' ' + st[1] : '') + '">' + e(st[0]) + '</span><span>' + e(p.label) + (p.det ? ' <span class="muted">· ' + e(p.det) + '</span>' : '') + '</span></li>';
