        if (A && A.running === 'guiones') A.stop();
        break;
      case 'tanda-al-form':
        pasarAlForm();
        break;
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset && t.dataset.cfg && A && t.closest('#ugc-auto-cfg')) {
      const k = t.dataset.cfg;
      A.setCfg('guiones', { [k]: k === 'auto' ? t.checked : Number(t.value) });
      return;
    }
    if (!t.closest('#ugc-form')) return;
    readForm();
    if (t.name === 'angulo' || t.name === 'personaje') renderForm();
  }

  /* ---------- Tanda automática: la tarea ---------- */

  function cortarSiCancelo(ctx) {
    if (ctx.signal.aborted) throw { code: 'cancelled' };
  }

  function refrescarProg() {
    if (el) renderAutoProg();
  }

  async function guardar(path, data) {
    try {
      await Store.set(path, data);
    } catch (err) {
      const code = err && err.code;
      throw new Error(
        code === 'invalid_argument'
          ? 'No tenés permiso para guardar cambios en este panel.'
          : code === 'quota_exceeded'
            ? 'Se llenó el espacio del panel. Borrá datos viejos para seguir guardando.'
            : 'No se pudieron guardar los guiones. Revisá la conexión y probá de nuevo.'
      );
    }
  }

  /*
   * Escribe una tanda de guiones con lo que ya sabe el panel: último reporte de anuncios, anuncios de la competencia,
   * dudas de los comentarios y las tandas anteriores. Funciona aunque la pestaña no esté abierta.
   */
  async function escribirTanda(ctx) {
    if (!AI.sample) throw new Error('Claude no está disponible en esta vista.');
    const pasos = [
      { label: 'Juntar tu último reporte de anuncios, la competencia y los comentarios', estado: 'curso', det: '' },
      { label: 'Escribir los guiones con Claude', estado: 'espera', det: '' },
      { label: 'Guardar la tanda', estado: 'espera', det: '' },
    ];
    auto.pasos = pasos;
    let i = 0;
    const avanzar = (det) => {
      pasos[i].estado = 'ok';
      if (det != null) pasos[i].det = det;
      i++;
      if (pasos[i]) pasos[i].estado = 'curso';
      refrescarProg();
    };
    refrescarProg();
    try {
      ctx.progress('Juntando datos…');
      const [analisis, comp, escaneo, resp, prev] = await Promise.all([
        App.ultimoAnalisis ? Promise.resolve(App.ultimoAnalisis) : Store.get('creativos/ultimo'),
        Store.list('competencia'),
        Store.get('escaneos/ultimo'),
        Store.list('respuestas'),
        Store.get('guiones/auto'),
      ]);
      cortarSiCancelo(ctx);
      const c = cfgAuto();
      const pref = prefGet('ugc-opts', {}) || {};
      const p = P.plan({
        ultimoAnalisis: analisis,
        competencia: { ads: [...comp.values()], escaneo },
        objeciones: P.objeciones(resp),
        historial: (prev && prev.historial) || [],
        tienda: App.tienda,
        cfg: { cantidad: c.cantidad, clips: c.clips },
        idioma: pref.idiomaPrompt === 'es' ? 'es' : 'en',
        hoy: U.todayKeyAR(),
      });
      const o = p.opts;
      const angulo = (S.ANGULOS[o.angulo] || {}).label || o.angulo;
      avanzar('Ángulo ' + angulo + ' · ' + ((S.PERSONAJES[o.personaje] || {}).label || o.personaje));
      pasos[1].label = 'Escribir ' + o.cantidad + (o.cantidad === 1 ? ' guion' : ' guiones') + ' de ' + o.clips + ' clips con Claude';
      refrescarProg();

      ctx.progress('Escribiendo ' + (o.cantidad === 1 ? 'el guion' : o.cantidad + ' guiones') + ' (ángulo ' + angulo + ')…');
      const opts = Object.assign({}, o, { producto: App.msgs.productoGuiones || S.PRODUCTO_DEFAULT });
      let aviso = 0;
      let data;
      try {
        data = await AI.sample.json(S.buildPrompt(opts), {
          signal: ctx.signal,
          cache: false,
          onText: ({ text }) => {
            // De a ratos: cada aviso redibuja el panel y la barra de arriba
            if (Date.now() - aviso < 800) return;
            aviso = Date.now();
            pasos[1].det = 'Escribiendo… ' + U.int(text.length) + ' caracteres';
            ctx.progress('Escribiendo guiones… ' + U.int(text.length) + ' caracteres');
          },
        });
      } catch (err) {
        if ((err && err.code === 'cancelled') || ctx.signal.aborted) throw err;
        if (AI.permanent(err)) {
          AI.sample = null;
          if (el) renderAutoHead();
        }
        throw new Error(AI.errorText(err));
      }
      cortarSiCancelo(ctx);
      const list = S.sanitize(data, opts);
      if (!list.length) throw new Error('Claude no devolvió guiones que se puedan usar. Probá de nuevo o bajá la cantidad de guiones por tanda.');
      avanzar(list.length + (list.length === 1 ? ' guion' : ' guiones'));

      ctx.progress('Guardando la tanda…');
      const fecha = new Date().toISOString();
      const doc = P.armarDoc({
        fecha,
        origen: ctx.origen,
        motivo: ctx.motivo,
        razones: p.razones,
        opts: o,
        guiones: list,
        historial: P.sumarHistorial(prev && prev.historial, { fecha, angulo: o.angulo, personaje: o.personaje }),
      });
      await guardar('guiones/auto', JSON.parse(JSON.stringify(doc)));
      avanzar();
      mostrarTanda(doc);
      const n = doc.guiones.length;
      return { novedades: n, guiones: n, angulo: o.angulo, resumen: P.resumen(n, o.angulo) };
    } catch (err) {
      if (pasos[i]) {
        pasos[i].estado = 'error';
        pasos[i].det = (err && err.code === 'cancelled') || ctx.signal.aborted ? 'Cancelado' : (err && err.message) || 'Error inesperado';
      }
      refrescarProg();
      throw err;
    }
  }

  if (A) A.register('guiones', { needs: ['sample'], run: escribirTanda });

  VC.tools = VC.tools || {};
  VC.tools.guiones = { mount, render };
})(window);
</script>
<script>
/* ui/clientes.js */
/* Reactivador de clientes que ya pagaron */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const C = VC.customers;
  const OF = VC.offers;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, chip, waButton, seg, emptyState, shopStatusBanner, toast, prefGet, prefSet, storeFail } = VC.ui;

  const R_ESTADOS = {
    enviado: { label: 'Oferta enviada', tone: 'warn' },
    respondio: { label: 'Respondió', tone: 'info' },
    compro: { label: 'Compró', tone: 'good' },
    no: { label: 'No le interesa', tone: 'neutral' },
  };

  const state = {
    filtro: prefGet('cli-filtro', 'escribir'),
    cfg: Object.assign({}, C.DEFAULT_CFG),
    contactos: new Map(),
    elegida: {}, // wa → oferta elegida a mano
    loading: false,
    error: null,
    codigo: { pct: 15, running: false, msg: '' },
  };
  let el;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Clientes para reactivar</h2><p class="lede">Gente que ya te compró y pagó. Escribiles con una oferta: venderle de nuevo a alguien que confía en vos cuesta mucho menos que conseguir un cliente nuevo.</p></div>' +
      '<div class="tool-actions"><button class="btn ghost" data-act="refrescar">Actualizar</button></div></header>' +
      '<div id="cli-status"></div><div id="cli-summary"></div><details class="panel" id="cli-ofertas"></details><div id="cli-filters"></div><div id="cli-list" class="order-list"></div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('input', onInput);
    Shop.onChange(render);
    App.on((w) => (w === 'resenas' || w === 'cfg' || w === 'msgs' || w === 'tienda') && render());
    Store.get('config/reactivar').then((d) => {
      if (d) state.cfg = Object.assign({}, C.DEFAULT_CFG, d, { mensajes: Object.assign({}, d.mensajes || {}) });
      renderOfertas();
      render();
    });
    Store.watch('reactivacion', (m) => {
      state.contactos = m;
      render();
    });
    renderOfertas();
    load();
  }

  async function load(fresh) {
    state.loading = true;
    state.error = null;
    render();
    try {
      await Shop.ensure(U.addDays(U.todayKeyAR(), -365), { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    render();
  }

  const saveCfg = VC.ui.debounce(() => Store.set('config/reactivar', JSON.parse(JSON.stringify(state.cfg))).catch(storeFail), 700);

  function ofertaDe(c) {
    const ct = state.contactos.get(c.wa);
    return state.elegida[c.wa] || (ct && ct.oferta) || C.suggestOffer(c);
  }

  function lists() {
    const all = C.buildCustomers(Shop.orders, { minDias: Number(state.cfg.minDias) || 20, resenas: App.resenas });
    const now = Date.now();
    const pausa = (Number(state.cfg.pausaDias) || 30) * 24;
    for (const c of all) {
      const ct = state.contactos.get(c.wa);
      c.contacto = ct || null;
      c.volvio = ct ? C.reordered(c, ct.enviadoEn) : null;
      c.enPausa = ct && ct.enviadoEn && U.hoursSince(ct.enviadoEn, now) < pausa;
    }
    return {
      all,
      escribir: all.filter((c) => c.listo && !c.contacto),
      escritos: all.filter((c) => c.contacto && !c.volvio && c.contacto.estado !== 'compro'),
      volvieron: all.filter((c) => c.volvio || (c.contacto && c.contacto.estado === 'compro')),
    };
  }

  function render() {
    if (!el) return;
    const st = $('#cli-status', el);
    if (Shop.mode === 'none') st.innerHTML = shopStatusBanner({ message: 'Esta vista no puede conectarse a Shopify. Abrí el panel desde claude.ai o importá el CSV de pedidos.' });
    else st.innerHTML = state.error ? shopStatusBanner(state.error) : '';

    const L = lists();
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;
    const recuperado = U.sum(L.volvieron, (c) => (c.volvio ? c.volvio.total : 0));
    const respondieron = L.all.filter((c) => c.contacto && ['respondio', 'compro'].includes(c.contacto.estado)).length;
    $('#cli-summary', el).innerHTML = loadingFirst
      ? '<div class="summary-strip is-loading">Cargando clientes…</div>'
      : '<div class="summary-strip">' +
        stat(L.all.length, 'clientes que pagaron') +
        stat(L.escribir.length, 'listos para escribir', L.escribir.length ? 'warn' : '') +
        stat(L.escritos.length + L.volvieron.length, 'ya escritos') +
        stat(respondieron, 'respondieron') +
        stat(L.volvieron.length, 'volvieron a comprar', L.volvieron.length ? 'good' : '') +
        stat(recuperado ? U.moneyShort(recuperado) : '—', 'vendido de nuevo') +
        '</div>';

    $('#cli-filters', el).innerHTML = seg(
      'cli-filtro',
      [
        { value: 'escribir', label: 'Para escribir', count: L.escribir.length },
        { value: 'escritos', label: 'Escritos', count: L.escritos.length },
        { value: 'volvieron', label: 'Volvieron', count: L.volvieron.length },
        { value: 'all', label: 'Todos', count: L.all.length },
      ],
      state.filtro
    );

    const list = L[state.filtro] || L.all;
    const box = $('#cli-list', el);
    if (loadingFirst) box.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    else if (!list.length)
      box.innerHTML = emptyState(
        'Nada por acá',
        e(
          {
            escribir: L.all.length ? 'Ya les escribiste a todos los clientes listos. Los que compraron hace menos de ' + state.cfg.minDias + ' días aparecen cuando pase ese tiempo.' : 'Todavía no hay clientes con pedidos entregados y cobrados.',
            escritos: 'Todavía no le mandaste ninguna oferta a un cliente.',
            volvieron: 'Cuando un cliente al que le escribiste haga un pedido nuevo, aparece acá solo.',
            all: 'Todavía no hay clientes con pedidos entregados y cobrados.',
          }[state.filtro]
        )
      );
    else box.innerHTML = list.map(card).join('');
  }

  function stat(v, label, tone) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"><span class="stat-value">' + e(v) + '</span><span class="stat-label">' + e(label) + '</span></div>';
  }

  function card(c) {
    const of = ofertaDe(c);
    const ct = c.contacto;
    const msg = C.message(c, of, state.cfg, App.datos());
    const chips = [
      c.volvio ? chip('Volvió a comprar: ' + c.volvio.name, 'good') : ct && R_ESTADOS[ct.estado] ? chip(R_ESTADOS[ct.estado].label, R_ESTADOS[ct.estado].tone) : c.listo ? chip('Listo para escribir', 'info') : '',
      c.abierto ? chip('Tiene un pedido abierto', 'neutral') : '',
      !c.listo && !c.abierto && !ct ? chip('Compró hace ' + c.dias + ' días', 'neutral') : '',
      c.resena ? chip('Reseña ' + '★'.repeat(Number(c.resena.estrellas) || 5), 'good') : '',
      c.compras > 1 ? chip(c.compras + ' compras', 'source') : '',
    ].join('');
    const ofSel =
      '<label class="field-inline small" for="of-' +
      e(c.wa) +
      '">Oferta <select id="of-' +
      e(c.wa) +
      '" data-oferta="' +
      e(c.wa) +
      '">' +
      Object.entries(C.OFERTAS)
        .map(([k, o]) => '<option value="' + k + '"' + (k === of ? ' selected' : '') + '>' + e(o.label) + (k === C.suggestOffer(c) ? ' (sugerida)' : '') + '</option>')
        .join('') +
      '</select></label>';
    return (
      '<article class="order-card' +
      (c.volvio ? ' is-good' : '') +
      '"><div class="oc-top"><div class="oc-id"><strong>' +
      e(c.nombre || 'Sin nombre') +
      '</strong><span class="muted">' +
      e([c.ciudad, c.provincia].filter(Boolean).join(', ')) +
      '</span></div><div class="oc-total mono">' +
      e(U.money(c.gastado)) +
      '</div></div><div class="oc-addr">' +
      e(c.unidades + (c.unidades === 1 ? ' unidad' : ' unidades') + ' · última compra ' + U.timeAgo(c.ultimaCompra) + ' · ' + c.ultimoPedido) +
      (ct && ct.enviadoEn ? ' · oferta enviada ' + e(U.timeAgo(ct.enviadoEn)) : '') +
      '</div><div class="oc-phone"><span class="mono selectable">' +
      e(c.phone.display) +
      '</span></div><div class="chips">' +
      chips +
      '</div>' +
      (!c.volvio ? '<div class="msg-row">' + ofSel + '<details class="msg-preview"><summary>Ver mensaje</summary><p class="preview">' + e(msg) + '</p></details></div>' : '') +
      (!c.volvio
        ? '<div class="oc-actions"><div class="row-actions">' +
          waButton(U.waLink(c.phone.wa, msg), ct ? 'Volver a escribir' : 'Enviar oferta', 'wa-oferta', c.wa, ct ? 'ghost' : 'wa') +
          '</div><div class="row-actions decide">' +
          (ct
            ? decide('respondio', 'Respondió', c, 'warn') + decide('compro', 'Compró', c, 'good') + decide('no', 'No le interesa', c, 'bad') + '<button class="btn link" data-act="deshacer" data-key="' + e(c.wa) + '">Deshacer</button>'
            : '') +
          '</div></div>'
        : '') +
      '</article>'
    );
  }

  function decide(v, label, c, tone) {
    const on = c.contacto && c.contacto.estado === v;
    return '<button class="btn decide-btn tone-' + tone + (on ? ' is-on' : '') + '" aria-pressed="' + !!on + '" data-act="marcar" data-estado="' + v + '" data-key="' + e(c.wa) + '">' + e(label) + '</button>';
  }

  function renderOfertas() {
    const box = $('#cli-ofertas', el);
    if (!box) return;
    const wasOpen = box.open;
    const f = state.cfg;
    const rates = O.historicalRates(Shop.orders);
    // Un cliente que responde la oferta ya confirmó: tasa de confirmación 100%
    const ev = OF.evaluate({ unidades: 1, precio: Number(f.precioOferta) || 0 }, Object.assign({}, App.cfg, { tasaConfirmacion: 100 }), rates, 0, 0);
    const deja = VC.profit.costsReady(App.cfg) ? 'Con tus costos, cada segunda unidad a ' + U.money(f.precioOferta) + ' te deja ' + U.money(ev.esperado) + ' en promedio (sin publicidad).' : 'Cargá tus costos en Ajustes para ver cuánto te deja cada oferta.';
    box.innerHTML =
      '<summary>Ofertas y mensajes</summary><div class="form-grid">' +
      field('precioOferta', 'Precio de la segunda unidad (familia)', U.int(f.precioOferta), 'numeric') +
      field('beneficioAmigo', 'Beneficio para el amigo', f.beneficioAmigo) +
      field('premio', 'Premio para el cliente que recomienda', f.premio) +
      field('ofertaLibre', 'Oferta de recompra', f.ofertaLibre) +
      field('codigo', 'Código de descuento (opcional)', f.codigo) +
      field('minDias', 'Escribir a partir de (días de la compra)', f.minDias, 'numeric') +
      '</div><p class="muted small">' +
      e(deja) +
      '</p>' +
      (Shop.mode === 'live'
        ? '<div class="row-actions code-row"><label class="field-inline" for="cli-pct">Crear el código en Shopify con <input id="cli-pct" class="num-input short" inputmode="numeric" value="' +
          e(state.codigo.pct) +
          '"> % de descuento</label><button class="btn ghost" data-act="crear-codigo"' +
          (state.codigo.running ? ' disabled' : '') +
          '>' +
          (state.codigo.running ? 'Creando…' : 'Crear código') +
          '</button></div><p class="muted small">Revisá que tu formulario de pago contra entrega acepte cupones. Si no, aplicá el precio a mano cuando el cliente confirme.' +
          (state.codigo.msg ? ' <strong>' + e(state.codigo.msg) + '</strong>' : '') +
          '</p>'
        : '') +
      '<div class="templates">' +
      Object.entries(C.OFERTAS)
        .map(
          ([k, o]) =>
            '<div class="template"><label for="cli-msg-' +
            k +
            '">' +
            e(o.label) +
            '<textarea id="cli-msg-' +
            k +
            '" data-msg="' +
            k +
            '" rows="6">' +
            e((f.mensajes && f.mensajes[k]) || o.mensaje) +
            '</textarea></label></div>'
        )
        .join('') +
      '</div><p class="muted small">Variables: <span class="mono">{nombre} {tienda} {precio} {precio_oferta} {beneficio_amigo} {premio} {oferta_libre} {codigo_txt}</span></p>';
    box.open = wasOpen;
  }

  function field(k, label, v, mode) {
    return '<label for="cli-' + k + '">' + e(label) + '<input id="cli-' + k + '" data-cfg="' + k + '"' + (mode ? ' inputmode="' + mode + '"' : '') + ' value="' + e(v == null ? '' : v) + '"></label>';
  }

  async function setC(wa, patch) {
    const prev = state.contactos.get(wa) || {};
    const next = Object.assign({}, prev, patch, { actualizado: new Date().toISOString() });
    state.contactos.set(wa, next);
    render();
    try {
      await Store.set('reactivacion/' + wa, next);
    } catch (err) {
      storeFail(err);
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'cli-filtro') {
      state.filtro = t.dataset.value;
      prefSet('cli-filtro', state.filtro);
      render();
      return;
    }
    const wa = t.dataset.key;
    switch (t.dataset.act) {
      case 'refrescar':
      case 'reintentar':
        load(true);
        break;
      case 'permisos':
        VC.runtime.managePermissions();
        break;
      case 'wa-oferta': {
        const c = lists().all.find((x) => x.wa === wa);
        const of = c ? ofertaDe(c) : 'familia';
        setTimeout(() => setC(wa, { estado: 'enviado', oferta: of, enviadoEn: new Date().toISOString(), nombre: c ? c.nombre : '' }), 60);
        break;
      }
      case 'marcar':
        setC(wa, { estado: t.dataset.estado });
        break;
      case 'deshacer':
        state.contactos.delete(wa);
        render();
        Store.remove('reactivacion/' + wa).catch(storeFail);
        break;
      case 'crear-codigo':
        crearCodigo();
        break;
    }
  }

  async function crearCodigo() {
    const code = String(state.cfg.codigo || '').trim().toUpperCase();
    const pct = Number(U.parseNum($('#cli-pct', el).value));
    if (!code || !/^[A-Z0-9_-]{3,30}$/.test(code)) {
      toast('Escribí un código de 3 a 30 letras o números, sin espacios (ej.: VUELVE15).', 'warn');
      return;
    }
    if (!(pct >= 1 && pct <= 90)) {
      toast('El descuento tiene que ser entre 1 y 90%.', 'warn');
      return;
    }
    state.codigo = { pct, running: true, msg: '' };
    renderOfertas();
    try {
      const res = await Shop.createDiscount({ code, percentage: pct, title: 'Reactivación clientes ' + code });
      state.codigo.msg = /error|invalid|taken|ya existe|already/i.test(res) ? 'Shopify respondió: ' + res.slice(0, 160) : 'Código ' + code + ' creado (' + pct + '%).';
      if (!/error|invalid|taken|already/i.test(res)) {
        state.cfg.codigo = code;
        saveCfg();
      }
    } catch (err) {
      state.codigo.msg = err && err.code === 'approval_required' ? 'Shopify pidió tu aprobación. Aprobala y probá de nuevo.' : err && err.code === 'not_in_manifest' ? 'No diste permiso para crear descuentos desde esta página.' : 'No se pudo crear: ' + ((err && err.message) || 'error de Shopify');
    }
    state.codigo.running = false;
    renderOfertas();
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.dataset.cfg) {
      const k = t.dataset.cfg;
      state.cfg[k] = ['precioOferta', 'minDias'].includes(k) ? U.parseMoney(t.value) || 0 : t.value;
      saveCfg();
      render();
    } else if (t.dataset.msg) {
      state.cfg.mensajes = Object.assign({}, state.cfg.mensajes, { [t.dataset.msg]: t.value });
      saveCfg();
      render();
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset.oferta) {
      state.elegida[t.dataset.oferta] = t.value;
      render();
    } else if (t.dataset.cfg === 'precioOferta') {
      renderOfertas();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      VC.ui
        .readFileText(t.files[0])
        .then((txt) => {
          Shop.importCSV(txt);
          state.error = null;
          render();
        })
        .catch((err) => toast(err.message || 'No se pudo leer el archivo.', 'bad'));
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.clientes = { mount, render: () => (renderOfertas(), render()), load };
})(window);
</script>
<script>
/* ui/tiendas.js */
/* Tiendas de la competencia: catálogo público de Shopify y señales de venta (dentro de la pestaña Competencia) */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const R = VC.research;
  const S = VC.stores;
  const A = VC.auto;
  const { Store, Browser } = VC.runtime;
  const { e, $, App, chip, emptyState, toast, storeFail } = VC.ui;

  const CADA = [24, 48, 72];
  const TONO = { alto: 'good', medio: 'info', bajo: 'neutral' };

  const state = {
    docs: new Map(), // dominio → documento guardado
    anuncios: {}, // dominio → {anuncios, diasMax} (de los anuncios guardados en Competencia)
    log: [], // [{st: 'ok'|'err', texto}] de la corrida en curso o la última
    enCola: false,
    confirmar: null, // {d, hasta}: botón Quitar esperando el segundo toque
  };
  let el = null;
  let unwatch = null;
  let suscripto = false;

  /* ---------- Tarea automática ---------- */

  async function revisarTiendas(ctx) {
    const cfg = A.cfg.tiendas || {};
    const guardadas = await Store.list('tiendas');
    const dominios = S.dominiosARevisar(cfg.dominios, guardadas, cfg.quitadas);
    state.log = [];
    paintStatus();
    if (!dominios.length) return { novedades: 0, tiendas: 0, resumen: 'No hay tiendas para revisar.' };
    const totales = { nuevos: 0, precios: 0, agotados: 0, repuestos: 0, resenas: 0 };
    let hechas = 0;
    let errores = 0;
    for (let i = 0; i < dominios.length; i++) {
      if (ctx.signal.aborted) break;
      const d = dominios[i];
      const paso = i + 1 + '/' + dominios.length + ' · ' + d;
      ctx.progress(paso);
      let cat = null;
      let error = '';
      const resenas = {};
      try {
        const texto = await Browser.read(R.productsJsonUrl(d), { ready: R.shopifyReady, tries: 3, firstWait: 1500, wait: 2000 });
        cat = S.leerCatalogo(texto);
        if (!cat) error = S.motivoError(texto);
      } catch (err) {
        if (Browser.fatal(err)) throw new Error(Browser.errorText(err));
        error = Browser.errorText(err);
      }
      // Reseñas de sus productos de postura (las páginas de producto las muestran; el catálogo no)
      const top = cat ? S.posturaOrdenada(cat.productos).slice(0, S.TOPE_RESENAS) : [];
      for (let j = 0; j < top.length && !ctx.signal.aborted; j++) {
        ctx.progress(paso + ' · reseñas ' + (j + 1) + '/' + top.length);
        try {
          resenas[top[j].handle] = R.reviewCount(await Browser.read(R.productUrl(d, top[j].handle), { tries: 2 }));
        } catch (err) {
          if (Browser.fatal(err)) throw new Error(Browser.errorText(err));
          resenas[top[j].handle] = null;
        }
      }
      const prev = guardadas.get(d) || null;
      const r = S.revisar(prev, {
        dominio: d,
        fecha: new Date().toISOString(),
        productos: cat ? cat.productos : null,
        parcial: cat ? cat.parcial : false,
        resenas,
        error,
        origen: prev ? prev.origen : 'anuncio', // sin documento: la sumó el escaneo de anuncios
      });
      hechas++;
      // Si la quitaron mientras se revisaba, no se vuelve a guardar
      if ((A.cfg.tiendas.quitadas || []).includes(d)) continue;
      let guardo = true;
      await Store.set('tiendas/' + d, r.doc).catch(() => (guardo = false));
      state.docs.set(d, r.doc);
      if (r.doc.ultima.error) {
        errores++;
        state.log.push({ st: 'err', texto: d + ' · ' + r.doc.ultima.error });
      } else {
        for (const k of Object.keys(totales)) totales[k] += r.cuenta[k];
        state.log.push({ st: 'ok', texto: d + ' · ' + lineaLog(r) + (guardo ? '' : ' (no se pudo guardar)') });
      }
      paintList();
    }
    const novedades = totales.nuevos + totales.precios + totales.agotados + totales.repuestos + totales.resenas;
    return {
      novedades,
      tiendas: hechas,
      cambios: totales.nuevos + totales.precios + totales.agotados + totales.repuestos,
      resenas: totales.resenas,
      errores,
      resumen: S.resumenCorrida(hechas, totales, errores),
    };
  }

  function lineaLog(r) {
    const u = r.doc.ultima;
    const n = u.total + ' producto' + (u.total === 1 ? '' : 's');
    if (!r.doc.cambios) return n + ', primera revisión';
    const c = r.cuenta.nuevos + r.cuenta.precios + r.cuenta.agotados + r.cuenta.repuestos;
    return n + ', ' + (c ? c + ' cambio' + (c === 1 ? '' : 's') : 'sin cambios') + (r.cuenta.resenas ? ', +' + r.cuenta.resenas + ' reseñas' : '');
  }

  A.register('tiendas', { needs: ['browser'], run: revisarTiendas });

  /* ---------- Interfaz ---------- */

  function mount(container) {
    if (!container) return;
    if (el === container && $('.tn', el)) {
      render();
      return;
    }
    el = container;
    el.innerHTML =
      '<section class="panel auto-panel tn" aria-labelledby="tn-title"><div class="auto-head"><h3 id="tn-title">Tiendas de la competencia</h3><div class="auto-meta" id="tn-meta"></div></div>' +
      '<p class="muted small">Lee el catálogo público de cada tienda Shopify (precios, precio tachado, qué está agotado y cuándo publicó cada producto) y las reseñas de sus correctores. Shopify no muestra las ventas de otros: comparando una revisión con la siguiente se ven lanzamientos, cambios de precio, productos que se agotan y se reponen, y reseñas nuevas. Son señales de venta, no ventas exactas, y las reseñas pueden ser inventadas.</p>' +
      '<form class="tn-add" id="tn-add" novalidate><label for="tn-dominio" class="sr-only">Dominio o dirección de la tienda</label><input id="tn-dominio" name="dominio" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tienda.com.ar o el link de la tienda"><button class="btn ghost" type="submit">Agregar tienda</button></form>' +
      '<div id="tn-ctrl" class="tn-ctrl"></div><div id="tn-prog" class="tn-prog"></div><div id="tn-summary"></div><div id="tn-list" class="tn-list"></div></section>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('submit', onSubmit);
    if (!unwatch) {
      unwatch = Store.watch(
        'tiendas',
        (m) => {
          state.docs = m;
          paintList();
        },
        () => Store.list('tiendas').then((m) => ((state.docs = m), paintList()))
      );
    }
    if (!suscripto) {
      suscripto = true;
      A.on(onAuto);
    }
    cargarAnuncios();
    render();
  }

  function render() {
    paintStatus();
    paintList();
  }

  function montado() {
    return !!(el && el.isConnected && $('.tn', el));
  }

  function cargarAnuncios() {
    Store.list('competencia')
      .then((m) => {
        state.anuncios = S.anunciosPorDominio([...m.values()]);
        paintList();
      })
      .catch(() => {});
  }

  function onAuto(ev) {
    if (!montado()) return;
    if (ev.type === 'cfg') {
      render();
      return;
    }
    if (ev.job === 'tiendas') {
      if (ev.type === 'progress') {
        paintProg();
        return;
      }
      state.enCola = false;
      if (ev.type === 'skip' && ev.motivo) state.log = [{ st: 'err', texto: ev.motivo }];
      render();
      return;
    }
    if (ev.job === 'competencia' && ev.type === 'done') cargarAnuncios();
    if (ev.type === 'start' || ev.type === 'done' || ev.type === 'error') paintCtrl();
  }

  // Dominios que se siguen: los de la configuración (manuales y del escaneo de anuncios) y los guardados, sin los quitados
  function dominios() {
    const c = A.cfg.tiendas || {};
    const fuera = new Set(c.quitadas || []);
    const set = new Set();
    for (const x of (c.dominios || []).concat([...state.docs.keys()])) {
      const n = R.normalizeDomain(x);
      if (n && R.isStoreDomain(n) && !fuera.has(n)) set.add(n);
    }
    return [...set];
  }

  function paintStatus() {
    paintCtrl();
    paintProg();
  }

  function paintCtrl() {
    if (!montado()) return;
    const box = $('#tn-ctrl', el);
    if (!Browser.checked) {
      box.innerHTML = '<p class="muted small">Buscando el navegador de Claude en tu PC…</p>';
      return;
    }
    if (!Browser.available) {
      box.innerHTML =
        '<div class="auto-off">La revisión usa el navegador de Claude en tu PC, que solo está disponible si abrís este panel desde la app de escritorio de Claude (Cowork). Igual podés agregar o quitar tiendas y ver lo que ya se revisó.</div>';
      return;
    }
    const c = A.cfg.tiendas || {};
    const corriendo = A.running === 'tiendas';
    const otra = A.running && !corriendo ? A.running : null;
    const n = dominios().length;
    const horas = Number(c.cadaHoras) || 24;
    const opts = CADA.includes(horas) ? CADA : CADA.concat([horas]).sort((a, b) => a - b);
    box.innerHTML =
      '<div class="row-actions">' +
      (corriendo
        ? '<button class="btn ghost" data-act="tn-detener">Detener</button>'
        : '<button class="btn" data-act="tn-revisar"' + (n && !state.enCola ? '' : ' disabled') + '>Revisar tiendas ahora</button>') +
      (state.enCola && otra ? '<span class="muted small">En cola: espera que termine ' + e(A.NOMBRES[otra] || otra) + '.</span>' : '') +
      (!n ? '<span class="muted small">Agregá una tienda para revisarla.</span>' : '') +
      '</div><div class="auto-toggles"><label><input type="checkbox" id="tn-auto"' +
      (c.auto ? ' checked' : '') +
      '> Revisar solas al abrir el panel</label><label for="tn-cada">cada <select id="tn-cada">' +
      opts.map((h) => '<option value="' + h + '"' + (h === horas ? ' selected' : '') + '>' + h + '</option>').join('') +
      '</select> horas</label></div>';
  }

  function paintProg() {
    if (!montado()) return;
    const est = A.estado.tiendas;
    const c = A.cfg.tiendas || {};
    const corriendo = A.running === 'tiendas';
    const meta = [];
    meta.push(est && est.ultima ? 'Última revisión ' + U.timeAgo(est.ultima) + (est.origen === 'auto' ? ' (sola)' : '') : 'Todavía no se revisó');
    meta.push(dominios().length + ' tienda' + (dominios().length === 1 ? '' : 's'));
    if (c.auto) meta.push('se revisan solas cada ' + (Number(c.cadaHoras) || 24) + ' h');
    $('#tn-meta', el).innerHTML = meta.map((m) => '<span>' + e(m) + '</span>').join('');
    let h = '';
    if (corriendo || state.log.length) {
      h +=
        '<ul class="auto-progress" aria-live="polite">' +
        state.log.map((l) => '<li><span class="st ' + (l.st === 'ok' ? 'ok' : 'err') + '">' + (l.st === 'ok' ? 'listo' : 'error') + '</span><span class="tn-log">' + e(l.texto) + '</span></li>').join('') +
        (corriendo ? '<li><span class="st">revisando</span><span class="tn-log">' + e(A.progress.tiendas || 'Empezando…') + '</span></li>' : '') +
        '</ul>';
    }
    if (!corriendo && est) {
      if (est.resultado && est.resultado.resumen) h += '<p class="small">' + e(est.resultado.resumen) + '</p>';
      if (est.error) h += '<p class="error-text">' + e(est.error === 'Cancelado.' ? 'La última revisión se detuvo antes de terminar.' : est.error) + '</p>';
    }
    $('#tn-prog', el).innerHTML = h;
  }

  function paintList() {
    if (!montado()) return;
    const hoy = U.todayKeyAR();
    const items = dominios().map((d) => {
      const doc = state.docs.get(d) || null;
      return { d, doc, mv: S.movimiento(doc, { hoy, anuncios: state.anuncios[d] }) };
    });
    items.sort((a, b) => (a.mv.nivel ? 0 : 1) - (b.mv.nivel ? 0 : 1) || b.mv.puntos - a.mv.puntos || a.d.localeCompare(b.d));
    paintSummary(items);
    const box = $('#tn-list', el);
    if (!items.length) {
      box.innerHTML = emptyState(
        'Todavía no seguís ninguna tienda',
        'Pegá arriba el dominio o el link de un competidor (por ejemplo, la tienda a la que llevan sus anuncios) y tocá “Agregar tienda”. El escaneo de anuncios de esta pestaña también suma solo las tiendas que encuentra.'
      );
      return;
    }
    box.innerHTML = items.map((x) => card(x, hoy)).join('');
  }

  function paintSummary(items) {
    const box = $('#tn-summary', el);
    const rev = items.filter((x) => x.mv.nivel);
    if (!rev.length) {
      box.innerHTML = '';
      return;
    }
    const altos = rev.filter((x) => x.mv.nivel === 'alto').length;
    let cambios = 0;
    let resenas = 0;
    for (const x of rev) {
      const k = x.doc.cambios;
      if (!k) continue;
      cambios += (k.conteo.nuevos || 0) + (k.conteo.precios || 0) + (k.conteo.agotados || 0) + (k.conteo.repuestos || 0);
      resenas += U.sum(k.resenas || [], (r) => r.suma);
    }
    box.innerHTML =
      '<div class="summary-strip">' +
      stat(rev.length, 'tiendas revisadas') +
      stat(altos, 'con movimiento alto', altos ? 'good' : '') +
      stat(cambios, 'cambios en la última revisión') +
      stat(resenas ? '+' + U.int(resenas) : 0, 'reseñas nuevas') +
      '</div>';
  }

  function stat(v, label, tone) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"><span class="stat-value">' + e(v) + '</span><span class="stat-label">' + e(label) + '</span></div>';
  }

  function card(x, hoy) {
    const { d, doc, mv } = x;
    const u = doc && doc.ultima;
    const origen = !doc || doc.origen === 'anuncio' ? 'La sumó el escaneo de anuncios' : 'Agregada a mano';
    let cuando = u && u.fecha ? 'Revisada ' + U.timeAgo(u.fecha) : 'Todavía no se revisó';
    if (u && u.error && u.intento) cuando += ' · el último intento ' + U.timeAgo(u.intento) + ' falló';
    let h =
      '<article class="tn-card' +
      (mv.nivel ? ' is-' + mv.nivel : '') +
      '"><header class="tn-card-head"><div class="tn-name"><a class="tn-dom" href="https://' +
      e(d) +
      '" target="_blank" rel="noopener">' +
      e(d) +
      '</a><span class="muted small">' +
      e(cuando + ' · ' + origen) +
      '</span></div>' +
      chip(mv.nivel ? 'Movimiento ' + mv.nivel : 'Sin revisar', mv.nivel ? TONO[mv.nivel] : 'neutral') +
      '</header>';
    if (u && u.fecha) {
      const lz = S.lanzamientos(u.productos, hoy).length;
      h +=
        '<p class="small tn-why">' +
        e(mv.texto) +
        '</p><ul class="tn-facts"><li><strong>' +
        e(U.int(u.total != null ? u.total : u.productos.length)) +
        '</strong> productos</li><li><strong>' +
        e(U.int(u.agotados != null ? u.agotados : u.productos.filter((p) => !p.disponible).length)) +
        '</strong> agotados</li><li><strong>' +
        e(U.int(lz)) +
        '</strong> publicados en los últimos ' +
        S.DIAS_LANZAMIENTO +
        ' días</li>' +
        (u.parcial ? '<li>catálogo leído en parte</li>' : '') +
        '</ul>' +
        corrector(d, doc, hoy) +
        cambios(doc) +
        historial(doc);
    } else if (!u || !u.error) {
      h += '<p class="muted small">' + (Browser.available ? 'Tocá “Revisar tiendas ahora” para leer su catálogo.' : 'Se va a revisar cuando abras el panel desde la app de escritorio de Claude.') + '</p>';
    }
    if (u && u.error) h += '<p class="error-text">' + e(u.error) + '</p>';
    const conf = state.confirmar && state.confirmar.d === d && Date.now() < state.confirmar.hasta;
    h +=
      '<div class="row-actions tn-actions"><button type="button" class="btn link tn-quitar' +
      (conf ? ' is-confirm' : '') +
      '" data-act="tn-quitar" data-d="' +
      e(d) +
      '" aria-label="Dejar de seguir ' +
      e(d) +
      '">' +
      (conf ? 'Tocá de nuevo para quitar' : 'Quitar') +
      '</button></div></article>';
    return h;
  }

  function corrector(d, doc, hoy) {
    const u = doc.ultima;
    const res = u.resenas || {};
    const c = S.principal(u.productos, res);
    if (!c) return '<div class="tn-corr"><span class="eyebrow">Su corrector</span><p class="muted small">No encontramos productos de postura en su catálogo.</p></div>';
    const delta = ((doc.cambios && doc.cambios.resenas) || []).find((r) => r.handle === c.handle);
    const dias = R.daysSince(c.publicado || c.creado, hoy);
    const cmp = S.compararPrecio(c.precioMin, App.tienda.precio1);
    const facts = [chip(c.disponible ? 'Disponible' : 'Agotado', c.disponible ? 'good' : 'bad')];
    if (c.variantes > 1) facts.push(e(c.disponibles + ' de ' + c.variantes + ' variantes con stock'));
    if (dias != null) facts.push(e('Publicado hace ' + dias + (dias === 1 ? ' día' : ' días')));
    facts.push(
      res[c.handle] != null
        ? '<strong>' + e(U.int(res[c.handle])) + '</strong> reseñas' + (delta ? ' <span class="tn-delta' + (delta.suma ? ' is-up' : '') + '">+' + e(U.int(delta.suma)) + ' desde la revisión anterior</span>' : '')
        : 'Sin reseñas visibles'
    );
    const est = delta ? S.ventasEstimadas(delta.suma) : null;
    const otros = S.posturaOrdenada(u.productos)
      .filter((p) => p.id !== c.id)
      .slice(0, 4);
    return (
      '<div class="tn-corr"><div class="tn-corr-head"><span class="eyebrow">Su corrector</span><a href="' +
      e(R.productUrl(d, c.handle)) +
      '" target="_blank" rel="noopener">' +
      e(c.titulo || c.handle) +
      '</a></div><div class="tn-price"><strong>' +
      e(U.money(c.precioMin)) +
      '</strong>' +
      (c.tachado && c.tachado > c.precioMin ? '<s>' + e(U.money(c.tachado)) + '</s>' : '') +
      (cmp ? chip(cmp.texto, cmp.tono) : '') +
      '</div><ul class="tn-facts">' +
      facts.map((f) => '<li>' + f + '</li>').join('') +
      '</ul>' +
      (est
        ? '<p class="note">Si esas ' +
          e(U.int(delta.suma)) +
          ' reseñas nuevas son reales, del orden de ' +
          e(U.int(est.min)) +
          ' a ' +
          e(U.int(est.max)) +
          ' ventas desde el ' +
          e(U.fmtDay(U.dayKeyAR(doc.cambios.desde))) +
          ' (se suele dejar 1 reseña cada ' +
          S.COMPRAS_POR_RESENA[0] +
          ' a ' +
          S.COMPRAS_POR_RESENA[1] +
          ' compras). Es una estimación gruesa.</p>'
        : '') +
      (otros.length
        ? '<ul class="tn-otros">' +
          otros
            .map(
              (p) =>
                '<li><a href="' +
                e(R.productUrl(d, p.handle)) +
                '" target="_blank" rel="noopener">' +
                e(p.titulo || p.handle) +
                '</a><span class="muted">' +
                e(U.money(p.precioMin) + (p.disponible ? '' : ' · agotado') + (res[p.handle] != null ? ' · ' + U.int(res[p.handle]) + ' reseñas' : '')) +
                '</span></li>'
            )
            .join('') +
          '</ul>'
        : '') +
      '</div>'
    );
  }

  const GRUPOS = [
    ['nuevos', 'Nuevo', 'info', (x) => x.titulo + ' · ' + U.money(x.precio)],
    ['precios', 'Precio', 'warn', (x) => x.titulo + ': ' + U.money(x.antes) + ' → ' + U.money(x.ahora)],
    ['agotados', 'Se agotó', 'bad', (x) => x.titulo + ' · ' + U.money(x.precio)],
    ['repuestos', 'Repuesto', 'good', (x) => x.titulo + ' · ' + U.money(x.precio)],
    ['variantes', 'Variantes', 'neutral', (x) => x.titulo + ': ' + x.ahora + ' de ' + x.de + ' con stock (antes ' + x.antes + ')'],
    ['resenas', 'Reseñas', 'source', (x) => x.titulo + ': +' + U.int(x.suma) + ' (' + U.int(x.ahora) + ' en total)'],
    ['quitados', 'Quitado', 'neutral', (x) => x.titulo + ' · ' + U.money(x.precio)],
  ];

  function cambios(doc) {
    const k = doc.cambios;
    if (!k) return '<p class="muted small">Primera revisión: los cambios aparecen a partir de la próxima.</p>';
    const conteo = k.conteo || {};
    let total = 0;
    let lis = '';
    for (const [key, label, tone, fmt] of GRUPOS) {
      const list = (k[key] || []).filter((x) => key !== 'resenas' || x.suma > 0);
      const n = key === 'resenas' ? list.length : conteo[key] || list.length;
      total += n;
      lis += list.map((x) => '<li>' + chip(label, tone) + '<span>' + e(fmt(x)) + '</span></li>').join('');
      if (n > list.length) lis += '<li class="muted small">y ' + (n - list.length) + ' más (' + e(label.toLowerCase()) + ')</li>';
    }
    const desde = U.fmtDay(U.dayKeyAR(k.desde));
    if (!total) return '<p class="muted small">Sin cambios desde la revisión del ' + e(desde) + '.</p>';
    return '<details class="tn-changes"' + (total <= 6 ? ' open' : '') + '><summary>Cambios desde el ' + e(desde) + ' (' + total + ')</summary><ul>' + lis + '</ul></details>';
  }

  function historial(doc) {
    const h = (doc.historial || []).filter((x) => x && x.fecha);
    if (h.length < 2) return '';
    const n = (v) => (v == null ? '—' : e(U.int(v)));
    return (
      '<details class="tn-hist"><summary>Historial (' +
      h.length +
      ' revisiones)</summary><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th class="num">Productos</th><th class="num">Agotados</th><th class="num">Corrector</th><th class="num">Reseñas</th></tr></thead><tbody>' +
      h
        .slice()
        .reverse()
        .map(
          (x) =>
            '<tr><th scope="row">' +
            e(U.fmtDay(U.dayKeyAR(x.fecha))) +
            '</th><td class="num">' +
            n(x.productos) +
            '</td><td class="num">' +
            n(x.agotados) +
            '</td><td class="num">' +
            (x.precioCorrector == null ? '—' : e(U.money(x.precioCorrector))) +
            '</td><td class="num">' +
            n(x.resenasTotal) +
            (x.resenasNuevas ? ' <span class="tn-delta is-up">+' + e(U.int(x.resenasNuevas)) + '</span>' : '') +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div></details>'
    );
  }

  /* ---------- Acciones ---------- */

  function agregar(raw) {
    const d = R.normalizeDomain(raw);
    if (!d) {
      toast('Escribí el dominio de la tienda, por ejemplo tienda.com.ar.', 'warn');
      return false;
    }
    if (!R.isStoreDomain(d)) {
      toast('Eso es una red social, un marketplace o un acortador: poné el dominio de la tienda propia.', 'warn');
      return false;
    }
    if (dominios().includes(d)) {
      toast('Ya seguís ' + d + '.', 'warn');
      return false;
    }
    const doc = S.docBase(d, new Date().toISOString(), 'manual');
    state.docs.set(d, doc);
    const c = A.cfg.tiendas || {};
    A.setCfg('tiendas', { dominios: [...new Set((c.dominios || []).concat(d))], quitadas: (c.quitadas || []).filter((x) => x !== d) });
    Store.set('tiendas/' + d, doc).catch(storeFail);
    toast(Browser.available ? 'Agregaste ' + d + '. Tocá “Revisar tiendas ahora” para leer su catálogo.' : 'Agregaste ' + d + '. Se revisa cuando abras el panel desde la app de escritorio de Claude.', 'good');
    return true;
  }

  function quitar(d) {
    const c = A.cfg.tiendas || {};
    state.confirmar = null;
    state.docs.delete(d);
    // "quitadas" evita que el escaneo de anuncios la vuelva a sumar
    A.setCfg('tiendas', { dominios: (c.dominios || []).filter((x) => R.normalizeDomain(x) !== d), quitadas: [...new Set((c.quitadas || []).concat(d))].slice(-200) });
    Store.remove('tiendas/' + d).catch(storeFail);
    toast('Dejaste de seguir ' + d + '.', 'good');
  }

  function onSubmit(ev) {
    const f = ev.target.closest('#tn-add');
    if (!f) return;
    ev.preventDefault();
    const inp = $('#tn-dominio', f);
    if (agregar(inp.value)) inp.value = '';
    inp.focus();
  }

  function onChange(ev) {
    if (ev.target.id === 'tn-auto') A.setCfg('tiendas', { auto: ev.target.checked });
    else if (ev.target.id === 'tn-cada') A.setCfg('tiendas', { cadaHoras: Number(ev.target.value) || 24 });
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t) || !t.closest('.tn')) return;
    switch (t.dataset.act) {
      case 'tn-revisar':
        state.log = [];
        state.enCola = !!A.running && A.running !== 'tiendas';
        A.run('tiendas', { origen: 'manual' });
        paintStatus();
        break;
      case 'tn-detener':
        if (A.running === 'tiendas') A.stop();
        break;
      case 'tn-quitar': {
        const d = t.dataset.d;
        if (state.confirmar && state.confirmar.d === d && Date.now() < state.confirmar.hasta) {
          quitar(d);
          return;
        }
        state.confirmar = { d, hasta: Date.now() + 4000 };
        t.classList.add('is-confirm');
        t.textContent = 'Tocá de nuevo para quitar';
        setTimeout(() => {
          if (state.confirmar && state.confirmar.d === d && Date.now() >= state.confirmar.hasta) {
            state.confirmar = null;
            if (t.isConnected) {
              t.classList.remove('is-confirm');
              t.textContent = 'Quitar';
            }
          }
        }, 4100);
        break;
      }
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.tiendas = { mount, render };
})(window);
</script>
<script>
/* ui/competencia.js */
/* Espía de anuncios de la competencia */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const CP = VC.competitors;
  const R = VC.research;
  const S = VC.scan;
  const { Store, AI, Browser } = VC.runtime;
  const { e, $, App, chip, emptyState, toast, copyText, storeFail } = VC.ui;
  const A = VC.auto;

  const LOGIN = 'Meta pide iniciar sesión en el navegador de Claude: entrá una vez a facebook.com en ese navegador';
  const HORAS = [12, 24, 48, 72];

  const state = {
    ads: new Map(),
    texto: '',
    imagenes: [],
    imgLimits: null,
    running: false,
    error: '',
    ideas: { text: '', fecha: null, running: false, error: '' },
  };
  let el;
  let ctl;
  // Escaneo automático: progreso en vivo, último escaneo guardado y si el usuario lo dejó en cola
  const vivo = { items: [] };
  let ultimo = null;
  let ultimoCargado = false;
  let pedido = false;
  let enCurso = false;
  let dataTimer = 0;
  let ultimoTipeo = 0;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Anuncios de la competencia</h2><p class="lede">Un corrector que lleva semanas activo en la Biblioteca de anuncios de Meta es señal de que le rinde: nadie sostiene un anuncio que pierde plata. Escaneá la Biblioteca sola desde tu PC o pegá lo que ves, y te resume ganchos, ángulos, ofertas y precios.</p></div></header>' +
      '<section class="panel auto-panel" id="cp-auto"></section><section class="panel" id="cp-found"></section><div id="cp-tiendas"></div>' +
      '<section class="panel" id="cp-links"></section><section class="panel" id="cp-input"></section><div id="cp-summary"></div><section class="panel" id="cp-ideas"></section><section class="panel" id="cp-table"></section>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('input', (ev) => {
      ultimoTipeo = Date.now();
      if (ev.target.id === 'cp-texto') state.texto = ev.target.value;
    });
    el.addEventListener('submit', onSubmit);
    el.addEventListener('paste', onPaste);
    Store.watch('competencia', (m) => {
      state.ads = m;
      renderDataSoon();
    });
    if (A) A.on(onAuto);
    if (!ultimoCargado) {
      Store.get('escaneos/ultimo').then((d) => {
        if (!ultimoCargado) ultimo = d || null;
        ultimoCargado = true;
        renderFound();
        renderDataSoon();
      });
    }
    Store.get('ideas/competencia').then((d) => {
      if (d && d.text && !state.ideas.text) {
        state.ideas.text = d.text;
        state.ideas.fecha = d.fecha;
        renderIdeas();
      }
    });
    if (AI.sample && AI.sample.limits) AI.sample.limits().then((l) => ((state.imgLimits = l && l.images ? l.images : null), renderInput())).catch(() => {});
    renderAuto();
    renderFound();
    if (VC.tools.tiendas) VC.tools.tiendas.mount($('#cp-tiendas', el));
    renderLinks();
    renderInput();
    renderData();
  }

  function render() {
    renderAuto();
    renderFound();
    if (VC.tools.tiendas && VC.tools.tiendas.render) VC.tools.tiendas.render();
    renderInput();
    renderData();
  }

  /* ---------- Escaneo automático: interfaz ---------- */

  function renderAuto() {
    const box = el && $('#cp-auto', el);
    if (!box) return;
    if (!box.dataset.ready) {
      box.innerHTML = '<div id="cp-auto-head"></div><div id="cp-auto-prog"></div><div id="cp-auto-cfg"></div>';
      box.dataset.ready = '1';
    }
    renderAutoHead();
    renderAutoProg();
    renderAutoCfg();
  }

  function renderAutoHead() {
    const box = el && $('#cp-auto-head', el);
    if (!box || !A) return;
    const c = A.cfg.competencia || A.DEFAULTS.competencia;
    const corriendo = A.running === 'competencia';
    const otra = A.running && !corriendo ? A.NOMBRES[A.running] || A.running : '';
    const chk = A.can('competencia');
    const est = A.estado.competencia || {};
    const ult = A.ultima('competencia');
    const meta = [
      ult ? 'Último escaneo: ' + U.timeAgo(ult) + (est.origen === 'auto' ? ' (solo, al abrir el panel)' : '') : 'Todavía no escaneaste',
      c.auto ? 'Automático: al abrir el panel, cada ' + c.cadaHoras + ' h' : 'Automático apagado',
    ];
    let accion = '';
    if (Browser.available) {
      accion = corriendo
        ? '<button class="btn ghost" data-act="auto-detener">Detener</button>'
        : '<button class="btn" data-act="auto-escanear"' + (!chk.ok || pedido ? ' disabled' : '') + '>' + (pedido ? 'En cola…' : 'Escanear ahora') + '</button>';
    }
    let aviso = '';
    if (!Browser.checked) aviso = '<p class="auto-off">Revisando si el navegador de Claude está disponible…</p>';
    else if (!Browser.available)
      aviso =
        '<div class="auto-off"><strong>El escaneo automático usa el navegador de Claude en tu PC.</strong> Funciona cuando abrís este panel desde la app de escritorio de Claude, en una sesión de Cowork: ahí abre la Biblioteca de anuncios con tus búsquedas, guarda los anuncios nuevos y te cuenta qué encontró. Igual podés dejar configurado qué buscar, y la búsqueda a mano de más abajo funciona en cualquier lado.</div>';
    else if (!chk.ok) aviso = '<p class="auto-off">' + e(chk.motivo) + '</p>';
    let estado = '';
    if (otra) estado = '<p class="small muted">' + (pedido ? 'En cola: el escaneo arranca cuando termine la ' + e(otra) + '.' : 'Ahora está corriendo la ' + e(otra) + '. Si tocás “Escanear ahora”, queda en cola.') + '</p>';
    else if (!corriendo && est.error) estado = '<p class="error-text">El último escaneo no terminó: ' + e(est.error) + '</p>';
    else if (!corriendo && est.resultado && est.resultado.resumen) estado = '<p class="small">' + e(est.resultado.resumen) + '.</p>';
    box.innerHTML =
      '<div class="auto-head"><div class="cp-auto-title"><h3>Escaneo automático</h3><div class="auto-meta">' +
      meta.map((m) => '<span>' + e(m) + '</span>').join('') +
      '</div></div>' +
      (accion ? '<div class="row-actions">' + accion + '</div>' : '') +
      '</div><p class="cp-auto-lede">Abre la Biblioteca de anuncios de Meta en el navegador de Claude con cada búsqueda, guarda los anuncios nuevos, suma las tiendas que aparecen para revisarlas y te resume qué les funciona a tus competidores.</p>' +
      aviso +
      estado;
  }

  const ST = {
    espera: ['en espera', ''],
    leyendo: ['leyendo…', ''],
    ok: ['listo', 'ok'],
    sin: ['sin anuncios', 'ok'],
    error: ['error', 'err'],
    omitida: ['no se revisó', ''],
  };

  function renderAutoProg() {
    const box = el && $('#cp-auto-prog', el);
    if (!box || !A) return;
    const corriendo = A.running === 'competencia';
    const est = A.estado.competencia || {};
    if (!vivo.items.length || (!corriendo && !est.error)) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML =
      '<ul class="auto-progress">' +
      vivo.items
        .map((it) => {
          const st = ST[it.estado] || ST.espera;
          const det = it.error ? it.error : it.estado === 'ok' ? plural(it.anuncios, 'anuncio', 'anuncios') + ' · ' + plural(it.nuevos, 'nuevo', 'nuevos') : '';
          return '<li><span class="st' + (st[1] ? ' ' + st[1] : '') + '">' + e(st[0]) + '</span><span>' + e(it.q) + (det ? ' <span class="muted">· ' + e(det) + '</span>' : '') + '</span></li>';
        })
        .join('') +
      '</ul>' +
      (corriendo && A.progress.competencia ? '<p class="muted small" aria-live="polite">' + e(A.progress.competencia) + '</p>' : '');
  }

  function busquedasCfg() {
    const c = (A && A.cfg.competencia) || {};
    return S.limpiarBusquedas(c.busquedas && c.busquedas.length ? c.busquedas : CP.BUSQUEDAS);
  }

  function renderAutoCfg() {
    const box = el && $('#cp-auto-cfg', el);
    if (!box || !A) return;
    const c = A.cfg.competencia || A.DEFAULTS.competencia;
    const qs = busquedasCfg();
    const dis = A.loaded ? '' : ' disabled';
    const horas = HORAS.includes(Number(c.cadaHoras)) ? HORAS : HORAS.concat(Number(c.cadaHoras) || 24).sort((a, b) => a - b);
    const lleno = qs.length >= S.MAX_BUSQUEDAS;
    const igualDefault = qs.join('|') === CP.BUSQUEDAS.join('|');
    // Si el usuario está escribiendo una búsqueda o usando una opción, conservamos el foco al redibujar
    const act = document.activeElement;
    const keep = act && act.id === 'cp-q-nueva' && box.contains(act) ? act.value : null;
    const keepCfg = act && box.contains(act) && act.dataset ? act.dataset.cfg : '';
    box.innerHTML =
      '<div class="cp-auto-cfg"><div class="auto-toggles"><span class="cp-auto-when"><label><input type="checkbox" data-cfg="auto"' +
      (c.auto ? ' checked' : '') +
      dis +
      '> Escanear solo al abrir el panel</label><label>si pasaron <select data-cfg="cadaHoras" aria-label="Cada cuántas horas"' +
      dis +
      '>' +
      horas.map((h) => '<option value="' + h + '"' + (Number(c.cadaHoras) === h ? ' selected' : '') + '>' + h + '</option>').join('') +
      '</select> horas</label></span><label><input type="checkbox" data-cfg="guionesTras"' +
      (c.guionesTras ? ' checked' : '') +
      dis +
      '> Después del escaneo, escribir guiones nuevos con lo que encontré</label></div>' +
      '<div class="cp-qs"><div class="cp-qs-head"><span class="eyebrow">Búsquedas · ' +
      qs.length +
      ' de ' +
      S.MAX_BUSQUEDAS +
      '</span>' +
      (igualDefault ? '' : '<button type="button" class="btn link" data-act="q-default"' + dis + '>Volver a las de siempre</button>') +
      '</div><div class="chips">' +
      qs
        .map(
          (q) =>
            '<span class="chip cp-q">' +
            e(q) +
            '<button type="button" class="cp-q-x" data-act="q-quitar" data-q="' +
            e(q) +
            '" aria-label="Quitar la búsqueda ' +
            e(q) +
            '"' +
            (qs.length <= 1 || !A.loaded ? ' disabled' : '') +
            '>×</button></span>'
        )
        .join('') +
      '</div><form id="cp-q-form" class="cp-q-form"><label for="cp-q-nueva" class="sr-only">Agregar una búsqueda</label><input id="cp-q-nueva" maxlength="60" autocomplete="off" placeholder="' +
      (lleno ? 'Quitá una para agregar otra' : 'Agregar búsqueda, ej. faja lumbar') +
      '"' +
      (lleno ? ' disabled' : '') +
      dis +
      '><button class="btn ghost" type="submit"' +
      (lleno ? ' disabled' : '') +
      dis +
      '>Agregar</button></form></div></div>';
    if (keep != null) {
      const inp = $('#cp-q-nueva', box);
      if (inp && !inp.disabled) {
        inp.value = keep;
        inp.focus();
      }
    } else if (keepCfg) {
      const opt = $('[data-cfg="' + keepCfg + '"]', box);
      if (opt) opt.focus();
    }
  }

  function renderFound() {
    const box = el && $('#cp-found', el);
    if (!box) return;
    if (!ultimoCargado) {
      box.innerHTML = '<h3>Qué encontré</h3><p class="muted small">Cargando el último escaneo…</p>';
      return;
    }
    const u = ultimo;
    if (!u) {
      box.innerHTML =
        '<h3>Qué encontré</h3>' +
        emptyState(
          'Todavía no hay escaneos',
          'Cuando escanees, acá vas a ver los anuncios nuevos de la competencia, los que llevan ' +
            CP.GANADOR_DIAS +
            ' días o más activos (señal de que les rinden), sus precios contra los tuyos y qué probar en ViaCare.'
        );
      return;
    }
    const pb = Array.isArray(u.porBusqueda) ? u.porBusqueda : [];
    box.innerHTML =
      '<div class="panel-head"><h3>Qué encontré</h3><div class="row-actions"><span class="muted small">Escaneado ' +
      e(U.timeAgo(u.fecha)) +
      '</span>' +
      (u.resumen ? '<button class="btn ghost" data-act="found-copiar">Copiar</button>' : '') +
      '</div></div><div class="chips">' +
      chip(plural(u.nuevos || 0, 'anuncio nuevo', 'anuncios nuevos'), u.nuevos ? 'info' : 'neutral') +
      chip((u.ganadores || 0) + ' activos ' + CP.GANADOR_DIAS + '+ días', u.ganadores ? 'good' : 'neutral') +
      chip(plural(u.anunciantesNuevos || 0, 'anunciante nuevo', 'anunciantes nuevos'), u.anunciantesNuevos ? 'source' : 'neutral') +
      chip(plural(u.total || 0, 'anuncio visto', 'anuncios vistos'), 'neutral') +
      '</div>' +
      (u.nombresNuevos && u.nombresNuevos.length ? '<p class="small"><span class="eyebrow">Anunciantes nuevos</span>' + e(u.nombresNuevos.join(', ')) + '</p>' : '') +
      (u.dominiosNuevos && u.dominiosNuevos.length ? '<p class="small"><span class="eyebrow">Tiendas sumadas para revisar</span>' + e(u.dominiosNuevos.join(', ')) + '</p>' : '') +
      (u.aviso ? '<p class="error-text">' + e(u.aviso) + '</p>' : '') +
      (pb.length
        ? '<ul class="auto-progress cp-found-q">' +
          pb
            .map(
              (b) =>
                '<li><span class="st ' +
                (b.error ? 'err' : 'ok') +
                '">' +
                (b.error ? 'error' : b.anuncios ? 'listo' : 'sin anuncios') +
                '</span><span>' +
                e(b.q) +
                ' <span class="muted">· ' +
                e(b.error || (b.anuncios ? plural(b.anuncios, 'anuncio', 'anuncios') + ' · ' + plural(b.nuevos, 'nuevo', 'nuevos') : 'ningún anuncio activo')) +
                '</span></span></li>'
            )
            .join('') +
          '</ul>'
        : '') +
      (u.resumen
        ? '<div class="findings">' + e(u.resumen) + '</div>'
        : '<p class="muted small">' +
          (!u.total ? 'No apareció ningún anuncio activo con estas búsquedas.' : u.errorResumen ? 'No se pudo escribir el resumen: ' + e(u.errorResumen) : A && A.running === 'competencia' ? 'Escribiendo el resumen…' : 'Sin resumen en este escaneo.') +
          '</p>') +
      '<p class="note">Meta no publica cuánto vende cada anuncio. Que siga activo ' + CP.GANADOR_DIAS + ' días o más es una señal de que le rinde, no un dato de ventas.</p>';
  }

  function plural(n, uno, varios) {
    return (n || 0) + ' ' + (n === 1 ? uno : varios);
  }

  function onAuto(ev) {
    if (!el) return;
    if (ev.type === 'cfg') {
      if (!ev.job || ev.job === 'competencia') {
        renderAutoHead();
        renderAutoCfg();
      }
      return;
    }
    if (ev.job !== 'competencia') {
      if (ev.type === 'start' || ev.type === 'done' || ev.type === 'error') renderAutoHead();
      return;
    }
    if (ev.type === 'start') vivo.items = [];
    if (ev.type === 'skip' && pedido) toast(ev.motivo || 'No se pudo escanear acá.', 'warn');
    renderAutoHead();
    renderAutoProg();
    if (ev.type === 'done' || ev.type === 'error') {
      renderFound();
      renderDataSoon();
    }
  }

  function escanearAhora() {
    if (!A || pedido || A.running === 'competencia') return;
    pedido = true;
    renderAutoHead();
    A.run('competencia', { origen: 'manual' }).finally(() => {
      pedido = false;
      renderAutoHead();
    });
  }

  function agregarBusqueda(form) {
    const inp = $('#cp-q-nueva', form);
    const r = S.agregarBusqueda(busquedasCfg(), inp ? inp.value : '');
    if (r.error) {
      toast(r.error, 'warn');
      return;
    }
    if (inp) inp.value = '';
    A.setCfg('competencia', { busquedas: r.lista });
    const nuevo = $('#cp-q-nueva', el);
    if (nuevo && !nuevo.disabled) nuevo.focus();
  }

  // Redibuja la tabla sin molestar si el usuario está escribiendo en un campo de esta pestaña
  function renderDataSoon() {
    if (!el) return;
    clearTimeout(dataTimer);
    dataTimer = setTimeout(() => {
      const a = document.activeElement;
      const tipeando = a && el.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && Date.now() - ultimoTipeo < 2500;
      if (tipeando) renderDataSoon();
      else renderData();
    }, 300);
  }

  function renderLinks() {
    $('#cp-links', el).innerHTML =
      '<h3>1. Buscá en la Biblioteca de anuncios</h3><p class="muted small">Se abre filtrada por Argentina y anuncios activos. Mirá la fecha “Comenzó a circular el…”: los que llevan ' +
      CP.GANADOR_DIAS +
      ' días o más son los que les rinden.</p><div class="row-actions">' +
      CP.BUSQUEDAS.map((q) => '<a class="btn ghost" href="' + e(CP.adLibraryUrl(q)) + '" target="_blank" rel="noopener">' + e(q) + '</a>').join('') +
      '<a class="btn ghost" href="' +
      e(CP.tiktokTopAdsUrl()) +
      '" target="_blank" rel="noopener">TikTok Creative Center</a></div>';
  }

  function renderInput() {
    const box = $('#cp-input', el);
    if (!box) return;
    const canImg = !!state.imgLimits;
    box.innerHTML =
      '<h3>2. Traé lo que encontraste</h3>' +
      (AI.sample
        ? '<p class="muted small">En la página de resultados seleccioná todo (Ctrl+A o Cmd+A), copiá y pegalo acá. ' +
          (canImg ? 'También podés pegar o subir capturas de pantalla (hasta ' + state.imgLimits.maxCount + ').' : '') +
          '</p><label for="cp-texto" class="sr-only">Texto copiado de la Biblioteca de anuncios</label><textarea id="cp-texto" rows="6" placeholder="Pegá acá el texto de la Biblioteca de anuncios…">' +
          e(state.texto) +
          '</textarea>' +
          (canImg
            ? '<div class="row-actions"><label class="btn ghost file-btn">Subir capturas<input type="file" id="cp-imgs" accept="' +
              e(state.imgLimits.mediaTypes.join(',')) +
              '" multiple hidden></label>' +
              (state.imagenes.length ? '<span class="muted small">' + state.imagenes.length + ' captura(s) lista(s)</span><button class="btn link" data-act="quitar-imgs">Quitar</button>' : '') +
              '</div>'
            : '') +
          '<div class="row-actions">' +
          (state.running
            ? '<button class="btn ghost" data-act="detener">Detener</button><span class="muted">Leyendo los anuncios… puede tardar un minuto.</span>'
            : '<button class="btn" data-act="extraer">Extraer anuncios</button>') +
          '</div>' +
          (state.error ? '<p class="error-text">' + e(state.error) + '</p>' : '')
        : '<p class="muted small">Abrí el panel desde claude.ai para que Claude lea el texto o las capturas. Mientras tanto, cargalos a mano.</p>') +
      '<details class="manual"><summary>Cargar un anuncio a mano</summary><form id="cp-form" class="review-form"><div class="form-grid">' +
      inp('anunciante', 'Anunciante') +
      inp('desde', 'Activo desde', 'date') +
      '<label for="cp-f-angulo">Ángulo<select id="cp-f-angulo" name="angulo">' +
      Object.entries(CP.ANGULOS)
        .map(([k, v]) => '<option value="' + k + '">' + e(v) + '</option>')
        .join('') +
      '</select></label>' +
      inp('oferta', 'Oferta') +
      inp('precio', 'Precio') +
      '<label for="cp-f-formato">Formato<select id="cp-f-formato" name="formato"><option>video</option><option>imagen</option><option>carrusel</option></select></label></div>' +
      '<label for="cp-f-gancho">Gancho (primera frase)<input id="cp-f-gancho" name="gancho" required></label><label for="cp-f-nota">Nota<input id="cp-f-nota" name="nota"></label><div class="row-actions"><button class="btn" type="submit">Guardar anuncio</button></div></form></details>';
  }

  function inp(k, label, type) {
    return '<label for="cp-f-' + k + '">' + e(label) + '<input id="cp-f-' + k + '" name="' + k + '"' + (type ? ' type="' + type + '"' : '') + '></label>';
  }

  function adsList() {
    return [...state.ads.entries()].map(([id, a]) => Object.assign({ id }, a));
  }

  function renderData() {
    const s = CP.summarize(adsList());
    const sum = $('#cp-summary', el);
    const table = $('#cp-table', el);
    if (!s.total) {
      sum.innerHTML = '';
      $('#cp-ideas', el).hidden = true;
      table.innerHTML = '<h3>Anuncios guardados</h3>' + emptyState('Todavía no hay anuncios', 'Buscá en la Biblioteca, pegá lo que encontraste y tocá “Extraer anuncios”. Quedan guardados acá para comparar.');
      return;
    }
    $('#cp-ideas', el).hidden = false;
    const top = (arr) => arr.slice(0, 4).map(([k, n]) => chip((CP.ANGULOS[k] || k) + ' · ' + n, 'source')).join('');
    sum.innerHTML =
      '<div class="summary-strip">' +
      stat(s.total, 'anuncios guardados') +
      stat(s.anunciantes, 'anunciantes') +
      stat(s.ganadores, 'activos hace ' + CP.GANADOR_DIAS + '+ días', s.ganadores ? 'good' : '') +
      '</div><div class="panel"><div class="kv"><span class="eyebrow">Ángulos</span><div class="chips">' +
      (top(s.angulos) || '<span class="muted small">—</span>') +
      '</div></div><div class="kv"><span class="eyebrow">Ofertas</span><div class="chips">' +
      (s.ofertas.length ? s.ofertas.slice(0, 6).map(([k, n]) => chip(k + ' · ' + n, 'neutral')).join('') : '<span class="muted small">—</span>') +
      '</div></div></div>';
    table.innerHTML =
      '<div class="panel-head"><h3>Anuncios guardados</h3><button class="btn link" data-act="borrar-todo">Borrar todos</button></div><div class="table-wrap"><table class="table comp"><thead><tr><th>Anunciante</th><th class="num">Días</th><th>Ángulo</th><th>Oferta</th><th class="num">Precio</th><th>Gancho</th><th></th></tr></thead><tbody>' +
      s.ads
        .map(
          (a) =>
            '<tr><th scope="row">' +
            e(a.anunciante || '—') +
            (ultimo && S.esNuevo(a, ultimo.fecha) ? ' ' + chip('nuevo', 'info') : '') +
            '<div class="muted small">' +
            e([a.formato || '', a.ultimaVez ? 'visto ' + U.timeAgo(a.ultimaVez) : ''].filter(Boolean).join(' · ')) +
            '</div></th><td class="num">' +
            (a.dias != null ? chip(a.dias + ' d', a.dias >= CP.GANADOR_DIAS ? 'good' : 'neutral') : '—') +
            '</td><td>' +
            e(CP.ANGULOS[a.angulo] || a.angulo || '') +
            '</td><td>' +
            e(a.oferta || '—') +
            '</td><td class="num">' +
            (a.precio ? e(U.money(a.precio)) : '—') +
            '</td><td class="hook-cell">“' +
            e(a.gancho) +
            '”' +
            (a.nota ? '<div class="muted small">' + e(a.nota) + '</div>' : '') +
            '</td><td><div class="cp-acts">' +
            (a.idBiblioteca
              ? '<a class="btn link" href="' + e(R.adUrl(a.idBiblioteca)) + '" target="_blank" rel="noopener" aria-label="Ver en la Biblioteca el anuncio de ' + e(a.anunciante || '') + '">Ver</a>'
              : '') +
            '<button class="btn link" data-act="borrar" data-id="' +
            e(a.id) +
            '" aria-label="Borrar anuncio de ' +
            e(a.anunciante || '') +
            '">Borrar</button></div></td></tr>'
        )
        .join('') +
      '</tbody></table></div>';
    renderIdeas();
  }

  function stat(v, label, tone) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"><span class="stat-value">' + e(v) + '</span><span class="stat-label">' + e(label) + '</span></div>';
  }

  function renderIdeas() {
    const box = $('#cp-ideas', el);
    if (!box || box.hidden) return;
    const I = state.ideas;
    box.innerHTML =
      '<div class="panel-head"><h3>Qué aprender y qué probar</h3>' +
      (AI.sample
        ? '<div class="row-actions">' +
          (I.running ? '<button class="btn ghost" data-act="ideas-stop">Detener</button>' : '<button class="btn" data-act="ideas">' + (I.text ? 'Actualizar' : 'Pedir resumen e ideas') + '</button>') +
          (I.text && !I.running ? '<button class="btn ghost" data-act="ideas-copiar">Copiar</button>' : '') +
          '</div>'
        : '') +
      '</div>' +
      (I.text || I.running
        ? '<div class="ia-out' + (I.running && !I.text ? ' is-thinking' : '') + '">' + (I.text ? e(I.text) : 'Pensando…') + '</div>' + (I.fecha && !I.running ? '<p class="muted small">Generado ' + e(U.timeAgo(I.fecha)) + '</p>' : '')
        : '<p class="muted">' + (AI.sample ? 'Claude compara los anuncios guardados y te propone 5 creativos para ViaCare.' : 'Abrí el panel desde claude.ai para pedir el resumen.') + '</p>') +
      (I.error ? '<p class="error-text">' + e(I.error) + '</p>' : '');
  }

  async function extraer() {
    const texto = ($('#cp-texto', el) || {}).value || '';
    if (!texto.trim() && !state.imagenes.length) {
      toast('Pegá el texto de la Biblioteca o subí capturas.', 'warn');
      return;
    }
    ctl = new AbortController();
    state.running = true;
    state.error = '';
    renderInput();
    try {
      const opts = { signal: ctl.signal, cache: false };
      if (state.imagenes.length) opts.images = state.imagenes;
      const data = await AI.sample.json(CP.extractPrompt(texto, state.imagenes.length, U.todayKeyAR()), opts);
      const ads = CP.sanitizeAds(data);
      if (!ads.length) state.error = 'No encontramos anuncios en lo que pegaste. Copiá la página de resultados completa o subí capturas.';
      else {
        const existentes = adsList().map((a) => (a.anunciante + '|' + a.gancho).toLowerCase());
        let nuevos = 0;
        for (const a of ads) {
          if (existentes.includes((a.anunciante + '|' + a.gancho).toLowerCase())) continue;
          const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          a.cargado = new Date().toISOString();
          state.ads.set(id, a);
          nuevos++;
          await Store.set('competencia/' + id, a).catch(storeFail);
        }
        toast(nuevos + ' anuncio(s) nuevo(s) guardado(s).', 'good');
        state.texto = '';
        state.imagenes = [];
      }
    } catch (err) {
      if (err && err.code !== 'cancelled') state.error = err.code === 'images_unavailable' || err.code === 'image_rejected' ? 'No se pudieron enviar las capturas. Probá con otras o pegá el texto.' : AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.running = false;
    renderInput();
    renderData();
  }

  async function ideas() {
    ctl = new AbortController();
    state.ideas = { text: '', fecha: null, running: true, error: '' };
    renderIdeas();
    try {
      const s = CP.summarize(adsList());
      const res = await AI.sample(CP.insightPrompt(s.ads, U.todayKeyAR(), App.datos()), {
        signal: ctl.signal,
        cache: false,
        onText: ({ text }) => {
          state.ideas.text = text;
          const out = el.querySelector('#cp-ideas .ia-out');
          if (out) {
            out.classList.remove('is-thinking');
            out.textContent = text;
          }
        },
      });
      state.ideas.text = res.text;
      state.ideas.fecha = new Date().toISOString();
      Store.set('ideas/competencia', { text: res.text, fecha: state.ideas.fecha }).catch(storeFail);
    } catch (err) {
      state.ideas.text = err.text || '';
      if (err.code !== 'cancelled') state.ideas.error = AI.errorText(err);
    }
    state.ideas.running = false;
    renderIdeas();
  }

  function addImages(files) {
    const lim = state.imgLimits;
    if (!lim) return;
    const ok = [...files].filter((f) => lim.mediaTypes.includes(f.type) && f.size <= lim.maxInputBytes);
    state.imagenes = state.imagenes.concat(ok).slice(0, lim.maxCount);
    if (ok.length < files.length) toast('Algunas imágenes no se pudieron usar (tipo o tamaño).', 'warn');
    renderInput();
  }

  function onPaste(ev) {
    if (!state.imgLimits || !ev.clipboardData) return;
    const files = [...ev.clipboardData.files].filter((f) => f.type.startsWith('image/'));
    if (files.length) {
      ev.preventDefault();
      addImages(files);
    }
  }

  function onChange(ev) {
    if (ev.target.id === 'cp-imgs' && ev.target.files) addImages(ev.target.files);
    const k = ev.target.dataset && ev.target.dataset.cfg;
    if (k && A) A.setCfg('competencia', { [k]: ev.target.type === 'checkbox' ? ev.target.checked : Number(ev.target.value) });
  }

  function onSubmit(ev) {
    const q = ev.target.closest('#cp-q-form');
    if (q) {
      ev.preventDefault();
      agregarBusqueda(q);
      return;
    }
    const f = ev.target.closest('#cp-form');
    if (!f) return;
    ev.preventDefault();
    const fd = new FormData(f);
    const a = CP.sanitizeAds([Object.fromEntries(fd.entries())])[0];
    if (!a) {
      toast('Escribí al menos el gancho.', 'warn');
      return;
    }
    a.cargado = new Date().toISOString();
    const id = 'a' + Date.now().toString(36);
    state.ads.set(id, a);
    Store.set('competencia/' + id, a).catch(storeFail);
    f.reset();
    renderData();
    toast('Anuncio guardado.', 'good');
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    switch (t.dataset.act) {
      case 'auto-escanear':
        escanearAhora();
        break;
      case 'auto-detener':
        if (A) A.stop();
        break;
      case 'q-quitar': {
        const qs = busquedasCfg();
        if (qs.length > 1) A.setCfg('competencia', { busquedas: qs.filter((x) => x !== t.dataset.q) });
        break;
      }
      case 'q-default':
        A.setCfg('competencia', { busquedas: CP.BUSQUEDAS.slice() });
        break;
      case 'found-copiar':
        if (ultimo && ultimo.resumen) copyText(ultimo.resumen, t);
        break;
      case 'extraer':
        extraer();
        break;
      case 'detener':
      case 'ideas-stop':
        if (ctl) ctl.abort();
        break;
      case 'quitar-imgs':
        state.imagenes = [];
        renderInput();
        break;
      case 'ideas':
        ideas();
        break;
      case 'ideas-copiar':
        copyText(state.ideas.text, t);
        break;
      case 'borrar':
        state.ads.delete(t.dataset.id);
        Store.remove('competencia/' + t.dataset.id).catch(storeFail);
        renderData();
        break;
      case 'borrar-todo':
        if (t.dataset.confirm !== '1') {
          t.dataset.confirm = '1';
          t.textContent = 'Tocá de nuevo para borrar todo';
          setTimeout(() => {
            t.dataset.confirm = '';
            t.textContent = 'Borrar todos';
          }, 4000);
          return;
        }
        for (const id of [...state.ads.keys()]) Store.remove('competencia/' + id).catch(storeFail);
        state.ads = new Map();
        renderData();
        break;
    }
  }

  /* ---------- Escaneo automático: la tarea ---------- */

  function cortarSiCancelo(ctx) {
    if (ctx.signal.aborted) {
      const err = new Error('Cancelado.');
      err.code = 'cancelled';
      throw err;
    }
  }

  async function guardar(path, data) {
    try {
      await Store.set(path, data);
    } catch (err) {
      const code = err && err.code;
      throw new Error(
        code === 'invalid_argument'
          ? 'No tenés permiso para guardar cambios en este panel.'
          : code === 'quota_exceeded'
            ? 'Se llenó el espacio del panel. Borrá anuncios viejos para seguir guardando.'
            : 'No se pudo guardar lo que encontré. Revisá la conexión y probá de nuevo.'
      );
    }
  }

  function refrescarVivo() {
    if (!el) return;
    renderAutoProg();
  }

  /*
   * Recorre las búsquedas en la Biblioteca de anuncios con el navegador de Claude, extrae los anuncios con Claude,
   * los fusiona con los guardados y escribe "Qué encontré". Funciona aunque la pestaña no esté abierta.
   */
  async function escanear(ctx) {
    if (enCurso) throw new Error('Ya hay un escaneo en curso.');
    enCurso = true;
    try {
      return await escanearUnaVez(ctx);
    } finally {
      enCurso = false;
    }
  }

  async function escanearUnaVez(ctx) {
    const busquedas = busquedasCfg().slice(0, S.MAX_BUSQUEDAS);
    if (!busquedas.length) throw new Error('Agregá al menos una búsqueda para escanear.');
    const hoy = U.todayKeyAR();
    const ahora = new Date().toISOString();
    let docs = await Store.list('competencia');
    // Si la lectura vino vacía pero la pestaña ya tiene anuncios, usamos esos (para no duplicar todo)
    if (!docs.size && state.ads.size) docs = new Map(state.ads);
    const antes = [...docs.values()];
    const tocados = new Set();
    const items = busquedas.map((q) => ({ q, estado: 'espera', anuncios: 0, nuevos: 0, error: '' }));
    vivo.items = items;
    refrescarVivo();
    let nuevos = [];
    let leidas = 0;
    let aviso = '';
    const omitirResto = (i, motivo) => {
      for (const it of items.slice(i + 1)) {
        it.estado = 'omitida';
        it.error = motivo;
      }
    };

    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      cortarSiCancelo(ctx);
      it.estado = 'leyendo';
      ctx.progress(S.progreso(i, items.length, it.q));
      refrescarVivo();
      let texto = '';
      try {
        texto = await Browser.read(CP.adLibraryUrl(it.q), { ready: R.adLibraryReady, tries: 6, firstWait: 3000, wait: 3000 });
      } catch (err) {
        it.estado = 'error';
        it.error = Browser.errorText(err);
        if (Browser.fatal(err)) {
          omitirResto(i, S.NO_REVISADA);
          refrescarVivo();
          throw new Error(Browser.errorText(err));
        }
        refrescarVivo();
        continue;
      }
      cortarSiCancelo(ctx);
      const pagina = S.estadoPagina(texto);
      if (pagina === 'login') {
        it.estado = 'error';
        it.error = LOGIN;
        aviso = LOGIN + '.';
        omitirResto(i, 'No se revisó: Meta pide iniciar sesión.');
        refrescarVivo();
        break;
      }
      if (pagina !== 'anuncios') {
        if (pagina === 'vacia') {
          it.estado = 'sin';
          leidas++;
        } else {
          it.estado = 'error';
          it.error =
            pagina === 'cookies'
