<title>Panel ViaCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* styles.css */
/* Layout: app con barra lateral en la compu y barra inferior en el celular. Inicio con tarjetas de "lo que hay
   que hacer hoy"; cada herramienta abre con su resumen y una sola acción principal. Papel azulado claro,
   tinta azul noche, azul ViaCare como acento y durazno para lo nuevo. */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f1f4fa;
  --surface-3: #e8edf6;
  --ink: #131a2b;
  --muted: #5f6b7d;
  --faint: #8a95a7;
  --line: #e2e7f0;
  --line-strong: #cfd7e4;
  --accent: #3157e8;
  --accent-hover: #2647cc;
  --accent-ink: #ffffff;
  --accent-soft: #eaefff;
  --peach: #f27a4a;
  --peach-soft: #ffeee6;
  --wa: #12a150;
  --wa-ink: #ffffff;
  --good: #128a4a;
  --good-soft: #e3f6ea;
  --warn: #b25e09;
  --warn-soft: #fff1dd;
  --bad: #d23b2f;
  --bad-soft: #fde8e6;
  --info: #1f6fd1;
  --info-soft: #e5f0fd;
  --source: #6a4fd8;
  --source-soft: #efebfd;
  --skeleton: #e7ecf4;
  --shadow-sm: 0 1px 2px rgba(19, 26, 43, 0.05);
  --shadow: 0 1px 2px rgba(19, 26, 43, 0.04), 0 6px 20px -6px rgba(19, 26, 43, 0.1);
  --shadow-lg: 0 20px 48px -12px rgba(19, 26, 43, 0.25);
  --font-display: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r-lg: 18px;
  --r: 14px;
  --r-sm: 10px;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.0625rem;
  --step-2: 1.5rem;
  --step-3: 1.875rem;
  --side-w: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0b101b;
    --surface: #141a28;
    --surface-2: #1a2132;
    --surface-3: #222a3e;
    --ink: #edf1f8;
    --muted: #9aa5b8;
    --faint: #6f7a8e;
    --line: #242c40;
    --line-strong: #323c55;
    --accent: #7d97ff;
    --accent-hover: #93a9ff;
    --accent-ink: #0b101b;
    --accent-soft: #1c2650;
    --peach: #ff9a70;
    --peach-soft: #3a2218;
    --wa: #2fc06c;
    --wa-ink: #07140c;
    --good: #4fd08a;
    --good-soft: #0f2c1d;
    --warn: #f2b155;
    --warn-soft: #33250e;
    --bad: #ff7b70;
    --bad-soft: #3a1714;
    --info: #74aef5;
    --info-soft: #11263f;
    --source: #b4a3ff;
    --source-soft: #241d48;
    --skeleton: #1c2333;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px -10px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 24px 56px -12px rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0b101b;
  --surface: #141a28;
  --surface-2: #1a2132;
  --surface-3: #222a3e;
  --ink: #edf1f8;
  --muted: #9aa5b8;
  --faint: #6f7a8e;
  --line: #242c40;
  --line-strong: #323c55;
  --accent: #7d97ff;
  --accent-hover: #93a9ff;
  --accent-ink: #0b101b;
  --accent-soft: #1c2650;
  --peach: #ff9a70;
  --peach-soft: #3a2218;
  --wa: #2fc06c;
  --wa-ink: #07140c;
  --good: #4fd08a;
  --good-soft: #0f2c1d;
  --warn: #f2b155;
  --warn-soft: #33250e;
  --bad: #ff7b70;
  --bad-soft: #3a1714;
  --info: #74aef5;
  --info-soft: #11263f;
  --source: #b4a3ff;
  --source-soft: #241d48;
  --skeleton: #1c2333;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px -10px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 24px 56px -12px rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: var(--step-3); font-weight: 800; }
h3 { font-size: var(--step-1); font-weight: 700; letter-spacing: -0.01em; }
h4 { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.selectable { user-select: text; -webkit-user-select: text; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-right: 6px; }
.error-text { color: var(--bad); font-size: var(--step--1); }
.warn-text { color: var(--warn); }
.nowrap { white-space: nowrap; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.fill { fill: currentColor; stroke: none; }

/* ---------- Estructura: barra lateral + contenido ---------- */
.shell { min-height: 100%; }
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side-w); z-index: 10;
  display: flex; flex-direction: column; gap: 6px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
.brand-mark svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; letter-spacing: -0.03em; line-height: 1.1; }
.brand-sub { display: block; color: var(--faint); font-size: 0.75rem; font-weight: 500; letter-spacing: 0; }
.nav { display: grid; gap: 2px; }
.nav-group { margin: 14px 10px 4px; font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 10px; background: none; cursor: pointer;
  color: var(--muted); font-weight: 600; font-size: 0.9rem; text-align: left;
}
.nav-item .ico { width: 19px; height: 19px; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.is-on { background: var(--accent-soft); color: var(--accent); }
.nav-item .nav-label { flex: 1; min-width: 0; }
.tab-badge { min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.6875rem; font-weight: 700; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.tab-badge.is-new { background: var(--peach); color: #fff; text-transform: lowercase; }
.side-foot { margin-top: auto; padding: 12px 8px 0; display: grid; gap: 6px; border-top: 1px solid var(--line); }
.conn-row { display: grid; gap: 6px; }
.conn { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted); font-weight: 500; min-width: 0; }
.conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.conn.tone-good .dot { background: var(--good); }
.conn.tone-bad .dot { background: var(--bad); }
.conn.tone-warn .dot { background: var(--warn); }
.conn.tone-info .dot { background: var(--info); }

.main-col { margin-left: var(--side-w); min-width: 0; }
.app { max-width: 1080px; margin: 0 auto; padding-inline: 32px; padding-block: 0 56px; }
.topbar { display: none; }
.bottom-nav { display: none; }

/* Aviso de tarea automática en curso */
.auto-strip {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 -32px; padding: 9px 32px; font-size: 0.8125rem; font-weight: 600;
  background: var(--accent-soft); color: var(--accent);
}
.auto-strip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s ease-in-out infinite; }
.auto-strip .txt { flex: 1; min-width: 0; color: var(--ink); font-weight: 500; }
.auto-strip button { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 2px 4px; }

/* Menú "Más" del celular */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(8, 12, 22, 0.45); }
.sheet-card { width: 100%; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow-lg); display: grid; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sheet-item { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 0.8125rem; cursor: pointer; text-align: center; }
.sheet-item .ico { width: 22px; height: 22px; color: var(--accent); }
.sheet-item.is-on { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- Encabezado de cada herramienta ---------- */
.tool { display: grid; gap: 18px; padding-top: 30px; }
.tool > div:empty { display: none; }
.tool > * { min-width: 0; }
.tool-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; }
.tool-head > div:first-child { display: grid; gap: 4px; max-width: 60ch; min-width: 0; }
.lede { color: var(--muted); font-size: 0.9375rem; }
.tool-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 18px; align-items: start; }
.grid-2 > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow-sm); }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.panel-title { display: flex; align-items: center; gap: 10px; }
.panel-title .ico-bubble { width: 34px; height: 34px; }
.note { color: var(--muted); font-size: var(--step--1); }

/* Ícono en burbuja de color */
.ico-bubble { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); flex: none; }
.ico-bubble .ico { width: 20px; height: 20px; }
.ico-bubble.tone-good { background: var(--good-soft); color: var(--good); }
.ico-bubble.tone-warn { background: var(--warn-soft); color: var(--warn); }
.ico-bubble.tone-bad { background: var(--bad-soft); color: var(--bad); }
.ico-bubble.tone-peach { background: var(--peach-soft); color: var(--peach); }
.ico-bubble.tone-source { background: var(--source-soft); color: var(--source); }
.ico-bubble.tone-wa { background: var(--good-soft); color: var(--wa); }

/* Ayuda plegable: un "?" que abre la explicación */
.info { position: relative; display: inline-block; vertical-align: middle; }
.info > summary { list-style: none; cursor: pointer; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--faint); }
.info > summary::-webkit-details-marker { display: none; }
.info > summary:hover { color: var(--accent); background: var(--accent-soft); }
.info > summary .ico { width: 17px; height: 17px; }
.info-pop { position: absolute; z-index: 15; top: 28px; left: -8px; width: min(320px, 80vw); padding: 12px 14px; border-radius: var(--r-sm); background: var(--ink); color: var(--bg); font-size: 0.8125rem; font-weight: 500; line-height: 1.5; box-shadow: var(--shadow-lg); letter-spacing: 0; text-transform: none; }

/* Más opciones plegables */
.more { border-top: 1px solid var(--line); padding-top: 12px; }
.more > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; font-size: 0.8125rem; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary .ico { width: 16px; height: 16px; transition: transform 0.15s; }
.more[open] > summary .ico { transform: rotate(90deg); }
.more[open] > summary { margin-bottom: 12px; color: var(--ink); }
.more > summary:hover { color: var(--ink); }

/* Interruptor */
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.875rem; font-weight: 500; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--line-strong); transition: background 0.15s; flex: none; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform 0.15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 16px; border-radius: 12px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 0.875rem; text-decoration: none; cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow-sm); transition: background 0.12s, border-color 0.12s, transform 0.06s;
}
.btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); box-shadow: none; }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--line-strong); }
.btn.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; box-shadow: none; }
.btn.soft:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: var(--wa-ink); }
.btn.wa:hover { filter: brightness(1.05); }
.btn.link { background: none; border: 0; color: var(--accent); padding: 4px 2px; min-height: 0; font-weight: 600; text-decoration: none; box-shadow: none; }
.btn.link:hover { text-decoration: underline; text-underline-offset: 3px; background: none; }
.btn.icon-only { padding: 8px; min-width: 40px; }
.btn.sm { min-height: 32px; padding: 5px 12px; font-size: 0.8125rem; border-radius: 10px; }
.btn .ico { width: 17px; height: 17px; }
.file-btn { position: relative; }
.row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.decide-btn { background: var(--surface); color: var(--ink); border-color: var(--line-strong); font-weight: 600; box-shadow: none; }
.decide-btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
.decide-btn.tone-good.is-on { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.decide-btn.tone-warn.is-on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.decide-btn.tone-bad.is-on { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

/* Segmentado (filtros) */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-3); border-radius: 13px; max-width: 100%; }
.seg-btn { border: 0; background: none; padding: 7px 13px; border-radius: 10px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 0.8125rem; display: inline-flex; align-items: center; gap: 6px; }
.seg-btn:hover { color: var(--ink); }
.seg-btn.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.seg-count { font-variant-numeric: tabular-nums; color: var(--faint); font-weight: 700; font-size: 0.75rem; background: var(--surface-2); border-radius: 999px; padding: 0 6px; }
.seg-btn.is-on .seg-count { background: var(--accent-soft); color: var(--accent); }

/* ---------- Chips y avisos ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 0; max-width: 100%; overflow-wrap: anywhere; }
.chip.tone-good { background: var(--good-soft); color: var(--good); }
.chip.tone-warn { background: var(--warn-soft); color: var(--warn); }
.chip.tone-bad { background: var(--bad-soft); color: var(--bad); }
.chip.tone-info { background: var(--info-soft); color: var(--info); }
.chip.tone-source { background: var(--source-soft); color: var(--source); }
.chip.tone-peach { background: var(--peach-soft); color: var(--peach); }
.badge { font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.06em; background: var(--peach-soft); color: var(--peach); padding: 2px 7px; border-radius: 999px; font-weight: 800; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 16px; border-radius: var(--r); border: 0; }
.banner-text { flex: 1 1 260px; min-width: 0; font-size: 0.875rem; }
.banner-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.banner.tone-bad { background: var(--bad-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--bad); }
.banner.tone-warn { background: var(--warn-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--warn); }
.banner.tone-info { background: var(--info-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--info); }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; max-width: min(92vw, 460px); padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 0.875rem; box-shadow: var(--shadow-lg); }
.toast.tone-bad { background: var(--bad); color: #fff; }

/* ---------- Resumen en números ---------- */
.summary-strip, .decision-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.summary-strip.is-loading { display: block; background: var(--surface); padding: 16px 18px; color: var(--muted); border-radius: var(--r); border: 1px solid var(--line); }
.stat, .dstat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; align-content: start; box-shadow: var(--shadow-sm); }
.stat-value { font-family: var(--font-display); font-size: 1.625rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: -0.02em; }
.stat-label { color: var(--muted); font-size: var(--step--1); font-weight: 500; }
.stat.tone-warn .stat-value, .dstat.tone-warn .stat-value { color: var(--warn); }
.stat.tone-good .stat-value, .dstat.tone-good .stat-value { color: var(--good); }
.dstat.tone-bad .stat-value { color: var(--bad); }
.dstat.tone-info .stat-value { color: var(--info); }

/* ---------- Tarjetas de pedido / cliente ---------- */
.order-list { display: grid; gap: 12px; }
.order-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: grid; gap: 8px; min-width: 0; box-shadow: var(--shadow-sm); transition: box-shadow 0.15s; }
.order-card:hover { box-shadow: var(--shadow); }
.order-card.is-good { box-shadow: inset 4px 0 0 var(--good), var(--shadow-sm); }
.order-card.is-bad { box-shadow: inset 4px 0 0 var(--bad), var(--shadow-sm); }
.oc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.oc-id { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }

.oc-id .muted { font-size: var(--step--1); }
.oc-total { font-size: 1.0625rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.oc-who { overflow-wrap: anywhere; }
.oc-addr { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }
.oc-phone { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 0.875rem; }
.oc-phone .muted { font-size: var(--step--1); }
.warnings { margin: 0; padding: 9px 12px 9px 28px; background: var(--warn-soft); border-radius: var(--r-sm); font-size: var(--step--1); color: var(--ink); }
.oc-actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 2px; }
.dispatch { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: var(--r); background: var(--good-soft); }
.dispatch > div { min-width: 0; overflow-wrap: anywhere; }
.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); padding: 34px 20px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.empty .ico-bubble { margin-bottom: 4px; }
.empty p { color: var(--muted); max-width: 46ch; font-size: 0.875rem; }
.skeleton { height: 128px; border-radius: var(--r-lg); background: var(--skeleton); animation: pulse 1.4s ease-in-out infinite; }
.kpi-sk { height: 104px; }
@keyframes pulse { 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { .skeleton, .auto-strip .dot { animation: none; } }

/* ---------- Inicio ---------- */
.home-hello { display: grid; gap: 2px; }
.home-hello h2 { font-size: 2rem; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.home-card {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center;
  padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface);
  box-shadow: var(--shadow-sm); cursor: pointer; text-align: left; color: var(--ink); transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s;
}
.home-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); border-color: var(--line-strong); }
.home-card .ico-bubble { grid-row: span 2; width: 46px; height: 46px; border-radius: 14px; }
.home-card .ico-bubble .ico { width: 22px; height: 22px; }
.hc-value { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hc-label { color: var(--muted); font-size: 0.875rem; font-weight: 500; }
.hc-cta { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 700; font-size: 0.8125rem; color: var(--accent); }
.hc-cta .ico { width: 16px; height: 16px; }
.home-card.is-quiet .hc-value { color: var(--muted); font-size: 1.125rem; }
.home-auto { display: grid; gap: 10px; }
.auto-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.875rem; }
.auto-row:first-of-type { border-top: 0; }
.auto-row .ar-name { flex: 1; min-width: 0; font-weight: 600; }
.auto-row .ar-meta { color: var(--muted); font-size: 0.8125rem; }

/* Ganancia */
.dates { display: flex; flex-wrap: wrap; gap: 10px; }
.dates label, .field-inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.875rem; }
input[type='date'], select, input, textarea { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 8px 11px; min-height: 40px; max-width: 100%; transition: border-color 0.12s, box-shadow 0.12s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input::placeholder, textarea::placeholder { color: var(--faint); }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 4px; align-content: start; box-shadow: var(--shadow-sm); }
.kpi.tone-good { box-shadow: inset 0 3px 0 var(--good), var(--shadow-sm); }
.kpi.tone-bad { box-shadow: inset 0 3px 0 var(--bad), var(--shadow-sm); }
.kpi-label { font-size: var(--step--1); color: var(--muted); font-weight: 500; }
.kpi-value { font-family: var(--font-display); font-size: var(--step-2); font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.kpi-sub { font-size: var(--step--1); color: var(--muted); }
.table-wrap { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
.table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.table th, .table td { padding: 10px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table thead th { font-size: 0.6875rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); font-weight: 700; white-space: nowrap; border-bottom-color: var(--line-strong); }
.table tbody tr:hover > * { background: var(--surface-2); }
.table tbody tr:last-child > * { border-bottom: 0; }
.table tbody th { font-weight: 500; white-space: nowrap; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table tr.is-winner th, .table tr.is-winner td { background: var(--good-soft); }
.nowrap { white-space: nowrap; }
.num-input { width: 100%; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.8125rem; }
.spend td { padding-block: 5px; }
.waterfall { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.waterfall li { display: grid; grid-template-columns: minmax(110px, 1.1fr) 2fr auto; align-items: center; gap: 10px; font-size: 0.875rem; }
.wf-track { height: 10px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.wf-bar { display: block; height: 100%; border-radius: 999px; }
.wf-bar.base { background: var(--accent); }
.wf-bar.cost { background: color-mix(in srgb, var(--muted) 55%, var(--surface)); }
.wf-bar.pos { background: var(--good); }
.wf-bar.neg { background: var(--bad); }
.wf-val { text-align: right; font-size: 0.8125rem; }
.wf-total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 600; }
.be { display: grid; gap: 10px; padding: 16px; border-radius: var(--r); background: var(--accent-soft); }
.be > div { display: grid; gap: 2px; }
.be-num { font-size: 1.25rem; font-weight: 500; }
.be-txt { font-size: 0.875rem; }
.chart-wrap { overflow-x: auto; }
.chart { display: block; max-width: none; }
.chart .zero { stroke: var(--line); stroke-width: 1; }
.chart .bar-pos { fill: var(--good); }
.chart .bar-neg { fill: var(--bad); }
.chart .hit { fill: transparent; }
.chart .bar-g:hover .bar-pos, .chart .bar-g:hover .bar-neg { opacity: 0.8; }
.chart .bar-label { fill: var(--ink); font-size: 11px; font-family: var(--font-mono); }
.chart .axis-label { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }

/* Creativos */
.dropzone { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 34px 18px; border: 2px dashed var(--line-strong); border-radius: var(--r-lg); background: var(--surface); cursor: pointer; transition: border-color 0.12s, background 0.12s; }
.dropzone:hover, .dropzone.is-over { border-color: var(--accent); background: var(--accent-soft); }
.dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.dropzone.is-compact { padding: 12px 16px; grid-template-columns: auto 1fr; text-align: left; justify-items: start; align-items: center; column-gap: 12px; }
.dz-title { font-weight: 600; }
.dz-sub { color: var(--muted); font-size: var(--step--1); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 0.875rem; }
.cr-meta { justify-content: space-between; }
.ads .ad-cell { min-width: 220px; max-width: 360px; }
.ad-name { font-family: var(--font-mono); font-size: 0.8125rem; overflow-wrap: anywhere; }
.ad-why { color: var(--muted); font-size: var(--step--1); margin-top: 4px; }
.mini-select { min-height: 26px; padding: 2px 6px; font-size: 0.75rem; margin-top: 4px; }
.ia-out { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.55; max-width: 75ch; }
.ia-out.is-thinking { color: var(--muted); }
details.panel > summary { cursor: pointer; font-weight: 600; font-family: var(--font-display); }
.map-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.map-grid label { display: grid; gap: 4px; font-size: var(--step--1); color: var(--muted); }

/* Reseñas */
.stars { color: var(--warn); letter-spacing: 1px; }
.stars .muted { color: var(--line); }
.review { margin: 0; padding: 10px 14px; border-left: 3px solid var(--good); background: var(--surface-2); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: 0.9rem; overflow-wrap: anywhere; }
.review footer { color: var(--muted); font-size: var(--step--1); margin-top: 4px; }
.review-form { display: grid; gap: 10px; padding: 12px; background: var(--surface-2); border-radius: var(--r-sm); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }
.form-grid.wide { grid-template-columns: 1fr minmax(120px, 180px); }
.form-grid label, .review-form > label, .ugc-form > label, .panel > label { display: grid; gap: 4px; font-size: var(--step--1); color: var(--muted); font-weight: 500; }
.form-grid input, .form-grid select, .ugc-form > label input, .review-form input { width: 100%; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.875rem; }
.checks label, .check { display: inline-flex; align-items: center; gap: 7px; }
.checks input, .check input { min-height: 0; width: 17px; height: 17px; accent-color: var(--accent); }
.code-block { margin: 0; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 0.75rem; overflow-x: auto; max-height: 220px; white-space: pre; }

/* Guiones */
.ugc-form fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.ugc-form legend { font-size: var(--step--1); color: var(--muted); font-weight: 500; margin-bottom: 6px; padding: 0; }
.pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pill-radio { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 0.875rem; }
.pill-radio input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pill-radio.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.pill-radio:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.out-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
#ugc-out, #cr-body, #gan-status, #conf-status, #res-status, #cp-summary, #cli-status, #of-warn, #pr-warn, #cm-warn { display: grid; gap: 16px; }
#ugc-out { gap: 14px; }
.script { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow-sm); display: grid; gap: 14px; min-width: 0; }
.script-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px; }
.script-head > div { display: grid; gap: 6px; min-width: 0; flex: 1 1 260px; }
.ficha { padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); display: grid; gap: 6px; font-size: 0.875rem; }
.clips { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.clip { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.clip-time { font-size: 0.75rem; color: var(--accent); font-weight: 500; padding-top: 2px; position: relative; }
.clip-body { display: grid; gap: 6px; min-width: 0; }
.clip-meta { font-size: 0.875rem; }
.clip-action { color: var(--muted); font-size: 0.875rem; }
.clip-dialog { font-size: 1rem; }
.prompt-box { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; background: var(--surface-2); display: grid; gap: 4px; min-width: 0; }
.prompt-box pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.5; max-height: 180px; overflow-y: auto; }
.continuity { color: var(--muted); }

/* Ajustes */
.settings { display: grid; gap: 12px; }
.setting { display: grid; grid-template-columns: 1fr minmax(120px, 160px); grid-template-areas: 'label input' 'help input'; gap: 2px 14px; align-items: center; }
.setting-label { grid-area: label; font-weight: 600; font-size: 0.875rem; }
.setting-help { grid-area: help; color: var(--muted); font-size: var(--step--1); }
.setting .input-unit { grid-area: input; }
.input-unit { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); }
.input-unit .unit { padding-left: 9px; color: var(--muted); font-size: 0.8125rem; }
.input-unit input { border: 0; width: 100%; text-align: right; font-family: var(--font-mono); font-size: 0.875rem; background: transparent; }
.input-unit:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-unit input:focus, .input-unit input:focus-visible { outline: none; box-shadow: none; }
.history { padding: 12px; background: var(--surface-2); border-radius: var(--r-sm); display: grid; gap: 4px; font-size: 0.875rem; }
.templates { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.template { display: grid; gap: 6px; align-content: start; }
.template > label { display: grid; gap: 4px; font-size: var(--step--1); color: var(--muted); font-weight: 600; }
.tpl-foot { display: flex; justify-content: flex-end; }
.preview { white-space: pre-wrap; font-size: 0.8125rem; background: var(--good-soft); padding: 12px 14px; border-radius: 16px 16px 16px 4px; overflow-wrap: anywhere; }


/* Clientes */
.msg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.msg-row select { min-height: 30px; padding: 3px 6px; font-size: 0.8125rem; }
.msg-preview > summary { cursor: pointer; color: var(--accent); font-size: var(--step--1); }
.msg-preview .preview { margin-top: 6px; }
.num-input.short { min-width: 0; width: 72px; }
.code-row { padding-top: 4px; }
details.panel[open] > summary { margin-bottom: 4px; }

/* Competencia */
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; }
.comp .hook-cell { min-width: 240px; max-width: 420px; }
.manual > summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: 0.875rem; }
.manual[open] > summary { margin-bottom: 10px; }

/* Comentarios */
.comment-card textarea { font-size: 0.9rem; }
.cm-q { font-size: 0.95rem; font-weight: 500; overflow-wrap: anywhere; }
.cm-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.lib { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.lib-group { display: grid; gap: 6px; align-content: start; }
.lib-item { padding: 8px 10px; background: var(--surface-2); border-radius: var(--r-sm); display: grid; gap: 2px; font-size: 0.875rem; }

/* Ofertas */
.offers-edit input { width: 100%; min-width: 120px; }
.offers-edit .num-input { min-width: 90px; }
.offers-edit .num-input.short { width: 64px; min-width: 64px; }
.input-unit.inline { display: inline-flex; width: auto; }
.input-unit.inline .unit { padding: 0 8px 0 0; }
.offer-bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.offer-bars li { display: grid; grid-template-columns: minmax(140px, 1.2fr) 2fr auto; gap: 10px; align-items: center; font-size: 0.875rem; }
.offer-bars li.is-best .ob-name { font-weight: 600; }
.table td.is-best-cell { background: var(--good-soft); font-weight: 600; }

/* Productos */
.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ranking li { display: grid; grid-template-columns: 22px minmax(150px, 1.4fr) 2fr 34px; gap: 10px; align-items: center; font-size: 0.875rem; }
.rk-pos { color: var(--muted); }
.product-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.product-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow-sm); display: grid; gap: 10px; align-content: start; min-width: 0; }
.pc-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.pc-score { display: grid; justify-items: end; }
.links { gap: 4px 12px; }
.scales { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.scales label { display: grid; gap: 3px; font-size: var(--step--1); color: var(--ink); font-weight: 500; }
.scales select { min-height: 32px; }
.pc-out { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-sm); }
.pc-out > div { display: grid; gap: 2px; min-width: 0; }
.pc-out .mono { font-size: 1rem; }
.ia-sug { padding: 10px 12px; border: 1px dashed var(--accent); border-radius: var(--r-sm); display: grid; gap: 4px; justify-items: start; }
.form-grid label .input-unit { margin-top: 0; }
.form-grid label .input-unit input { min-height: 34px; }

@media (max-width: 560px) {
  .offer-bars li, .ranking li { grid-template-columns: 1fr auto; }
  .offer-bars .wf-track, .ranking .wf-track { grid-column: 1 / -1; grid-row: 2; }
  .ranking .rk-pos { display: none; }
  .pc-out { grid-template-columns: 1fr 1fr; }
  .kv { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  h2 { font-size: var(--step-2); }
  .oc-actions { flex-direction: column; align-items: stretch; }
  .oc-actions .row-actions .btn { flex: 1 1 auto; }
  .setting { grid-template-columns: 1fr; grid-template-areas: 'label' 'help' 'input'; }
  .waterfall li { grid-template-columns: 1fr auto; }
  .waterfall .wf-track { grid-column: 1 / -1; grid-row: 2; }
  .clip { grid-template-columns: 1fr; gap: 4px; }
  .form-grid.wide { grid-template-columns: 1fr; }
}

/* ---------- Celular y tablet ---------- */
@media (max-width: 900px) {
  .side { display: none; }
  .main-col { margin-left: 0; }
  .app { padding-inline: 16px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .auto-strip { margin: 0 -16px; padding: 9px 16px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 -16px; padding: 14px 16px 10px; background: var(--bg);
  }
  .topbar .brand { padding: 0; }
  .topbar .conn-row { display: flex; gap: 6px; }
  .topbar .conn { font-size: 0; gap: 0; }
  .topbar .conn .dot { width: 9px; height: 9px; }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px -16px rgba(19, 26, 43, 0.35);
  }
  .bn-item { position: relative; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none; color: var(--faint); font-size: 0.6875rem; font-weight: 700; cursor: pointer; border-radius: 12px; }
  .bn-item .ico { width: 22px; height: 22px; }
  .bn-item.is-on { color: var(--accent); }
  .bn-item .tab-badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; line-height: 16px; padding: 0 5px; font-size: 0.625rem; }
  .tool { padding-top: 14px; gap: 16px; }
  h2 { font-size: 1.5rem; }
  .home-hello h2 { font-size: 1.625rem; }
  .panel { padding: 16px; border-radius: var(--r); }
  .seg { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg-btn { flex: none; }
  .summary-strip, .decision-strip { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat, .dstat { padding: 12px 14px; }
  .stat-value { font-size: 1.375rem; }
  .tool-actions { width: 100%; }
}

/* Confirmar: detalles de la tarjeta */
.oc-meta { overflow-wrap: anywhere; }
.oc-addr { display: flex; gap: 8px; align-items: flex-start; }
.oc-addr .ico { width: 16px; height: 16px; margin-top: 2px; color: var(--faint); }
.oc-phone .ico, .note .ico, .dispatch .ico { width: 15px; height: 15px; vertical-align: -3px; }
.decide .btn .ico { width: 15px; height: 15px; }
.stat-label .info { margin-left: 2px; }
.stat-label .info > summary { width: 18px; height: 18px; vertical-align: -4px; }
/* css/auto.css */
/* Motor automático: aviso en la barra superior y paneles de "Automático" que comparten las herramientas */
.auto-chip { gap: 8px; max-width: 100%; overflow-wrap: anywhere; }
.conn .dot.pulse { background: var(--info); animation: pulse 1.2s ease-in-out infinite; }
.conn-stop { border: 0; background: none; padding: 0 2px; color: var(--accent); font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: underline; }
.tab-badge.is-new { background: var(--good); color: var(--bg); text-transform: lowercase; }
@media (prefers-reduced-motion: reduce) { .conn .dot.pulse { animation: none; } }

/* Panel "Automático" (lo usan Competencia, Productos y Guiones) */
.auto-panel { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: linear-gradient(0deg, var(--surface), var(--surface)), var(--surface); }
.auto-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.auto-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: var(--step--1); }
.auto-toggles { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.875rem; }
.auto-toggles label { display: inline-flex; align-items: center; gap: 7px; }
.auto-toggles input[type='checkbox'] { width: 17px; height: 17px; min-height: 0; accent-color: var(--accent); }
.auto-toggles select { min-height: 30px; padding: 2px 6px; font-size: 0.8125rem; }
.auto-progress { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.875rem; }
.auto-progress li { display: flex; gap: 8px; align-items: baseline; }
.auto-progress .st { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); min-width: 64px; }
.auto-progress .st.ok { color: var(--good); }
.auto-progress .st.err { color: var(--bad); }
.auto-off { padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 0.875rem; }
.findings { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.55; max-width: 78ch; }
/* css/competencia-auto.css */
/* Competencia: escaneo automático, "Qué encontré", anuncios guardados y búsqueda a mano */

/* Notas de una línea con ícono (también las usa Tiendas) */
.cp-note, .tn-note { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.cp-note > .ico, .tn-note > .ico { width: 16px; height: 16px; margin-top: 2px; color: var(--faint); }
.cp-note > span, .tn-note > span { min-width: 0; overflow-wrap: anywhere; }
.cp-note .info > summary, .tn-note .info > summary { width: 18px; height: 18px; vertical-align: -4px; }

/* Chips con número destacado: "12 nuevos" */
.cp-nums { gap: 8px; }
.chip.cp-num { gap: 6px; padding: 5px 12px; font-size: 0.8125rem; font-weight: 500; }
.chip.cp-num strong { font-family: var(--font-display); font-size: 0.9375rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.chip.cp-num.tone-neutral { color: var(--muted); }
.chip.cp-num.tone-neutral strong { color: var(--ink); }

/* Título con "?" al lado */
.cp-title { display: flex; align-items: center; gap: 4px; }

/* ---------- Escaneo automático ---------- */
#cp-auto > div:empty { display: none; }
#cp-auto-head { display: grid; gap: 10px; }
.cp-auto .more { padding-top: 12px; }
.cp-auto-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
.cp-auto-txt { flex: 1 1 220px; min-width: 0; display: grid; gap: 3px; }
.cp-auto-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: var(--step--1); }

/* Progreso de cada búsqueda */
.cp-prog { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); gap: 6px; }
.cp-prog li > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.cp-prog .st { min-width: 84px; }
.cp-prog .st:not(.ok):not(.err) { color: var(--info); }
.cp-prog li.is-espera, .cp-prog li.is-omitida { color: var(--muted); }

/* Opciones */
.cp-auto-cfg { display: grid; gap: 14px; }
.cp-cfg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.cp-cada { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.875rem; }
.cp-cada select { min-height: 34px; padding: 4px 8px; font-size: 0.875rem; }
.cp-qs { display: grid; gap: 8px; min-width: 0; padding-top: 12px; border-top: 1px solid var(--line); }
.cp-qs-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
.cp-qs-head .eyebrow { margin: 0; }
.chip.cp-q { gap: 2px; padding: 3px 3px 3px 11px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font-weight: 500; font-size: 0.8125rem; }
.cp-q-x { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 999px; background: none; color: var(--faint); cursor: pointer; }
.cp-q-x .ico { width: 13px; height: 13px; stroke-width: 2.4; }
.cp-q-x:hover:not([disabled]) { color: var(--bad); background: var(--bad-soft); }
.cp-q-x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cp-q-x[disabled] { opacity: 0.35; cursor: not-allowed; }
.cp-q-form { display: flex; align-items: center; gap: 8px; }
.cp-q-form input { flex: 1 1 auto; min-width: 0; }

/* ---------- Qué encontré ---------- */
.cp-found { gap: 16px; }
.cp-found .panel-title > div { min-width: 0; }
.cp-sk { height: 140px; }
.cp-found-body { display: grid; gap: 6px; justify-items: start; min-width: 0; }
.cp-found-body > .cp-prose { width: 100%; }

/* Texto de Claude en secciones */
.cp-prose { display: grid; gap: 12px; min-width: 0; }
.cp-prose.is-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: start; }
.cp-sec { display: grid; gap: 8px; align-content: start; min-width: 0; padding: 14px 16px; border-radius: var(--r); background: var(--surface-2); font-size: 0.9rem; line-height: 1.55; overflow-wrap: anywhere; }
.cp-sec h4 { display: flex; align-items: center; gap: 8px; font-size: 0.9375rem; }
.cp-sec h4 .ico { width: 17px; height: 17px; color: var(--accent); }
.cp-sec ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.cp-sec li { position: relative; padding-left: 16px; }
.cp-sec li::before { content: ''; position: absolute; left: 2px; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.55; }
.cp-sec p + p, .cp-sec ul + p, .cp-sec p + ul { margin-top: 2px; }
.cp-fold .ico { width: 15px; height: 15px; transition: transform 0.15s; }
.cp-fold[aria-expanded='true'] .ico { transform: rotate(180deg); }

/* Detalle del escaneo */
.cp-det { display: grid; gap: 10px; min-width: 0; }
.cp-det-line { font-size: 0.875rem; overflow-wrap: anywhere; }
.cp-det-line .eyebrow { display: block; margin: 0 0 2px; }

/* ---------- Anuncios guardados ---------- */
.cp-saved .panel-title > div { min-width: 0; }
#cp-saved-head { display: grid; gap: 14px; }
#cp-saved-head:empty, #cp-ideas:empty { display: none; }
.cp-mix { display: grid; gap: 8px; }
.cp-mix-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.cp-mix-row .eyebrow { min-width: 64px; margin: 0; }
.cp-mix-row .chip.cp-num { padding: 3px 10px; font-size: 0.75rem; }
.cp-mix-row .chip.cp-num strong { font-size: 0.8125rem; }

.cp-ideas { display: grid; gap: 10px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); min-width: 0; }
.cp-ideas-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.cp-ideas-title { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 0.9375rem; }
.cp-ideas-title .ico { width: 17px; height: 17px; color: var(--accent); }
.cp-ideas-head .btn { margin-left: auto; }
.cp-ideas-out { display: grid; gap: 6px; justify-items: start; min-width: 0; }
.cp-ideas-out > .cp-prose { width: 100%; }

.cp-table .cp-c-who { min-width: 150px; }
.cp-who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 700; color: var(--ink); white-space: normal; }
.cp-who-sub { display: block; color: var(--muted); font-size: 0.75rem; font-weight: 500; white-space: normal; }
.cp-table .chip { white-space: nowrap; }
.cp-c-hook { min-width: 240px; max-width: 420px; }
.cp-hook { display: block; color: var(--ink); overflow-wrap: anywhere; }
.cp-hook-note { display: block; margin-top: 3px; color: var(--muted); font-size: 0.75rem; }
.cp-acts { display: flex; align-items: center; justify-content: flex-end; gap: 8px; white-space: nowrap; }
.cp-acts .btn.link { gap: 4px; }
.cp-acts .ico { width: 15px; height: 15px; }
.cp-del { color: var(--faint); }
.cp-del:hover { color: var(--bad); text-decoration: none; }
.cp-saved-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.cp-del-all { color: var(--muted); font-weight: 500; }
.cp-del-all:hover, .cp-del-all.is-confirm { color: var(--bad); }

/* ---------- Buscar a mano ---------- */
.cp-manual > .more > summary { font-size: 0.875rem; }
.cp-manual-body { display: grid; gap: 14px; }
.cp-step { display: grid; gap: 10px; min-width: 0; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.cp-step:empty { display: none; }
.cp-step-head { display: flex; align-items: center; gap: 10px; }
.cp-step-n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 0.8125rem; flex: none; }
.cp-step-head h4 { font-size: 0.9375rem; }
.cp-step-head .info { margin-left: -4px; }
.cp-links { display: flex; flex-wrap: wrap; gap: 8px; }
.cp-links .ico { width: 14px; height: 14px; color: var(--faint); }
.cp-step .row-actions .chip { align-self: center; }
.cp-form { display: grid; gap: 12px; }
.cp-form .form-grid label, .cp-form .form-grid.wide label { display: grid; gap: 4px; font-size: var(--step--1); color: var(--muted); font-weight: 500; }
.cp-form input, .cp-form select { width: 100%; }

/* ---------- Celular ---------- */
@media (max-width: 640px) {
  /* La tabla de anuncios pasa a tarjetas */
  .cp-table thead { display: none; }
  .cp-table, .cp-table tbody { display: block; }
  .cp-table tr { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cp-table tbody tr:last-child { border-bottom: 0; }
  .cp-table tbody tr:hover > * { background: none; }
  .cp-table th, .cp-table td { display: block; padding: 0; border: 0; min-width: 0; max-width: none; text-align: left; }
  .cp-table .cp-c-who { order: 1; flex: 1 1 auto; min-width: 0; white-space: normal; }
  .cp-table .cp-c-dias { order: 2; flex: none; }
  .cp-table .cp-c-hook { order: 3; flex: 1 1 100%; }
  .cp-table .cp-c-meta { order: 4; flex: none; color: var(--muted); font-size: 0.8125rem; }
  .cp-table .cp-c-meta + .cp-c-meta:not(.is-empty)::before { content: '·'; margin-right: 8px; color: var(--faint); }
  .cp-table .cp-c-meta.is-empty { display: none; }
  .cp-table .cp-c-acts { order: 5; margin-left: auto; }
  .cp-table-wrap, .cp-saved .table-wrap { margin-inline: 0; padding-inline: 0; overflow: visible; }
}
@media (max-width: 560px) {
  .cp-auto-row > .row-actions, .cp-auto-row > .row-actions .btn { width: 100%; }
  .cp-sec { padding: 12px 14px; }
  .cp-step { padding: 14px; }
  .cp-ideas { padding: 12px; }
}
/* css/tiendas.css */
/* Tiendas de la competencia (dentro de la pestaña Competencia) */
.tn { min-width: 0; gap: 16px; }
.tn-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
.tn-top-txt { flex: 1 1 220px; min-width: 0; display: grid; gap: 3px; }
.tn-title { display: flex; align-items: center; gap: 4px; }
.tn-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--muted); font-size: var(--step--1); }
.tn-ctrl, .tn-prog { display: grid; gap: 10px; min-width: 0; }
.tn-ctrl:empty, .tn-prog:empty, #tn-summary:empty, #tn-act:empty { display: none; }
.tn-log-list { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); gap: 6px; }
.tn-log-list .st { min-width: 76px; }
.tn-log-list .is-curso .st { color: var(--info); }
.tn-log { min-width: 0; overflow-wrap: anywhere; }

/* Agregar tienda: una fila */
.tn-add { display: flex; align-items: center; gap: 8px; }
.tn-add input { flex: 1 1 auto; min-width: 0; }
.tn-add .btn { flex: none; }

.tn-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.tn-cada { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.875rem; }
.tn-cada select { min-height: 34px; padding: 4px 8px; font-size: 0.875rem; }

/* Tarjetas */
.tn-list { display: grid; gap: 12px; min-width: 0; }
.tn-card { position: relative; display: grid; gap: 12px; min-width: 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); transition: box-shadow 0.15s, border-color 0.15s; }
.tn-card:hover { box-shadow: var(--shadow); border-color: var(--line-strong); }
.tn-card.is-alto { box-shadow: inset 4px 0 0 var(--good); }
.tn-card.is-medio { box-shadow: inset 4px 0 0 var(--info); }
.tn-card.is-alto:hover { box-shadow: inset 4px 0 0 var(--good), var(--shadow); }
.tn-card.is-medio:hover { box-shadow: inset 4px 0 0 var(--info), var(--shadow); }
.tn-card > * { min-width: 0; }

.tn-card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.tn-ini { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--source-soft); color: var(--source); font-family: var(--font-display); font-weight: 800; font-size: 1rem; flex: none; }
.tn-name { flex: 1 1 160px; display: grid; gap: 1px; min-width: 0; }
.tn-dom { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: var(--step-1); font-weight: 700; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; min-width: 0; }
.tn-dom .ico { width: 14px; height: 14px; color: var(--faint); }
.tn-dom:hover, .tn-dom:focus-visible { color: var(--accent); }
.tn-dom:hover .ico { color: var(--accent); }
.tn-sub { color: var(--muted); font-size: 0.75rem; }
.tn-head-r { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.tn-quitar { color: var(--faint); gap: 6px; padding: 6px; }
.tn-quitar .ico { width: 16px; height: 16px; }
.tn-quitar:hover { color: var(--bad); text-decoration: none; }
.tn-quitar.is-confirm { color: var(--bad); font-weight: 600; font-size: 0.8125rem; }

.tn-why { color: var(--muted); font-size: 0.875rem; line-height: 1.5; max-width: 72ch; }
.tn-facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--step--1); color: var(--muted); }
.tn-facts strong { color: var(--ink); font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; margin-right: 3px; }
.tn-quiet { display: flex; align-items: flex-start; gap: 7px; color: var(--muted); font-size: var(--step--1); }
.tn-quiet .ico { width: 15px; height: 15px; margin-top: 2px; color: var(--faint); }

/* Su corrector contra el tuyo */
.tn-corr { display: grid; gap: 10px; min-width: 0; padding: 14px; background: var(--surface-2); border-radius: var(--r); }
.tn-corr > * { min-width: 0; }
.tn-corr-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; }
.tn-corr-name { display: grid; gap: 2px; min-width: 0; flex: 1 1 180px; }
.tn-corr-name .eyebrow { margin: 0; }
.tn-corr-name a { font-weight: 700; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.tn-corr-name a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.tn-price { display: flex; align-items: baseline; gap: 8px; }
.tn-price strong { font-family: var(--font-display); font-size: 1.375rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tn-price s { color: var(--faint); font-size: var(--step--1); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tn-vs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.tn-mio { color: var(--muted); font-size: var(--step--1); font-variant-numeric: tabular-nums; }
.tn-vs .chip { font-weight: 700; }
.tn-delta { margin-left: 4px; color: var(--good); font-weight: 800; font-variant-numeric: tabular-nums; }

/* Desplegables de la tarjeta */
.tn-dets { display: grid; border-top: 1px solid var(--line); }
.tn-det + .tn-det { border-top: 1px solid var(--line); }
.tn-card > .tn-det { border-top: 1px solid var(--line); }
.tn-det > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 10px 0; font-size: 0.875rem; font-weight: 600; color: var(--ink); }
.tn-card > .tn-det > summary { padding-bottom: 4px; }
.tn-det > summary::-webkit-details-marker { display: none; }
.tn-det > summary .ico { width: 16px; height: 16px; color: var(--muted); transition: transform 0.15s; }
.tn-det[open] > summary .ico { transform: rotate(90deg); }
.tn-det > summary:hover { color: var(--accent); }
.tn-det-body { padding: 4px 0 12px 24px; min-width: 0; }
.tn-dets > .tn-det:last-child .tn-det-body { padding-bottom: 0; }
.tn-dets > .tn-det:last-child:not([open]) > summary { padding-bottom: 0; }

.tn-changes { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 0.875rem; }
.tn-changes li { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.tn-changes li > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.tn-changes li .chip { flex: none; min-width: 76px; justify-content: center; }

.tn-otros { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--step--1); }
.tn-otros li { display: flex; flex-wrap: wrap; gap: 0 8px; min-width: 0; }
.tn-otros a { overflow-wrap: anywhere; }

.tn-hist { font-size: var(--step--1); }
.tn-hist th, .tn-hist td { padding: 6px 6px; }
.tn-hist thead th { letter-spacing: 0.02em; text-transform: none; font-size: 0.75rem; }

@media (max-width: 560px) {
  .tn-top > .row-actions, .tn-top > .row-actions .btn { width: 100%; }
  .tn-card { padding: 14px 12px; }
  .tn-ini { width: 34px; height: 34px; border-radius: 10px; }
  .tn-head-r { width: 100%; justify-content: space-between; margin-left: 0; }
  .tn-corr { padding: 12px; }
  .tn-det-body { padding-left: 0; }
  .tn-changes li { flex-wrap: wrap; }
}
