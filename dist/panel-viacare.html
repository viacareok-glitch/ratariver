      '<div class="cp-auto-txt"><h3 id="cp-auto-title">Escaneo automático</h3><p class="cp-auto-meta"><span>' +
      e(meta) +
      '</span>' +
      (c.auto ? chip('Solo cada ' + c.cadaHoras + ' h', 'good') : '') +
      '</p></div>' +
      (accion ? '<div class="row-actions">' + accion + '</div>' : '') +
      '</div>' +
      aviso;
  }

  const ST = {
    espera: ['en espera', ''],
    leyendo: ['leyendo', ''],
    ok: ['listo', 'ok'],
    sin: ['sin anuncios', 'ok'],
    error: ['error', 'err'],
    omitida: ['no se revisó', ''],
  };

  function renderAutoProg() {
    const box = el && $('#cp-auto-prog', el);
    if (!box || !A) return;
    const corriendo = A.running === 'competencia';
    const est = A.estado.competencia || {};
    if (!vivo.items.length || (!corriendo && (!est.error || est.error === CANCELADO))) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML =
      '<ul class="auto-progress cp-prog">' +
      vivo.items
        .map((it) => {
          const st = ST[it.estado] || ST.espera;
          const det = it.error ? it.error : it.estado === 'ok' ? plural(it.anuncios, 'anuncio', 'anuncios') + ' · ' + plural(it.nuevos, 'nuevo', 'nuevos') : '';
          return '<li class="is-' + e(it.estado) + '"><span class="st' + (st[1] ? ' ' + st[1] : '') + '">' + e(st[0]) + '</span><span>' + e(it.q) + (det ? ' <span class="muted">· ' + e(det) + '</span>' : '') + '</span></li>';
        })
        .join('') +
      '</ul>' +
      (corriendo && A.progress.competencia ? '<p class="muted small" aria-live="polite">' + e(A.progress.competencia) + '</p>' : '');
  }

  function busquedasCfg() {
    const c = (A && A.cfg.competencia) || {};
    return S.limpiarBusquedas(c.busquedas && c.busquedas.length ? c.busquedas : CP.BUSQUEDAS);
  }

  function renderAutoCfg() {
    const box = el && $('#cp-auto-cfg', el);
    if (!box || !A) return;
    const c = A.cfg.competencia || A.DEFAULTS.competencia;
    const qs = busquedasCfg();
    const dis = A.loaded ? '' : ' disabled';
    const horas = HORAS.includes(Number(c.cadaHoras)) ? HORAS : HORAS.concat(Number(c.cadaHoras) || 24).sort((a, b) => a - b);
    const lleno = qs.length >= S.MAX_BUSQUEDAS;
    const igualDefault = qs.join('|') === CP.BUSQUEDAS.join('|');
    // Si el usuario está escribiendo una búsqueda o usando una opción, conservamos el foco al redibujar
    const act = document.activeElement;
    const keep = act && act.id === 'cp-q-nueva' && box.contains(act) ? act.value : null;
    const keepCfg = act && box.contains(act) && act.dataset ? act.dataset.cfg : '';
    box.innerHTML =
      '<div class="cp-auto-cfg"><div class="cp-cfg-row">' +
      toggle('cp-auto-solo', !!c.auto, 'Escanear solo al abrir el panel', 'data-cfg="auto"' + dis) +
      '<label class="cp-cada">Cada <select data-cfg="cadaHoras" aria-label="Cada cuántas horas"' +
      dis +
      '>' +
      horas.map((h) => '<option value="' + h + '"' + (Number(c.cadaHoras) === h ? ' selected' : '') + '>' + h + ' horas</option>').join('') +
      '</select></label></div>' +
      toggle('cp-guiones-tras', !!c.guionesTras, 'Después, escribir guiones nuevos', 'data-cfg="guionesTras"' + dis) +
      '<div class="cp-qs"><div class="cp-qs-head"><span class="eyebrow">Búsquedas · ' +
      qs.length +
      ' de ' +
      S.MAX_BUSQUEDAS +
      '</span>' +
      (igualDefault ? '' : '<button type="button" class="btn link sm" data-act="q-default"' + dis + '>Volver a las de siempre</button>') +
      '</div><div class="chips">' +
      qs
        .map(
          (q) =>
            '<span class="chip cp-q">' +
            e(q) +
            '<button type="button" class="cp-q-x" data-act="q-quitar" data-q="' +
            e(q) +
            '" aria-label="Quitar la búsqueda ' +
            e(q) +
            '"' +
            (qs.length <= 1 || !A.loaded ? ' disabled' : '') +
            '>' +
            icon('x') +
            '</button></span>'
        )
        .join('') +
      '</div><form id="cp-q-form" class="cp-q-form"><label for="cp-q-nueva" class="sr-only">Agregar una búsqueda</label><input id="cp-q-nueva" maxlength="60" autocomplete="off" placeholder="' +
      (lleno ? 'Quitá una para agregar otra' : 'Ej. faja lumbar') +
      '"' +
      (lleno ? ' disabled' : '') +
      dis +
      '><button class="btn ghost" type="submit"' +
      (lleno ? ' disabled' : '') +
      dis +
      '>' +
      icon('plus') +
      'Agregar</button></form></div></div>';
    if (keep != null) {
      const inp = $('#cp-q-nueva', box);

      }

  /* ---------- Qué encontré ---------- */

  function renderFound() {
    const box = el && $('#cp-found', el);
    if (!box) return;
    const abiertos = $$('details[id][open]', box).map((d) => d.id);
    const head = (sub, acciones) =>
      '<div class="panel-head"><div class="panel-title">' +
      bubble('sparkles') +
      '<div><div class="cp-title"><h3 id="cp-found-title">Qué encontré</h3>' +
      info('Meta no publica cuánto vende cada anuncio. Que siga activo ' + CP.GANADOR_DIAS + ' días o más es señal de que le rinde, no un dato de ventas.') +
      '</div>' +
      (sub ? '<p class="small muted">' + e(sub) + '</p>' : '') +
      '</div></div>' +
      (acciones || '') +
      '</div>';
    if (!ultimoCargado) {
      box.innerHTML = head('Cargando el último escaneo…') + '<div class="skeleton cp-sk"></div>';
      return;
    }
    const u = ultimo;
    if (!u) {
      box.innerHTML = head() + emptyState('Sin escaneos todavía', 'Escaneá y acá vas a ver qué anuncian y qué les funciona.', '', 'eye');
      return;
    }
    const pb = Array.isArray(u.porBusqueda) ? u.porBusqueda : [];
    const errores = pb.filter((b) => b.error).length;
    const det =
      (u.nombresNuevos && u.nombresNuevos.length ? '<p class="cp-det-line"><span class="eyebrow">Anunciantes nuevos</span>' + e(u.nombresNuevos.join(', ')) + '</p>' : '') +
      (u.dominiosNuevos && u.dominiosNuevos.length ? '<p class="cp-det-line"><span class="eyebrow">Tiendas sumadas</span>' + e(u.dominiosNuevos.join(', ')) + '</p>' : '') +
      (pb.length
        ? '<ul class="auto-progress cp-prog">' +
          pb
            .map(
              (b) =>
                '<li><span class="st ' +
                (b.error ? 'err' : 'ok') +
                '">' +
                (b.error ? 'error' : b.anuncios ? 'listo' : 'sin anuncios') +
                '</span><span>' +
                e(b.q) +
                ' <span class="muted">· ' +
                e(b.error || (b.anuncios ? plural(b.anuncios, 'anuncio', 'anuncios') + ' · ' + plural(b.nuevos, 'nuevo', 'nuevos') : 'ningún anuncio activo')) +
                '</span></span></li>'
            )
            .join('') +
          '</ul>'
        : '');
    box.innerHTML =
      head(
        'Escaneado ' + U.timeAgo(u.fecha) + (pb.length ? ' · ' + plural(pb.length, 'búsqueda', 'búsquedas') : ''),
        u.resumen ? '<button type="button" class="btn ghost sm" data-act="found-copiar">' + icon('copy') + 'Copiar</button>' : ''
      ) +
      '<div class="chips cp-nums">' +
      num(u.nuevos, u.nuevos === 1 ? 'nuevo' : 'nuevos', u.nuevos ? 'peach' : '') +
      num(u.ganadores, (u.ganadores === 1 ? 'activo ' : 'activos ') + CP.GANADOR_DIAS + '+ días', u.ganadores ? 'good' : '') +
      num(u.anunciantesNuevos, u.anunciantesNuevos === 1 ? 'anunciante nuevo' : 'anunciantes nuevos', u.anunciantesNuevos ? 'source' : '') +
      num(u.total, u.total === 1 ? 'visto' : 'vistos', '') +
      '</div>' +
      (u.aviso ? banner('warn', e(u.aviso)) : '') +
      (u.resumen
        ? '<div class="cp-found-body">' + prosa(u.resumen, 'found') + '</div>'
        : '<p class="muted small">' +
          (!u.total ? 'No apareció ningún anuncio activo con estas búsquedas.' : u.errorResumen ? 'No se pudo escribir el resumen: ' + e(u.errorResumen) : A && A.running === 'competencia' ? 'Escribiendo el resumen…' : 'Sin resumen en este escaneo.') +
          '</p>') +
      (det ? more('Detalle' + (errores ? ' · ' + plural(errores, 'búsqueda con error', 'búsquedas con error') : ''), '<div class="cp-det">' + det + '</div>', 'cp-found-det') : '');

      const d = $('#' + id, box);

  function onAuto(ev) {
    if (!el) return;
    if (ev.type === 'cfg') {
      if (!ev.job || ev.job === 'competencia') {
        renderAutoHead();
        renderAutoCfg();
      }
      return;
    }
    if (ev.job !== 'competencia') {
      if (ev.type === 'start' || ev.type === 'done' || ev.type === 'error') renderAutoHead();
      return;
    }
    if (ev.type === 'start') vivo.items = [];
    if (ev.type === 'skip' && pedido) toast(ev.motivo || 'No se pudo escanear acá.', 'warn');
    renderAutoHead();
    renderAutoProg();
    if (ev.type === 'done' || ev.type === 'error') {
      renderFound();
      renderDataSoon();
    }
  }

  function escanearAhora() {
    if (!A || pedido || A.running === 'competencia') return;
    pedido = true;
    renderAutoHead();
    A.run('competencia', { origen: 'manual' }).finally(() => {
      pedido = false;
      renderAutoHead();
    });
  }

  function agregarBusqueda(form) {
    const inp = $('#cp-q-nueva', form);
    const r = S.agregarBusqueda(busquedasCfg(), inp ? inp.value : '');
    if (r.error) {
      toast(r.error, 'warn');
      return;
    }
    if (inp) inp.value = '';
    A.setCfg('competencia', { busquedas: r.lista });
    const nuevo = $('#cp-q-nueva', el);
    if (nuevo && !nuevo.disabled) nuevo.focus();
  }

  // Redibuja la tabla sin molestar si el usuario está escribiendo en un campo de esta pestaña
  function renderDataSoon() {
    if (!el) return;
    clearTimeout(dataTimer);
    dataTimer = setTimeout(() => {
      const a = document.activeElement;
      const tipeando = a && el.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && Date.now() - ultimoTipeo < 2500;
      if (tipeando) renderDataSoon();
      else renderData();
    }, 300);
  }

  /* ---------- Buscar a mano ---------- */

  function paso(n, titulo, extra) {

      paso(1, 'Abrí la Biblioteca', info('Se abre filtrada por Argentina y anuncios activos. Mirá “Comenzó a circular el…”: los que llevan ' + CP.GANADOR_DIAS + ' días o más son los que les rinden.')) +
      '<div class="cp-links">' +

  /* ---------- Anuncios guardados ---------- */

  function adsList() {
    return [...state.ads.entries()].map(([id, a]) => Object.assign({ id }, a));
  }

  function renderData() {
    if (!el) return;
    const s = CP.summarize(adsList());
    const head = $('#cp-saved-head', el);
    const body = $('#cp-saved-body', el);
    const ideasBox = $('#cp-ideas', el);
    if (!head || !body || !ideasBox) return;
    const sub = s.total
      ? plural(s.total, 'anuncio', 'anuncios') + ' · ' + plural(s.anunciantes, 'anunciante', 'anunciantes') + (s.ganadores ? ' · ' + s.ganadores + ' activos ' + CP.GANADOR_DIAS + '+ días' : '')
      : '';
    const titulo =
      '<div class="panel-title">' + bubble('grid', 'source') + '<div><h3 id="cp-table-title">Anuncios guardados</h3>' + (sub ? '<p class="small muted">' + e(sub) + '</p>' : '') + '</div></div>';
    if (!s.total) {
      head.innerHTML = '<div class="panel-head">' + titulo + '</div>';

      ideasBox.innerHTML = '';
      body.innerHTML = emptyState('Sin anuncios guardados', 'Escaneá o buscá a mano: quedan acá para comparar.', '', 'grid');

    }
    ideasBox.hidden = false;
    const angulos = s.angulos.slice(0, 4).map(([k, n]) => num(n, CP.ANGULOS[k] || k, 'source')).join('');
    const ofertas = s.ofertas.slice(0, 4).map(([k, n]) => num(n, k, '')).join('');
    head.innerHTML =

          (ofertas ? '<div class="cp-mix-row"><span class="eyebrow">Ofertas</span><div class="chips">' + ofertas + '</div></div>' : '') +

  function renderIdeas() {
    const box = el && $('#cp-ideas', el);
    if (!box) return;
    const I = state.ideas;
    const igual = !!(I.text && ultimo && ultimo.resumen && I.text.trim() === String(ultimo.resumen).trim());
    const act = $('#cp-ideas-act', el);
    if (act)
      act.innerHTML = AI.sample
        ? I.running
          ? '<button type="button" class="btn ghost sm" data-act="ideas-stop">' + icon('stop') + 'Detener</button>'
          : '<button type="button" class="btn soft sm" data-act="ideas">' + icon('sparkles') + (I.text && !igual ? 'Nuevas ideas' : 'Ideas con Claude') + '</button>'
        : '';
    if (box.hidden) return;
    // Si las ideas son el mismo texto de "Qué encontré", no se repiten
    if (!(I.text || I.running || I.error) || (igual && !I.running && !I.error)) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML =
      '<div class="cp-ideas"><div class="cp-ideas-head"><span class="cp-ideas-title">' +
      icon('sparkles') +
      'Ideas para ViaCare</span><span class="muted small">' +
      (I.running ? 'Pensando…' : I.fecha ? e(U.timeAgo(I.fecha)) : '') +
      '</span>' +
      (I.text && !I.running ? '<button type="button" class="btn link sm" data-act="ideas-copiar">' + icon('copy') + 'Copiar</button>' : '') +
      '</div><div class="cp-ideas-out">' +
      (I.text && !igual ? prosa(I.text, 'ideas') : I.running ? '<p class="muted small">Comparando los anuncios guardados…</p>' : '') +
      '</div>' +
      (I.error ? '<p class="error-text">' + e(I.error) + '</p>' : '') +
      '</div>';

  async function extraer() {
    const texto = ($('#cp-texto', el) || {}).value || '';
    if (!texto.trim() && !state.imagenes.length) {
      toast('Pegá el texto de la Biblioteca o subí capturas.', 'warn');
      return;
    }
    ctl = new AbortController();
    state.running = true;
    state.error = '';
    renderInput();
    try {
      const opts = { signal: ctl.signal, cache: false };
      if (state.imagenes.length) opts.images = state.imagenes;
      const data = await AI.sample.json(CP.extractPrompt(texto, state.imagenes.length, U.todayKeyAR()), opts);
      const ads = CP.sanitizeAds(data);
      if (!ads.length) state.error = 'No encontramos anuncios en lo que pegaste. Copiá la página completa o subí capturas.';
      else {
        const existentes = adsList().map((a) => (a.anunciante + '|' + a.gancho).toLowerCase());
        let nuevos = 0;
        for (const a of ads) {
          if (existentes.includes((a.anunciante + '|' + a.gancho).toLowerCase())) continue;
          const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          a.cargado = new Date().toISOString();
          state.ads.set(id, a);
          nuevos++;
          await Store.set('competencia/' + id, a).catch(storeFail);
        }
        toast(nuevos ? plural(nuevos, 'anuncio nuevo guardado', 'anuncios nuevos guardados') + '.' : 'Ya tenías esos anuncios guardados.', 'good');
        state.texto = '';
        state.imagenes = [];
      }
    } catch (err) {
      if (err && err.code !== 'cancelled') state.error = err.code === 'images_unavailable' || err.code === 'image_rejected' ? 'No se pudieron enviar las capturas. Probá con otras o pegá el texto.' : AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.running = false;
    renderInput();
    renderData();
  }

  async function ideas() {
    ctl = new AbortController();
    state.ideas = { text: '', fecha: null, running: true, error: '' };
    state.abierto.ideas = false;
    renderIdeas();
    try {
      const s = CP.summarize(adsList());
      const res = await AI.sample(CP.insightPrompt(s.ads, U.todayKeyAR(), App.datos()), {
        signal: ctl.signal,
        cache: false,
        onText: ({ text }) => {
          state.ideas.text = text;
          const out = el.querySelector('#cp-ideas .cp-ideas-out');
          if (out) out.innerHTML = prosa(text, 'ideas');
        },
      });
      state.ideas.text = res.text;
      state.ideas.fecha = new Date().toISOString();
      Store.set('ideas/competencia', { text: res.text, fecha: state.ideas.fecha }).catch(storeFail);
    } catch (err) {
      state.ideas.text = err.text || '';
      if (err.code !== 'cancelled') state.ideas.error = AI.errorText(err);
    }
    state.ideas.running = false;
    renderIdeas();
  }

  function addImages(files) {
    const lim = state.imgLimits;
    if (!lim) return;
    const ok = [...files].filter((f) => lim.mediaTypes.includes(f.type) && f.size <= lim.maxInputBytes);
    state.imagenes = state.imagenes.concat(ok).slice(0, lim.maxCount);
    if (ok.length < files.length) toast('Algunas imágenes no se pudieron usar (tipo o tamaño).', 'warn');
    renderInput();
  }

  function onPaste(ev) {
    if (!state.imgLimits || !ev.clipboardData) return;
    const files = [...ev.clipboardData.files].filter((f) => f.type.startsWith('image/'));
    if (files.length) {
      ev.preventDefault();
      addImages(files);
    }
  }

  function onChange(ev) {
    if (ev.target.id === 'cp-imgs' && ev.target.files) addImages(ev.target.files);
    const k = ev.target.dataset && ev.target.dataset.cfg;
    if (k && A) A.setCfg('competencia', { [k]: ev.target.type === 'checkbox' ? ev.target.checked : Number(ev.target.value) });
  }

  function onSubmit(ev) {
    const q = ev.target.closest('#cp-q-form');
    if (q) {
      ev.preventDefault();
      agregarBusqueda(q);
      return;
    }
    const f = ev.target.closest('#cp-form');
    if (!f) return;
    ev.preventDefault();
    const fd = new FormData(f);
    const a = CP.sanitizeAds([Object.fromEntries(fd.entries())])[0];
    if (!a) {
      toast('Escribí al menos el gancho.', 'warn');
      return;
    }
    a.cargado = new Date().toISOString();
    const id = 'a' + Date.now().toString(36);
    state.ads.set(id, a);
    Store.set('competencia/' + id, a).catch(storeFail);
    f.reset();
    renderData();
    toast('Anuncio guardado.', 'good');
  }

  function copiar(text) {
    copyText(text).then((ok) => ok && toast('Copiado.', 'good'));
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    switch (t.dataset.act) {
      case 'auto-escanear':
        escanearAhora();
        break;
      case 'auto-detener':
        if (A) A.stop();
        break;
      case 'q-quitar': {
        const qs = busquedasCfg();
        if (qs.length > 1) A.setCfg('competencia', { busquedas: qs.filter((x) => x !== t.dataset.q) });
        break;
      }
      case 'q-default':
        A.setCfg('competencia', { busquedas: CP.BUSQUEDAS.slice() });
        break;
      case 'found-copiar':
        if (ultimo && ultimo.resumen) copiar(ultimo.resumen);
        break;
      case 'plegar':
        state.abierto[t.dataset.k] = !state.abierto[t.dataset.k];
        if (t.dataset.k === 'found') renderFound();
        else renderIdeas();
        break;
      case 'abrir-manual': {
        const d = $('#cp-manual', el);
        if (d) {
          d.open = true;
          if (d.scrollIntoView) d.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        }
        break;
      }
      case 'extraer':
        extraer();
        break;
      case 'detener':
      case 'ideas-stop':
        if (ctl) ctl.abort();
        break;
      case 'quitar-imgs':
        state.imagenes = [];
        renderInput();
        break;
      case 'ideas':
        ideas();
        break;
      case 'ideas-copiar':
        copiar(state.ideas.text);
        break;
      case 'ver-todos':
        state.verTodos = !state.verTodos;
        renderData();
        break;
      case 'borrar':
        state.ads.delete(t.dataset.id);
        Store.remove('competencia/' + t.dataset.id).catch(storeFail);
        renderData();
        break;
      case 'borrar-todo':
        if (t.dataset.confirm !== '1') {
          t.dataset.confirm = '1';
          t.classList.add('is-confirm');
          t.textContent = 'Tocá de nuevo para borrar todo';
          setTimeout(() => {
            t.dataset.confirm = '';
            t.classList.remove('is-confirm');
            t.textContent = 'Borrar todos';
          }, 4000);
          return;
        }
        for (const id of [...state.ads.keys()]) Store.remove('competencia/' + id).catch(storeFail);
        state.ads = new Map();
        renderData();
        break;
    }
  }

  /* ---------- Escaneo automático: la tarea ---------- */

  function cortarSiCancelo(ctx) {
    if (ctx.signal.aborted) {
      const err = new Error('Cancelado.');
      err.code = 'cancelled';
      throw err;
    }
  }

  async function guardar(path, data) {
    try {
      await Store.set(path, data);
    } catch (err) {
      const code = err && err.code;
      throw new Error(
        code === 'invalid_argument'
          ? 'No tenés permiso para guardar cambios en este panel.'
          : code === 'quota_exceeded'
            ? 'Se llenó el espacio del panel. Borrá anuncios viejos para seguir guardando.'
            : 'No se pudo guardar lo que encontré. Revisá la conexión y probá de nuevo.'
      );
    }
  }

  function refrescarVivo() {
    if (!el) return;
    renderAutoProg();
  }

  /*
   * Recorre las búsquedas en la Biblioteca de anuncios con el navegador de Claude, extrae los anuncios con Claude,
   * los fusiona con los guardados y escribe "Qué encontré". Funciona aunque la pestaña no esté abierta.
   */
  async function escanear(ctx) {
    if (enCurso) throw new Error('Ya hay un escaneo en curso.');
    enCurso = true;
    try {
      return await escanearUnaVez(ctx);
    } finally {
      enCurso = false;
    }
  }

  async function escanearUnaVez(ctx) {
    const busquedas = busquedasCfg().slice(0, S.MAX_BUSQUEDAS);
    if (!busquedas.length) throw new Error('Agregá al menos una búsqueda para escanear.');
    const hoy = U.todayKeyAR();
    const ahora = new Date().toISOString();
    let docs = await Store.list('competencia');
    // Si la lectura vino vacía pero la pestaña ya tiene anuncios, usamos esos (para no duplicar todo)
    if (!docs.size && state.ads.size) docs = new Map(state.ads);
    const antes = [...docs.values()];
    const tocados = new Set();
    const items = busquedas.map((q) => ({ q, estado: 'espera', anuncios: 0, nuevos: 0, error: '' }));
    vivo.items = items;
    refrescarVivo();
    let nuevos = [];
    let leidas = 0;
    let aviso = '';
    const omitirResto = (i, motivo) => {
      for (const it of items.slice(i + 1)) {
        it.estado = 'omitida';
        it.error = motivo;
      }
    };

    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      cortarSiCancelo(ctx);
      it.estado = 'leyendo';
      ctx.progress(S.progreso(i, items.length, it.q));
      refrescarVivo();
      let texto = '';
      try {
        texto = await Browser.read(CP.adLibraryUrl(it.q), { ready: R.adLibraryReady, tries: 6, firstWait: 3000, wait: 3000 });
      } catch (err) {
        it.estado = 'error';
        it.error = Browser.errorText(err);
        if (Browser.fatal(err)) {
          omitirResto(i, S.NO_REVISADA);
          refrescarVivo();
          throw new Error(Browser.errorText(err));
        }
        refrescarVivo();
        continue;
      }
      cortarSiCancelo(ctx);
      const pagina = S.estadoPagina(texto);
      if (pagina === 'login') {
        it.estado = 'error';
        it.error = LOGIN;
        aviso = LOGIN + '.';
        omitirResto(i, 'No se revisó: Meta pide iniciar sesión.');
        refrescarVivo();
        break;
      }
      if (pagina !== 'anuncios') {
        if (pagina === 'vacia') {
          it.estado = 'sin';
          leidas++;
        } else {
          it.estado = 'error';
          it.error =
            pagina === 'cookies'
              ? 'Facebook muestra un aviso de cookies: aceptalo una vez en el navegador de Claude.'
              : 'La página no terminó de cargar. Probá de nuevo más tarde.';
        }
        refrescarVivo();
        continue;
      }
      if (!AI.sample) throw new Error('Claude no está disponible en esta vista.');
      let ads;
      try {
        const data = await AI.sample.json(CP.extractPrompt(R.compactText(texto, 60000), 0, hoy), { signal: ctx.signal, cache: false });
        ads = S.validarIds(CP.sanitizeAds(data), R.adLibraryIds(texto)).map((a) => Object.assign(a, { busqueda: it.q }));
      } catch (err) {
        if (err && err.code === 'cancelled') throw err;
        it.estado = 'error';
        it.error = AI.errorText(err);
        if (AI.permanent(err)) {
          AI.sample = null;
          omitirResto(i, S.NO_REVISADA);
          refrescarVivo();
          throw new Error(AI.errorText(err));
        }
        refrescarVivo();
        continue;
      }
      leidas++;
      const m = S.mergeAds(docs, ads, ahora, { tocados });
      for (const w of m.escrituras) await guardar('competencia/' + w.id, w.data);
      docs = m.docs;
      nuevos = nuevos.concat(m.nuevos);
      it.estado = 'ok';
      it.anuncios = ads.length;
      it.nuevos = m.nuevos.length;
      refrescarVivo();
    }

    // Si no se pudo leer ninguna búsqueda, no pisamos el último escaneo bueno
    if (!leidas) throw new Error(aviso || (items.find((it) => it.error) || {}).error || 'No se pudo leer ninguna búsqueda.');

    const vistos = [...tocados].filter((id) => docs.has(id)).map((id) => Object.assign({ id }, docs.get(id)));
    const ganadores = S.ganadores(vistos, hoy);
    const nombresNuevos = S.anunciantesNuevos(antes, nuevos);
    const tiendas = (A.cfg.tiendas && A.cfg.tiendas.dominios) || [];
    // Las tiendas que el usuario quitó no vuelven a sumarse solas
    const quitadas = new Set((A.cfg.tiendas && A.cfg.tiendas.quitadas) || []);
    const dom = S.dominiosNuevos(vistos.filter((a) => !quitadas.has(VC.research.normalizeDomain(a.dominio))), tiendas, S.MAX_DOMINIOS);
    if (dom.agregar.length) A.setCfg('tiendas', { dominios: dom.lista });
    const porBusqueda = S.porBusqueda(items);
    const base = { fecha: ahora, porBusqueda, nuevos: nuevos.length, total: vistos.length, ganadores: ganadores.length, nombresNuevos, dominiosNuevos: dom.agregar, aviso };
    let doc = S.armarEscaneo(base);
    await guardar('escaneos/ultimo', doc);
    ultimo = doc;
    ultimoCargado = true;
    if (el) {
      renderFound();
      renderDataSoon();
    }

    if (vistos.length && AI.sample) {
      cortarSiCancelo(ctx);
      ctx.progress('Escribiendo qué encontré…');
      let resumen = '';
      let errorResumen = '';
      try {
        const res = await AI.sample(S.findingsPrompt({ nuevos, ganadores, porBusqueda, total: vistos.length, hoy, datos: App.datos(), vistos }), { signal: ctx.signal, cache: false });
        resumen = String((res && res.text) || '').trim();
      } catch (err) {
        if (err && err.code === 'cancelled') throw err;
        errorResumen = AI.errorText(err);
      }
      doc = S.armarEscaneo(Object.assign({}, base, { resumen, errorResumen }));
      await guardar('escaneos/ultimo', doc);
      ultimo = doc;
      if (resumen) {
        const fecha = new Date().toISOString();
        await guardar('ideas/competencia', { text: doc.resumen, fecha });
        if (!state.ideas.running) {
          state.ideas.text = doc.resumen;
          state.ideas.fecha = fecha;
          state.ideas.error = '';
        }
      }
      if (el) {
        renderFound();
        renderIdeas();
      }
    }

    const c = A.cfg.competencia || {};
    return {
      novedades: nuevos.length,
      nuevos: nuevos.length,
      total: vistos.length,
      ganadores: ganadores.length,
      anunciantesNuevos: nombresNuevos.length,
      tiendasNuevas: dom.agregar.length,
      resumen: S.resumenCorto(nuevos.length) + (aviso ? '. ' + LOGIN : ''),
      siguiente: c.guionesTras && nuevos.length > 0 ? 'guiones' : undefined,
      motivoSiguiente: 'competencia',
    };
  }

  if (A) A.register('competencia', { needs: ['browser', 'sample'], run: escanear });

  VC.tools = VC.tools || {};
  VC.tools.competencia = { mount, render };
})(window);
</script>
<script>
/* ui/comentarios.js */
/* Respuestas para comentarios de TikTok */
(function (root) {
  'use strict';
  const VC = root.VC;
  const CM = VC.comments;
  const { Store, AI } = VC.runtime;
  const { e, $, App, chip, toast, copyText, storeFail, icon, bubble, pageHead, info, more } = VC.ui;

  const state = {
    texto: '',
    items: [], // {comentario, tipo, respuesta, variante, video, ocultar, origen}
    running: false,
    error: '',
    biblioteca: new Map(),
    tono: '',
  };
  let el;
  let ctl;

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead('Comentarios', 'Pegá los comentarios y te armo una respuesta para cada uno.') +
      '<div id="cm-warn"></div><section class="panel" id="cm-input"></section><div id="cm-summary"></div><div id="cm-list" class="cm-list"></div><section class="panel" id="cm-lib"></section>';
    el.addEventListener('click', onClick);
    el.addEventListener('input', onInput);
    App.on((w) => w === 'tienda' && renderWarn());
    Store.watch('respuestas', (m) => {
      state.biblioteca = m;
      renderLib();
    });
    render();
  }

  function render() {
    renderWarn();
    renderInput();
    renderList();
    renderLib();
  }

  function renderWarn() {
    const d = App.tienda;
    const faltan = [!d.demora && 'demora del envío', !d.talles && 'talles'].filter(Boolean);
    $('#cm-warn', el).innerHTML = faltan.length
      ? '<p class="note cm-alert">' + icon('alert') + ' Faltan datos: ' + e(faltan.join(' y ')) + '. <button class="btn link" data-goto="ajustes">Completar</button></p>'
      : '';
  }

  function renderInput() {
    const box = $('#cm-input', el);
    const abierto = !!$('#cm-tono-more[open]', box);
    box.innerHTML =
      '<div class="panel-head"><div class="panel-title">' +
      bubble('message') +
      '<h3><label for="cm-texto">Pegá los comentarios</label></h3>' +
      info('Uno por línea. Podés pegar la lista tal como la copiás de TikTok. Responder rápido genera confianza y más alcance.') +
      '</div></div>' +
      '<textarea id="cm-texto" rows="6" placeholder="¿Es incómodo?&#10;¿Hacen envíos a Córdoba?&#10;¿Sirve de verdad?">' +
      e(state.texto) +
      '</textarea>' +
      '<div class="row-actions">' +
      (state.running
        ? '<button class="btn ghost" data-act="detener">' + icon('stop') + 'Detener</button><span class="cm-run">Escribiendo respuestas…</span>'
        : (AI.sample ? '<button class="btn" data-act="claude">' + icon('sparkles') + 'Responder con Claude</button>' : '') +
          '<button class="btn ' +
          (AI.sample ? 'ghost' : '') +
          '" data-act="plantillas">' +
          (AI.sample ? 'Usar plantillas' : 'Responder') +
          '</button>') +
      '</div>' +
      (state.error ? '<p class="error-text">' + e(state.error) + '</p>' : '') +
      (AI.sample ? more('Tono', '<label class="sr-only" for="cm-tono">Tono</label><input id="cm-tono" placeholder="Ej.: más canchero, sin emojis, tuteo…" value="' + e(state.tono) + '">', 'cm-tono-more') : '');
    if (abierto) $('#cm-tono-more', box).open = true;
  }

  function renderList() {
    const box = $('#cm-list', el);
    const sum = $('#cm-summary', el);
    if (!state.items.length) {
      sum.innerHTML = '';
      box.innerHTML = '';
      return;
    }
    const counts = new Map();
    for (const it of state.items) counts.set(it.tipo, (counts.get(it.tipo) || 0) + 1);
    const top = [...counts.entries()].filter(([k]) => !['positivo', 'otro'].includes(k)).sort((a, b) => b[1] - a[1]);
    const videoTip =
      top.length && top[0][1] >= 2
        ? '<div class="cm-tip">' +
          icon('video') +
          '<span>Lo que más preguntan: <strong>' +
          e(CM.tipo(top[0][0]).label.toLowerCase()) +
          '</strong> (' +
          top[0][1] +
          '). Respondelo con un video.</span><button class="btn soft sm" data-goto="guiones">Armar guion</button></div>'
        : '';
    sum.innerHTML = '<div class="chips">' + [...counts.entries()].map(([k, n]) => chip(CM.tipo(k).label + ' · ' + n, CM.tipo(k).tone)).join('') + '</div>' + videoTip;
    box.innerHTML = state.items
      .map((it, i) => {
        const t = CM.tipo(it.tipo);
        const len = it.respuesta.length;
        return (
          '<article class="cm-card"><div class="cm-top"><p class="cm-q">“' +
          e(it.comentario) +
          '”</p><div class="chips">' +
          chip(t.label, t.tone) +
          (it.video ? chip('Mejor con video', 'source') : '') +
          (it.ocultar ? chip('Ocultar', 'bad') : '') +
          '</div></div><label class="sr-only" for="cm-r-' +
          i +
          '">Respuesta</label><textarea id="cm-r-' +
          i +
          '" data-i="' +
          i +
          '" rows="' +
          (len > 90 ? 3 : 2) +
          '" maxlength="' +
          CM.MAX +
          '">' +
          e(it.respuesta) +
          '</textarea><div class="cm-foot"><span class="cm-count' +
          (len > CM.MAX ? ' is-over' : '') +
          '" id="cm-n-' +
          i +
          '">' +
          len +
          '/' +
          CM.MAX +
          '</span><div class="row-actions"><button class="btn sm" data-act="copiar" data-i="' +
          i +
          '">' +
          icon('copy') +
          '<span class="lbl">Copiar</span></button><button class="btn ghost sm" data-act="otra" data-i="' +
          i +
          '">' +
          icon('refresh') +
          'Otra</button><button class="btn link" data-act="guardar" data-i="' +
          i +
          '">Guardar</button></div></div></article>'
        );
      })
      .join('');
  }

  function renderLib() {
    const box = $('#cm-lib', el);
    if (!box) return;
    const list = [...state.biblioteca.entries()].map(([id, r]) => Object.assign({ id }, r));
    const head =
      '<div class="panel-head"><div class="panel-title">' +
      bubble('star', 'peach') +
      '<div><h3>Biblioteca</h3>' +
      (list.length ? '' : '<p class="small muted">Guardá las respuestas que te gusten para reusarlas.</p>') +
      '</div>' +
      (list.length ? chip(String(list.length), 'neutral') : '') +
      '</div></div>';
    if (!list.length) {
      box.innerHTML = head;
      return;
    }
    const by = new Map();
    for (const r of list) {
      if (!by.has(r.tipo)) by.set(r.tipo, []);
      by.get(r.tipo).push(r);
    }
    box.innerHTML =
      head +
      '<div class="lib">' +
      [...by.entries()]
        .map(
          ([tipo, rs]) =>
            '<div class="lib-group"><span class="eyebrow">' +
            e(CM.tipo(tipo).label) +
            '</span>' +
            rs
              .map(
                (r) =>
                  '<div class="lib-item"><p class="selectable">' +
                  e(r.respuesta) +
                  '</p><div class="row-actions"><button class="btn ghost sm icon-only" data-act="lib-copiar" data-id="' +
                  e(r.id) +
                  '" aria-label="Copiar" title="Copiar">' +
                  icon('copy') +
                  '</button><button class="btn ghost sm icon-only cm-lib-del" data-act="lib-borrar" data-id="' +
                  e(r.id) +
                  '" aria-label="Borrar" title="Borrar">' +
                  icon('trash') +
                  '</button></div></div>'
              )
              .join('') +
            '</div>'
        )
        .join('') +
      '</div>';
  }

  // Copia y muestra "Copiado" sin perder el ícono del botón
  function copiar(text, btn) {
    copyText(text).then((ok) => {
      if (!ok || !btn) return;
      const lbl = btn.querySelector('.lbl');
      if (lbl) {
        if (!lbl.dataset.prev) lbl.dataset.prev = lbl.textContent;
        lbl.textContent = 'Copiado';
        clearTimeout(btn._t);
        btn._t = setTimeout(() => (lbl.textContent = lbl.dataset.prev), 1600);
      } else {
        btn.classList.add('is-done');
        toast('Copiado.', 'good');
        setTimeout(() => btn.classList.remove('is-done'), 1600);
      }
    });
  }

  function plantillas() {
    const coms = CM.splitComments(($('#cm-texto', el) || {}).value || state.texto);
    if (!coms.length) {
      toast('Pegá al menos un comentario.', 'warn');
      return;
    }
    const d = App.datos();
    state.items = coms.slice(0, 80).map((c) => {
      const r = CM.templateReply(c, d, 0);
      return { comentario: c, tipo: r.tipo.id, respuesta: r.respuesta, variante: 0, video: false, ocultar: false, origen: 'plantilla' };
    });
    state.error = '';
    renderInput();
    renderList();
  }

  async function claude() {
    const coms = CM.splitComments(($('#cm-texto', el) || {}).value || state.texto).slice(0, 60);
    if (!coms.length) {
      toast('Pegá al menos un comentario.', 'warn');
      return;
    }
    ctl = new AbortController();
    state.running = true;
    state.error = '';
    renderInput();
    try {
      const data = await AI.sample.json(CM.buildPrompt(coms, App.datos(), state.tono), { signal: ctl.signal, cache: false, modelTier: 'quick' });
      const rs = (data && Array.isArray(data.respuestas) ? data.respuestas : []).filter((r) => r && r.n >= 1 && r.n <= coms.length);
      const byN = new Map(rs.map((r) => [Number(r.n), r]));
      const d = App.datos();
      state.items = coms.map((c, i) => {
        const r = byN.get(i + 1);
        if (!r) {
          const t = CM.templateReply(c, d, 0);
          return { comentario: c, tipo: t.tipo.id, respuesta: t.respuesta, variante: 0, origen: 'plantilla' };
        }
        const tipo = CM.TIPOS.some((t) => t.id === r.tipo) ? r.tipo : CM.classify(c).id;
        return { comentario: c, tipo, respuesta: CM.fit(String(r.respuesta || '')), variante: 0, video: !!r.video, ocultar: !!r.ocultar, origen: 'claude' };
      });
    } catch (err) {
      if (err && err.code !== 'cancelled') state.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.running = false;
    renderInput();
    renderList();
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'cm-texto') state.texto = t.value;
    else if (t.id === 'cm-tono') state.tono = t.value;
    else if (t.dataset.i != null && t.tagName === 'TEXTAREA') {
      const it = state.items[Number(t.dataset.i)];
      it.respuesta = t.value;
      const n = $('#cm-n-' + t.dataset.i, el);
      if (n) {
        n.textContent = t.value.length + '/' + CM.MAX;
        n.classList.toggle('is-over', t.value.length > CM.MAX);
      }
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    const it = t.dataset.i != null ? state.items[Number(t.dataset.i)] : null;
    switch (t.dataset.act) {
      case 'plantillas':
        plantillas();
        break;
      case 'claude':
        claude();
        break;
      case 'detener':
        if (ctl) ctl.abort();
        break;
      case 'copiar':
        copiar(it.respuesta, t);
        break;
      case 'otra': {
        it.variante = (it.variante || 0) + 1;
        it.respuesta = CM.templateReply(it.comentario, App.datos(), it.variante).respuesta;
        it.origen = 'plantilla';
        renderList();
        break;
      }
      case 'guardar': {
        const id = 'r' + Date.now().toString(36);
        const doc = { tipo: it.tipo, respuesta: it.respuesta, ejemplo: it.comentario, creada: new Date().toISOString() };
        state.biblioteca.set(id, doc);
        Store.set('respuestas/' + id, doc).catch(storeFail);
        renderLib();
        toast('Guardada en la biblioteca.', 'good');
        break;
      }
      case 'lib-copiar':
        copiar((state.biblioteca.get(t.dataset.id) || {}).respuesta || '', t);
        break;
      case 'lib-borrar':
        state.biblioteca.delete(t.dataset.id);
        Store.remove('respuestas/' + t.dataset.id).catch(storeFail);
        renderLib();
        break;
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.comentarios = { mount, render };
})(window);
</script>
<script>
/* ui/ofertas.js */
/* Ofertas: qué promo deja más plata por pedido */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const OF = VC.offers;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, chip, banner, storeFail, icon, bubble, pageHead, info, more } = VC.ui;

  const state = {
    items: OF.DEFAULT_OFERTAS.map((o) => Object.assign({}, o)),
    cpa: null, // null = usar el real de los últimos 7 días
    envioExtra: 0,
    gastos: {},
  };
  let el;

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead('Ofertas', '¿Qué promo te deja más plata?') +
      '<div id="of-warn"></div><div id="of-best"></div>' +
      '<section class="panel of-params" id="of-params"></section>' +
      '<section class="panel of-edit" id="of-rows"></section>' +
      '<section class="panel of-res"><div class="panel-head"><div class="panel-title">' +
      bubble('chart') +
      '<h3>Cuánto deja cada una</h3>' +
      info('Ganancia promedio por cada pedido que entra, después de publicidad, pedidos anulados y devoluciones.') +
      '</div></div><div id="of-results"></div>' +
      more('Ver el detalle', '<div id="of-detail"></div>', 'of-more-detalle') +
      more('¿Y si la publicidad sube o baja?', '<div id="of-sens"></div>', 'of-more-sens') +
      '</section>';
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    App.on((w) => (w === 'cfg' || w === 'tienda') && renderAll());
    Shop.onChange(() => renderResults());
    Store.watch('gastos', (m) => {
      state.gastos = Object.fromEntries(m);
      renderParams();
      renderResults();
    });
    Store.get('config/ofertas').then((d) => {
      if (d && Array.isArray(d.items) && d.items.length) {
        state.items = d.items;
        state.cpa = d.cpa == null ? null : d.cpa;
        state.envioExtra = d.envioExtra || 0;
      } else {
        // Precios de la tienda como punto de partida
        const p1 = Number(App.tienda.precio1) || 68990;
        const p2 = Number(App.tienda.precio2) || 72990;
        state.items = OF.DEFAULT_OFERTAS.map((o) => Object.assign({}, o, { precio: o.id === 'dos' ? p2 : o.id === '3x2' ? p1 * 2 : p1 }));
      }
      renderAll();
    });
    Shop.ensure(U.addDays(U.todayKeyAR(), -7)).catch(() => {});
    renderAll();
  }

  const save = VC.ui.debounce(() => Store.set('config/ofertas', JSON.parse(JSON.stringify({ items: state.items, cpa: state.cpa, envioExtra: state.envioExtra }))).catch(storeFail), 800);

  /* CPA real: gasto en anuncios de los últimos 7 días ÷ pedidos que entraron en esos días. */
  function cpaReal() {
    const hoy = U.todayKeyAR();
    const desde = U.addDays(hoy, -6);
    let ads = 0;
    for (const d of U.dayRange(desde, hoy)) ads += P.spendOf(state.gastos[d]).total;
    const pedidos = Shop.orders.filter((o) => o.day >= desde && o.day <= hoy).length;
    return ads > 0 && pedidos ? { cpa: ads / pedidos, ads, pedidos } : null;
  }

  function cpaActual() {
    if (state.cpa != null) return { valor: state.cpa, origen: 'manual' };
    const r = cpaReal();
    if (r) return { valor: r.cpa, origen: 'real', detalle: r };
    return { valor: 15000, origen: 'supuesto' };
  }

  function renderAll() {
    if (!el) return;
    $('#of-warn', el).innerHTML = P.costsReady(App.cfg) ? '' : banner('warn', '<strong>Faltan tus costos.</strong> Sin el costo del corrector y del envío, la cuenta no sirve.', '<button class="btn" data-goto="ajustes">Cargar costos</button>');
    renderParams();
    renderRows();
    renderResults();
  }

  function moneyField(id, label, value, help, extra) {
    return (
      '<div class="of-field"><div class="of-flabel"><label for="' +
      id +
      '">' +
      e(label) +
      '</label>' +
      (help ? info(help) : '') +
      '</div><span class="input-unit"><span class="unit">$</span><input id="' +
      id +
      '" inputmode="numeric" value="' +
      e(value) +
      '" placeholder="0"></span>' +
      (extra || '') +
      '</div>'
    );
  }

  function renderParams(force) {
    const box = $('#of-params', el);
    if (!box || (!force && box.contains(document.activeElement))) return;
    const c = cpaActual();
    const cfg = P.normalizeCfg(App.cfg);
    const origen =
      c.origen === 'real'
        ? chip('Real · 7 días', 'good') + info('Gastaste ' + e(U.money(c.detalle.ads)) + ' en anuncios y entraron ' + c.detalle.pedidos + ' pedidos en los últimos 7 días.')
        : c.origen === 'manual'
          ? chip('A mano', 'info') + ' <button class="btn link sm" data-act="cpa-real">Usar el real</button>'
          : chip('Supuesto', 'warn') + info('Cargá el gasto diario en Ganancia para usar el real, o escribí acá lo que te cuesta cada pedido.');
    const costos = ['Corrector ' + U.money(cfg.costoUnidad), 'envío ' + U.money(cfg.costoEnvio), 'devolución ' + U.money(cfg.costoDevolucion)];
    if (cfg.comisionCobro) costos.push('comisión ' + String(cfg.comisionCobro).replace('.', ',') + '%');
    box.innerHTML =
      '<div class="of-params-row">' +
      moneyField('of-cpa', 'Publicidad por pedido', U.int(c.valor), '', '<div class="of-origen">' + origen + '</div>') +
      moneyField('of-envio', 'Envío extra', state.envioExtra ? U.int(state.envioExtra) : '', 'Lo que suma el envío por cada unidad de más en el mismo paquete.') +
      '<div class="of-field of-costos"><span class="of-flabel">Tus costos</span><p class="of-costos-txt">' +
      e(costos.join(' · ')) +
      '</p><button class="btn link sm" data-goto="ajustes">Editar en Ajustes' +
      icon('arrowRight') +
      '</button></div></div>';
  }

  function renderRows() {
    const box = $('#of-rows', el);
    if (!box) return;
    const quitar = state.items.length > 2;
    box.innerHTML =
      '<div class="panel-head"><div class="panel-title">' +
      bubble('tag', 'peach') +
      '<h3>Tus ofertas</h3>' +
      info('<strong>Más pedidos:</strong> si creés que la promo trae más pedidos con la misma plata en publicidad (por ejemplo +25 %), cargalo y el costo por pedido baja en esa proporción. La primera oferta es la base.') +
      '</div><button class="btn soft sm" data-act="agregar">' +
      icon('plus') +
      'Agregar oferta</button></div>' +
      '<div class="of-table"><div class="of-row of-head" aria-hidden="true"><span>Oferta</span><span>Unidades</span><span>Cobrás en total</span><span>Costo regalo</span><span>Más pedidos</span><span></span></div>' +
      state.items
        .map(
          (o, i) =>
            '<div class="of-row">' +
            field(i, 'n', 'nombre', 'Oferta', '<input id="of-n-' + i + '" data-i="' + i + '" data-k="nombre" value="' + e(o.nombre) + '">') +
            field(i, 'u', 'unidades', 'Unidades', '<input id="of-u-' + i + '" class="num-input" data-i="' + i + '" data-k="unidades" inputmode="numeric" value="' + e(o.unidades) + '">') +
            field(i, 'p', 'precio', 'Cobrás en total', '<span class="input-unit"><span class="unit">$</span><input id="of-p-' + i + '" data-i="' + i + '" data-k="precio" inputmode="numeric" value="' + e(U.int(o.precio)) + '"></span>') +
            field(i, 'x', 'extra', 'Costo regalo', '<span class="input-unit"><span class="unit">$</span><input id="of-x-' + i + '" data-i="' + i + '" data-k="extra" inputmode="numeric" value="' + e(o.extra ? U.int(o.extra) : '') + '" placeholder="0"></span>') +
            (i === 0
              ? '<div class="of-f of-f-l"><span class="of-lbl">Más pedidos</span><span class="of-base">Base</span></div>'
              : field(i, 'l', 'lift', 'Más pedidos', '<span class="input-unit"><input id="of-l-' + i + '" data-i="' + i + '" data-k="lift" inputmode="decimal" value="' + e(o.lift ? String(o.lift).replace('.', ',') : '') + '" placeholder="0"><span class="unit is-after">%</span></span>')) +
            '<div class="of-del">' +
            (quitar ? '<button class="btn ghost icon-only sm" data-act="quitar" data-i="' + i + '" aria-label="Quitar ' + e(o.nombre) + '" title="Quitar">' + icon('trash') + '</button>' : '') +
            '</div></div>'
        )
        .join('') +
      '</div>';
  }

  function field(i, code, k, label, control) {
    return '<label class="of-f of-f-' + code + '" for="of-' + code + '-' + i + '"><span class="of-lbl">' + e(label) + '</span>' + control + '</label>';
  }

  function computed() {
    const rates = O.historicalRates(Shop.orders);
    return OF.compare(state.items, App.cfg, rates, cpaActual().valor, state.envioExtra);
  }

  function renderBest(evs) {
    const box = $('#of-best', el);
    if (!box) return;
    const best = evs.find((x) => x.mejor);
    if (!best) {
      box.innerHTML = '';
      return;
    }
    const cpa = 'Con ' + U.money(cpaActual().valor) + ' de publicidad por pedido';
    if (best.ganancia <= 0) {
      box.innerHTML =
        '<section class="of-hero tone-bad">' +
        bubble('alert', 'bad') +
        '<div class="of-hero-main"><span class="of-hero-eyebrow">Ninguna deja ganancia</span><strong class="of-hero-name">Todas pierden plata</strong><span class="of-hero-sub">' +
        e(cpa) +
        '. Probá subir el precio o bajar costos.</span></div><div class="of-hero-num"><span class="of-hero-value">' +
        e(U.money(best.ganancia)) +
        '</span><span class="of-hero-label">la menos mala</span></div></section>';
      return;
    }
    const base = evs[0];
    const sub = best === base ? 'Es tu oferta base. ' + cpa + '.' : U.money(best.vsBase) + ' más por pedido que ' + base.oferta.nombre + '.';
    box.innerHTML =
      '<section class="of-hero">' +
      bubble('trending', 'good') +
      '<div class="of-hero-main"><span class="of-hero-eyebrow">La que más deja</span><strong class="of-hero-name">' +
      e(best.oferta.nombre) +
      '</strong><span class="of-hero-sub">' +
      e(sub) +
      '</span></div><div class="of-hero-num"><span class="of-hero-value">' +
      e(U.money(best.ganancia)) +
      '</span><span class="of-hero-label">por pedido</span></div></section>';
  }

  function renderResults() {
    const box = $('#of-results', el);
    if (!box) return;
    const { evs } = computed();
    renderBest(evs);
    const max = Math.max(1, ...evs.map((x) => Math.abs(x.ganancia)));
    box.innerHTML =
      '<ul class="of-bars">' +
      evs
        .map(
          (x) =>
            '<li' +
            (x.mejor ? ' class="is-best"' : '') +
            '><span class="ob-name">' +
            e(x.oferta.nombre) +
            (x.mejor ? ' ' + chip('Mejor', 'good') : '') +
            '</span><span class="wf-track"><span class="wf-bar ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '" style="width:' +
            Math.max(1, (Math.abs(x.ganancia) / max) * 100).toFixed(1) +
            '%"></span></span><span class="ob-val mono ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '">' +
            e(U.money(x.ganancia)) +
            '</span></li>'
        )
        .join('') +
      '</ul>';
    renderDetail(evs);
    renderSens();
  }

  function renderDetail(evs) {
    const box = $('#of-detail', el);
    if (!box) return;
    const mix = OF.unitMix(Shop.orders);
    box.innerHTML =
      '<div class="table-wrap"><table class="table of-detail"><thead><tr><th>Oferta</th><th class="num">Por unidad</th><th class="num">Si se entrega</th><th class="num">Por pedido</th><th class="num">vs. ' +
      e(evs[0].oferta.nombre) +
      '</th><th>Para empatar</th></tr></thead><tbody>' +
      evs
        .map(
          (x, i) =>
            '<tr' +
            (x.mejor ? ' class="is-winner"' : '') +
            '><th scope="row">' +
            e(x.oferta.nombre) +
            '</th><td class="num">' +
            e(U.money(x.precioUnidad)) +
            '</td><td class="num">' +
            e(U.money(x.margenEntrega)) +
            '</td><td class="num ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '">' +
            e(U.money(x.ganancia)) +
            '</td><td class="num">' +
            (i === 0 ? '—' : e((x.vsBase >= 0 ? '+' : '') + U.money(x.vsBase))) +
            '</td><td class="small">' +
            (i === 0 ? '<span class="muted">Base</span>' : liftText(x)) +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div>' +
      (mix.n ? '<p class="note">' + icon('box') + ' En tu historial, ' + U.pct(mix.dos) + ' de los entregados llevó 2 unidades' + (mix.tresOMas ? ' y ' + U.pct(mix.tresOMas) + ' llevó 3 o más' : '') + ' (' + mix.n + ' pedidos).</p>' : '');
  }

  function liftText(x) {
    if (x.liftNecesario == null) return '<span class="neg">No empata ni con publicidad gratis</span>';
    if (x.liftNecesario <= 0) return '<span class="pos">Gana aunque venda ' + e(U.pct(-x.liftNecesario)) + ' menos</span>';
    return e(U.pct(x.liftNecesario)) + ' más pedidos';
  }

  function renderSens() {
    const box = $('#of-sens', el);
    if (!box) return;
    const base = cpaActual().valor;
    const niveles = [0.5, 0.75, 1, 1.25, 1.5].map((f) => Math.round((base * f) / 500) * 500);
    const rates = O.historicalRates(Shop.orders);
    const filas = state.items.map((o) => niveles.map((cpa) => OF.evaluate(o, App.cfg, rates, cpa, state.envioExtra).ganancia));
    const bestCol = niveles.map((_, j) => filas.reduce((bi, f, i) => (f[j] > filas[bi][j] ? i : bi), 0));
    box.innerHTML =
      '<p class="note">Ganancia por pedido según cuánto te cueste cada pedido en publicidad. En verde, la mejor en cada caso.</p><div class="table-wrap"><table class="table of-sens"><thead><tr><th>Oferta</th>' +
      niveles.map((n, j) => '<th class="num' + (j === 2 ? ' is-now' : '') + '">' + e(U.moneyShort(n)) + '</th>').join('') +
      '</tr></thead><tbody>' +
      filas
        .map(
          (f, i) =>
            '<tr><th scope="row">' +
            e(state.items[i].nombre) +
            '</th>' +
            f.map((v, j) => '<td class="num ' + (v >= 0 ? '' : 'neg') + (bestCol[j] === i ? ' is-best-cell' : '') + '">' + e(U.moneyShort(v)) + '</td>').join('') +
            '</tr>'
        )
        .join('') +
      '</tbody></table></div>';
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'of-cpa') {
      const v = U.parseMoney(t.value);
      state.cpa = v != null ? v : null;
      save();
      renderResults();
    } else if (t.id === 'of-envio') {
      state.envioExtra = U.parseMoney(t.value) || 0;
      save();
      renderResults();
    } else if (t.dataset.i != null && t.dataset.k) {
      const o = state.items[Number(t.dataset.i)];
      const k = t.dataset.k;
      o[k] = k === 'nombre' ? t.value : k === 'lift' ? U.parseNum(t.value) || 0 : k === 'unidades' ? Math.max(1, Math.round(U.parseMoney(t.value) || 1)) : U.parseMoney(t.value) || 0;
      save();
      renderResults();
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset.k === 'precio' || t.dataset.k === 'extra') {
      const v = U.parseMoney(t.value);
      t.value = v ? U.int(v) : '';
    } else if (t.id === 'of-cpa') renderParams();
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.act === 'agregar') {
      state.items.push({ id: 'o' + Date.now().toString(36), nombre: 'Nueva oferta', unidades: 1, precio: Number(App.tienda.precio1) || 68990, extra: 0, lift: 0 });
      save();
      renderRows();
      renderResults();
      const n = $('#of-n-' + (state.items.length - 1), el);
      if (n) n.focus();
    } else if (t.dataset.act === 'quitar') {
      state.items.splice(Number(t.dataset.i), 1);
      save();
      renderRows();
      renderResults();
    } else if (t.dataset.act === 'cpa-real') {
      state.cpa = null;
      save();
      renderParams(true);
      renderResults();
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.ofertas = { mount, render: renderAll };
})(window);
</script>
<script>
/* ui/productos.js */
/* Productos: qué vender junto al corrector */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const PR = VC.products;
  const CP = VC.competitors;
  const R = VC.research;
  const W = VC.winners;
  const { Store, Shop, AI, Browser } = VC.runtime;
  const { e, $, $$, App, chip, banner, toast, storeFail, icon, bubble, pageHead, info, more, toggle } = VC.ui;
  const A = VC.auto;

  const ESCALAS = [
    ['demanda', 'Demanda'],
    ['competencia', 'Competencia (5 = mucha)'],
    ['afinidad', 'Afinidad con tu cliente'],
    ['video', 'Se luce en video'],
    ['riesgo', 'Riesgo (5 = alto)'],
  ];
  const CADA = [24, 72, 168];
  const CANCELADO = 'Cancelado.';

  const state = {
    items: PR.CANDIDATOS.map((c) => Object.assign({ precio: null, costo: null }, c)),
    cpa: null,
    ia: { running: false, data: null, error: '' },
    cargado: false, // ya se leyó 'productos/lista'
    inv: new Map(), // id de documento → medición en Mercado Libre ('investigacion/<id>')
    desc: null, // 'investigacion/descubrir'
  };
  let el;
  let ctl;
  // Tareas automáticas: progreso en vivo y si el usuario las dejó en cola
  const vivo = { medir: [], desc: [] };
  const pedido = { productos: false, descubrir: false };

  function mount(section) {
    el = section;
    el.innerHTML =
      pageHead('Productos', 'Qué vender junto al corrector.', '<button class="btn ghost" data-act="agregar">' + icon('plus') + 'Agregar producto</button>') +
      '<div id="pr-warn"></div>' +
      '<section class="panel auto-panel pr-auto" id="pr-auto" aria-labelledby="pr-auto-title"></section>' +
      '<section class="panel pr-rank"><div class="panel-head"><div class="panel-title">' +
      bubble('trending', 'good') +
      '<h3>Ranking</h3>' +
      info(
        'Puntaje de 0 a 100: margen ' +
          PR.PESOS.margen +
          ' %, demanda ' +
          PR.PESOS.demanda +
          ' %, competencia ' +
          PR.PESOS.competencia +
          ' %, afinidad ' +
          PR.PESOS.afinidad +
          ' %, video ' +
          PR.PESOS.video +
          ' % y riesgo ' +
          PR.PESOS.riesgo +
          ' %. Sin precio y costo, el margen no cuenta.<br><br>“Publicidad por pedido” es lo que calculás pagar en anuncios por cada venta del producto nuevo. Los precios de referencia salen de Mercado Libre (relevados en ' +
          e(PR.REF_FECHA) +
          ' o de tu última medición).'
      ) +
      '</div><div id="pr-params"></div></div><div id="pr-ranking"></div></section>' +
      '<section class="panel pr-ia" id="pr-ia"></section>' +
      '<div id="pr-list" class="pr-list"></div>';
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    App.on((w) => w === 'cfg' && renderAll());
    if (A) A.on(onAuto);
    Store.get('productos/lista')
      .catch(() => null)
      .then((d) => {
        // Conserva lo que cargó el usuario y suma candidatos nuevos de la lista base
        if (d && Array.isArray(d.items) && d.items.length) {
          state.items = W.unirLista(d, PR.CANDIDATOS);
          state.cpa = d.cpa == null ? null : d.cpa;
        }
        state.cargado = true;
        renderAll();
      });
    cargarInvestigacion();
    renderAll();
  }

  const save = VC.ui.debounce(() => Store.set('productos/lista', JSON.parse(JSON.stringify({ items: state.items, cpa: state.cpa }))).catch(storeFail), 800);

  function cpa() {
    if (state.cpa != null) return state.cpa;
    const manual = P.normalizeCfg(App.cfg).cpaMaxManual;
    return manual > 0 ? Math.round(manual * 0.7) : 15000;
  }

  function rates() {
    return O.historicalRates(Shop.orders);
  }

  // ¿Estás escribiendo o eligiendo algo en este bloque? Entonces no se redibuja entero
  function editando(box) {
    const a = document.activeElement;
    return !!(a && box && box.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
  }

  function renderAll() {
    if (!el) return;
    renderAuto();
    $('#pr-warn', el).innerHTML = P.costsReady(App.cfg)
      ? ''
      : banner('warn', '<strong>Faltan tus costos.</strong> Sin envío y devolución no se puede calcular cuánto deja cada producto.', '<button class="btn" data-goto="ajustes">Cargar costos</button>');
    const pb = $('#pr-params', el);
    if (!editando(pb)) {
      pb.innerHTML = '<label class="pr-cpa" for="pr-cpa">Publicidad por pedido<span class="input-unit"><span class="unit">$</span><input id="pr-cpa" inputmode="numeric" value="' + e(U.int(cpa())) + '"></span></label>';
    }
    renderRanking();
    renderIA();
    renderList();
  }

  function scored() {
    return state.items.map((p) => Object.assign({ p }, PR.score(p, App.cfg, rates(), cpa())));
  }

  function renderRanking() {
    const list = scored().sort((a, b) => b.completo - a.completo || b.puntaje - a.puntaje);
    $('#pr-ranking', el).innerHTML =
      '<ol class="pr-rk">' +
      list
        .map((s, i) => {
          const v = W.veredicto(s.p.vende);
          return (
            '<li><span class="pr-rk-pos">' +
            (i + 1) +
            '</span><span class="pr-rk-name"><button type="button" class="pr-rk-go" data-act="ver" data-id="' +
            e(s.p.id) +
            '">' +
            e(s.p.nombre) +
            '</button>' +
            (v ? chip(v.label, v.tone) : '') +
            (s.completo ? '' : '<span class="pr-rk-miss">sin precio</span>') +
            '</span><span class="wf-track"><span class="wf-bar ' +
            (i === 0 && s.completo ? 'pos' : 'base') +
            '" style="width:' +
            Math.max(2, s.puntaje) +
            '%"></span></span><span class="pr-rk-val">' +
            s.puntaje +
            '</span></li>'
          );
        })
        .join('') +
      '</ol>';
  }

  function refText(p) {
    return p.refMin ? 'Mercado Libre: ' + U.money(p.refMin) + ' a ' + U.money(p.refMax) : 'Sin precio de referencia';
  }

  function renderList() {
    const box = $('#pr-list', el);
    if (editando(box)) {
      // Solo actualiza los números para no perder el foco mientras escribís
      for (const s of scored()) updateNumbers(s);
      return;
    }
    // Conserva abiertos los plegables al redibujar
    const abiertos = $$('details[open]', box)
      .map((d) => d.id)
      .filter(Boolean);
    box.innerHTML = scored()
      .map((s, i) => card(s, i))
      .join('');
    for (const id of abiertos) {
      const d = box.querySelector('#' + CSS.escape(id));
      if (d) d.open = true;
    }
  }

  function card(s, i) {
    const p = s.p;
    const sug = state.ia.data && state.ia.data.find((x) => norm(x.nombre) === norm(p.nombre));
    const inv = state.inv.get(W.docId(p.id));
    return (
      '<article class="pr-card" id="pc-' +
      e(p.id) +
      '"><header class="pr-card-head"><div class="pr-card-title"><h4><span data-out="nombre">' +
      e(p.nombre) +
      '</span>' +
      (p.nota ? info(e(p.nota)) : '') +
      '</h4><p class="pr-ref" data-out="ref">' +
      e(refText(p)) +
      '</p></div><div class="pr-score" title="Puntaje de 0 a 100"><span class="pr-score-num" data-out="puntaje">' +
      s.puntaje +
      '</span><span class="pr-score-lbl">puntos</span></div></header>' +
      '<div class="pr-ml" data-out="ml" data-v="' +
      e(inv ? inv.fecha : '') +
      '"' +
      (inv || Browser.available ? '' : ' hidden') +
      '>' +
      mlInner(p) +
      '</div><div class="pr-inputs">' +
      (p.custom ? fld(i, 'nombre', 'Nombre', p.nombre, true, 'pr-name') : '') +
      fld(i, 'precio', 'Precio de venta', p.precio) +
      fld(i, 'costo', 'Costo', p.costo) +
      '</div><div class="pr-nums">' +
      num(
        'Por pedido',
        'anuncios',
        s.eco ? U.money(s.eco.conAnuncios) : '—',
        s.eco ? (s.eco.conAnuncios >= 0 ? 'pos' : 'neg') : '',
        info('<strong>Por pedido:</strong> lo que queda por cada pedido que entra por anuncios, con tus anulados y devoluciones. “A un cliente” es venderle por WhatsApp a alguien que ya te compró, sin publicidad.')
      ) +
      num('A un cliente', 'cliente', s.eco ? U.money(s.eco.aCliente) : '—') +
      num('Precio ÷ costo', 'markup', s.eco ? s.eco.markup.toFixed(1).replace('.', ',') + '×' : '—') +
      '</div>' +
      (sug ? suggestion(sug, i) : '') +
      more('Puntajes y más', masInner(p, i), 'pcm-' + p.id) +
      '</article>'
    );
  }

  function num(label, k, val, cls, extra) {
    return '<div><span class="pr-num-lbl">' + e(label) + (extra || '') + '</span><span class="pr-num mono' + (cls ? ' ' + cls : '') + '" data-out="' + k + '">' + e(val) + '</span></div>';
  }

  function masInner(p, i) {
    const q = p.busqueda || p.nombre;
    return (
      '<div class="pr-more"><div class="pr-scales">' +
      ESCALAS.map(
        ([k, label]) =>
          '<label for="pr-' +
          i +
          '-' +
          k +
          '">' +
          e(label) +
          '<select id="pr-' +
          i +
          '-' +
          k +
          '" data-i="' +
          i +
          '" data-k="' +
          k +
          '">' +
          [1, 2, 3, 4, 5].map((n) => '<option' + (Number(p[k]) === n ? ' selected' : '') + '>' + n + '</option>').join('') +
          '</select></label>'
      ).join('') +
      fld(i, 'envioExtra', 'Envío extra', p.envioExtra) +
      '</div><div class="pr-links"><a class="btn link" href="' +
      e(PR.mlUrl(q)) +
      '" target="_blank" rel="noopener">Mercado Libre' +
      icon('external') +
      '</a><a class="btn link" href="' +
      e(PR.trendsUrl(q)) +
      '" target="_blank" rel="noopener">Google Trends' +
      icon('external') +
      '</a><a class="btn link" href="' +
      e(CP.adLibraryUrl(q)) +
      '" target="_blank" rel="noopener">Anuncios' +
      icon('external') +
      '</a>' +
      (p.custom ? '<button class="btn link pr-quitar" data-act="quitar" data-i="' + i + '">' + icon('trash') + 'Quitar</button>' : '') +
      '</div></div>'
    );
  }

  function updateNumbers(s) {
    const card = el.querySelector('#pc-' + CSS.escape(s.p.id));
    if (!card) return;
    const set = (k, v) => {
      const n = card.querySelector('[data-out="' + k + '"]');
      if (n) n.textContent = v;
      return n;
    };
    set('puntaje', s.puntaje);
    const an = set('anuncios', s.eco ? U.money(s.eco.conAnuncios) : '—');
    if (an) {
      an.classList.toggle('pos', !!s.eco && s.eco.conAnuncios >= 0);
      an.classList.toggle('neg', !!s.eco && s.eco.conAnuncios < 0);
    }
    set('cliente', s.eco ? U.money(s.eco.aCliente) : '—');
    set('markup', s.eco ? s.eco.markup.toFixed(1).replace('.', ',') + '×' : '—');
    set('nombre', s.p.nombre);
    // Lo que cambia una medición en Mercado Libre (sin tocar el campo donde estás escribiendo)
    set('ref', refText(s.p));
    const ml = card.querySelector('[data-out="ml"]');
    const inv = state.inv.get(W.docId(s.p.id));
    if (ml && ml.dataset.v !== (inv ? inv.fecha : '')) {
      ml.dataset.v = inv ? inv.fecha : '';
      ml.hidden = !inv && !Browser.available;
      ml.innerHTML = mlInner(s.p);
    }
    for (const k of ['demanda', 'competencia']) {
      const sel = card.querySelector('select[data-k="' + k + '"]');
      if (sel && sel !== document.activeElement && Number(s.p[k])) sel.value = String(s.p[k]);
    }
  }

  /* Bloque "Mercado Libre · hace X" de una tarjeta */
  function mlInner(p) {
    const inv = state.inv.get(W.docId(p.id));
    if (!inv || !inv.senales) return Browser.available ? '<p class="pr-ml-none">' + icon('search') + 'Todavía sin medir en Mercado Libre</p>' : '';
    const s = inv.senales;
    const v = W.veredicto(s.vende);
    const facts = [];
    if (s.vendidosVisibles != null) facts.push(fact('+' + U.int(s.vendidosVisibles), 'vendidos'));
    if (s.opiniones != null) facts.push(fact(U.int(s.opiniones), 'opiniones'));
    if (s.masVendidos) facts.push(fact(s.masVendidos, '“Más vendido”'));
    if (s.resultados != null) facts.push(fact(U.int(s.resultados), s.resultados === 1 ? 'resultado' : 'resultados'));
    if (s.precioMediana != null) facts.push(fact(U.money(s.precioMediana), 'precio típico'));
    const pubs = Array.isArray(inv.publicaciones) ? inv.publicaciones : [];
    return (
      '<div class="pr-ml-head"><span class="pr-ml-src">Mercado Libre · ' +
      e(U.timeAgo(inv.fecha)) +
      '</span>' +
      (v ? chip(v.label, v.tone) : '') +
      '</div><ul class="pr-facts">' +
      facts.join('') +
      '</ul>' +
      (pubs.length
        ? more(
            'Ver publicaciones (' + pubs.length + ')',
            '<ol class="pr-pubs">' + pubs.map(pubItem).join('') + '</ol><p class="note">Los vendidos son redondeados y de toda la vida de la publicación: son una señal, no ventas exactas.</p>',
            'pcp-' + p.id
          )
        : '')
    );
  }

  function fact(valor, label) {
    return '<li><strong>' + e(valor) + '</strong> ' + e(label) + '</li>';
  }

  function pubItem(l) {
    const meta = [];
    if (l.vendidos != null) meta.push(W.fmtVendidos(l.vendidos));
    if (l.opiniones != null) meta.push((l.calificacion ? String(l.calificacion).replace('.', ',') + ' ' : '') + '(' + U.int(l.opiniones) + ' opiniones)');
    if (l.masVendido) meta.push('Más vendido');
    if (l.full) meta.push('Full');
    else if (l.envioGratis) meta.push('Envío gratis');
    if (l.vendedor) meta.push(l.vendedor);
    return (
      '<li><span class="pr-pub-t">' +
      e(l.titulo || 'Sin título') +
      '</span><span class="pr-pub-p mono">' +
      (l.precio ? e(U.money(l.precio)) : '—') +
      '</span>' +
      (meta.length ? '<span class="pr-pub-m">' + e(meta.join(' · ')) + '</span>' : '') +
      '</li>'
    );
  }

  function fld(i, k, label, v, text, cls) {
    const id = 'pr-' + i + '-' + k;
    const input = '<input id="' + id + '" data-i="' + i + '" data-k="' + k + '"' + (text ? '' : ' inputmode="numeric" placeholder="0"') + ' value="' + e(text ? v || '' : v ? U.int(v) : '') + '">';
    return '<label class="pr-fld' + (cls ? ' ' + cls : '') + '" for="' + id + '">' + e(label) + (text ? input : '<span class="input-unit"><span class="unit">$</span>' + input + '</span>') + '</label>';
  }

  function suggestion(x, i) {
    return (
      '<div class="pr-sug"><div class="pr-sug-head"><span class="eyebrow">Claude sugiere</span><button class="btn soft sm" data-act="aplicar" data-i="' +
      i +
      '">Usar estos puntajes</button></div><p>Demanda ' +
      x.demanda +
      ' · competencia ' +
      x.competencia +
      ' · afinidad ' +
      x.afinidad +
      ' · video ' +
      x.video +
      ' · riesgo ' +
      x.riesgo +
      (x.precio_sugerido ? ' · precio ' + e(U.money(U.parseMoney(x.precio_sugerido))) : '') +
      '</p>' +
      (x.angulo ? '<p><strong>Ángulo:</strong> ' + e(x.angulo) + '</p>' : '') +
      (x.combo ? '<p><strong>Combo:</strong> ' + e(x.combo) + '</p>' : '') +
      (x.dudas ? '<p class="muted">' + e(x.dudas) + '</p>' : '') +
      '</div>'
    );
  }

  function norm(s) {
    return U.stripAccents(String(s || '')).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function renderIA() {
    const box = $('#pr-ia', el);
    const I = state.ia;
    const meta = !AI.sample ? 'Necesita Claude.' : I.running ? 'Pensando… puede tardar un minuto.' : I.data ? 'Sus puntajes están en cada producto.' : 'Estima puntajes, precio y ángulo de cada uno.';
    const accion = !AI.sample
      ? ''
      : I.running
        ? '<button class="btn ghost" data-act="ia-stop">' + icon('stop') + 'Detener</button>'
        : '<button class="btn soft" data-act="ia">' + icon('sparkles') + (I.data ? 'Preguntar de nuevo' : 'Pedir opinión') + '</button>';
    box.innerHTML =
      '<div class="pr-row">' +
      bubble('sparkles', 'source') +
      '<div class="pr-row-txt"><div class="pr-row-title"><h3>Opinión de Claude</h3>' +
      info(
        AI.sample
          ? 'Claude estima demanda, competencia y afinidad de cada producto y te sugiere precio, ángulo y combo. No entra a internet: confirmá en Mercado Libre antes de comprar stock.'
          : 'Abrí el panel desde claude.ai o la app de Claude para pedirle su opinión.'
      ) +
      '</div><p class="pr-row-meta">' +
      e(meta) +
      '</p></div>' +
      (accion ? '<div class="row-actions">' + accion + '</div>' : '') +
      '</div>' +
      (I.reco && !I.running ? '<p class="pr-reco">' + e(I.reco) + '</p>' : '') +
      (I.error ? '<p class="error-text">' + e(I.error) + '</p>' : '');
  }

  async function askIA() {
    ctl = new AbortController();
    state.ia = { running: true, data: state.ia.data, error: '' };
    renderIA();
    try {
      const data = await AI.sample.json(PR.claudePrompt(state.items, App.tienda), { signal: ctl.signal, cache: false });
      const list = data && Array.isArray(data.productos) ? data.productos : [];
      const clamp = (n) => U.clamp(Math.round(Number(n) || 3), 1, 5);
      state.ia.data = list.map((x) => ({ nombre: String(x.nombre || ''), demanda: clamp(x.demanda), competencia: clamp(x.competencia), afinidad: clamp(x.afinidad), video: clamp(x.video), riesgo: clamp(x.riesgo), precio_sugerido: x.precio_sugerido, angulo: String(x.angulo || ''), combo: String(x.combo || ''), dudas: String(x.dudas || '') }));
      state.ia.reco = String((data && data.recomendacion) || '');
      if (!state.ia.data.length) state.ia.error = 'La respuesta vino vacía. Probá de nuevo.';
    } catch (err) {
      if (err && err.code !== 'cancelled') state.ia.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.ia.running = false;
    renderIA();
    renderList();
  }

  /* ---------- Buscar ganadores: interfaz ---------- */

  function renderAuto() {
    const box = el && $('#pr-auto', el);
    if (!box) return;
    if (!box.dataset.ready) {
      box.innerHTML = '<div id="pr-auto-head"></div><div id="pr-auto-prog"></div><div id="pr-desc-prog"></div><div id="pr-desc-list"></div>' + (A ? more('Opciones', '<div id="pr-auto-cfg"></div>', 'pr-auto-more') : '');
      box.dataset.ready = '1';
    }
    renderAutoHead();
    renderAutoProg();
    renderAutoCfg();
    renderDesc();
  }

  function diasTxt(h) {
    const n = Number(h) || 24;
    if (n % 24) return n + ' h';
    return n === 24 ? '1 día' : n / 24 + ' días';
  }

  function nota(ic, html) {
    return '<p class="note">' + icon(ic) + html + '</p>';
  }

  function renderAutoHead() {
    const box = el && $('#pr-auto-head', el);
    if (!box) return;
    const titulo =
      '<div class="pr-row-title"><h3 id="pr-auto-title">Buscar ganadores</h3>' +
      info(
        'Abre en el navegador de Claude la búsqueda de Mercado Libre de cada producto, lee las publicaciones y anota las señales de venta: vendidos, opiniones, el sello MÁS VENDIDO y cuántos compiten. Con eso ajusta demanda, competencia y precios.<br><br>“Descubrir productos” busca productos nuevos para el mismo cliente del corrector que ya muestran ventas.'
      ) +
      '</div>';
    if (!A) {
      box.innerHTML = '<div class="pr-auto-row">' + bubble('zap', 'peach') + '<div class="pr-auto-txt">' + titulo + '<p class="pr-auto-meta">No cargó. Recargá el panel.</p></div></div>';
      return;
    }
    const c = A.cfg.productos || A.DEFAULTS.productos;
    const midiendo = A.running === 'productos';
    const buscando = A.running === 'descubrir';
    const chk = A.can('productos');
    const chkD = A.can('descubrir');
    const est = A.estado.productos || {};
    const estD = A.estado.descubrir || {};
    const ult = A.ultima('productos');
    const meta = midiendo ? 'Midiendo en Mercado Libre…' : buscando ? 'Buscando productos nuevos…' : ult ? 'Última medición ' + U.timeAgo(ult) : 'Todavía no mediste';

    let acciones = '';
    if (Browser.available) {
      acciones =
        (midiendo
          ? '<button class="btn ghost" data-act="medir-stop">' + icon('stop') + 'Detener</button>'
          : '<button class="btn" data-act="medir"' + (!chk.ok || pedido.productos ? ' disabled' : '') + '>' + icon('search') + (pedido.productos ? 'En cola…' : 'Medir en Mercado Libre') + '</button>') +
        (buscando
          ? '<button class="btn ghost" data-act="desc-stop">' + icon('stop') + 'Detener</button>'
          : '<button class="btn ghost" data-act="descubrir"' + (!chkD.ok || pedido.descubrir ? ' disabled' : '') + '>' + icon('sparkles') + (pedido.descubrir ? 'En cola…' : 'Descubrir productos') + '</button>');
    }

    const notas = [];
    if (!Browser.checked) notas.push(nota('clock', 'Revisando si el navegador de Claude está disponible…'));
    else if (!Browser.available)
      notas.push(
        nota(
          'alert',
          'Necesita la app de escritorio de Claude.' +
            info('La medición usa el navegador de Claude en tu PC: abrí este panel desde la app de escritorio de Claude, en una sesión de Cowork. Ahí abre la búsqueda de cada producto en Mercado Libre y anota las señales de venta. Mientras tanto, cargá los puntajes a mano en cada producto.')
        )
      );
    else if (!chk.ok) notas.push(nota('alert', e(chk.motivo)));
    else if (!chkD.ok) notas.push(nota('alert', e(chkD.motivo)));
    const otra = A.running && !midiendo && !buscando ? A.NOMBRES[A.running] || A.running : '';
    for (const [job, que] of [
      ['productos', 'La medición'],
      ['descubrir', 'La búsqueda'],
    ]) {
      if (pedido[job] && A.running && A.running !== job) notas.push(nota('clock', 'En cola: ' + que.toLowerCase() + ' arranca cuando termine la ' + e(A.NOMBRES[A.running] || A.running) + '.'));
    }
    if (otra && !pedido.productos && !pedido.descubrir) notas.push(nota('clock', 'Ahora corre la ' + e(otra) + '. Si tocás un botón, queda en cola.'));
    if (!midiendo && est.error === CANCELADO) notas.push(nota('stop', 'Cancelaste la última medición.'));
    else if (!midiendo && est.error) notas.push('<p class="error-text">La última medición no terminó: ' + e(est.error) + '</p>');
    else if (!midiendo && est.resultado && est.resultado.resumen) notas.push(nota('check', e(est.resultado.resumen) + '.'));
    if (!buscando && estD.error === CANCELADO) notas.push(nota('stop', 'Cancelaste la última búsqueda.'));
    else if (!buscando && estD.error) notas.push('<p class="error-text">La última búsqueda no terminó: ' + e(estD.error) + '</p>');

    box.innerHTML =
      '<div class="pr-auto-row">' +
      bubble('zap', 'peach') +
      '<div class="pr-auto-txt">' +
      titulo +
      '<p class="pr-auto-meta"><span>' +
      e(meta) +
      '</span>' +
      (c.auto ? chip('Solo cada ' + diasTxt(c.cadaHoras), 'good') : '') +
      '</p></div>' +
      (acciones ? '<div class="row-actions pr-auto-actions">' + acciones + '</div>' : '') +
      '</div>' +
      (notas.length ? '<div class="pr-auto-notes">' + notas.join('') + '</div>' : '');
  }

  const ST = {
    espera: ['en espera', ''],
    leyendo: ['leyendo…', ''],
    ok: ['listo', 'ok'],
    error: ['error', 'err'],
    omitida: ['no se leyó', ''],
  };

  function progList(items, texto) {
    return (
      '<div class="pr-prog"><ul class="auto-progress">' +
      items
        .map((it) => {
          const st = ST[it.estado] || ST.espera;
          return '<li class="is-' + e(it.estado) + '"><span class="st' + (st[1] ? ' ' + st[1] : '') + '">' + e(st[0]) + '</span><span>' + e(it.q) + (it.detalle ? ' <span class="muted">· ' + e(it.detalle) + '</span>' : '') + '</span></li>';
        })
        .join('') +
      '</ul>' +
      (texto ? '<p class="note" aria-live="polite">' + e(texto) + '</p>' : '') +
      '</div>'
    );
  }

  function renderAutoProg() {
    const box = el && $('#pr-auto-prog', el);
    if (!box || !A) return;
    const corriendo = A.running === 'productos';
    const est = A.estado.productos || {};
    box.innerHTML = vivo.medir.length && (corriendo || (est.error && est.error !== CANCELADO)) ? progList(vivo.medir, corriendo ? A.progress.productos : '') : '';
  }

  function renderAutoCfg() {
    const box = el && $('#pr-auto-cfg', el);
    if (!box || !A) return;
