    return Shop.orders.find((o) => o.key === key);
  }

  async function setWA(key, patch) {
    const o = findOrder(key);
    const prev = App.confirm.get(key) || {};
    const next = Object.assign({}, prev, patch, { pedido: o ? o.name : prev.pedido, actualizado: new Date().toISOString() });
    App.confirm.set(key, next);
    App.emit('confirm');
    try {
      await Store.set('confirmaciones/' + key, next);
    } catch (err) {
      storeFail(err);
    }
    return o;
  }

  async function tagShopify(o, estado) {
    if (!App.msgs.etiquetarShopify || !o || Shop.mode !== 'live') return;
    const add = estado === 'confirmado' ? [TAG_OK] : estado === 'cancelado' ? [TAG_NO] : [];
    const remove = [TAG_OK, TAG_NO].filter((t) => !add.includes(t));
    try {
      await Shop.setTags(o, add, remove);
      render();
    } catch (err) {
      const m = err && err.code === 'approval_required' ? 'Shopify pidió tu aprobación para etiquetar el pedido. Aprobalo y volvé a marcarlo.' : 'Quedó marcado en el panel, pero no se pudo etiquetar en Shopify.';
      toast(m, 'warn');
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'conf-filtro') {
      state.filtro = t.dataset.value;
      prefSet('conf-filtro', state.filtro);
      render();
      return;
    }
    const act = t.dataset.act;
    const key = t.dataset.key;
    if (act === 'refrescar' || act === 'reintentar') load(true);
    else if (act === 'permisos') VC.runtime.managePermissions().then((ok) => !ok && toast('Abrí el menú Permisos de esta página para habilitar Shopify.', 'warn'));
    else if (act === 'wa-confirmar' || act === 'wa-recordatorio' || act === 'wa-direccion') {
      // El enlace abre WhatsApp; acá solo registramos que se abrió el chat (después del clic, para no cortar la navegación).
      const prev = App.confirm.get(key) || {};
      setTimeout(
        () =>
          setWA(key, {
            estado: prev.estado === 'confirmado' || prev.estado === 'cancelado' ? prev.estado : 'esperando',
            ultimoContacto: new Date().toISOString(),
            intentos: (prev.intentos || 0) + 1,
          }),
        60
      );
    } else if (act === 'marcar') {
      const estado = t.dataset.estado;
      setWA(key, { estado }).then((o) => tagShopify(o, estado));
      if (estado === 'confirmado') toast('Confirmado. Ya podés despacharlo.', 'good');
    } else if (act === 'deshacer') {
      const o = findOrder(key);
      App.confirm.delete(key);
      App.emit('confirm');
      Store.remove('confirmaciones/' + key).catch(storeFail);
      if (o && o.tags.some((tg) => tg === TAG_OK || tg === TAG_NO)) tagShopify(o, null);
    } else if (act === 'copiar-despacho') copyText(t.dataset.text, t);
  }

  async function onChange(ev) {
    const t = ev.target;
    if (t.id === 'conf-dias') {
      state.dias = Number(t.value);
      prefSet('conf-dias', state.dias);
      load();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      try {
        Shop.importCSV(await VC.ui.readFileText(t.files[0]));
        state.error = null;
        toast('Pedidos importados del CSV.', 'good');
      } catch (err) {
        toast(err.message || 'No se pudo leer el archivo.', 'bad');
      }
      render();
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.confirmar = { mount, render, load };
})(window);
</script>
<script>
/* ui/ganancia.js */
/* 2 · Panel de ganancia real */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, kpi, seg, banner, shopStatusBanner, prefGet, prefSet, toast, storeFail } = VC.ui;

  const state = {
    rango: prefGet('gan-rango', 'hoy'),
    desde: null,
    hasta: null,
    gastos: {},
    loading: false,
    error: null,
  };

  let el;

  function range() {
    const hoy = U.todayKeyAR();
    switch (state.rango) {
      case 'ayer':
        return [U.addDays(hoy, -1), U.addDays(hoy, -1)];
      case '7d':
        return [U.addDays(hoy, -6), hoy];
      case 'mes':
        return [hoy.slice(0, 8) + '01', hoy];
      case 'custom':
        return [state.desde || U.addDays(hoy, -6), state.hasta || hoy];
      default:
        return [hoy, hoy];
    }
  }

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Ganancia real</h2><p class="lede">Ventas de Shopify menos producto, envíos, devoluciones, comisiones y anuncios. Los pedidos que todavía no se entregaron se proyectan con tus tasas reales.</p></div>' +
      '<div class="tool-actions"><button class="btn ghost" data-act="refrescar">Actualizar</button></div></header>' +
      '<div id="gan-range"></div><div id="gan-status"></div><div id="gan-kpis"></div>' +
      '<div class="grid-2"><section class="panel" id="gan-spend"></section><section class="panel" id="gan-break"></section></div>' +
      '<section class="panel" id="gan-chart"></section><section class="panel" id="gan-sources"></section><p class="note" id="gan-rates"></p>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('input', onInput);
    Shop.onChange(renderAll);
    App.on((w) => (w === 'cfg' || w === 'confirm') && renderAll());
    Store.watch(
      'gastos',
      (m) => {
        const g = {};
        for (const [k, v] of m) g[k] = v;
        state.gastos = g;
        renderAll(true);
      },
      () => {}
    );
    load();
  }

  async function load(fresh) {
    const [from] = range();
    state.loading = true;
    state.error = null;
    renderAll();
    try {
      await Shop.ensure(from, { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    renderAll();
  }

  function renderAll(keepInputs) {
    if (!el) return;
    const [from, to] = range();
    $('#gan-range', el).innerHTML =
      '<div class="toolbar">' +
      seg(
        'gan-rango',
        [
          { value: 'hoy', label: 'Hoy' },
          { value: 'ayer', label: 'Ayer' },
          { value: '7d', label: '7 días' },
          { value: 'mes', label: 'Este mes' },
          { value: 'custom', label: 'Elegir fechas' },
        ],
        state.rango
      ) +
      (state.rango === 'custom'
        ? '<div class="dates"><label for="gan-desde">Desde <input type="date" id="gan-desde" value="' + from + '"></label><label for="gan-hasta">Hasta <input type="date" id="gan-hasta" value="' + to + '"></label></div>'
        : '<span class="muted">' + e(from === to ? U.fmtDay(from, true) : U.fmtDay(from) + ' al ' + U.fmtDay(to)) + '</span>') +
      '</div>';

    const statusEl = $('#gan-status', el);
    const notes = [];
    if (Shop.mode === 'none') notes.push(shopStatusBanner({ message: 'Esta vista no puede conectarse a Shopify. Abrí el panel desde claude.ai o importá el CSV de pedidos.' }));
    else if (state.error) notes.push(shopStatusBanner(state.error));
    if (!P.costsReady(App.cfg)) notes.push(banner('warn', '<strong>Falta el costo del producto.</strong> Cargá cuánto te cuesta cada corrector, el envío y la devolución para ver la ganancia de verdad.', '<button class="btn" data-goto="ajustes">Cargar costos</button>'));
    statusEl.innerHTML = notes.join('');

    const rates = O.historicalRates(Shop.orders);
    const res = P.computeProfit({ orders: Shop.orders, gastos: state.gastos, cfg: App.cfg, rates, confirm: App.confirmStates(), from, to });
    const be = P.breakEven(App.cfg, rates);
    const t = res.total;
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;

    $('#gan-kpis', el).innerHTML = loadingFirst
      ? '<div class="kpis"><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div><div class="skeleton kpi-sk"></div></div>'
      : '<div class="kpis">' +
        kpi(
          'Ganancia estimada',
          '<span class="' + (t.ganancia >= 0 ? 'pos' : 'neg') + '">' + e(U.money(t.ganancia)) + '</span>',
          'Ya cobrado menos gastos: <span class="mono nowrap">' + e(U.money(t.asegurado.ganancia)) + '</span>',
          t.ganancia >= 0 ? 'good' : 'bad'
        ) +
        kpi('Gasto en anuncios', e(U.money(t.ads)), t.roas != null ? 'ROAS real ' + e(t.roas.toFixed(2).replace('.', ',')) + ' · ' + e(U.money(t.cpaPedido)) + ' por pedido' : t.pedidos ? 'Cargá el gasto del día abajo' : 'Sin gasto cargado') +
        kpi('Pedidos', e(U.int(t.pedidos)), e(t.anulados) + ' anulados · ' + e(t.entregados) + ' entregados · ' + e(t.abiertos) + ' abiertos' + (t.devueltos ? ' · ' + e(t.devueltos) + ' devueltos' : '')) +
        kpi(
          'Costo por entrega',
          t.cpaEntrega != null ? e(U.money(t.cpaEntrega)) : '—',
          be && be.cpaEntregaEquilibrio > 0 ? 'Equilibrio: ' + e(U.money(be.cpaEntregaEquilibrio)) + ' por entrega' : 'Anuncios ÷ entregas esperadas',
          t.cpaEntrega != null && be && be.cpaEntregaEquilibrio > 0 ? (t.cpaEntrega <= be.cpaEntregaEquilibrio ? 'good' : 'bad') : ''
        ) +
        '</div>';

    if (!keepInputs || !el.querySelector('#gan-spend input:focus')) renderSpend(res, from, to);
    renderBreak(res, be);
    renderChart(res);
    renderSources(res);
    const r = res.rates;
    const origen = (o) => (o === 'historico' ? 'tu historial' : o === 'manual' ? 'cargada a mano' : 'supuesta, sin historial');
    $('#gan-rates', el).textContent =
      'Proyección: de cada 100 pedidos se despachan ' +
      Math.round(r.confirmacion * 100) +
      ' (' +
      origen(r.origenConfirmacion) +
      (r.origenConfirmacion === 'historico' ? ', ' + rates.muestraConfirmacion + ' pedidos' : '') +
      ') y de cada 100 despachados se entregan ' +
      Math.round(r.entrega * 100) +
      ' (' +
      origen(r.origenEntrega) +
      (r.origenEntrega === 'historico' ? ', ' + rates.muestraEntrega + ' envíos' : '') +
      '). Los pedidos confirmados por WhatsApp cuentan como despachados. Podés cambiar las tasas en Ajustes.';
  }

  function renderSpend(res, from, to) {
    const days = res.days.slice().reverse();
    const many = days.length > 31;
    const rows = (many ? days.slice(0, 31) : days)
      .map((d) => {
        const g = state.gastos[d.day] || {};
        const inp = (k) =>
          '<input type="text" inputmode="numeric" class="num-input" id="gasto-' +
          d.day +
          '-' +
          k +
          '" data-day="' +
          d.day +
          '" data-k="' +
          k +
          '" value="' +
          (g[k] ? e(U.int(g[k])) : '') +
          '" placeholder="0" aria-label="Gasto en ' +
          k +
          ' el ' +
          e(U.fmtDay(d.day)) +
          '">';
        return (
          '<tr><th scope="row">' +
          e(U.fmtDay(d.day, true)) +
          '</th><td>' +
          inp('tiktok') +
          '</td><td>' +
          inp('meta') +
          '</td><td>' +
          inp('otros') +
          '</td><td class="num ' +
          (d.ganancia >= 0 ? 'pos' : 'neg') +
          '">' +
          e(U.moneyShort(d.ganancia)) +
          '</td></tr>'
        );
      })
      .join('');
    $('#gan-spend', el).innerHTML =
      '<h3>Gasto en anuncios</h3><p class="muted small">Copiá el gasto de cada plataforma (en pesos). Se guarda solo.</p>' +
      '<div class="table-wrap"><table class="table spend"><thead><tr><th>Día</th><th>TikTok</th><th>Meta</th><th>Otros</th><th class="num">Ganancia</th></tr></thead><tbody>' +
      rows +
      '</tbody></table></div>' +
      (many ? '<p class="muted small">Se muestran los últimos 31 días del rango.</p>' : '');
  }

  function renderBreak(res, be) {
    const t = res.total;
    const items = [
      ['Ventas esperadas', t.ventas, 'base'],
      ['Costo del producto', -t.producto],
      ['Envíos', -t.envios],
      ['Devoluciones', -t.devoluciones],
      ['Comisión de cobro', -t.comisiones],
      ['Otros por pedido', -t.otros],
      ['Costos fijos', -t.fijos],
      ['Anuncios', -t.ads],
    ].filter((x) => x[2] === 'base' || Math.round(x[1]) !== 0);
    const max = Math.max(1, t.ventas, Math.abs(t.ganancia));
    const bar = (v, cls) => '<span class="wf-bar ' + cls + '" style="width:' + Math.max(1, (Math.abs(v) / max) * 100).toFixed(1) + '%"></span>';
    const list = items
      .map((x) => '<li><span class="wf-label">' + e(x[0]) + '</span><span class="wf-track">' + bar(x[1], x[2] === 'base' ? 'base' : 'cost') + '</span><span class="wf-val mono">' + e(U.money(x[1])) + '</span></li>')
      .join('');
    const g = '<li class="wf-total"><span class="wf-label">Ganancia</span><span class="wf-track">' + bar(t.ganancia, t.ganancia >= 0 ? 'pos' : 'neg') + '</span><span class="wf-val mono ' + (t.ganancia >= 0 ? 'pos' : 'neg') + '">' + e(U.money(t.ganancia)) + '</span></li>';
    let beHtml = '';
    if (be && P.costsReady(App.cfg)) {
      beHtml =
        be.cpaEquilibrio > 0
          ? '<div class="be"><div><span class="be-num mono">' +
            e(U.money(be.cpaEquilibrio)) +
            '</span><span class="be-txt">es lo máximo que podés pagar por pedido en TikTok o Meta sin perder plata.</span></div><div><span class="be-num mono">' +
            e(U.money(be.cpaObjetivo)) +
            '</span><span class="be-txt">es el costo por pedido para quedarte con el 30% de margen.</span></div><p class="muted small">Con ticket promedio de ' +
            e(U.money(be.ticket)) +
            ' y ' +
            e(be.unidades.toFixed(1).replace('.', ',')) +
            ' unidades por pedido entregado: cada entrega te deja ' +
            e(U.money(be.margenEntrega)) +
            ' antes de anuncios.</p></div>'
          : banner('bad', 'Con estos costos cada pedido pierde plata aun sin anuncios. Revisá el precio o los costos en Ajustes.')
    } else if (!be) beHtml = '<p class="muted small">Cuando tengas pedidos entregados vamos a calcular cuánto podés pagar por pedido.</p>';
    $('#gan-break', el).innerHTML = '<h3>De dónde sale la ganancia</h3><ul class="waterfall">' + list + g + '</ul>' + beHtml;
  }

  function renderChart(res) {
    const box = $('#gan-chart', el);
    if (res.days.length < 2) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    const vals = res.days.map((d) => d.ganancia);
    const maxAbs = Math.max(1, ...vals.map(Math.abs));
    const hasNeg = vals.some((v) => v < 0);
    const W = Math.max(300, Math.floor(box.clientWidth) - 34, res.days.length * 28);
    const H = 190;
    const pad = { t: 18, b: hasNeg ? 42 : 26, l: 8, r: 8 };
    const hasPos = vals.some((v) => v > 0);
    const zeroY = hasNeg && hasPos ? pad.t + ((H - pad.t - pad.b) * maxPos(vals)) / (maxPos(vals) + maxNeg(vals)) : hasNeg ? pad.t : H - pad.b;
    const scale = (H - pad.t - pad.b) / (hasNeg && hasPos ? maxPos(vals) + maxNeg(vals) : maxAbs);
    const bw = (W - pad.l - pad.r) / res.days.length;
    const iMax = vals.indexOf(Math.max(...vals));
    const iMin = vals.indexOf(Math.min(...vals));
    let bars = '';
    res.days.forEach((d, i) => {
      const v = d.ganancia;
      const h = Math.max(1, Math.abs(v) * scale);
      const x = pad.l + i * bw + bw * 0.18;
      const y = v >= 0 ? zeroY - h : zeroY;
      const w = bw * 0.64;
      bars +=
        '<g class="bar-g"><rect class="hit" x="' +
        (pad.l + i * bw) +
        '" y="0" width="' +
        bw +
        '" height="' +
        H +
        '"></rect><rect class="' +
        (v >= 0 ? 'bar-pos' : 'bar-neg') +
        '" x="' +
        x.toFixed(1) +
        '" y="' +
        y.toFixed(1) +
        '" width="' +
        w.toFixed(1) +
        '" height="' +
        h.toFixed(1) +
        '" rx="3"></rect><title>' +
        e(U.fmtDay(d.day, true) + ': ' + U.money(v) + ' · ' + d.pedidos + ' pedidos · anuncios ' + U.money(d.ads)) +
        '</title></g>';
      if ((i === iMax && v > 0) || (i === iMin && v < 0)) {
        const ly = v >= 0 ? y - 5 : y + h + 12;
        bars += '<text class="bar-label" x="' + (x + w / 2).toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle">' + e(U.moneyShort(v)) + '</text>';
      }
      const step = Math.ceil(res.days.length / 10);
      if (i % step === 0 || i === res.days.length - 1) bars += '<text class="axis-label" x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + e(U.fmtDay(d.day)) + '</text>';
    });
    box.innerHTML =
      '<h3>Ganancia por día</h3><div class="chart-wrap"><svg class="chart" viewBox="0 0 ' +
      W +
      ' ' +
      H +
      '" width="' +
      W +
      '" height="' +
      H +
      '" role="img" aria-label="Ganancia estimada por día"><line class="zero" x1="' +
      pad.l +
      '" x2="' +
      (W - pad.r) +
      '" y1="' +
      zeroY.toFixed(1) +
      '" y2="' +
      zeroY.toFixed(1) +
      '"></line>' +
      bars +
      '</svg></div>';
  }

  function maxPos(v) {
    return Math.max(0, ...v);
  }
  function maxNeg(v) {
    return Math.max(0, ...v.map((x) => -x));
  }

  function renderSources(res) {
    const box = $('#gan-sources', el);
    const rows = res.sources.filter((s) => s.pedidos || s.ads);
    if (!rows.length) {
      box.innerHTML = '<h3>Por plataforma</h3><p class="muted">Sin pedidos en este rango.</p>';
      return;
    }
    box.innerHTML =
      '<h3>Por plataforma</h3><p class="muted small">Según la UTM que trae cada pedido. El gasto de “Otros” no se asigna a ninguna.</p><div class="table-wrap"><table class="table"><thead><tr><th>Plataforma</th><th class="num">Pedidos</th><th class="num">Anulados</th><th class="num">Ventas esperadas</th><th class="num">Anuncios</th><th class="num">Ganancia</th><th class="num">ROAS</th></tr></thead><tbody>' +
      rows
        .map(
          (s) =>
            '<tr><th scope="row">' +
            e(O.SOURCES[s.source] || s.source) +
            '</th><td class="num">' +
            s.pedidos +
            '</td><td class="num">' +
            s.anulados +
            '</td><td class="num">' +
            e(U.money(s.ventas)) +
            '</td><td class="num">' +
            e(U.money(s.ads)) +
            '</td><td class="num ' +
            (s.ganancia - s.fijos >= 0 ? 'pos' : 'neg') +
            '">' +
            e(U.money(s.ganancia)) +
            '</td><td class="num">' +
            (s.roas != null ? e(s.roas.toFixed(2).replace('.', ',')) : '—') +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div>';
  }

  const saveSpend = {};
  function onInput(ev) {
    const t = ev.target;
    if (!t.dataset.day) return;
    const day = t.dataset.day;
    clearTimeout(saveSpend[day]);
    saveSpend[day] = setTimeout(() => {
      const row = {};
      for (const k of ['tiktok', 'meta', 'otros']) {
        const inp = el.querySelector('#gasto-' + day + '-' + k);
        row[k] = inp ? U.parseMoney(inp.value) || 0 : 0;
      }
      state.gastos[day] = row;
      Store.set('gastos/' + day, row).catch(storeFail);
      renderAll(true);
    }, 600);
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.id === 'gan-desde' || t.id === 'gan-hasta') {
      state.desde = $('#gan-desde', el).value;
      state.hasta = $('#gan-hasta', el).value;
      if (state.desde > state.hasta) [state.desde, state.hasta] = [state.hasta, state.desde];
      load();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      VC.ui
        .readFileText(t.files[0])
        .then((txt) => {
          Shop.importCSV(txt);
          state.error = null;
          toast('Pedidos importados del CSV.', 'good');
          renderAll();
        })
        .catch((err) => toast(err.message || 'No se pudo leer el archivo.', 'bad'));
    } else if (t.dataset.day) {
      const v = U.parseMoney(t.value);
      t.value = v ? U.int(v) : '';
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'gan-rango') {
      state.rango = t.dataset.value;
      prefSet('gan-rango', state.rango);
      load();
    } else if (t.dataset.act === 'refrescar' || t.dataset.act === 'reintentar') load(true);
    else if (t.dataset.act === 'permisos') VC.runtime.managePermissions();
  }

  VC.tools = VC.tools || {};
  VC.tools.ganancia = { mount, render: renderAll, load };
})(window);
</script>
<script>
/* ui/creativos.js */
/* 3 · Analizador de creativos (reportes de TikTok Ads y Meta Ads) */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const A = VC.ads;
  const P = VC.profit;
  const O = VC.orders;
  const { Store, Shop, AI } = VC.runtime;
  const { e, $, App, chip, banner, emptyState, toast, copyText, storeFail } = VC.ui;

  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  const EJEMPLO = [
    'Ad name,Cost,Impressions,Clicks (destination),Complete payment,2-second video views,Video views at 100%',
    'EJEMPLO dolor_confesion_v1,84000,31000,620,9,10500,1400',
    'EJEMPLO dolor_pregunta_v2,52000,22000,350,4,6900,800',
    'EJEMPLO medico_kinesiologa_v1,61000,26000,410,3,7800,1100',
    'EJEMPLO estetica_remera_v1,48000,24000,190,0,4100,300',
    'EJEMPLO gym_press_v1,39000,15000,240,1,5200,500',
    'EJEMPLO gym_espejo_v2,12000,5200,40,0,700,60',
    'EJEMPLO dolor_demo_v3,9000,4100,70,0,1600,210',
  ].join('\n');

  const state = {
    file: null,
    headers: [],
    rows: [],
    map: {},
    plataforma: null,
    ads: [],
    overrides: {},
    cpaMax: null,
    ejemplo: false,
    ia: { running: false, text: '', error: '' },
  };
  let el;
  let ctl;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Analizador de creativos</h2><p class="lede">Subí el reporte de anuncios de TikTok o Meta. Te dice qué apagar, qué mantener, qué escalar y qué ángulo vende mejor, usando tu CPA máximo real.</p></div></header>' +
      '<div id="cr-drop"></div><div id="cr-body"></div>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('dragover', (ev) => {
      if (ev.target.closest('.dropzone')) {
        ev.preventDefault();
        ev.target.closest('.dropzone').classList.add('is-over');
      }
    });
    el.addEventListener('dragleave', (ev) => ev.target.closest('.dropzone') && ev.target.closest('.dropzone').classList.remove('is-over'));
    el.addEventListener('drop', (ev) => {
      const dz = ev.target.closest('.dropzone');
      if (!dz) return;
      ev.preventDefault();
      dz.classList.remove('is-over');
      if (ev.dataTransfer.files[0]) loadFile(ev.dataTransfer.files[0]);
    });
    Store.get('creativos/angulos').then((d) => {
      state.overrides = (d && d.map) || {};
      render();
    });
    App.on((w) => w === 'cfg' && render());
    Shop.onChange(() => state.rows.length && render());
    render();
  }

  function suggestedCpa() {
    const manual = P.normalizeCfg(App.cfg).cpaMaxManual;
    if (manual > 0) return { value: manual, origen: 'Ajustes' };
    const be = P.breakEven(App.cfg, O.historicalRates(Shop.orders));
    if (be && P.costsReady(App.cfg) && be.cpaEquilibrio > 0) return { value: Math.round(be.cpaEquilibrio), origen: 'Ganancia real' };
    return { value: null, origen: null };
  }

  function angleOf(a) {
    return state.overrides[a.nombre] || A.detectAngle(a.nombre);
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (root.XLSX) return resolve();
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('No se pudo cargar el lector de Excel. Exportá el reporte como CSV.'));
      document.head.appendChild(s);
    });
  }

  async function loadFile(file) {
    try {
      let headers;
      let rows;
      if (/\.(xlsx|xls)$/i.test(file.name)) {
        await loadScript(XLSX_URL);
        const wb = root.XLSX.read(await file.arrayBuffer(), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const matrix = root.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
        const hi = matrix.findIndex((r) => r.filter((c) => String(c).trim()).length >= 3);
        headers = (matrix[hi] || []).map((h) => String(h).trim());
        rows = matrix.slice(hi + 1).map((r) => {
          const o = {};
          headers.forEach((h, i) => (o[h] = r[i] == null ? '' : r[i]));
          return o;
        });
      } else {
        const parsed = U.parseCSV(await VC.ui.readFileText(file));
        headers = parsed.headers;
        rows = parsed.rows;
      }
      setData(file.name, headers, rows, false);
    } catch (err) {
      toast(err.message || 'No se pudo leer el archivo.', 'bad');
    }
  }

  function setData(name, headers, rows, ejemplo) {
    state.file = name;
    state.headers = headers;
    state.rows = rows;
    state.map = A.detectMapping(headers);
    state.plataforma = A.detectPlatform(headers);
    state.ejemplo = ejemplo;
    state.ia = { running: false, text: '', error: '' };
    recompute();
    if (!state.map.nombre || !state.map.gasto) toast('No reconocimos todas las columnas. Revisalas en “Columnas detectadas”.', 'warn');
    else saveSummary();
  }

  function recompute() {
    state.ads = state.map.nombre ? A.aggregate(state.rows, state.map) : [];
    render();
  }

  function cpaMax() {
    return state.cpaMax != null ? state.cpaMax : suggestedCpa().value;
  }

  function analysis() {
    const max = cpaMax();
    const ads = state.ads.map((a) => Object.assign({}, a, { angulo: angleOf(a), decision: A.decide(a, max) }));
    ads.sort((x, y) => A.ACCIONES[x.decision.accion].orden - A.ACCIONES[y.decision.accion].orden || y.gasto - x.gasto);
    const angles = A.byAngle(state.ads, angleOf);
    return { ads, angles, ganador: A.winner(angles), max };
  }

  function angleLabel(k) {
    return (A.ANGLES[k] && A.ANGLES[k].label) || 'Sin ángulo';
  }

  function render() {
    if (!el) return;
    $('#cr-drop', el).innerHTML =
      '<label class="dropzone' +
      (state.file ? ' is-compact' : '') +
      '" for="cr-file"><input type="file" id="cr-file" accept=".csv,.xlsx,.xls,text/csv"><span class="dz-title">' +
      (state.file ? 'Cambiar reporte' : 'Arrastrá el reporte acá o tocá para elegirlo') +
      '</span><span class="dz-sub">CSV o Excel exportado de TikTok Ads Manager o del Administrador de anuncios de Meta, a nivel anuncio.</span></label>';
    const body = $('#cr-body', el);
    if (!state.file) {
      body.innerHTML =
        '<div class="grid-2"><section class="panel"><h3>Cómo exportar de TikTok</h3><ol class="steps"><li>Ads Manager → Campañas → pestaña <strong>Anuncios</strong>.</li><li>Elegí el rango de fechas (los últimos 3 a 7 días).</li><li>Columnas: Costo, Impresiones, Clics (destino), Pago completado, Reproducciones de video de 2 segundos y al 100%.</li><li>Exportar → CSV o Excel.</li></ol></section>' +
        '<section class="panel"><h3>Cómo exportar de Meta</h3><ol class="steps"><li>Administrador de anuncios → pestaña <strong>Anuncios</strong>.</li><li>Elegí el rango de fechas.</li><li>Columnas: Importe gastado, Impresiones, Clics en el enlace, Compras, Reproducciones de video de 3 segundos y ThruPlays.</li><li>Informes → Exportar datos de la tabla → CSV.</li></ol></section></div>' +
        '<p class="note">Para que el ángulo se detecte solo, poné la palabra en el nombre del anuncio: <span class="mono">dolor</span>, <span class="mono">medico</span>, <span class="mono">estetica</span> o <span class="mono">gym</span> (por ejemplo <span class="mono">dolor_confesion_v2</span>). Si no, lo elegís a mano.</p>' +
        '<div class="row-actions"><button class="btn ghost" data-act="ejemplo">Ver con un reporte de ejemplo</button></div>';
      return;
    }
    const sug = suggestedCpa();
    const an = analysis();
    const counts = {};
    for (const a of an.ads) counts[a.decision.accion] = (counts[a.decision.accion] || 0) + 1;
    const plat = state.plataforma === 'tiktok' ? 'TikTok' : state.plataforma === 'meta' ? 'Meta' : 'Plataforma desconocida';

    let html = '';
    if (state.ejemplo) html += banner('info', '<strong>Datos de ejemplo.</strong> No son tus anuncios: subí tu reporte para ver tus números.');
    html +=
      '<div class="toolbar cr-meta"><div class="chips">' +
      chip(plat, 'source') +
      chip(state.file, 'neutral') +
      chip(an.ads.length + ' anuncios', 'neutral') +
      '</div><label class="field-inline" for="cr-cpa">CPA máximo por pedido <input type="text" inputmode="numeric" id="cr-cpa" class="num-input" value="' +
      (an.max ? e(U.int(an.max)) : '') +
      '" placeholder="ej. 25.000"></label>' +
      (sug.value && state.cpaMax != null && state.cpaMax !== sug.value ? '<button class="btn link" data-act="cpa-sugerido">Usar ' + e(U.money(sug.value)) + ' (' + e(sug.origen) + ')</button>' : sug.origen ? '<span class="muted small">Calculado en ' + e(sug.origen) + '</span>' : '') +
      '</div>';
    if (!an.max) html += banner('warn', 'Sin CPA máximo no se puede decidir. Cargá tus costos en Ajustes o escribí acá cuánto podés pagar como máximo por pedido.', '<button class="btn" data-goto="ajustes">Cargar costos</button>');
    if (!state.map.nombre || !state.map.gasto) html += banner('bad', 'No encontramos la columna del nombre del anuncio o la del gasto. Elegilas en “Columnas detectadas”.');
    else if (!state.map.compras) html += banner('warn', 'No encontramos una columna de compras o conversiones: solo se puede juzgar por CTR y retención.');

    html +=
      '<div class="decision-strip">' +
      ['escalar', 'mantener', 'revisar', 'esperar', 'apagar']
        .map((k) => '<div class="dstat tone-' + A.ACCIONES[k].tone + '"><span class="stat-value">' + (counts[k] || 0) + '</span><span class="stat-label">' + e(A.ACCIONES[k].label) + '</span></div>')
        .join('') +
      '</div>';

    // Ángulos
    const g = an.ganador;
    let winTxt = 'Todavía no hay datos suficientes para elegir un ángulo ganador.';
    if (g && g.criterio === 'cpa')
      winTxt = '<strong>Ángulo ganador: ' + e(angleLabel(g.angulo)) + '.</strong> Vende a ' + e(U.money(g.cpa)) + ' por pedido' + (g.vsPromedio != null && g.vsPromedio < 0 ? ', ' + e(U.pct(-g.vsPromedio)) + ' más barato que el promedio' : '') + '. Hacé más variantes de ese ángulo.';
    else if (g) winTxt = '<strong>Señal temprana: ' + e(angleLabel(g.angulo)) + '.</strong> Todavía sin ventas suficientes, pero tiene el mejor CTR (' + e(U.pct(g.ctr, 2)) + ').';
    html +=
      '<section class="panel"><h3>Ángulos</h3><p>' +
      winTxt +
      '</p><div class="table-wrap"><table class="table"><thead><tr><th>Ángulo</th><th class="num">Anuncios</th><th class="num">Gasto</th><th class="num">Ventas</th><th class="num">CPA</th><th class="num">CTR</th><th class="num">Gancho 2-3 s</th></tr></thead><tbody>' +
      an.angles
        .map(
          (x) =>
            '<tr' +
            (g && x.angulo === g.angulo ? ' class="is-winner"' : '') +
            '><th scope="row">' +
            e(angleLabel(x.angulo)) +
            (g && x.angulo === g.angulo ? ' ' + chip('Ganador', 'good') : '') +
            '</th><td class="num">' +
            x.anuncios +
            '</td><td class="num">' +
            e(U.money(x.gasto)) +
            '</td><td class="num">' +
            e(U.int(x.compras)) +
            '</td><td class="num">' +
            e(x.cpa != null ? U.money(x.cpa) : '—') +
            '</td><td class="num">' +
            e(U.pct(x.ctr, 2)) +
            '</td><td class="num">' +
            e(U.pct(x.hookRate)) +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div></section>';

    // Anuncios
    html +=
      '<section class="panel"><h3>Qué hacer con cada anuncio</h3><div class="table-wrap"><table class="table ads"><thead><tr><th>Anuncio</th><th>Acción</th><th class="num">Gasto</th><th class="num">Ventas</th><th class="num">CPA</th><th class="num">CTR</th><th class="num">Gancho</th></tr></thead><tbody>' +
      an.ads
        .map((a, i) => {
          const acc = A.ACCIONES[a.decision.accion];
          return (
            '<tr><td class="ad-cell"><div class="ad-name">' +
            e(a.nombre) +
            '</div><label class="sr-only" for="ang-' +
            i +
            '">Ángulo</label><select id="ang-' +
            i +
            '" class="mini-select" data-ad="' +
            e(a.nombre) +
            '">' +
            Object.keys(A.ANGLES)
              .concat('otro')
              .map((k) => '<option value="' + k + '"' + (k === a.angulo ? ' selected' : '') + '>' + e(angleLabel(k)) + '</option>')
              .join('') +
            '</select><div class="ad-why">' +
            e(a.decision.motivo) +
            '</div></td><td>' +
            chip(acc.label, acc.tone) +
            '</td><td class="num">' +
            e(U.money(a.gasto)) +
            '</td><td class="num">' +
            e(U.int(a.compras)) +
            '</td><td class="num">' +
            e(a.cpa != null ? U.money(a.cpa) : '—') +
            '</td><td class="num">' +
            e(U.pct(a.ctr, 2)) +
            '</td><td class="num">' +
            e(U.pct(a.hookRate)) +
            '</td></tr>'
          );
        })
        .join('') +
      '</tbody></table></div><p class="muted small">Contra entrega: la plataforma cuenta el pedido, no la entrega. El CPA máximo ya descuenta los pedidos que se anulan y los que vuelven.</p></section>';

    // Claude
    html +=
      '<section class="panel" id="cr-ia"><div class="panel-head"><h3>Lectura de Claude</h3>' +
      (AI.sample
        ? '<div class="row-actions">' + (state.ia.running ? '<button class="btn ghost" data-act="ia-stop">Detener</button>' : '<button class="btn" data-act="ia">' + (state.ia.text ? 'Volver a analizar' : 'Pedir lectura y nuevos ganchos') + '</button>') + (state.ia.text && !state.ia.running ? '<button class="btn ghost" data-act="ia-copiar">Copiar</button>' : '') + '</div>'
        : '') +
      '</div>' +
      (AI.sample
        ? '<div class="ia-out' + (state.ia.running && !state.ia.text ? ' is-thinking' : '') + '">' + (state.ia.text ? e(state.ia.text) : state.ia.running ? 'Pensando…' : '<span class="muted">Claude lee la tabla, explica por qué gana el ángulo y te propone 5 ganchos nuevos para testear.</span>') + '</div>' + (state.ia.error ? '<p class="error-text">' + e(state.ia.error) + '</p>' : '')
        : '<p class="muted">Abrí el panel desde claude.ai para pedirle a Claude una lectura del reporte.</p>') +
      '</section>';

    // Mapeo de columnas
    const fields = { nombre: 'Nombre del anuncio', gasto: 'Gasto', impresiones: 'Impresiones', clics: 'Clics', compras: 'Compras / conversiones', valor: 'Valor de compras', hook: 'Vistas de 2-3 s', completas: 'Vistas completas' };
    html +=
      '<details class="panel"><summary>Columnas detectadas</summary><div class="map-grid">' +
      Object.entries(fields)
        .map(
          ([k, label]) =>
            '<label for="map-' +
            k +
            '">' +
            e(label) +
            '<select id="map-' +
            k +
            '" data-map="' +
            k +
            '"><option value="">(no usar)</option>' +
            state.headers.map((h) => '<option' + (state.map[k] === h ? ' selected' : '') + '>' + e(h) + '</option>').join('') +
            '</select></label>'
        )
        .join('') +
      '</div></details>';
    body.innerHTML = html;
  }

  function summaryRows(an) {
    return an.angles.map((x) => ({ angulo: x.angulo, gasto: Math.round(x.gasto), compras: x.compras, cpa: x.cpa ? Math.round(x.cpa) : null, ctr: x.ctr, hookRate: x.hookRate }));
  }

  function saveSummary() {
    if (state.ejemplo) return;
    const an = analysis();
    const doc = {
      fecha: new Date().toISOString(),
      archivo: state.file,
      plataforma: state.plataforma,
      cpaMax: an.max || null,
      ganador: an.ganador ? an.ganador.angulo : null,
      angulos: summaryRows(an),
      acciones: an.ads.slice(0, 60).map((a) => ({ nombre: a.nombre, angulo: a.angulo, accion: a.decision.accion, gasto: Math.round(a.gasto), compras: a.compras })),
    };
    App.ultimoAnalisis = doc;
    App.emit('analisis');
    Store.set('creativos/ultimo', doc).catch(storeFail);
  }

  async function askClaude() {
    const an = analysis();
    const ticket = O.historicalRates(Shop.orders).ticketPromedio;
    const tabla = an.ads
      .slice(0, 80)
      .map((a) => [a.nombre, angleLabel(a.angulo), Math.round(a.gasto), a.compras, a.cpa ? Math.round(a.cpa) : '-', U.pct(a.ctr, 2), U.pct(a.hookRate), A.ACCIONES[a.decision.accion].label].join(' | '))
      .join('\n');
    const angs = an.angles.map((x) => [angleLabel(x.angulo), Math.round(x.gasto), x.compras, x.cpa ? Math.round(x.cpa) : '-', U.pct(x.ctr, 2), U.pct(x.hookRate)].join(' | ')).join('\n');
    const prompt = [
      'Sos media buyer de e-commerce en Argentina. La tienda vende un corrector de postura con pago contra entrega' + (ticket ? ' (ticket promedio de los pedidos entregados: ' + U.money(ticket) + ')' : '') + '. Plataforma del reporte: ' + (state.plataforma || 'desconocida') + '.',
      'CPA máximo por pedido para no perder: ' + (an.max ? U.money(an.max) : 'sin dato') + '. La plataforma cuenta pedidos, no entregas.',
      '',
      'ÁNGULOS (ángulo | gasto ARS | ventas | CPA | CTR | gancho 2-3 s):',
      angs,
      '',
      'ANUNCIOS (nombre | ángulo | gasto ARS | ventas | CPA | CTR | gancho | decisión por reglas):',
      tabla,
      '',
      'Respondé en español rioplatense, sin markdown (texto plano con guiones), en este orden y breve:',
      '1. Lectura en 3 líneas: qué está pasando.',
      '2. Si alguna decisión por reglas te parece equivocada, cuál y por qué (si no, decilo).',
      '3. Por qué creés que funciona el mejor ángulo y qué patrón ves en los ganchos que retienen.',
      '4. Cinco ganchos nuevos (primera frase del video, máximo 12 palabras) para testear del ángulo ganador. Sin promesas de cura ni claims médicos.',
      '5. Cómo repartir el presupuesto mañana.',
    ].join('\n');
    ctl = new AbortController();
    state.ia = { running: true, text: '', error: '' };
    render();
    try {
      const res = await AI.sample(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => {
        state.ia.text = text;
        const out = el.querySelector('#cr-ia .ia-out');
        if (out) {
          out.classList.remove('is-thinking');
          out.textContent = text;
        }
      } });
      state.ia.text = res.text + (res.truncated ? '\n\n(La respuesta se cortó por largo.)' : '');
    } catch (err) {
      state.ia.text = err.text || '';
      if (err.code !== 'cancelled') state.ia.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.ia.running = false;
    render();
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    const act = t.dataset.act;
    if (act === 'ejemplo') {
      const p = U.parseCSV(EJEMPLO);
      setData('reporte-ejemplo.csv', p.headers, p.rows, true);
    } else if (act === 'cpa-sugerido') {
      state.cpaMax = null;
      render();
    } else if (act === 'ia') askClaude();
    else if (act === 'ia-stop') ctl && ctl.abort();
    else if (act === 'ia-copiar') copyText(state.ia.text, t);
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.id === 'cr-file' && t.files && t.files[0]) loadFile(t.files[0]);
    else if (t.id === 'cr-cpa') {
      const v = U.parseMoney(t.value);
      state.cpaMax = v > 0 ? v : null;
      render();
      saveSummary();
    } else if (t.dataset.ad) {
      state.overrides[t.dataset.ad] = t.value;
      if (!state.ejemplo) Store.set('creativos/angulos', { map: Object.assign({}, state.overrides) }).catch(storeFail);
      render();
      saveSummary();
    } else if (t.dataset.map) {
      state.map[t.dataset.map] = t.value || undefined;
      recompute();
      saveSummary();
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.creativos = { mount, render };
})(window);
</script>
<script>
/* ui/resenas.js */
/* 4 · Pedidor de reseñas reales */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, chip, waButton, seg, emptyState, shopStatusBanner, toast, copyText, prefGet, prefSet, storeFail } = VC.ui;

  const R_ESTADOS = {
    pedida: { label: 'Reseña pedida', tone: 'warn' },
    recordada: { label: 'Recordatorio enviado', tone: 'warn' },
    recibida: { label: 'Reseña recibida', tone: 'good' },
    no: { label: 'No quiere', tone: 'neutral' },
  };
  const HANDLE = 'corrector-postura-viacare';

  const state = { filtro: prefGet('res-filtro', 'pedir'), editing: null, loading: false, error: null };
  let el;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Reseñas reales</h2><p class="lede">Cuando un pedido se entrega, escribile al cliente para pedirle su opinión y una foto usando el corrector. Guardá lo que te manda y publicalo con su permiso.</p></div>' +
      '<div class="tool-actions"><button class="btn ghost" data-act="refrescar">Actualizar</button></div></header>' +
      '<div id="res-status"></div><div id="res-summary"></div><div id="res-filters"></div><div id="res-list" class="order-list"></div><section class="panel" id="res-export"></section>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('submit', onSubmit);
    Shop.onChange(render);
    App.on((w) => (w === 'resenas' || w === 'msgs') && render());
    load();
  }

  async function load(fresh) {
    state.loading = true;
    state.error = null;
    render();
    try {
      await Shop.ensure(U.addDays(U.todayKeyAR(), -60), { fresh });
    } catch (err) {
      state.error = err;
    }
    state.loading = false;
    render();
  }

  function deliveredAt(o) {
    return o.deliveredAt || o.closedAt || o.shippedAt || o.createdAt;
  }

  function lists() {
    const since = U.addDays(U.todayKeyAR(), -60);
    const entregados = Shop.orders.filter((o) => o.estado === 'entregado' && o.day >= since).sort((a, b) => (deliveredAt(a) < deliveredAt(b) ? 1 : -1));
    const st = (o) => (App.resenas.get(o.key) || {}).estado;
    return {
      pedir: entregados.filter((o) => !st(o)),
      pedidas: entregados.filter((o) => st(o) === 'pedida' || st(o) === 'recordada'),
      recibidas: [...App.resenas.entries()].filter(([, r]) => r.estado === 'recibida').map(([k, r]) => Shop.orders.find((o) => o.key === k) || ghost(k, r)),
      todas: entregados,
    };
  }

  // Reseña guardada de un pedido que ya no está en la lista cargada
  function ghost(key, r) {
    return { key, name: r.pedido || '', fullName: r.cliente || '', firstName: r.cliente || '', city: r.ciudad || '', phone: { wa: '', display: '' }, units: 1, extras: [], total: 0, createdAt: r.pedidaEn || r.actualizado, estado: 'entregado', ghost: true };
  }

  function render() {
    if (!el) return;
    const statusEl = $('#res-status', el);
    if (Shop.mode === 'none') statusEl.innerHTML = shopStatusBanner({ message: 'Esta vista no puede conectarse a Shopify. Abrí el panel desde claude.ai o importá el CSV de pedidos.' });
    else statusEl.innerHTML = state.error ? shopStatusBanner(state.error) : '';

    const L = lists();
    const loadingFirst = (state.loading || Shop.mode === 'pending') && !Shop.loadedAt;
    const conPermiso = L.recibidas.filter((o) => (App.resenas.get(o.key) || {}).permiso);
    const conFoto = L.recibidas.filter((o) => (App.resenas.get(o.key) || {}).foto);
    const pedidasTot = [...App.resenas.values()].filter((r) => r.estado !== 'no').length;
    $('#res-summary', el).innerHTML = loadingFirst
      ? '<div class="summary-strip is-loading">Cargando pedidos entregados…</div>'
      : '<div class="summary-strip">' +
        stat(L.pedir.length, 'entregados sin pedir', L.pedir.length ? 'warn' : '') +
        stat(L.pedidas.length, 'esperando respuesta') +
        stat(L.recibidas.length, 'reseñas recibidas', L.recibidas.length ? 'good' : '') +
        stat(conFoto.length, 'con foto') +
        stat(pedidasTot ? U.pct(L.recibidas.length / pedidasTot) : '—', 'responden') +
        '</div>';

    $('#res-filters', el).innerHTML =
      '<div class="toolbar">' +
      seg(
        'res-filtro',
        [
          { value: 'pedir', label: 'Para pedir', count: L.pedir.length },
          { value: 'pedidas', label: 'Pedidas', count: L.pedidas.length },
          { value: 'recibidas', label: 'Recibidas', count: L.recibidas.length },
          { value: 'todas', label: 'Todos los entregados', count: L.todas.length },
        ],
        state.filtro
      ) +
      '<label class="field-inline" for="res-dias">Pedir a los <select id="res-dias">' +
      [2, 3, 4, 5, 7, 10].map((d) => '<option value="' + d + '"' + (d === Number(App.msgs.diasResena) ? ' selected' : '') + '>' + d + ' días</option>').join('') +
      '</select> de entregado</label></div>';

    const list = L[state.filtro] || [];
    const listEl = $('#res-list', el);
    if (loadingFirst) listEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    else if (!list.length)
      listEl.innerHTML = emptyState(
        'Nada por acá',
        e(
          {
            pedir: 'No hay pedidos entregados sin pedirles reseña en los últimos 60 días.',
            pedidas: 'No hay reseñas pedidas esperando respuesta.',
            recibidas: 'Todavía no cargaste reseñas. Cuando un cliente te responda, tocá “Cargar reseña” en su pedido.',
            todas: 'No hay pedidos entregados en los últimos 60 días.',
          }[state.filtro]
        )
      );
    else listEl.innerHTML = list.map(card).join('');

    renderExport(conPermiso);
  }

  function stat(value, label, tone) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"><span class="stat-value">' + e(value) + '</span><span class="stat-label">' + e(label) + '</span></div>';
  }

  function card(o) {
    const r = App.resenas.get(o.key) || {};
    const vars = O.templateVars(o, App.msgs);
    const dAt = deliveredAt(o);
    const dias = Math.floor(U.hoursSince(dAt) / 24);
    const ideal = Number(App.msgs.diasResena) || 4;
    const st = R_ESTADOS[r.estado];
    const chips = [
      st ? chip(st.label, st.tone) : dias < ideal ? chip('Ideal en ' + (ideal - dias) + (ideal - dias === 1 ? ' día' : ' días'), 'neutral') : chip('Listo para pedir', 'info'),
      r.foto ? chip('Con foto', 'good') : '',
      r.estado === 'recibida' && !r.permiso ? chip('Sin permiso para publicar', 'warn') : '',
    ].join('');
    const msg = U.fillTemplate(App.msgs.resena, vars);
    const rec = U.fillTemplate(App.msgs.resenaRecordatorio, vars);
    const editing = state.editing === o.key;
    return (
      '<article class="order-card' +
      (r.estado === 'recibida' ? ' is-good' : '') +
      '"><div class="oc-top"><div class="oc-id"><span class="mono">' +
      e(o.name) +
      '</span><span class="muted">' +
      (o.ghost ? '' : 'Entregado ' + e(U.timeAgo(dAt))) +
      '</span></div>' +
      (r.estrellas ? '<div class="stars" aria-label="' + r.estrellas + ' estrellas">' + '★'.repeat(r.estrellas) + '<span class="muted">' + '★'.repeat(5 - r.estrellas) + '</span></div>' : '') +
      '</div><div class="oc-who"><strong>' +
      e(o.fullName || 'Sin nombre') +
      '</strong>' +
      (o.city ? ' · ' + e(o.city) : '') +
      (o.ghost ? '' : ' · ' + e(vars.cantidad)) +
      '</div>' +
      (o.phone.display ? '<div class="oc-phone"><span class="mono selectable">' + e(o.phone.display) + '</span>' + (r.pedidaEn ? '<span class="muted">Pedida ' + e(U.timeAgo(r.pedidaEn)) + '</span>' : '') + '</div>' : '') +
      '<div class="chips">' +
      chips +
      '</div>' +
      (r.texto && !editing ? '<blockquote class="review">“' + e(r.texto) + '”<footer>— ' + e(r.nombre || '') + (r.ciudad ? ', ' + e(r.ciudad) : '') + '</footer></blockquote>' : '') +
      (editing
        ? form(o, r)
        : '<div class="oc-actions"><div class="row-actions">' +
          (r.estado !== 'recibida' && !o.ghost
            ? waButton(U.waLink(o.phone.wa, msg), r.estado ? 'Volver a pedir' : 'Pedir reseña', 'wa-resena', o.key, r.estado ? 'ghost' : 'wa') +
              (r.estado === 'pedida' ? waButton(U.waLink(o.phone.wa, rec), 'Recordatorio', 'wa-recordatorio', o.key, 'ghost') : '')
            : '') +
          '</div><div class="row-actions decide"><button class="btn ghost" data-act="cargar" data-key="' +
          e(o.key) +
          '">' +
          (r.estado === 'recibida' ? 'Editar reseña' : 'Cargar reseña') +
          '</button>' +
          (r.estado !== 'recibida' && r.estado !== 'no' ? '<button class="btn link" data-act="no-quiere" data-key="' + e(o.key) + '">No quiere</button>' : '') +
          (r.estado ? '<button class="btn link" data-act="deshacer" data-key="' + e(o.key) + '">Deshacer</button>' : '') +
          '</div></div>') +
      '</article>'
    );
  }

  function form(o, r) {
    const k = e(o.key);
    const defName = r.nombre || (U.firstName(o.firstName) + (o.lastName ? ' ' + U.capitalizeName(o.lastName).charAt(0) + '.' : ''));
    return (
      '<form class="review-form" data-key="' +
      k +
      '"><div class="form-grid"><label for="rv-estrellas-' +
      k +
      '">Estrellas<select id="rv-estrellas-' +
      k +
      '" name="estrellas">' +
      [5, 4, 3, 2, 1].map((n) => '<option value="' + n + '"' + (Number(r.estrellas || 5) === n ? ' selected' : '') + '>' + n + '</option>').join('') +
      '</select></label><label for="rv-nombre-' +
      k +
      '">Nombre a mostrar<input id="rv-nombre-' +
      k +
      '" name="nombre" value="' +
      e(defName) +
      '"></label><label for="rv-ciudad-' +
      k +
      '">Ciudad<input id="rv-ciudad-' +
      k +
      '" name="ciudad" value="' +
      e(r.ciudad || o.city || '') +
      '"></label></div><label for="rv-texto-' +
      k +
      '">Lo que escribió (copialo tal cual)<textarea id="rv-texto-' +
      k +
      '" name="texto" rows="3" required>' +
      e(r.texto || '') +
      '</textarea></label><div class="checks"><label for="rv-foto-' +
      k +
      '"><input type="checkbox" id="rv-foto-' +
      k +
      '" name="foto"' +
      (r.foto ? ' checked' : '') +
      '> Mandó foto</label><label for="rv-permiso-' +
      k +
      '"><input type="checkbox" id="rv-permiso-' +
      k +
      '" name="permiso"' +
      (r.permiso ? ' checked' : '') +
      '> Dio permiso para publicarla</label></div><div class="row-actions"><button class="btn" type="submit">Guardar reseña</button><button class="btn link" type="button" data-act="cancelar-form">Cancelar</button></div></form>'
    );
  }

  function renderExport(list) {
    const box = $('#res-export', el);
    if (!list.length) {
      box.innerHTML =
        '<h3>Para publicar</h3><p class="muted">Las reseñas con permiso aparecen acá para copiarlas a tu app de reseñas. Las fotos las guardás desde WhatsApp y las subís a mano.</p>';
      return;
    }
    const rows = list.map((o) => {
      const r = App.resenas.get(o.key);
      const words = String(r.texto || '').split(/\s+/);
      return {
        product_handle: HANDLE,
        rating: r.estrellas || 5,
        title: words.slice(0, 6).join(' ') + (words.length > 6 ? '…' : ''),
        body: r.texto || '',
        reviewer_name: r.nombre || '',
        reviewer_location: r.ciudad || '',
        review_date: (r.actualizado || '').slice(0, 10),
        foto: r.foto ? 'sí' : 'no',
        pedido: r.pedido || o.name,
      };
    });
    const headers = ['product_handle', 'rating', 'title', 'body', 'reviewer_name', 'reviewer_location', 'review_date', 'foto', 'pedido'];
    const csv = U.toCSV(headers, rows);
    box.innerHTML =
      '<div class="panel-head"><h3>Para publicar (' +
      list.length +
      ')</h3><button class="btn" data-act="copiar-csv">Copiar CSV</button></div><p class="muted small">Reseñas con permiso. Revisá que las columnas coincidan con las que pide tu app de reseñas antes de importarlas.</p><pre class="code-block selectable" id="res-csv">' +
      e(csv) +
      '</pre>';
    box.dataset.csv = csv;
  }

  async function setR(key, patch) {
    const o = Shop.orders.find((x) => x.key === key);
    const prev = App.resenas.get(key) || {};
    const next = Object.assign({}, prev, patch, { actualizado: new Date().toISOString() });
    if (o) {
      next.pedido = o.name;
      next.cliente = o.fullName;
    }
    App.resenas.set(key, next);
    App.emit('resenas');
    try {
      await Store.set('resenas/' + key, next);
    } catch (err) {
      storeFail(err);
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act], [data-seg]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.seg === 'res-filtro') {
      state.filtro = t.dataset.value;
      prefSet('res-filtro', state.filtro);
      render();
      return;
    }
    const key = t.dataset.key;
    switch (t.dataset.act) {
      case 'refrescar':
      case 'reintentar':
        load(true);
        break;
      case 'permisos':
        VC.runtime.managePermissions();
        break;
      case 'wa-resena': {
        const prev = App.resenas.get(key) || {};
        setTimeout(() => setR(key, { estado: prev.estado === 'recibida' ? 'recibida' : 'pedida', pedidaEn: new Date().toISOString() }), 60);
        break;
      }
      case 'wa-recordatorio':
        setTimeout(() => setR(key, { estado: 'recordada', recordadaEn: new Date().toISOString() }), 60);
        break;
      case 'cargar':
        state.editing = key;
        render();
        break;
      case 'cancelar-form':
        state.editing = null;
        render();
        break;
      case 'no-quiere':
        setR(key, { estado: 'no' });
        break;
      case 'deshacer':
        App.resenas.delete(key);
        App.emit('resenas');
        Store.remove('resenas/' + key).catch(storeFail);
        break;
      case 'copiar-csv':
        copyText($('#res-export', el).dataset.csv || '', t);
        break;
    }
  }

  function onSubmit(ev) {
    const f = ev.target.closest('.review-form');
    if (!f) return;
    ev.preventDefault();
    const fd = new FormData(f);
    const texto = String(fd.get('texto') || '').trim();
    if (!texto) {
      toast('Escribí lo que te mandó el cliente.', 'warn');
      return;
    }
    setR(f.dataset.key, {
      estado: 'recibida',
      estrellas: Number(fd.get('estrellas')) || 5,
      nombre: String(fd.get('nombre') || '').trim(),
      ciudad: String(fd.get('ciudad') || '').trim(),
      texto,
      foto: fd.get('foto') === 'on',
      permiso: fd.get('permiso') === 'on',
    });
    state.editing = null;
    toast('Reseña guardada.', 'good');
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.id === 'res-dias') {
      App.msgs.diasResena = Number(t.value);
      App.saveMsgs();
      render();
    } else if (t.dataset.act === 'importar-csv' && t.files && t.files[0]) {
      VC.ui
        .readFileText(t.files[0])
        .then((txt) => {
          Shop.importCSV(txt);
          state.error = null;
          render();
        })
        .catch((err) => toast(err.message || 'No se pudo leer el archivo.', 'bad'));
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.resenas = { mount, render, load };
})(window);
</script>
<script>
/* ui/guiones.js */
/* 5 · Generador de guiones UGC para Flow: tanda automática y "Elegirlo yo" */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const S = VC.scripts;
  const P = VC.autoplan;
  const { Store, AI } = VC.runtime;
  const { e, $, App, chip, toast, copyText, prefGet, prefSet, storeFail } = VC.ui;
  const A = VC.auto;

  const CADA = [24, 48, 72];

  const state = {
    opts: Object.assign(
      { angulo: 'dolor', anguloLibre: '', personaje: 'oficinista', personajeLibre: '', genero: 'f', clips: 4, cantidad: 3, idiomaPrompt: 'en', oferta: 'Pagás al recibir. Llevando 2 pagás $ 72.990 en total', extra: '' },
      prefGet('ugc-opts', {})
    ),
    guiones: [],
    origen: null,
    fecha: null,
    running: false,
    streamChars: 0,
    error: '',
  };
  // Tanda automática: último documento guardado, pasos en vivo y si el usuario la dejó en cola
  const auto = { doc: null, cargado: false, pasos: [], pedido: false };
  let abierta = prefGet('ugc-auto-abierta', true);
  let el;
  let ctl;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Guiones UGC</h2><p class="lede">Guiones partidos en clips de 8 segundos, con la ficha de continuidad y el prompt listo para pegar en Flow. Dejá que se escriban solos con lo que funciona, o elegí vos el ángulo y el personaje.</p></div></header>' +
      '<section class="panel auto-panel" id="ugc-auto" aria-labelledby="ugc-auto-title"></section><div id="ugc-auto-out"></div>' +
      '<section class="ugc-manual" aria-labelledby="ugc-manual-title"><div class="ugc-manual-head"><h3 id="ugc-manual-title">Elegirlo yo</h3><p class="muted small">Vos elegís ángulo, personaje, lugar, clips y cantidad. Funciona aparte de la tanda automática.</p></div>' +
      '<form id="ugc-form" class="panel ugc-form"></form><div id="ugc-out"></div></section>';
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('submit', (ev) => {
      ev.preventDefault();
      generate();
    });
    Store.get('guiones/ultimo').then((d) => {
      if (d && Array.isArray(d.guiones) && !state.guiones.length) {
        state.guiones = S.sanitize(d, d.opts || {});
        state.origen = d.origen;
        state.fecha = d.fecha;
        renderOut();
      }
    });
    App.on((w) => (w === 'analisis' || w === 'msgs') && renderForm());
    if (A) A.on(onAuto);
    if (!auto.cargado) cargarTanda();
    renderAuto();
    renderAutoOut();
    renderForm();
    renderOut();
  }

  function render() {
    renderAuto();
    renderForm();
  }

  /* ---------- Tanda automática: interfaz ---------- */

  function cfgAuto() {
    return Object.assign({}, A ? A.DEFAULTS.guiones : {}, A ? A.cfg.guiones : {});
  }

  function cadaTxt(h) {
    h = Number(h) || 24;
    if (h % 24) return h + ' h';
    return h === 24 ? '1 día' : h / 24 + ' días';
  }

  function renderAuto() {
    const box = el && $('#ugc-auto', el);
    if (!box) return;
    if (!box.dataset.ready) {
      box.innerHTML = '<div id="ugc-auto-head"></div><div id="ugc-auto-prog"></div><div id="ugc-auto-plan"></div><div id="ugc-auto-cfg"></div>';
      box.dataset.ready = '1';
    }
    renderAutoHead();
    renderAutoProg();
    renderAutoPlan();
    renderAutoCfg();
  }

  function renderAutoHead() {
    const box = el && $('#ugc-auto-head', el);
    if (!box) return;
    const c = cfgAuto();
    const corriendo = !!A && A.running === 'guiones';
    const otra = A && A.running && !corriendo ? A.NOMBRES[A.running] || A.running : '';
    const est = (A && A.estado.guiones) || {};
    const d = auto.doc;
    const meta = [
      d && d.fecha ? 'Última tanda: ' + U.timeAgo(d.fecha) + ', ' + P.motivoTexto(d.origen, d.motivo) : auto.cargado ? 'Todavía no hay tandas automáticas' : 'Buscando la última tanda…',
      c.auto ? 'Automático: al abrir el panel, cada ' + cadaTxt(c.cadaHoras) : 'Automático apagado',
    ];
    if (A && A.cfg.competencia && A.cfg.competencia.guionesTras) meta.push('También después de un escaneo de la competencia con anuncios nuevos');
    let accion = '';
    if (A && AI.sample) {
      accion = corriendo
        ? '<button type="button" class="btn ghost" data-act="tanda-detener">Detener</button>'
        : '<button type="button" class="btn" data-act="tanda-generar"' + (auto.pedido ? ' disabled' : '') + '>' + (auto.pedido ? 'En cola…' : 'Generar ahora') + '</button>';
    }
    let aviso = '';
    if (!AI.sample)
      aviso =
        '<div class="auto-off"><strong>Los guiones automáticos los escribe Claude.</strong> Abrí el panel desde claude.ai o la app de Claude para que se escriban solos. Mientras tanto, en “Elegirlo yo” podés armarlos con plantillas.</div>';
    let estado = '';
    if (otra) estado = '<p class="small muted">' + (auto.pedido ? 'En cola: la tanda arranca cuando termine la ' + e(otra) + '.' : 'Ahora está corriendo la ' + e(otra) + '. Si tocás “Generar ahora”, queda en cola.') + '</p>';
    else if (!corriendo && est.error) estado = '<p class="error-text">La última tanda no terminó: ' + e(est.error) + '</p>';
    box.innerHTML =
      '<div class="auto-head"><div class="ugc-auto-title"><h3 id="ugc-auto-title">Guiones automáticos</h3><div class="auto-meta">' +
      meta.map((m) => '<span>' + e(m) + '</span>').join('') +
      '</div></div>' +
      (accion ? '<div class="row-actions">' + accion + '</div>' : '') +
      '</div><p class="ugc-auto-lede">Cada tanda elige sola el ángulo (el ganador de tus anuncios o el que más dura en la competencia), rota el personaje y responde la duda que más se repite en tus comentarios.</p>' +
      aviso +
      estado;
  }

  const ST = {
    espera: ['en espera', ''],
    curso: ['en curso…', ''],
    ok: ['listo', 'ok'],
    error: ['error', 'err'],
  };

  function renderAutoProg() {
    const box = el && $('#ugc-auto-prog', el);
    if (!box) return;
    const corriendo = !!A && A.running === 'guiones';
    const est = (A && A.estado.guiones) || {};
    if (!auto.pasos.length || (!corriendo && !est.error)) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML =
      '<ul class="auto-progress">' +
      auto.pasos
        .map((p) => {
          const st = ST[p.estado] || ST.espera;
          return '<li><span class="st' + (st[1] ? ' ' + st[1] : '') + '">' + e(st[0]) + '</span><span>' + e(p.label) + (p.det ? ' <span class="muted">· ' + e(p.det) + '</span>' : '') + '</span></li>';
        })
        .join('') +
      '</ul>';
  }

  function renderAutoPlan() {
    const box = el && $('#ugc-auto-plan', el);
    if (!box) return;
    const d = auto.doc;
    if (!d || !d.razones.length) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML =
      '<div class="ugc-plan"><span class="eyebrow">Por qué la última tanda salió así</span><ul class="ugc-razones">' +
      d.razones.map((r) => '<li>' + e(r) + '</li>').join('') +
      '</ul>' +
      (d.opts && S.ANGULOS[d.opts.angulo] ? '<div class="row-actions"><button type="button" class="btn ghost" data-act="tanda-al-form">Pasar esta configuración al formulario</button></div>' : '') +
      '</div>';
  }

  function renderAutoCfg() {
    const box = el && $('#ugc-auto-cfg', el);
    if (!box || !A) return;
    const c = cfgAuto();
    const dis = A.loaded ? '' : ' disabled';
    const cada = CADA.includes(Number(c.cadaHoras)) ? CADA : CADA.concat(Number(c.cadaHoras) || 24).sort((a, b) => a - b);
    // Si el usuario está usando una opción, conservamos el foco al redibujar
    const act = document.activeElement;
    const keep = act && box.contains(act) && act.dataset ? act.dataset.cfg : '';
    box.innerHTML =
      '<div class="ugc-auto-cfg auto-toggles"><span class="ugc-auto-when"><label><input type="checkbox" data-cfg="auto"' +
      (c.auto ? ' checked' : '') +
      dis +
      '> Escribir guiones nuevos solos al abrir el panel</label><label>cada <select data-cfg="cadaHoras" aria-label="Cada cuántos días"' +
      dis +
      '>' +
      cada.map((h) => '<option value="' + h + '"' + (Number(c.cadaHoras) === h ? ' selected' : '') + '>' + e(cadaTxt(h)) + '</option>').join('') +
      '</select></label></span><label>Guiones por tanda <select data-cfg="cantidad"' +
      dis +
      '>' +
      [1, 2, 3, 4, 5].map((n) => '<option value="' + n + '"' + (Number(c.cantidad) === n ? ' selected' : '') + '>' + n + '</option>').join('') +
      '</select></label><label>Clips por guion <select data-cfg="clips"' +
      dis +
      '>' +
      [3, 4, 5, 6].map((n) => '<option value="' + n + '"' + (Number(c.clips) === n ? ' selected' : '') + '>' + n + ' clips · ' + n * S.CLIP_SECONDS + ' s</option>').join('') +
      '</select></label></div>';
    if (keep) {
      const opt = $('[data-cfg="' + keep + '"]', box);
      if (opt) opt.focus();
    }
  }

  function renderAutoOut() {
    const box = el && $('#ugc-auto-out', el);
    if (!box) return;
    const d = auto.doc;
    if (!d || !d.guiones.length) {
      box.innerHTML = '';
      return;
    }
    const o = d.opts || {};
    const n = d.guiones.length;
    const datos = [
      (S.ANGULOS[o.angulo] || {}).label,
      (S.PERSONAJES[o.personaje] || {}).label,
      o.clips ? o.clips + ' clips · ' + o.clips * S.CLIP_SECONDS + ' s' : '',
      d.fecha ? U.timeAgo(d.fecha) : '',
    ].filter(Boolean);
    box.innerHTML =
      '<details class="ugc-tanda"' +
      (abierta ? ' open' : '') +
      '><summary><span class="ugc-tanda-title">Tanda automática · ' +
      n +
      (n === 1 ? ' guion' : ' guiones') +
      '</span><span class="muted small">' +
      e(datos.join(' · ')) +
      '</span></summary><div class="ugc-tanda-body">' +
      scriptCards(d.guiones, 'auto-') +
      '</div></details>';
    const det = $('details', box);
    det.addEventListener('toggle', () => {
      abierta = det.open;
      prefSet('ugc-auto-abierta', abierta);
    });
  }

  // Lo guardado en 'guiones/auto' listo para mostrar (o null si no sirve)
  function limpiarTanda(d) {
    if (!d || !Array.isArray(d.guiones)) return null;
    return Object.assign({}, d, {
      guiones: S.sanitize(d, d.opts || {}),
      razones: Array.isArray(d.razones) ? d.razones.map(String) : [],
      opts: d.opts && typeof d.opts === 'object' ? d.opts : {},
    });
  }

  function mostrarTanda(d) {
    const t = limpiarTanda(d);
    // No pisamos una tanda más nueva con una lectura que llegó tarde
    if (t && auto.doc && String(auto.doc.fecha || '') > String(t.fecha || '')) return;
    if (t || !auto.doc) auto.doc = t;
    auto.cargado = true;
    if (!el) return;
    renderAutoHead();
    renderAutoPlan();
    renderAutoOut();
  }

  function cargarTanda() {
    return Store.get('guiones/auto').then(mostrarTanda, () => mostrarTanda(null));
  }

  function onAuto(ev) {
    if (!el) return;
    if (ev.type === 'cfg') {
      if (!ev.job || ev.job === 'guiones' || ev.job === 'competencia') renderAutoHead();
      if (!ev.job || ev.job === 'guiones') renderAutoCfg();
      return;
    }
    if (ev.job !== 'guiones') {
      if (ev.type === 'start' || ev.type === 'done' || ev.type === 'error') renderAutoHead();
      return;
    }
    if (ev.type === 'progress') {
      renderAutoProg();
      return;
    }
    if (ev.type === 'skip' && auto.pedido) toast(ev.motivo || 'No se pudo escribir la tanda acá.', 'warn');
    renderAutoHead();
    renderAutoProg();
    if (ev.type === 'done') {
      abierta = true;
      prefSet('ugc-auto-abierta', true);
    }
    if (ev.type === 'done' || ev.type === 'error') cargarTanda();
  }

  function generarAhora() {
    if (!A || auto.pedido || A.running === 'guiones') return;
    auto.pedido = true;
    renderAutoHead();
    A.run('guiones', { origen: 'manual' }).finally(() => {
      auto.pedido = false;
      renderAutoHead();
    });
  }

  // Copia la configuración de la última tanda al formulario de "Elegirlo yo"
  function pasarAlForm() {
    const o = auto.doc && auto.doc.opts;
    if (!o || !S.ANGULOS[o.angulo]) return;
    state.opts = Object.assign({}, state.opts, {
      angulo: o.angulo,
      personaje: S.PERSONAJES[o.personaje] ? o.personaje : state.opts.personaje,
      personajeLibre: '',
      genero: o.genero === 'm' ? 'm' : 'f',
      clips: U.clamp(Number(o.clips) || 4, 3, 6),
      cantidad: U.clamp(Number(o.cantidad) || 3, 1, 5),
      idiomaPrompt: o.idiomaPrompt === 'es' ? 'es' : 'en',
      oferta: o.oferta || state.opts.oferta,
      extra: o.extra || '',
    });
    prefSet('ugc-opts', state.opts);
    renderForm();
    const f = $('#ugc-form', el);
    if (f && f.scrollIntoView) f.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    toast('Listo: la configuración de la tanda quedó en “Elegirlo yo”. Cambiá lo que quieras y escribí.', 'good');
  }

      .join('');
    const per = Object.entries(S.PERSONAJES)
      .map(([k, p]) => '<option value="' + k + '"' + (o.personaje === k ? ' selected' : '') + '>' + e(p.label) + '</option>')
      .join('');
    $('#ugc-form', el).innerHTML =
      (ganador && ganador !== o.angulo && S.ANGULOS[ganador]
        ? '<p class="note">Tu último análisis de creativos marcó <strong>' + e(S.ANGULOS[ganador].label) + '</strong> como ángulo ganador. <button type="button" class="btn link" data-act="usar-ganador" data-v="' + e(ganador) + '">Usarlo</button></p>'
        : '') +
      '<fieldset><legend>Ángulo</legend><div class="pill-row">' +

      '" for="ang-libre"><input type="radio" name="angulo" id="ang-libre" value="libre"' +

      '>Otro</label></div>' +
      (o.angulo === 'libre' ? '<label for="ugc-angulo-libre" class="sr-only">Describí el ángulo</label><input id="ugc-angulo-libre" name="anguloLibre" placeholder="Ej.: regalo para el Día de la Madre, choferes que manejan muchas horas…" value="' + e(o.anguloLibre) + '">' : '<p class="muted small">' + e((S.ANGULOS[o.angulo] || {}).brief || '') + '</p>') +
      '</fieldset>' +
      '<div class="form-grid"><label for="ugc-personaje">Personaje y lugar<select id="ugc-personaje" name="personaje">' +
      per +
      '<option value="libre"' +

      '>Otro (lo describo)</option></select></label>' +

      [3, 4, 5, 6].map((n) => '<option value="' + n + '"' + (Number(o.clips) === n ? ' selected' : '') + '>' + n + ' clips · ' + n * S.CLIP_SECONDS + ' s</option>').join('') +
      '</select></label><label for="ugc-cantidad">Cantidad de guiones<select id="ugc-cantidad" name="cantidad">' +
      [1, 2, 3, 4, 5].map((n) => '<option value="' + n + '"' + (Number(o.cantidad) === n ? ' selected' : '') + '>' + n + '</option>').join('') +
      '</select></label><label for="ugc-idioma">Idioma del prompt<select id="ugc-idioma" name="idiomaPrompt"><option value="en"' +
      (o.idiomaPrompt === 'en' ? ' selected' : '') +
      '>Inglés (mejor en Flow)</option><option value="es"' +
      (o.idiomaPrompt === 'es' ? ' selected' : '') +
      '>Español</option></select></label></div>' +
      (o.personaje === 'libre'
        ? '<div class="form-grid wide"><label for="ugc-personaje-libre">Describí personaje, ropa y lugar<textarea id="ugc-personaje-libre" name="personajeLibre" rows="2" placeholder="Ej.: Hombre de 50, camionero, remera azul, cabina de camión, luz de mediodía">' +
          e(o.personajeLibre) +
          '</textarea></label><label for="ugc-genero">Habla como<select id="ugc-genero" name="genero"><option value="f"' +
          (o.genero === 'f' ? ' selected' : '') +
          '>Mujer</option><option value="m"' +
          (o.genero === 'm' ? ' selected' : '') +
          '>Hombre</option></select></label></div>'
        : '<p class="muted small">' + e((S.PERSONAJES[o.personaje] || S.PERSONAJES.oficinista).es) + '</p>') +
      '<label for="ugc-oferta">Oferta y cierre<input id="ugc-oferta" name="oferta" value="' +

        ? '<button type="button" class="btn ghost" data-act="detener">Detener</button><span class="muted">' + (state.streamChars ? 'Escribiendo… ' + U.int(state.streamChars) + ' caracteres' : 'Pensando los guiones… puede tardar hasta un minuto.') + '</span>'
        : (AI.sample ? '<button type="submit" class="btn">Escribir guiones con Claude</button>' : '') + '<button type="button" class="btn ghost" data-act="plantillas">' + (AI.sample ? 'Usar plantillas (sin IA)' : 'Generar con plantillas') + '</button>') +

  function readForm() {
    const f = $('#ugc-form', el);
    const fd = new FormData(f);
    const o = Object.assign({}, state.opts);
    for (const k of ['angulo', 'anguloLibre', 'personaje', 'personajeLibre', 'genero', 'clips', 'cantidad', 'idiomaPrompt', 'oferta', 'extra']) {
      if (fd.has(k)) o[k] = String(fd.get(k));
    }
    o.clips = Number(o.clips);
    o.cantidad = Number(o.cantidad);
    state.opts = o;
    prefSet('ugc-opts', o);
    return o;
  }

  function fullOpts() {
    const o = Object.assign({}, state.opts, { producto: App.msgs.productoGuiones || S.PRODUCTO_DEFAULT });
    if (o.angulo === 'libre') o.angulo = o.anguloLibre || 'ángulo libre';
    if (o.personaje !== 'libre') o.personajeLibre = '';
    return o;
  }

  async function generate() {
    readForm();
    const opts = fullOpts();
    if (state.opts.angulo === 'libre' && !state.opts.anguloLibre.trim()) {
      toast('Describí el ángulo que querés probar.', 'warn');
      return;
    }
    if (state.opts.personaje === 'libre' && !state.opts.personajeLibre.trim()) {
      toast('Describí el personaje y el lugar.', 'warn');
      return;
    }
    ctl = new AbortController();
    state.running = true;
    state.streamChars = 0;
    state.error = '';
    renderForm();
    try {
      const data = await AI.sample.json(S.buildPrompt(opts), {
        signal: ctl.signal,
        cache: false,
        onText: ({ text }) => {
          state.streamChars = text.length;
          const m = el.querySelector('#ugc-form .row-actions .muted');
          if (m) m.textContent = 'Escribiendo… ' + U.int(text.length) + ' caracteres';
        },
      });
      const list = S.sanitize(data, opts);
      if (!list.length) throw { code: 'invalid_json' };
      setResult(list, 'claude', opts);
    } catch (err) {
      if (err && err.code !== 'cancelled') state.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.running = false;
    renderForm();
  }

  function setResult(list, origen, opts) {
    state.guiones = list;
    state.origen = origen;
    state.fecha = new Date().toISOString();
    renderOut();
    const doc = { guiones: list, origen, fecha: state.fecha, opts: { angulo: opts.angulo, clips: opts.clips, cantidad: opts.cantidad } };
    Store.set('guiones/ultimo', JSON.parse(JSON.stringify(doc))).catch(storeFail);
    const out = $('#ugc-out', el);
    if (out && out.scrollIntoView) out.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }

  function renderOut() {
    const out = $('#ugc-out', el);
    if (!state.guiones.length) {
      out.innerHTML =
        '<section class="panel tips"><h3>Cómo usarlos en Flow</h3><ol class="steps"><li>Pegá el prompt del clip 1 y generá 2 o 3 tomas. Elegí la que tenga mejor cara y voz: esa define el personaje.</li><li>Para el clip 2 usá <strong>Extend</strong> sobre esa toma, o tomá su último cuadro como imagen inicial (<strong>Frames to Video</strong>), y pegá el prompt del clip 2.</li><li>Repetí clip por clip. La ficha de continuidad va completa en cada prompt para que no cambie la ropa ni el lugar.</li><li>Al subir a TikTok, activá la etiqueta de contenido generado con IA.</li></ol></section>';
      return;
    }
    const head =
      '<div class="out-head"><h3>' +
      state.guiones.length +
      (state.guiones.length === 1 ? ' guion' : ' guiones') +
      '</h3><span class="muted small">' +
      (state.origen === 'claude' ? 'Escritos por Claude' : 'Armados con plantillas') +
      (state.fecha ? ' · ' + e(U.timeAgo(state.fecha)) : '') +
      '</span></div>';
    out.innerHTML = head + scriptCards(state.guiones, '');
  }

  /*
   * Tarjetas de guion (ficha, clips, prompts y botones de copiar). `pre` va adelante de cada data-act para que los
   * botones de la tanda automática ('auto-') y los del formulario ('') no se pisen.
   */
  function scriptCards(list, pre) {
    return list
      .map(
        (g, gi) =>
          '<article class="script"><header class="script-head"><div><h4>' +
          e(g.titulo) +
          '</h4><div class="chips">' +
          (g.gancho ? chip(g.gancho, 'source') : '') +
          chip(g.clips.length * S.CLIP_SECONDS + ' s', 'neutral') +
          '</div>' +
          (g.nota ? '<p class="muted small">' + e(g.nota) + '</p>' : '') +
          '</div><button class="btn ghost" data-act="' +
          pre +
          'copiar-guion" data-g="' +
          gi +
          '">Copiar guion completo</button></header>' +
          '<div class="ficha"><div class="panel-head"><span class="eyebrow">Ficha de continuidad</span><button class="btn link" data-act="' +
          pre +
          'copiar-ficha" data-g="' +
          gi +
          '">Copiar</button></div><p class="selectable">' +
          e(g.ficha) +
          '</p></div><ol class="clips">' +
          g.clips
            .map(
              (c, ci) =>
                '<li class="clip"><div class="clip-time mono">' +
                c.desde +
                '–' +
                c.hasta +
                ' s</div><div class="clip-body"><div class="clip-meta"><strong>Clip ' +
                c.n +
                '</strong> · ' +
                e(c.plano) +
                '</div><p class="clip-action">' +
                e(c.accion) +
                '</p><p class="clip-dialog">“' +
                e(c.dialogo) +
                '” <span class="' +
                (c.largo ? 'warn-text' : 'muted') +
                ' small">' +
                c.palabras +
                ' palabras' +
                (c.largo ? ' · puede no entrar en 8 s' : '') +
                '</span></p>' +
                (c.texto_pantalla ? '<p class="small"><span class="eyebrow">Texto en pantalla</span> ' + e(c.texto_pantalla) + '</p>' : '') +
                '<div class="prompt-box"><div class="panel-head"><span class="eyebrow">Prompt para Flow</span><button class="btn link" data-act="' +
                pre +
                'copiar-prompt" data-g="' +
                gi +
                '" data-c="' +
                ci +
                '">Copiar prompt</button></div><pre class="selectable">' +
                e(c.prompt) +
                '</pre></div>' +
                (c.continuidad ? '<p class="small continuity"><span class="eyebrow">Empalme</span> ' + e(c.continuidad) + '</p>' : '') +
                '</div></li>'
            )
            .join('') +
          '</ol>' +
          (g.caption ? '<p class="small"><span class="eyebrow">Caption</span> <span class="selectable">' + e(g.caption) + '</span></p>' : '') +
          '</article>'
      )
      .join('');
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    let act = t.dataset.act;
    let lista = state.guiones;
    if (act.startsWith('auto-')) {
      act = act.slice(5);
      lista = (auto.doc && auto.doc.guiones) || [];
    }
    const g = lista[Number(t.dataset.g)];
    switch (act) {
      case 'plantillas': {
        readForm();
        const opts = fullOpts();
        if (!S.ANGULOS[state.opts.angulo]) toast('Las plantillas solo tienen los 4 ángulos base. Uso “Dolor”.', 'warn');
        setResult(S.fallbackScripts(opts), 'plantillas', opts);
        break;
      }
      case 'detener':
        if (ctl) ctl.abort();
        break;
      case 'usar-ganador':
        state.opts.angulo = t.dataset.v;
        prefSet('ugc-opts', state.opts);
        renderForm();
        break;
      case 'copiar-guion':
        if (g) copyText(S.scriptAsText(g), t);
        break;
      case 'copiar-ficha':
        if (g) copyText(g.ficha, t);
        break;
      case 'copiar-prompt': {
        const c = g && g.clips[Number(t.dataset.c)];
        if (c) copyText(c.prompt, t);
        break;
      }
      case 'tanda-generar':
        generarAhora();
        break;
      case 'tanda-detener':
