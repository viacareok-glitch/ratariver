              ? 'Facebook muestra un aviso de cookies: aceptalo una vez en el navegador de Claude.'
              : 'La página no terminó de cargar. Probá de nuevo más tarde.';
        }
        refrescarVivo();
        continue;
      }
      if (!AI.sample) throw new Error('Claude no está disponible en esta vista.');
      let ads;
      try {
        const data = await AI.sample.json(CP.extractPrompt(R.compactText(texto, 60000), 0, hoy), { signal: ctx.signal, cache: false });
        ads = S.validarIds(CP.sanitizeAds(data), R.adLibraryIds(texto)).map((a) => Object.assign(a, { busqueda: it.q }));
      } catch (err) {
        if (err && err.code === 'cancelled') throw err;
        it.estado = 'error';
        it.error = AI.errorText(err);
        if (AI.permanent(err)) {
          AI.sample = null;
          omitirResto(i, S.NO_REVISADA);
          refrescarVivo();
          throw new Error(AI.errorText(err));
        }
        refrescarVivo();
        continue;
      }
      leidas++;
      const m = S.mergeAds(docs, ads, ahora, { tocados });
      for (const w of m.escrituras) await guardar('competencia/' + w.id, w.data);
      docs = m.docs;
      nuevos = nuevos.concat(m.nuevos);
      it.estado = 'ok';
      it.anuncios = ads.length;
      it.nuevos = m.nuevos.length;
      refrescarVivo();
    }

    // Si no se pudo leer ninguna búsqueda, no pisamos el último escaneo bueno
    if (!leidas) throw new Error(aviso || (items.find((it) => it.error) || {}).error || 'No se pudo leer ninguna búsqueda.');

    const vistos = [...tocados].filter((id) => docs.has(id)).map((id) => Object.assign({ id }, docs.get(id)));
    const ganadores = S.ganadores(vistos, hoy);
    const nombresNuevos = S.anunciantesNuevos(antes, nuevos);
    const tiendas = (A.cfg.tiendas && A.cfg.tiendas.dominios) || [];
    // Las tiendas que el usuario quitó no vuelven a sumarse solas
    const quitadas = new Set((A.cfg.tiendas && A.cfg.tiendas.quitadas) || []);
    const dom = S.dominiosNuevos(vistos.filter((a) => !quitadas.has(VC.research.normalizeDomain(a.dominio))), tiendas, S.MAX_DOMINIOS);
    if (dom.agregar.length) A.setCfg('tiendas', { dominios: dom.lista });
    const porBusqueda = S.porBusqueda(items);
    const base = { fecha: ahora, porBusqueda, nuevos: nuevos.length, total: vistos.length, ganadores: ganadores.length, nombresNuevos, dominiosNuevos: dom.agregar, aviso };
    let doc = S.armarEscaneo(base);
    await guardar('escaneos/ultimo', doc);
    ultimo = doc;
    ultimoCargado = true;
    if (el) {
      renderFound();
      renderDataSoon();
    }

    if (vistos.length && AI.sample) {
      cortarSiCancelo(ctx);
      ctx.progress('Escribiendo qué encontré…');
      let resumen = '';
      let errorResumen = '';
      try {
        const res = await AI.sample(S.findingsPrompt({ nuevos, ganadores, porBusqueda, total: vistos.length, hoy, datos: App.datos(), vistos }), { signal: ctx.signal, cache: false });
        resumen = String((res && res.text) || '').trim();
      } catch (err) {
        if (err && err.code === 'cancelled') throw err;
        errorResumen = AI.errorText(err);
      }
      doc = S.armarEscaneo(Object.assign({}, base, { resumen, errorResumen }));
      await guardar('escaneos/ultimo', doc);
      ultimo = doc;
      if (resumen) {
        const fecha = new Date().toISOString();
        await guardar('ideas/competencia', { text: doc.resumen, fecha });
        if (!state.ideas.running) {
          state.ideas.text = doc.resumen;
          state.ideas.fecha = fecha;
          state.ideas.error = '';
        }
      }
      if (el) {
        renderFound();
        renderIdeas();
      }
    }

    const c = A.cfg.competencia || {};
    return {
      novedades: nuevos.length,
      nuevos: nuevos.length,
      total: vistos.length,
      ganadores: ganadores.length,
      anunciantesNuevos: nombresNuevos.length,
      tiendasNuevas: dom.agregar.length,
      resumen: S.resumenCorto(nuevos.length) + (aviso ? '. ' + LOGIN : ''),
      siguiente: c.guionesTras && nuevos.length > 0 ? 'guiones' : undefined,
      motivoSiguiente: 'competencia',
    };
  }

  if (A) A.register('competencia', { needs: ['browser', 'sample'], run: escanear });

  VC.tools = VC.tools || {};
  VC.tools.competencia = { mount, render };
})(window);
</script>
<script>
/* ui/comentarios.js */
/* Respuestas para comentarios de TikTok */
(function (root) {
  'use strict';
  const VC = root.VC;
  const CM = VC.comments;
  const { Store, AI } = VC.runtime;
  const { e, $, App, chip, banner, toast, copyText, storeFail } = VC.ui;

  const state = {
    texto: '',
    items: [], // {comentario, tipo, respuesta, variante, video, ocultar, origen}
    running: false,
    error: '',
    biblioteca: new Map(),
    tono: '',
  };
  let el;
  let ctl;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Respuestas a comentarios</h2><p class="lede">Pegá los comentarios de tus anuncios de TikTok y te armo una respuesta corta para cada uno, con tu tono y tus datos reales. Responder rápido genera confianza y más alcance.</p></div></header>' +
      '<div id="cm-warn"></div><section class="panel" id="cm-input"></section><div id="cm-summary"></div><div id="cm-list" class="order-list"></div><section class="panel" id="cm-lib"></section>';
    el.addEventListener('click', onClick);
    el.addEventListener('input', onInput);
    App.on((w) => w === 'tienda' && renderWarn());
    Store.watch('respuestas', (m) => {
      state.biblioteca = m;
      renderLib();
    });
    render();
  }

  function render() {
    renderWarn();
    renderInput();
    renderList();
    renderLib();
  }

  function renderWarn() {
    const d = App.tienda;
    const faltan = [!d.demora && 'cuánto tarda el envío', !d.talles && 'qué talles cubre'].filter(Boolean);
    $('#cm-warn', el).innerHTML = faltan.length
      ? banner('info', 'Para responder mejor, completá en Ajustes ' + e(faltan.join(' y ')) + '. Mientras tanto las respuestas no mencionan esos datos.', '<button class="btn ghost" data-goto="ajustes">Completar datos</button>')
      : '';
  }

  function renderInput() {
    $('#cm-input', el).innerHTML =
      '<label for="cm-texto">Comentarios (uno por línea; podés pegar la lista tal como la copiás de TikTok)<textarea id="cm-texto" rows="6" placeholder="¿Es incómodo?&#10;¿Hacen envíos a Córdoba?&#10;¿Sirve de verdad?">' +
      e(state.texto) +
      '</textarea></label>' +
      (AI.sample ? '<label for="cm-tono">Tono (opcional)<input id="cm-tono" placeholder="Ej.: más canchero, sin emojis, tuteo…" value="' + e(state.tono) + '"></label>' : '') +
      '<div class="row-actions">' +
      (state.running
        ? '<button class="btn ghost" data-act="detener">Detener</button><span class="muted">Escribiendo respuestas…</span>'
        : (AI.sample ? '<button class="btn" data-act="claude">Responder con Claude</button>' : '') + '<button class="btn ' + (AI.sample ? 'ghost' : '') + '" data-act="plantillas">Responder con plantillas</button>') +
      '</div>' +
      (state.error ? '<p class="error-text">' + e(state.error) + '</p>' : '');
  }

  function renderList() {
    const box = $('#cm-list', el);
    const sum = $('#cm-summary', el);
    if (!state.items.length) {
      sum.innerHTML = '';
      box.innerHTML = '';
      return;
    }
    const counts = new Map();
    for (const it of state.items) counts.set(it.tipo, (counts.get(it.tipo) || 0) + 1);
    const top = [...counts.entries()].filter(([k]) => !['positivo', 'otro'].includes(k)).sort((a, b) => b[1] - a[1]);
    const videoTip = top.length && top[0][1] >= 2 ? '<p class="note">La duda que más se repite es <strong>' + e(CM.tipo(top[0][0]).label.toLowerCase()) + '</strong> (' + top[0][1] + ' comentarios). Respondela con un video: <button class="btn link" data-goto="guiones">armar guion</button></p>' : '';
    sum.innerHTML = '<div class="chips">' + [...counts.entries()].map(([k, n]) => chip(CM.tipo(k).label + ' · ' + n, CM.tipo(k).tone)).join('') + '</div>' + videoTip;
    box.innerHTML = state.items
      .map((it, i) => {
        const t = CM.tipo(it.tipo);
        const len = it.respuesta.length;
        return (
          '<article class="order-card comment-card"><div class="cm-q">“' +
          e(it.comentario) +
          '”</div><div class="chips">' +
          chip(t.label, t.tone) +
          (it.video ? chip('Conviene responder con video', 'source') : '') +
          (it.ocultar ? chip('Ocultar o ignorar', 'bad') : '') +
          (it.origen === 'claude' ? chip('Claude', 'neutral') : '') +
          '</div><label class="sr-only" for="cm-r-' +
          i +
          '">Respuesta</label><textarea id="cm-r-' +
          i +
          '" data-i="' +
          i +
          '" rows="2" maxlength="' +
          CM.MAX +
          '">' +
          e(it.respuesta) +
          '</textarea><div class="cm-foot"><span class="small ' +
          (len > CM.MAX ? 'warn-text' : 'muted') +
          '" id="cm-n-' +
          i +
          '">' +
          len +
          '/' +
          CM.MAX +
          '</span><div class="row-actions"><button class="btn" data-act="copiar" data-i="' +
          i +
          '">Copiar</button><button class="btn ghost" data-act="otra" data-i="' +
          i +
          '">Otra versión</button><button class="btn link" data-act="guardar" data-i="' +
          i +
          '">Guardar en biblioteca</button></div></div></article>'
        );
      })
      .join('');
  }

  function renderLib() {
    const box = $('#cm-lib', el);
    if (!box) return;
    const list = [...state.biblioteca.entries()].map(([id, r]) => Object.assign({ id }, r));
    if (!list.length) {
      box.innerHTML = '<h3>Biblioteca de respuestas</h3><p class="muted">Guardá las respuestas que más te gusten para reusarlas. Quedan ordenadas por tipo de comentario.</p>';
      return;
    }
    const by = new Map();
    for (const r of list) {
      if (!by.has(r.tipo)) by.set(r.tipo, []);
      by.get(r.tipo).push(r);
    }
    box.innerHTML =
      '<h3>Biblioteca de respuestas (' +
      list.length +
      ')</h3><div class="lib">' +
      [...by.entries()]
        .map(
          ([tipo, rs]) =>
            '<div class="lib-group"><span class="eyebrow">' +
            e(CM.tipo(tipo).label) +
            '</span>' +
            rs
              .map(
                (r) =>
                  '<div class="lib-item"><p class="selectable">' +
                  e(r.respuesta) +
                  '</p><div class="row-actions"><button class="btn link" data-act="lib-copiar" data-id="' +
                  e(r.id) +
                  '">Copiar</button><button class="btn link" data-act="lib-borrar" data-id="' +
                  e(r.id) +
                  '">Borrar</button></div></div>'
              )
              .join('') +
            '</div>'
        )
        .join('') +
      '</div>';
  }

  function plantillas() {
    const coms = CM.splitComments(($('#cm-texto', el) || {}).value || state.texto);
    if (!coms.length) {
      toast('Pegá al menos un comentario.', 'warn');
      return;
    }
    const d = App.datos();
    state.items = coms.slice(0, 80).map((c) => {
      const r = CM.templateReply(c, d, 0);
      return { comentario: c, tipo: r.tipo.id, respuesta: r.respuesta, variante: 0, video: false, ocultar: false, origen: 'plantilla' };
    });
    state.error = '';
    renderInput();
    renderList();
  }

  async function claude() {
    const coms = CM.splitComments(($('#cm-texto', el) || {}).value || state.texto).slice(0, 60);
    if (!coms.length) {
      toast('Pegá al menos un comentario.', 'warn');
      return;
    }
    ctl = new AbortController();
    state.running = true;
    state.error = '';
    renderInput();
    try {
      const data = await AI.sample.json(CM.buildPrompt(coms, App.datos(), state.tono), { signal: ctl.signal, cache: false, modelTier: 'quick' });
      const rs = (data && Array.isArray(data.respuestas) ? data.respuestas : []).filter((r) => r && r.n >= 1 && r.n <= coms.length);
      const byN = new Map(rs.map((r) => [Number(r.n), r]));
      const d = App.datos();
      state.items = coms.map((c, i) => {
        const r = byN.get(i + 1);
        if (!r) {
          const t = CM.templateReply(c, d, 0);
          return { comentario: c, tipo: t.tipo.id, respuesta: t.respuesta, variante: 0, origen: 'plantilla' };
        }
        const tipo = CM.TIPOS.some((t) => t.id === r.tipo) ? r.tipo : CM.classify(c).id;
        return { comentario: c, tipo, respuesta: CM.fit(String(r.respuesta || '')), variante: 0, video: !!r.video, ocultar: !!r.ocultar, origen: 'claude' };
      });
    } catch (err) {
      if (err && err.code !== 'cancelled') state.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.running = false;
    renderInput();
    renderList();
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'cm-texto') state.texto = t.value;
    else if (t.id === 'cm-tono') state.tono = t.value;
    else if (t.dataset.i != null && t.tagName === 'TEXTAREA') {
      const it = state.items[Number(t.dataset.i)];
      it.respuesta = t.value;
      const n = $('#cm-n-' + t.dataset.i, el);
      if (n) {
        n.textContent = t.value.length + '/' + CM.MAX;
        n.className = 'small ' + (t.value.length > CM.MAX ? 'warn-text' : 'muted');
      }
    }
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    const it = t.dataset.i != null ? state.items[Number(t.dataset.i)] : null;
    switch (t.dataset.act) {
      case 'plantillas':
        plantillas();
        break;
      case 'claude':
        claude();
        break;
      case 'detener':
        if (ctl) ctl.abort();
        break;
      case 'copiar':
        copyText(it.respuesta, t);
        break;
      case 'otra': {
        it.variante = (it.variante || 0) + 1;
        it.respuesta = CM.templateReply(it.comentario, App.datos(), it.variante).respuesta;
        it.origen = 'plantilla';
        renderList();
        break;
      }
      case 'guardar': {
        const id = 'r' + Date.now().toString(36);
        const doc = { tipo: it.tipo, respuesta: it.respuesta, ejemplo: it.comentario, creada: new Date().toISOString() };
        state.biblioteca.set(id, doc);
        Store.set('respuestas/' + id, doc).catch(storeFail);
        renderLib();
        toast('Guardada en la biblioteca.', 'good');
        break;
      }
      case 'lib-copiar':
        copyText((state.biblioteca.get(t.dataset.id) || {}).respuesta || '', t);
        break;
      case 'lib-borrar':
        state.biblioteca.delete(t.dataset.id);
        Store.remove('respuestas/' + t.dataset.id).catch(storeFail);
        renderLib();
        break;
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.comentarios = { mount, render };
})(window);
</script>
<script>
/* ui/ofertas.js */
/* Calculadora de ofertas */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const OF = VC.offers;
  const { Store, Shop } = VC.runtime;
  const { e, $, App, chip, banner, storeFail } = VC.ui;

  const state = {
    items: OF.DEFAULT_OFERTAS.map((o) => Object.assign({}, o)),
    cpa: null, // null = usar el real de los últimos 7 días
    envioExtra: 0,
    gastos: {},
  };
  let el;

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Calculadora de ofertas</h2><p class="lede">Compará cuánto te deja cada promo con tus costos reales, los pedidos que se anulan y lo que pagás por cada venta en publicidad.</p></div></header>' +
      '<div id="of-warn"></div><section class="panel" id="of-params"></section><section class="panel" id="of-rows"></section><section class="panel" id="of-results"></section><section class="panel" id="of-sens"></section>';
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    App.on((w) => (w === 'cfg' || w === 'tienda') && renderAll());
    Shop.onChange(() => renderResults());
    Store.watch('gastos', (m) => {
      state.gastos = Object.fromEntries(m);
      renderParams();
      renderResults();
    });
    Store.get('config/ofertas').then((d) => {
      if (d && Array.isArray(d.items) && d.items.length) {
        state.items = d.items;
        state.cpa = d.cpa == null ? null : d.cpa;
        state.envioExtra = d.envioExtra || 0;
      } else {
        // Precios de la tienda como punto de partida
        const p1 = Number(App.tienda.precio1) || 68990;
        const p2 = Number(App.tienda.precio2) || 72990;
        state.items = OF.DEFAULT_OFERTAS.map((o) => Object.assign({}, o, { precio: o.id === 'dos' ? p2 : o.id === '3x2' ? p1 * 2 : p1 }));
      }
      renderAll();
    });
    Shop.ensure(U.addDays(U.todayKeyAR(), -7)).catch(() => {});
    renderAll();
  }

  const save = VC.ui.debounce(() => Store.set('config/ofertas', JSON.parse(JSON.stringify({ items: state.items, cpa: state.cpa, envioExtra: state.envioExtra }))).catch(storeFail), 800);

  /* CPA real: gasto en anuncios de los últimos 7 días ÷ pedidos que entraron en esos días. */
  function cpaReal() {
    const hoy = U.todayKeyAR();
    const desde = U.addDays(hoy, -6);
    let ads = 0;
    for (const d of U.dayRange(desde, hoy)) ads += P.spendOf(state.gastos[d]).total;
    const pedidos = Shop.orders.filter((o) => o.day >= desde && o.day <= hoy).length;
    return ads > 0 && pedidos ? { cpa: ads / pedidos, ads, pedidos } : null;
  }

  function cpaActual() {
    if (state.cpa != null) return { valor: state.cpa, origen: 'manual' };
    const r = cpaReal();
    if (r) return { valor: r.cpa, origen: 'real', detalle: r };
    return { valor: 15000, origen: 'supuesto' };
  }

  function renderAll() {
    if (!el) return;
    const warn = $('#of-warn', el);
    warn.innerHTML = P.costsReady(App.cfg) ? '' : banner('warn', '<strong>Faltan tus costos.</strong> Sin el costo del corrector y del envío la comparación no sirve.', '<button class="btn" data-goto="ajustes">Cargar costos</button>');
    renderParams();
    renderRows();
    renderResults();
  }

  function renderParams() {
    const box = $('#of-params', el);
    if (!box || box.contains(document.activeElement)) return;
    const c = cpaActual();
    const cfg = P.normalizeCfg(App.cfg);
    const origen =
      c.origen === 'real'
        ? 'Real de los últimos 7 días: ' + U.money(c.detalle.ads) + ' en anuncios ÷ ' + c.detalle.pedidos + ' pedidos.'
        : c.origen === 'manual'
          ? 'Cargado a mano.'
          : 'Supuesto: cargá el gasto diario en Ganancia o escribí tu costo por pedido.';
    box.innerHTML =
      '<div class="form-grid"><label for="of-cpa">Costo en publicidad por pedido<span class="input-unit"><span class="unit">$</span><input id="of-cpa" inputmode="numeric" value="' +
      e(U.int(c.valor)) +
      '"></span></label><label for="of-envio">Envío extra por cada unidad adicional<span class="input-unit"><span class="unit">$</span><input id="of-envio" inputmode="numeric" value="' +
      e(state.envioExtra ? U.int(state.envioExtra) : '') +
      '" placeholder="0"></span></label></div><p class="muted small">' +
      e(origen) +
      (c.origen === 'manual' ? ' <button class="btn link" data-act="cpa-real">Usar el real</button>' : '') +
      '</p><p class="muted small">Costos de Ajustes: corrector ' +
      e(U.money(cfg.costoUnidad)) +
      ' · envío ' +
      e(U.money(cfg.costoEnvio)) +
      ' · devolución ' +
      e(U.money(cfg.costoDevolucion)) +
      (cfg.comisionCobro ? ' · comisión ' + e(String(cfg.comisionCobro).replace('.', ',')) + '%' : '') +
      '.</p>';
  }

  function renderRows() {
    const box = $('#of-rows', el);
    box.innerHTML =
      '<div class="panel-head"><h3>Ofertas a comparar</h3><button class="btn ghost" data-act="agregar">Agregar oferta</button></div><div class="table-wrap"><table class="table offers-edit"><thead><tr><th>Oferta</th><th class="num">Unidades</th><th class="num">Cobrás en total</th><th class="num">Regalo / extra</th><th class="num">Conversión vs. la 1ª</th><th></th></tr></thead><tbody>' +
      state.items
        .map(
          (o, i) =>
            '<tr><td><label class="sr-only" for="of-n-' +
            i +
            '">Nombre</label><input id="of-n-' +
            i +
            '" data-i="' +
            i +
            '" data-k="nombre" value="' +
            e(o.nombre) +
            '"></td><td><label class="sr-only" for="of-u-' +
            i +
            '">Unidades</label><input id="of-u-' +
            i +
            '" class="num-input short" data-i="' +
            i +
            '" data-k="unidades" inputmode="numeric" value="' +
            e(o.unidades) +
            '"></td><td><label class="sr-only" for="of-p-' +
            i +
            '">Precio</label><input id="of-p-' +
            i +
            '" class="num-input" data-i="' +
            i +
            '" data-k="precio" inputmode="numeric" value="' +
            e(U.int(o.precio)) +
            '"></td><td><label class="sr-only" for="of-x-' +
            i +
            '">Costo del regalo</label><input id="of-x-' +
            i +
            '" class="num-input" data-i="' +
            i +
            '" data-k="extra" inputmode="numeric" value="' +
            e(o.extra ? U.int(o.extra) : '') +
            '" placeholder="0"></td><td><label class="sr-only" for="of-l-' +
            i +
            '">Cambio de conversión</label><span class="input-unit inline"><input id="of-l-' +
            i +
            '" class="num-input short" data-i="' +
            i +
            '" data-k="lift" inputmode="decimal" value="' +
            e(o.lift ? String(o.lift).replace('.', ',') : '') +
            '" placeholder="0"' +
            (i === 0 ? ' disabled' : '') +
            '><span class="unit">%</span></span></td><td>' +
            (state.items.length > 2 ? '<button class="btn link" data-act="quitar" data-i="' + i + '">Quitar</button>' : '') +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div><p class="muted small">“Conversión vs. la 1ª”: si creés que la promo va a traer más pedidos por el mismo gasto (ej. +25%), cargalo y tu costo por pedido baja en esa proporción. La primera fila es la base de comparación.</p>';
  }

  function computed() {
    const rates = O.historicalRates(Shop.orders);
    return OF.compare(state.items, App.cfg, rates, cpaActual().valor, state.envioExtra);
  }

  function renderResults() {
    const box = $('#of-results', el);
    if (!box) return;
    const { evs } = computed();
    const max = Math.max(1, ...evs.map((x) => Math.abs(x.ganancia)));
    const mix = OF.unitMix(Shop.orders);
    const best = evs.find((x) => x.mejor);
    box.innerHTML =
      '<h3>Resultado</h3>' +
      (best ? '<p><strong>' + e(best.oferta.nombre) + '</strong> es la que más deja por pedido: ' + e(U.money(best.ganancia)) + (best !== evs[0] ? ', ' + e(U.money(best.vsBase)) + ' más que ' + e(evs[0].oferta.nombre) + '.' : '.') + '</p>' : '') +
      '<ul class="offer-bars">' +
      evs
        .map(
          (x) =>
            '<li' +
            (x.mejor ? ' class="is-best"' : '') +
            '><span class="ob-name">' +
            e(x.oferta.nombre) +
            (x.mejor ? ' ' + chip('Mejor', 'good') : '') +
            '</span><span class="wf-track"><span class="wf-bar ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '" style="width:' +
            Math.max(1, (Math.abs(x.ganancia) / max) * 100).toFixed(1) +
            '%"></span></span><span class="wf-val mono ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '">' +
            e(U.money(x.ganancia)) +
            '</span></li>'
        )
        .join('') +
      '</ul><p class="muted small">Ganancia promedio por cada pedido que entra, después de anuncios, anulados y devoluciones.</p>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Oferta</th><th class="num">Precio por unidad</th><th class="num">Deja si se entrega</th><th class="num">Por pedido que entra</th><th class="num">vs. ' +
      e(evs[0].oferta.nombre) +
      '</th><th>Para empatar necesita</th></tr></thead><tbody>' +
      evs
        .map(
          (x, i) =>
            '<tr' +
            (x.mejor ? ' class="is-winner"' : '') +
            '><th scope="row">' +
            e(x.oferta.nombre) +
            '</th><td class="num">' +
            e(U.money(x.precioUnidad)) +
            '</td><td class="num">' +
            e(U.money(x.margenEntrega)) +
            '</td><td class="num ' +
            (x.ganancia >= 0 ? 'pos' : 'neg') +
            '">' +
            e(U.money(x.ganancia)) +
            '</td><td class="num">' +
            (i === 0 ? '—' : e((x.vsBase >= 0 ? '+' : '') + U.money(x.vsBase))) +
            '</td><td class="small">' +
            (i === 0 ? '<span class="muted">Base</span>' : liftText(x)) +
            '</td></tr>'
        )
        .join('') +
      '</tbody></table></div>' +
      (mix.n ? '<p class="note">En tu historial, ' + U.pct(mix.dos) + ' de los pedidos entregados llevó 2 unidades' + (mix.tresOMas ? ' y ' + U.pct(mix.tresOMas) + ' llevó 3 o más' : '') + ' (' + mix.n + ' pedidos).</p>' : '');
    renderSens();
  }

  function liftText(x) {
    if (x.liftNecesario == null) return '<span class="neg">No empata ni con publicidad gratis</span>';
    if (x.liftNecesario <= 0) return '<span class="pos">Gana aunque convierta ' + e(U.pct(-x.liftNecesario)) + ' menos</span>';
    return e(U.pct(x.liftNecesario)) + ' más pedidos por el mismo gasto';
  }

  function renderSens() {
    const box = $('#of-sens', el);
    const base = cpaActual().valor;
    const niveles = [0.5, 0.75, 1, 1.25, 1.5].map((f) => Math.round((base * f) / 500) * 500);
    const rates = O.historicalRates(Shop.orders);
    const filas = state.items.map((o) => niveles.map((cpa) => OF.evaluate(o, App.cfg, rates, cpa, state.envioExtra).ganancia));
    const bestCol = niveles.map((_, j) => filas.reduce((bi, f, i) => (f[j] > filas[bi][j] ? i : bi), 0));
    box.innerHTML =
      '<h3>¿Y si la publicidad sube o baja?</h3><p class="muted small">Ganancia por pedido según lo que te cueste cada pedido en anuncios.</p><div class="table-wrap"><table class="table"><thead><tr><th>Oferta</th>' +
      niveles.map((n) => '<th class="num">' + e(U.moneyShort(n)) + '</th>').join('') +
      '</tr></thead><tbody>' +
      filas
        .map(
          (f, i) =>
            '<tr><th scope="row">' +
            e(state.items[i].nombre) +
            '</th>' +
            f.map((v, j) => '<td class="num ' + (v >= 0 ? '' : 'neg') + (bestCol[j] === i ? ' is-best-cell' : '') + '">' + e(U.moneyShort(v)) + '</td>').join('') +
            '</tr>'
        )
        .join('') +
      '</tbody></table></div><p class="muted small">Resaltada: la mejor oferta para cada costo por pedido.</p>';
  }

  function onInput(ev) {
    const t = ev.target;
    if (t.id === 'of-cpa') {
      const v = U.parseMoney(t.value);
      state.cpa = v != null ? v : null;
      save();
      renderResults();
    } else if (t.id === 'of-envio') {
      state.envioExtra = U.parseMoney(t.value) || 0;
      save();
      renderResults();
    } else if (t.dataset.i != null && t.dataset.k) {
      const o = state.items[Number(t.dataset.i)];
      const k = t.dataset.k;
      o[k] = k === 'nombre' ? t.value : k === 'lift' ? U.parseNum(t.value) || 0 : k === 'unidades' ? Math.max(1, Math.round(U.parseMoney(t.value) || 1)) : U.parseMoney(t.value) || 0;
      save();
      renderResults();
    }
  }

  function onChange(ev) {
    const t = ev.target;
    if (t.dataset.k === 'precio' || t.dataset.k === 'extra') {
      const v = U.parseMoney(t.value);
      t.value = v ? U.int(v) : '';
    } else if (t.id === 'of-cpa') renderParams();
  }

  function onClick(ev) {
    const t = ev.target.closest('[data-act]');
    if (!t || !el.contains(t)) return;
    if (t.dataset.act === 'agregar') {
      state.items.push({ id: 'o' + Date.now().toString(36), nombre: 'Nueva oferta', unidades: 1, precio: Number(App.tienda.precio1) || 68990, extra: 0, lift: 0 });
      save();
      renderRows();
      renderResults();
    } else if (t.dataset.act === 'quitar') {
      state.items.splice(Number(t.dataset.i), 1);
      save();
      renderRows();
      renderResults();
    } else if (t.dataset.act === 'cpa-real') {
      state.cpa = null;
      save();
      renderParams();
      renderResults();
    }
  }

  VC.tools = VC.tools || {};
  VC.tools.ofertas = { mount, render: renderAll };
})(window);
</script>
<script>
/* ui/productos.js */
/* Buscador del próximo producto */
(function (root) {
  'use strict';
  const VC = root.VC;
  const U = VC.util;
  const O = VC.orders;
  const P = VC.profit;
  const PR = VC.products;
  const CP = VC.competitors;
  const R = VC.research;
  const W = VC.winners;
  const { Store, Shop, AI, Browser } = VC.runtime;
  const { e, $, App, chip, banner, toast, storeFail } = VC.ui;
  const A = VC.auto;

  const ESCALAS = [
    ['demanda', 'Demanda', 'más es mejor'],
    ['competencia', 'Competencia', '5 = mucha'],
    ['afinidad', 'Afinidad con tu cliente', 'más es mejor'],
    ['video', 'Se luce en video', 'más es mejor'],
    ['riesgo', 'Riesgo (devoluciones, talles, fallas)', '5 = alto'],
  ];
  const CADA = [24, 72, 168];

  const state = {
    items: PR.CANDIDATOS.map((c) => Object.assign({ precio: null, costo: null }, c)),
    cpa: null,
    ia: { running: false, data: null, error: '' },
    cargado: false, // ya se leyó 'productos/lista'
    inv: new Map(), // id de documento → medición en Mercado Libre ('investigacion/<id>')
    desc: null, // 'investigacion/descubrir'
  };
  let el;
  let ctl;
  // Tareas automáticas: progreso en vivo y si el usuario las dejó en cola
  const vivo = { medir: [], desc: [] };
  const pedido = { productos: false, descubrir: false };

  function mount(section) {
    el = section;
    el.innerHTML =
      '<header class="tool-head"><div><h2>Próximo producto</h2><p class="lede">Compará qué sumar al corrector. Cargá el precio al que lo venderías y lo que te cuesta: el panel calcula cuánto deja con tus tasas reales y lo puntúa por demanda, competencia y afinidad con tu cliente.</p></div>' +
      '<div class="tool-actions"><button class="btn ghost" data-act="agregar">Agregar producto</button></div></header>' +
      '<section class="panel auto-panel" id="pr-auto"></section>' +
      '<div id="pr-warn"></div><section class="panel" id="pr-params"></section><div id="pr-ranking"></div><section class="panel" id="pr-ia"></section><div id="pr-list" class="product-list"></div>';
    el.addEventListener('input', onInput);
    el.addEventListener('change', onChange);
    el.addEventListener('click', onClick);
    App.on((w) => w === 'cfg' && renderAll());
    if (A) A.on(onAuto);
    Store.get('productos/lista')
      .catch(() => null)
      .then((d) => {
        // Conserva lo que cargó el usuario y suma candidatos nuevos de la lista base
        if (d && Array.isArray(d.items) && d.items.length) {
          state.items = W.unirLista(d, PR.CANDIDATOS);
          state.cpa = d.cpa == null ? null : d.cpa;
        }
        state.cargado = true;
        renderAll();
      });
    cargarInvestigacion();
    renderAll();
  }

  const save = VC.ui.debounce(() => Store.set('productos/lista', JSON.parse(JSON.stringify({ items: state.items, cpa: state.cpa }))).catch(storeFail), 800);

  function cpa() {
    if (state.cpa != null) return state.cpa;
    const manual = P.normalizeCfg(App.cfg).cpaMaxManual;
    return manual > 0 ? Math.round(manual * 0.7) : 15000;
  }

  function rates() {
    return O.historicalRates(Shop.orders);
  }

  function renderAll() {
    if (!el) return;
    renderAuto();
    $('#pr-warn', el).innerHTML = P.costsReady(App.cfg) ? '' : banner('warn', 'Cargá en Ajustes el costo de envío y de devolución: se usan para calcular el margen de cualquier producto.', '<button class="btn ghost" data-goto="ajustes">Ir a Ajustes</button>');
    if (!$('#pr-params', el).contains(document.activeElement)) {
      const medidos = state.items.some((p) => p.medido);
      $('#pr-params', el).innerHTML =
        '<div class="form-grid"><label for="pr-cpa">Costo en publicidad por pedido (estimado para el producto nuevo)<span class="input-unit"><span class="unit">$</span><input id="pr-cpa" inputmode="numeric" value="' +
        e(U.int(cpa())) +
        '"></span></label></div><p class="muted small">' +
        (medidos
          ? 'Precios de referencia: del 25 % al 75 % de los precios de las publicaciones medidas en Mercado Libre. Cada medición ajusta demanda y competencia; afinidad, video y riesgo quedan como los dejes.'
          : 'Precios de referencia: publicaciones de Mercado Libre Argentina (' +
            PR.REF_FECHA +
            '). Los puntajes vienen con una estimación inicial: ajustalos con lo que veas en Mercado Libre, Google Trends y la Biblioteca de anuncios.') +
        '</p>';
    }
    renderRanking();
    renderIA();
    renderList();
  }

  function scored() {
    return state.items.map((p) => Object.assign({ p }, PR.score(p, App.cfg, rates(), cpa())));
  }

  function renderRanking() {
    const list = scored().sort((a, b) => b.completo - a.completo || b.puntaje - a.puntaje);
    const box = $('#pr-ranking', el);
    box.innerHTML =
      '<section class="panel"><h3>Ranking</h3><ol class="ranking">' +
      list
        .map((s, i) => {
          const v = W.veredicto(s.p.vende);
          return (
            '<li><span class="rk-pos mono">' +
            (i + 1) +
            '</span><span class="rk-name">' +
            e(s.p.nombre) +
            (v ? ' ' + chip(v.label, v.tone) : '') +
            (s.completo ? '' : ' <span class="muted small">(falta precio o costo)</span>') +
            '</span><span class="wf-track"><span class="wf-bar ' +
            (i === 0 && s.completo ? 'pos' : 'base') +
            '" style="width:' +
            Math.max(2, s.puntaje) +
            '%"></span></span><span class="wf-val mono">' +
            s.puntaje +
            '</span></li>'
          );
        })
        .join('') +
      '</ol><p class="muted small">Puntaje de 0 a 100: margen ' +
      PR.PESOS.margen +
      '%, demanda ' +
      PR.PESOS.demanda +
      '%, competencia ' +
      PR.PESOS.competencia +
      '%, afinidad ' +
      PR.PESOS.afinidad +
      '%, video ' +
      PR.PESOS.video +
      '%, riesgo ' +
      PR.PESOS.riesgo +
      '%. Sin precio y costo, el margen no cuenta.</p></section>';
  }

  function refText(p) {
    return p.refMin ? 'Mercado Libre: ' + U.money(p.refMin) + ' a ' + U.money(p.refMax) : 'Sin precio de referencia relevado';
  }

  function renderList() {
    const box = $('#pr-list', el);
    if (box.contains(document.activeElement)) {
      // Solo actualiza los números para no perder el foco mientras escribís
      for (const s of scored()) updateNumbers(s);
      return;
    }
    box.innerHTML = scored()
      .map((s, i) => {
        const p = s.p;
        const sug = state.ia.data && state.ia.data.find((x) => norm(x.nombre) === norm(p.nombre));
        const inv = state.inv.get(W.docId(p.id));
        return (
          '<article class="product-card" id="pc-' +
          e(p.id) +
          '"><header class="pc-head"><div><h4>' +
          e(p.nombre) +
          '</h4><p class="muted small" data-out="ref">' +
          e(refText(p)) +
          '</p></div><div class="pc-score"><span class="stat-value" data-out="puntaje">' +
          s.puntaje +
          '</span><span class="stat-label">puntaje</span></div></header>' +
          (p.nota ? '<p class="small">' + e(p.nota) + '</p>' : '') +
          '<div class="pr-ml" data-out="ml" data-v="' +
          e(inv ? inv.fecha : '') +
          '"' +
          (inv || Browser.available ? '' : ' hidden') +
          '>' +
          mlInner(p) +
          '</div>' +
          '<div class="row-actions links"><a class="btn link" href="' +
          e(PR.mlUrl(p.busqueda || p.nombre)) +
          '" target="_blank" rel="noopener">Mercado Libre</a><a class="btn link" href="' +
          e(PR.trendsUrl(p.busqueda || p.nombre)) +
          '" target="_blank" rel="noopener">Google Trends</a><a class="btn link" href="' +
          e(CP.adLibraryUrl(p.busqueda || p.nombre)) +
          '" target="_blank" rel="noopener">Anuncios activos</a>' +
          (p.custom ? '<button class="btn link" data-act="quitar" data-i="' + i + '">Quitar</button>' : '') +
          '</div><div class="form-grid">' +
          (p.custom ? money(i, 'nombre', 'Nombre', p.nombre, true) : '') +
          money(i, 'precio', 'Precio de venta', p.precio) +
          money(i, 'costo', 'Costo (proveedor)', p.costo) +
          money(i, 'envioExtra', 'Envío extra vs. el corrector', p.envioExtra) +
          '</div><div class="scales">' +
          ESCALAS.map(
            ([k, label, hint]) =>
              '<label for="pr-' +
              i +
              '-' +
              k +
              '">' +
              e(label) +
              ' <span class="muted">(' +
              e(hint) +
              ')</span><select id="pr-' +
              i +
              '-' +
              k +
              '" data-i="' +
              i +
              '" data-k="' +
              k +
              '">' +
              [1, 2, 3, 4, 5].map((n) => '<option' + (Number(p[k]) === n ? ' selected' : '') + '>' + n + '</option>').join('') +
              '</select></label>'
          ).join('') +
          '</div><div class="pc-out"><div><span class="eyebrow">Por pedido con anuncios</span><span class="mono" data-out="anuncios">' +
          (s.eco ? e(U.money(s.eco.conAnuncios)) : '—') +
          '</span></div><div><span class="eyebrow">Venta a un cliente actual</span><span class="mono" data-out="cliente">' +
          (s.eco ? e(U.money(s.eco.aCliente)) : '—') +
          '</span></div><div><span class="eyebrow">Precio ÷ costo</span><span class="mono" data-out="markup">' +
          (s.eco ? e(s.eco.markup.toFixed(1).replace('.', ',')) + '×' : '—') +
          '</span></div></div>' +
          (sug ? suggestion(sug, i) : '') +
          '</article>'
        );
      })
      .join('');
  }

  function updateNumbers(s) {
    const card = el.querySelector('#pc-' + CSS.escape(s.p.id));
    if (!card) return;
    const set = (k, v) => {
      const n = card.querySelector('[data-out="' + k + '"]');
      if (n) n.textContent = v;
    };
    set('puntaje', s.puntaje);
    set('anuncios', s.eco ? U.money(s.eco.conAnuncios) : '—');
    set('cliente', s.eco ? U.money(s.eco.aCliente) : '—');
    set('markup', s.eco ? s.eco.markup.toFixed(1).replace('.', ',') + '×' : '—');
    // Lo que cambia una medición en Mercado Libre (sin tocar el campo donde estás escribiendo)
    set('ref', refText(s.p));
    const ml = card.querySelector('[data-out="ml"]');
    const inv = state.inv.get(W.docId(s.p.id));
    if (ml && ml.dataset.v !== (inv ? inv.fecha : '')) {
      ml.dataset.v = inv ? inv.fecha : '';
      ml.hidden = !inv && !Browser.available;
      ml.innerHTML = mlInner(s.p);
    }
    for (const k of ['demanda', 'competencia']) {
      const sel = card.querySelector('select[data-k="' + k + '"]');
      if (sel && sel !== document.activeElement && Number(s.p[k])) sel.value = String(s.p[k]);
    }
  }

  /* Bloque "Mercado Libre (hace X)" de una tarjeta */
  function mlInner(p) {
    const inv = state.inv.get(W.docId(p.id));
    if (!inv || !inv.senales) return Browser.available ? '<p class="muted small">Mercado Libre: todavía sin medir. Tocá “Medir en Mercado Libre ahora” arriba.</p>' : '';
    const s = inv.senales;
    const v = W.veredicto(s.vende);
    const facts = [];
    if (s.resultados != null) facts.push(fact(U.int(s.resultados), s.resultados === 1 ? 'resultado' : 'resultados'));
    if (s.vendidosVisibles != null) facts.push(fact('+' + U.int(s.vendidosVisibles), 'vendidos visibles'));
    if (s.opiniones != null) facts.push(fact(U.int(s.opiniones), 'opiniones'));
    facts.push(fact(s.masVendidos || 0, 'con “Más vendido”'));
    if (s.precioMediana != null) facts.push(fact(U.money(s.precioMediana), 'precio mediana'));
    const pubs = Array.isArray(inv.publicaciones) ? inv.publicaciones : [];
    return (
      '<div class="pr-ml-head"><span class="eyebrow">Mercado Libre (' +
      e(U.timeAgo(inv.fecha)) +
      ')</span>' +
      (v ? chip(v.label, v.tone) : '') +
      '</div><ul class="pr-facts">' +
      facts.join('') +
      '</ul>' +
      (pubs.length
        ? '<details class="pr-pubs"><summary>Publicaciones principales (' +
          pubs.length +
          ')</summary><ol>' +
          pubs.map(pubItem).join('') +
          '</ol><p class="note">Mercado Libre muestra los vendidos redondeados y por toda la vida de la publicación: son señales de demanda, no ventas exactas.</p></details>'
        : '')
    );
  }

  function fact(valor, label) {
    return '<li><strong>' + e(valor) + '</strong> ' + e(label) + '</li>';
  }

  function pubItem(l) {
    const meta = [];
    if (l.vendidos != null) meta.push(W.fmtVendidos(l.vendidos));
    if (l.opiniones != null) meta.push((l.calificacion ? String(l.calificacion).replace('.', ',') + ' ' : '') + '(' + U.int(l.opiniones) + ' opiniones)');
    if (l.masVendido) meta.push('Más vendido');
    if (l.full) meta.push('Full');
    else if (l.envioGratis) meta.push('Envío gratis');
    if (l.vendedor) meta.push(l.vendedor);
    return (
      '<li><span class="pr-pub-t">' +
      e(l.titulo || 'Sin título') +
      '</span><span class="pr-pub-p mono">' +
      (l.precio ? e(U.money(l.precio)) : '—') +
      '</span>' +
      (meta.length ? '<span class="pr-pub-m">' + e(meta.join(' · ')) + '</span>' : '') +
      '</li>'
    );
  }

  function money(i, k, label, v, text) {
    return (
      '<label for="pr-' +
      i +
      '-' +
      k +
      '">' +
      e(label) +
      (text ? '' : '<span class="input-unit"><span class="unit">$</span>') +
      '<input id="pr-' +
      i +
      '-' +
      k +
      '" data-i="' +
      i +
      '" data-k="' +
      k +
      '"' +
      (text ? '' : ' inputmode="numeric" placeholder="0"') +
      ' value="' +
      e(text ? v || '' : v ? U.int(v) : '') +
      '">' +
      (text ? '' : '</span>') +
      '</label>'
    );
  }

  function suggestion(x, i) {
    return (
      '<div class="ia-sug"><span class="eyebrow">Claude sugiere</span><p class="small">Demanda ' +
      x.demanda +
      ' · competencia ' +
      x.competencia +
      ' · afinidad ' +
      x.afinidad +
      ' · video ' +
      x.video +
      ' · riesgo ' +
      x.riesgo +
      (x.precio_sugerido ? ' · precio ' + e(U.money(U.parseMoney(x.precio_sugerido))) : '') +
      '</p>' +
      (x.angulo ? '<p class="small"><strong>Ángulo:</strong> ' + e(x.angulo) + '</p>' : '') +
      (x.combo ? '<p class="small"><strong>Combo:</strong> ' + e(x.combo) + '</p>' : '') +
      (x.dudas ? '<p class="small muted">' + e(x.dudas) + '</p>' : '') +
      '<button class="btn ghost" data-act="aplicar" data-i="' +
      i +
      '">Usar estos puntajes</button></div>'
    );
  }

  function norm(s) {
    return U.stripAccents(String(s || '')).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function renderIA() {
    const box = $('#pr-ia', el);
    const I = state.ia;
    box.innerHTML =
      '<div class="panel-head"><h3>Opinión de Claude</h3>' +
      (AI.sample ? (I.running ? '<button class="btn ghost" data-act="ia-stop">Detener</button>' : '<button class="btn" data-act="ia">' + (I.data ? 'Volver a preguntar' : 'Pedir opinión') + '</button>') : '') +
      '</div>' +
      (AI.sample
        ? I.running
          ? '<p class="muted">Pensando… puede tardar un minuto.</p>'
          : I.reco
            ? '<p>' + e(I.reco) + '</p><p class="muted small">Estimaciones sin acceso a internet: confirmá precios y demanda en Mercado Libre antes de comprar stock.</p>'
            : '<p class="muted">Claude estima demanda, competencia y afinidad de cada candidato y te sugiere precio, ángulo y combo. Son estimaciones sin acceso a internet.</p>'
        : '<p class="muted">Abrí el panel desde claude.ai para pedir la opinión de Claude.</p>') +
      (I.error ? '<p class="error-text">' + e(I.error) + '</p>' : '');
  }

  async function askIA() {
    ctl = new AbortController();
    state.ia = { running: true, data: state.ia.data, error: '' };
    renderIA();
    try {
      const data = await AI.sample.json(PR.claudePrompt(state.items, App.tienda), { signal: ctl.signal, cache: false });
      const list = data && Array.isArray(data.productos) ? data.productos : [];
      const clamp = (n) => U.clamp(Math.round(Number(n) || 3), 1, 5);
      state.ia.data = list.map((x) => ({ nombre: String(x.nombre || ''), demanda: clamp(x.demanda), competencia: clamp(x.competencia), afinidad: clamp(x.afinidad), video: clamp(x.video), riesgo: clamp(x.riesgo), precio_sugerido: x.precio_sugerido, angulo: String(x.angulo || ''), combo: String(x.combo || ''), dudas: String(x.dudas || '') }));
      state.ia.reco = String((data && data.recomendacion) || '');
      if (!state.ia.data.length) state.ia.error = 'La respuesta vino vacía. Probá de nuevo.';
    } catch (err) {
      if (err && err.code !== 'cancelled') state.ia.error = AI.errorText(err);
      if (AI.permanent(err)) AI.sample = null;
    }
    state.ia.running = false;
    renderIA();
    renderList();
  }

  /* ---------- Buscar ganadores: interfaz ---------- */

  function renderAuto() {
    const box = el && $('#pr-auto', el);
    if (!box) return;
    if (!box.dataset.ready) {
      box.innerHTML = '<div id="pr-auto-head"></div><div id="pr-auto-prog"></div><div id="pr-auto-cfg"></div><div class="pr-desc"><div id="pr-desc-head"></div><div id="pr-desc-prog"></div><div id="pr-desc-list"></div></div>';
      box.dataset.ready = '1';
    }
    renderAutoHead();
    renderAutoProg();
    renderAutoCfg();
    renderDesc();
  }

  function diasTxt(h) {
    const n = Number(h) || 24;
    if (n % 24) return n + ' h';
    return n === 24 ? '1 día' : n / 24 + ' días';
  }

  function otraTarea(job) {
    return A && A.running && A.running !== job ? A.NOMBRES[A.running] || A.running : '';
  }

  function renderAutoHead() {
    const box = el && $('#pr-auto-head', el);
    if (!box) return;
    if (!A) {
      box.innerHTML = '<h3>Buscar ganadores</h3><p class="auto-off">La medición automática no cargó. Recargá el panel.</p>';
      return;
    }
    const c = A.cfg.productos || A.DEFAULTS.productos;
    const corriendo = A.running === 'productos';
    const otra = otraTarea('productos');
    const chk = A.can('productos');
    const est = A.estado.productos || {};
    const ult = A.ultima('productos');
    const meta = [
      ult ? 'Última medición: ' + U.timeAgo(ult) + (est.origen === 'auto' ? ' (sola, al abrir el panel)' : '') : 'Todavía no mediste',
      c.auto ? 'Automático: al abrir el panel, cada ' + diasTxt(c.cadaHoras) : 'Automático apagado',
    ];
    let accion = '';
    if (Browser.available) {
      accion = corriendo
        ? '<button class="btn ghost" data-act="medir-stop">Detener</button>'
        : '<button class="btn" data-act="medir"' + (!chk.ok || pedido.productos ? ' disabled' : '') + '>' + (pedido.productos ? 'En cola…' : 'Medir en Mercado Libre ahora') + '</button>';
    }
    let aviso = '';
    if (!Browser.checked) aviso = '<p class="auto-off">Revisando si el navegador de Claude está disponible…</p>';
    else if (!Browser.available)
      aviso =
        '<div class="auto-off"><strong>La medición usa el navegador de Claude en tu PC.</strong> Funciona cuando abrís este panel desde la app de escritorio de Claude, en una sesión de Cowork: ahí abre la búsqueda de cada producto en Mercado Libre, lee las publicaciones y anota las señales de venta. Mientras tanto, usá los links de cada tarjeta y cargá los puntajes a mano.</div>';
    else if (!chk.ok) aviso = '<p class="auto-off">' + e(chk.motivo) + '</p>';
    let estado = '';
    if (otra) estado = '<p class="small muted">' + (pedido.productos ? 'En cola: la medición arranca cuando termine la ' + e(otra) + '.' : 'Ahora está corriendo la ' + e(otra) + '. Si tocás “Medir en Mercado Libre ahora”, queda en cola.') + '</p>';
    else if (!corriendo && est.error) estado = '<p class="error-text">La última medición no terminó: ' + e(est.error) + '</p>';
    else if (!corriendo && est.resultado && est.resultado.resumen) estado = '<p class="small">' + e(est.resultado.resumen) + '.</p>';
    box.innerHTML =
      '<div class="auto-head"><div class="pr-auto-title"><h3>Buscar ganadores</h3><div class="auto-meta">' +
      meta.map((m) => '<span>' + e(m) + '</span>').join('') +
      '</div></div>' +
      (accion ? '<div class="row-actions">' + accion + '</div>' : '') +
      '</div><p class="pr-auto-lede">Abre en el navegador de Claude la búsqueda de Mercado Libre de cada producto de tu lista, lee las publicaciones principales y anota las señales de venta: “+X vendidos”, opiniones, el sello MÁS VENDIDO y cuántas publicaciones compiten. Con eso ajusta demanda, competencia y el rango de precios de cada tarjeta.</p>' +
      aviso +
      estado;

  const ST = {
    espera: ['en espera', ''],
    leyendo: ['leyendo…', ''],
    ok: ['listo', 'ok'],
    error: ['error', 'err'],
    omitida: ['no se leyó', ''],

  function progList(items, texto) {
    return (
      '<ul class="auto-progress">' +
      items
        .map((it) => {
          const st = ST[it.estado] || ST.espera;
          return '<li><span class="st' + (st[1] ? ' ' + st[1] : '') + '">' + e(st[0]) + '</span><span>' + e(it.q) + (it.detalle ? ' <span class="muted">· ' + e(it.detalle) + '</span>' : '') + '</span></li>';
        })

  function renderAutoProg() {
    const box = el && $('#pr-auto-prog', el);
    if (!box || !A) return;
    const corriendo = A.running === 'productos';
    const est = A.estado.productos || {};
    box.innerHTML = vivo.medir.length && (corriendo || est.error) ? progList(vivo.medir, corriendo ? A.progress.productos : '') : '';

  function renderAutoCfg() {
    const box = el && $('#pr-auto-cfg', el);

    // Si el usuario está usando una opción, le devolvemos el foco al redibujar

    box.innerHTML =

    renderDescProg();
    renderDescList();

  function renderDescHead() {
    const box = el && $('#pr-desc-head', el);
    if (!box) return;

      '<div class="panel-head"><div class="pr-auto-title"><h4>Productos nuevos</h4><p class="muted small">Recorre Mercado Libre buscando productos que compraría el mismo cliente del corrector (espalda, cuello, dormir, home office) y que ya muestran señales de venta.</p></div>' +

  function renderDescList() {
    const box = el && $('#pr-desc-list', el);
    if (!box) return;
    const d = state.desc;
    const prods = d && Array.isArray(d.productos) ? d.productos : [];
    if (!d) {
      box.innerHTML = Browser.available

      e(U.timeAgo(d.fecha)) +
      (d.modo === 'claude' ? ': Claude eligió qué páginas de Mercado Libre leer' : ': búsquedas de partida en Mercado Libre') +
      '. Las señales salen de lo que muestran las publicaciones, no son ventas exactas.</p>';

  function descCard(d, n) {
    const ya = W.yaEnLista(d.busqueda || d.nombre, state.items);
    const v = W.veredicto(d.senales ? d.senales.vende : W.vendeDesde(d));
    const facts = [];
    if (d.precioMin || d.precioMax) facts.push('<li><strong>' + e(d.precioMin && d.precioMax && d.precioMin !== d.precioMax ? U.money(d.precioMin) + ' a ' + U.money(d.precioMax) : U.money(d.precioMin || d.precioMax)) + '</strong></li>');
    if (d.vendidos != null) facts.push('<li><strong>' + e(W.fmtVendidos(d.vendidos)) + '</strong> en una publicación</li>');
    if (d.opiniones != null) facts.push('<li><strong>' + e(U.int(d.opiniones)) + '</strong> opiniones</li>');
    return (
      '<li class="pr-desc-card"><div class="pr-desc-top"><strong class="pr-desc-name">' +
      e(d.nombre) +
      '</strong>' +
      (v ? chip(v.label, v.tone) : '') +
      '</div>' +
      (facts.length ? '<ul class="pr-facts">' + facts.join('') + '</ul>' : '') +
      (d.evidencia ? '<p class="small">' + e(d.evidencia) + '</p>' : '') +
      (d.por_que ? '<p class="small"><span class="eyebrow">Por qué</span>' + e(d.por_que) + '</p>' : '') +
      (d.video ? '<p class="small"><span class="eyebrow">En video</span>' + e(d.video) + '</p>' : '') +
      '<div class="row-actions">' +
      (ya ? '<span class="muted small">Ya está en tu lista</span>' : '<button class="btn ghost" data-act="desc-agregar" data-n="' + n + '">Agregar a mi lista</button>') +
      '<a class="btn link" href="' +
      e(PR.mlUrl(d.busqueda || d.nombre)) +
